<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ancient Tic-Tac-Toe</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 35%, #4b463c 0%, #211f1a 48%, #090909 100%);
    font-family: Georgia, "Times New Roman", serif;
    color: #e8d8ad;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

/* =========================================================
   ENTIRE GAME
   ========================================================= */

#game {
    width: 100vw;
    height: 100dvh;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding:
        max(8px, env(safe-area-inset-top))
        max(8px, env(safe-area-inset-right))
        max(8px, env(safe-area-inset-bottom))
        max(8px, env(safe-area-inset-left));
    position: relative;
}

/* =========================================================
   TITLE
   ========================================================= */

#title {
    flex: 0 0 auto;
    text-align: center;
    font-size: clamp(20px, 4vh, 48px);
    letter-spacing: clamp(3px, 0.8vw, 10px);
    font-weight: bold;
    color: #d8c08b;
    text-shadow:
        0 2px 0 #3b2b13,
        0 4px 12px #000;
    line-height: 1;
    margin-top: 2px;
}

/* =========================================================
   STATUS
   ========================================================= */

#status {
    flex: 0 0 auto;
    text-align: center;
    font-size: clamp(13px, 2.4vh, 24px);
    min-height: 1.3em;
    color: #f1dfae;
    text-shadow: 0 2px 5px #000;
    font-weight: bold;
}

/* =========================================================
   MAIN AREA
   ========================================================= */

#arena {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1200px;
    overflow: hidden;
}

/* =========================================================
   MASSIVE STANDING FRAME
   ========================================================= */

#monument {
    /*
       JS supplies --boardSize so the complete monument always
       fits inside the available viewport.
    */
    width: calc(var(--boardSize) + var(--frameWidth) * 2);
    height: calc(var(--boardSize) + var(--frameWidth) * 2);
    position: relative;
    flex: 0 0 auto;
    transform: perspective(1200px) rotateX(2deg);
}

/* Ground shadow */
#monument::after {
    content: "";
    position: absolute;
    left: 5%;
    right: 5%;
    bottom: -2%;
    height: 8%;
    border-radius: 50%;
    background: rgba(0,0,0,.75);
    filter: blur(10px);
    z-index: -5;
}

/* =========================================================
   FRAME
   ========================================================= */

.frame {
    position: absolute;
    background:
        linear-gradient(
            90deg,
            #171513 0%,
            #51493b 8%,
            #a18b62 17%,
            #534b3c 28%,
            #24211d 48%,
            #74664b 68%,
            #2a2721 88%,
            #11100e 100%
        );
    border: calc(var(--boardSize) * .018) solid #171512;
    box-shadow:
        inset 0 0 0 calc(var(--boardSize) * .007) rgba(216,184,116,.45),
        inset 0 0 calc(var(--boardSize) * .035) rgba(0,0,0,.8),
        0 10px 18px rgba(0,0,0,.75);
}

/* left / right */
.frame.left,
.frame.right {
    top: 0;
    bottom: 0;
    width: var(--frameWidth);
}

.frame.left {
    left: 0;
}

.frame.right {
    right: 0;
}

/* top / bottom */
.frame.top,
.frame.bottom {
    left: 0;
    right: 0;
    height: var(--frameWidth);
}

.frame.top {
    top: 0;
}

.frame.bottom {
    bottom: 0;
}

/* =========================================================
   FRAME RIVETS
   ========================================================= */

.rivet {
    position: absolute;
    width: calc(var(--boardSize) * .038);
    height: calc(var(--boardSize) * .038);
    border-radius: 50%;
    background:
        radial-gradient(circle at 35% 30%,
            #e1c989 0%,
            #8f784d 28%,
            #403522 60%,
            #17130e 100%);
    border: 1px solid #15120e;
    box-shadow:
        1px 2px 3px #000,
        inset 0 1px 1px rgba(255,255,255,.35);
    z-index: 4;
}

.r1 { left: 5%; top: 5%; }
.r2 { right: 5%; top: 5%; }
.r3 { left: 5%; bottom: 5%; }
.r4 { right: 5%; bottom: 5%; }

/* =========================================================
   BOARD
   ========================================================= */

#board {
    position: absolute;
    width: var(--boardSize);
    height: var(--boardSize);
    left: var(--frameWidth);
    top: var(--frameWidth);

    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);

    background:
        radial-gradient(circle at 45% 40%,
            #514a3c 0%,
            #322e27 50%,
            #1a1815 100%);

    border:
        calc(var(--boardSize) * .012) solid #15130f;

    box-shadow:
        inset 0 0 calc(var(--boardSize) * .025) rgba(0,0,0,.9),
        inset 0 0 calc(var(--boardSize) * .01) rgba(207,174,104,.3),
        0 0 calc(var(--boardSize) * .025) rgba(0,0,0,.8);
}

/* =========================================================
   GRID LINES
   ========================================================= */

.cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    overflow: hidden;
}

.cell::before,
.cell::after {
    content: "";
    position: absolute;
    pointer-events: none;
}

/* vertical divider */
.cell:nth-child(2)::before,
.cell:nth-child(5)::before,
.cell:nth-child(8)::before {
    right: 0;
    top: 4%;
    bottom: 4%;
    width: calc(var(--boardSize) * .012);
    background:
        linear-gradient(
            90deg,
            #17140f,
            #9d8759,
            #30291e
        );
    box-shadow: 2px 0 4px #000;
}

/* horizontal divider */
.cell:nth-child(n+4)::after {
    left: 4%;
    right: 4%;
    top: 0;
    height: calc(var(--boardSize) * .012);
    background:
        linear-gradient(
            90deg,
            #17140f,
            #9d8759,
            #30291e
        );
    box-shadow: 0 -2px 4px #000;
}

/* =========================================================
   PIECES
   ========================================================= */

.piece {
    width: 70%;
    height: 70%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-origin: center center;
    filter:
        drop-shadow(
            calc(var(--boardSize) * .012)
            calc(var(--boardSize) * .018)
            calc(var(--boardSize) * .015)
            rgba(0,0,0,.85)
        );
}

/* Bronze material */
.x-piece,
.o-piece {
    color: #b88945;
    text-shadow:
        1px 1px 0 #3b2410,
        -1px -1px 0 #e5c27d,
        2px 4px 5px #000;
}

/* =========================================================
   X
   ========================================================= */

.x-piece::before,
.x-piece::after {
    content: "";
    position: absolute;
    width: 20%;
    height: 95%;
    left: 40%;
    top: 2.5%;
    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            #3c2510 0%,
            #8d5c28 15%,
            #d0a45d 34%,
            #a56e32 52%,
            #553213 76%,
            #21150b 100%
        );

    border: 2px solid #2a1b0d;

    box-shadow:
        inset 2px 0 2px rgba(255,255,255,.35),
        inset -3px 0 4px rgba(0,0,0,.55);
}

.x-piece::before {
    transform: rotate(45deg);
}

.x-piece::after {
    transform: rotate(-45deg);
}

/* =========================================================
   O
   ========================================================= */

.o-piece {
    width: 62%;
    height: 62%;
    border-radius: 50%;

    background:
        radial-gradient(
            circle at 34% 28%,
            #e1bf78 0%,
            #b77e39 23%,
            #74451d 55%,
            #3b220e 78%,
            #171009 100%
        );

    border:
        max(3px, calc(var(--boardSize) * .012))
        solid #2b1a0b;

    box-shadow:
        inset 0 0 0 calc(var(--boardSize) * .008) rgba(223,183,104,.45),
        inset 0 0 calc(var(--boardSize) * .018) rgba(0,0,0,.9);
}

.o-piece::after {
    content: "";
    position: absolute;
    width: 43%;
    height: 43%;
    border-radius: 50%;
    background:
        radial-gradient(circle,
            #171411 0%,
            #080807 70%,
            #020202 100%);
    box-shadow:
        inset 2px 2px 3px rgba(0,0,0,.9);
}

/* =========================================================
   FIVE PLACEMENT ANIMATIONS
   ========================================================= */

.anim-hammer {
    animation: hammer .58s cubic-bezier(.2,1.6,.35,1) both;
}

@keyframes hammer {
    0% {
        transform: translateY(calc(var(--boardSize) * -.30))
                   scale(1.7)
                   rotate(-15deg);
        opacity: 0;
    }
    55% {
        transform: translateY(calc(var(--boardSize) * .035))
                   scale(.9)
                   rotate(4deg);
        opacity: 1;
    }
    75% {
        transform: translateY(calc(var(--boardSize) * -.012))
                   scale(1.08);
    }
    100% {
        transform: translateY(0) scale(1) rotate(0);
    }
}

.anim-spin {
    animation: spinIn .65s cubic-bezier(.2,1.3,.3,1) both;
}

@keyframes spinIn {
    0% {
        transform: scale(.15) rotate(360deg);
        opacity: 0;
    }
    70% {
        transform: scale(1.12) rotate(-15deg);
        opacity: 1;
    }
    100% {
        transform: scale(1) rotate(0);
    }
}

.anim-rise {
    animation: rise .65s cubic-bezier(.25,1.5,.35,1) both;
}

@keyframes rise {
    0% {
        transform: translateY(100%) scale(.65);
        opacity: 0;
    }
    60% {
        transform: translateY(-8%) scale(1.08);
        opacity: 1;
    }
    100% {
        transform: translateY(0) scale(1);
    }
}

.anim-forge {
    animation: forge .55s cubic-bezier(.2,1.5,.3,1) both;
}

@keyframes forge {
    0% {
        transform: scale(2.5);
        opacity: 0;
        filter:
            brightness(4)
            drop-shadow(0 0 20px #ffd875);
    }
    35% {
        opacity: 1;
        transform: scale(.82);
        filter:
            brightness(2)
            drop-shadow(0 0 18px #ffd875);
    }
    65% {
        transform: scale(1.12);
        filter:
            brightness(1.4)
            drop-shadow(0 0 7px #d29c42);
    }
    100% {
        transform: scale(1);
        filter:
            brightness(1)
            drop-shadow(
                calc(var(--boardSize) * .012)
                calc(var(--boardSize) * .018)
                calc(var(--boardSize) * .015)
                rgba(0,0,0,.85)
            );
    }
}

.anim-swing {
    animation: swing .65s cubic-bezier(.2,1.4,.3,1) both;
    transform-origin: 50% 100%;
}

@keyframes swing {
    0% {
        transform:
            translateX(-60%)
            rotate(-65deg)
            scale(.7);
        opacity: 0;
    }
    55% {
        transform:
            translateX(8%)
            rotate(12deg)
            scale(1.1);
        opacity: 1;
    }
    100% {
        transform:
            translateX(0)
            rotate(0)
            scale(1);
    }
}

/* =========================================================
   WIN EFFECT
   ========================================================= */

.winner {
    animation: winnerPulse .7s ease-in-out infinite alternate;
}

@keyframes winnerPulse {
    from {
        filter:
            drop-shadow(0 0 2px #d6a94d)
            brightness(1);
    }
    to {
        filter:
            drop-shadow(0 0 14px #ffd66e)
            brightness(1.45);
    }
}

.draw-cell {
    animation: drawPulse .7s ease-in-out infinite alternate;
}

@keyframes drawPulse {
    from { background: rgba(170,130,55,.04); }
    to   { background: rgba(170,130,55,.18); }
}

/* =========================================================
   CONTROLS
   ========================================================= */

#controls {
    flex: 0 0 auto;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: clamp(5px, 1vw, 12px);
    width: 100%;
    padding-bottom: 2px;
}

button {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: bold;
    font-size: clamp(10px, 1.8vh, 18px);
    letter-spacing: clamp(.5px, .2vw, 2px);
    color: #ead5a2;

    padding:
        clamp(6px, 1vh, 11px)
        clamp(10px, 2vw, 24px);

    border-radius: 5px;
    border: 2px solid #19140d;

    background:
        linear-gradient(
            180deg,
            #9a7c4a 0%,
            #5a4528 45%,
            #302417 100%
        );

    box-shadow:
        inset 0 1px 1px rgba(255,255,255,.35),
        0 3px 6px #000;

    cursor: pointer;
    white-space: nowrap;
}

button:hover {
    background:
        linear-gradient(
            180deg,
            #b1925b 0%,
            #705631 45%,
            #3b2c1c 100%
        );
}

button:active {
    transform: translateY(2px);
    box-shadow:
        inset 0 2px 3px #111,
        0 1px 2px #000;
}

button.active {
    border-color: #d2ae68;
    box-shadow:
        inset 0 0 8px rgba(0,0,0,.8),
        0 0 8px rgba(216,176,89,.5);
    color: #fff1c7;
}

/* =========================================================
   LANDSCAPE ADJUSTMENT
   ========================================================= */

@media (orientation: landscape) {
    #game {
        padding-top: max(4px, env(safe-area-inset-top));
        padding-bottom: max(4px, env(safe-area-inset-bottom));
    }

    #title {
        font-size: clamp(16px, 5vh, 38px);
    }

    #status {
        font-size: clamp(11px, 2.8vh, 19px);
    }
}

/* =========================================================
   VERY SHORT SCREENS
   ========================================================= */

@media (max-height: 430px) {
    #title {
        display: none;
    }

    #status {
        font-size: 12px;
    }

    button {
        padding: 4px 9px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="title">ANCIENT TIC-TAC-TOE</div>

    <div id="status">PLAYER X — YOUR TURN</div>

    <div id="arena">

        <div id="monument">

            <div class="frame left"></div>
            <div class="frame right"></div>
            <div class="frame top"></div>
            <div class="frame bottom"></div>

            <div class="rivet r1"></div>
            <div class="rivet r2"></div>
            <div class="rivet r3"></div>
            <div class="rivet r4"></div>

            <div id="board">

                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>

                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>

                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>

            </div>
        </div>
    </div>

    <div id="controls">
        <button id="twoPlayer" class="active">2 PLAYERS</button>
        <button id="computer">VS COMPUTER</button>
        <button id="newGame">NEW GAME</button>
    </div>

</div>

<script>

/* =========================================================
   GAME STATE
   ========================================================= */

const cells = [...document.querySelectorAll(".cell")];
const board = document.getElementById("board");
const monument = document.getElementById("monument");
const arena = document.getElementById("arena");
const statusText = document.getElementById("status");

const twoPlayerButton = document.getElementById("twoPlayer");
const computerButton = document.getElementById("computer");
const newGameButton = document.getElementById("newGame");

let game = Array(9).fill("");
let currentPlayer = "X";
let gameOver = false;
let mode = "2P";

/*
 Five different placement animations.
 They cycle in order.
 */
const animations = [
    "anim-hammer",
    "anim-spin",
    "anim-rise",
    "anim-forge",
    "anim-swing"
];

let animationNumber = 0;

/* =========================================================
   RESPONSIVE FIT
   ========================================================= */

function fitGame() {

    const arenaWidth = arena.clientWidth;
    const arenaHeight = arena.clientHeight;

    if (!arenaWidth || !arenaHeight) return;

    /*
       The board needs room for the four-sided monument frame.
       Frame width is proportional to board size.
    */

    const frameRatio = 0.105;

    /*
       Total monument dimension is:

       board + two frame widths

       Therefore boardSize is calculated from the smaller
       available dimension.
    */

    const usableWidth = arenaWidth * 0.96;
    const usableHeight = arenaHeight * 0.96;

    const maxBoardFromWidth =
        usableWidth / (1 + frameRatio * 2);

    const maxBoardFromHeight =
        usableHeight / (1 + frameRatio * 2);

    let boardSize =
        Math.min(
            maxBoardFromWidth,
            maxBoardFromHeight
        );

    /*
       Never allow a microscopic board.
       The viewport should normally be large enough,
       but this protects extreme cases.
    */

    boardSize = Math.max(100, boardSize);

    const frameWidth = boardSize * frameRatio;

    monument.style.setProperty(
        "--boardSize",
        boardSize + "px"
    );

    monument.style.setProperty(
        "--frameWidth",
        frameWidth + "px"
    );
}

window.addEventListener("resize", fitGame);
window.addEventListener("orientationchange", () => {
    setTimeout(fitGame, 100);
});

if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", fitGame);
}

setTimeout(fitGame, 20);

/* =========================================================
   WINNING COMBINATIONS
   ========================================================= */

const wins = [
    [0,1,2],
    [3,4,5],
    [6,7,8],

    [0,3,6],
    [1,4,7],
    [2,5,8],

    [0,4,8],
    [2,4,6]
];

/* =========================================================
   WIN CHECK
   ========================================================= */

function getWinner() {

    for (const combo of wins) {

        const [a,b,c] = combo;

        if (
            game[a] &&
            game[a] === game[b] &&
            game[a] === game[c]
        ) {
            return {
                player: game[a],
                combo
            };
        }
    }

    if (game.every(Boolean)) {
        return {
            player: "DRAW",
            combo: []
        };
    }

    return null;
}

/* =========================================================
   PLACE PIECE
   ========================================================= */

function placePiece(index, player) {

    game[index] = player;

    const cell = cells[index];

    const piece = document.createElement("div");

    piece.classList.add("piece");

    if (player === "X") {
        piece.classList.add("x-piece");
    } else {
        piece.classList.add("o-piece");
    }

    /*
       Cycle through the five animations.
    */

    piece.classList.add(
        animations[animationNumber % animations.length]
    );

    animationNumber++;

    cell.appendChild(piece);

    /*
       Slight impact effect on the board.
    */

    board.animate(
        [
            {
                transform: "scale(1)"
            },
            {
                transform: "scale(.997)"
            },
            {
                transform: "scale(1)"
            }
        ],
        {
            duration: 180,
            easing: "ease-out"
        }
    );

    return piece;
}

/* =========================================================
   HUMAN MOVE
   ========================================================= */

function humanMove(index) {

    if (gameOver) return;

    if (game[index]) return;

    if (mode === "CPU" && currentPlayer === "O") {
        return;
    }

    placePiece(index, currentPlayer);

    finishMove();
}

/* =========================================================
   FINISH MOVE
   ========================================================= */

function finishMove() {

    const result = getWinner();

    if (result) {

        gameOver = true;

        if (result.player === "DRAW") {

            statusText.textContent = "DRAW — THE BOARD IS COMPLETE";

            cells.forEach(cell => {
                cell.classList.add("draw-cell");
            });

        } else {

            statusText.textContent =
                "PLAYER " + result.player + " WINS!";

            result.combo.forEach(index => {

                const piece =
                    cells[index].querySelector(".piece");

                if (piece) {
                    piece.classList.add("winner");
                }
            });
        }

        return;
    }

    currentPlayer =
        currentPlayer === "X"
            ? "O"
            : "X";

    if (mode === "CPU" && currentPlayer === "O") {

        statusText.textContent =
            "COMPUTER — THINKING...";

        setTimeout(computerMove, 430);

    } else {

        statusText.textContent =
            "PLAYER " + currentPlayer + " — YOUR TURN";
    }
}

/* =========================================================
   COMPUTER
   ========================================================= */

function computerMove() {

    if (gameOver) return;

    if (currentPlayer !== "O") return;

    const move = findComputerMove();

    if (move === -1) return;

    placePiece(move, "O");

    finishMove();
}

/*
   Computer logic:
   1. Win if possible
   2. Block X
   3. Take center
   4. Take a corner
   5. Take any remaining square
 */

function findComputerMove() {

    /* Try winning */
    for (let i = 0; i < 9; i++) {

        if (!game[i]) {

            game[i] = "O";

            if (checkPlayerWin("O")) {
                game[i] = "";
                return i;
            }

            game[i] = "";
        }
    }

    /* Block player */
    for (let i = 0; i < 9; i++) {

        if (!game[i]) {

            game[i] = "X";

            if (checkPlayerWin("X")) {
                game[i] = "";
                return i;
            }

            game[i] = "";
        }
    }

    /* Center */
    if (!game[4]) {
        return 4;
    }

    /* Corners */
    const corners = [0,2,6,8];

    const availableCorners =
        corners.filter(i => !game[i]);

    if (availableCorners.length) {

        return availableCorners[
            Math.floor(
                Math.random() *
                availableCorners.length
            )
        ];
    }

    /* Anything left */
    const available =
        game
            .map((value,index) =>
                value ? -1 : index
            )
            .filter(index => index !== -1);

    if (!available.length) {
        return -1;
    }

    return available[
        Math.floor(
            Math.random() * available.length
        )
    ];
}

function checkPlayerWin(player) {

    return wins.some(combo => {

        return combo.every(index =>
            game[index] === player
        );

    });
}

/* =========================================================
   NEW GAME
   ========================================================= */

function startNewGame() {

    game = Array(9).fill("");
    currentPlayer = "X";
    gameOver = false;
    animationNumber = 0;

    cells.forEach(cell => {

        cell.innerHTML = "";

        cell.classList.remove(
            "winner",
            "draw-cell"
        );
    });

    statusText.textContent =
        mode === "CPU"
            ? "PLAYER X — YOUR TURN"
            : "PLAYER X — YOUR TURN";
}

/* =========================================================
   CELL INPUT
   ========================================================= */

cells.forEach(cell => {

    cell.addEventListener("click", () => {

        const index =
            Number(cell.dataset.index);

        humanMove(index);
    });

});

/*
   Touch support is naturally handled by click,
   but prevent double-tap zoom on game cells.
 */

cells.forEach(cell => {

    cell.addEventListener(
        "touchstart",
        event => {
            event.preventDefault();
        },
        { passive: false }
    );

});

/* =========================================================
   MODE BUTTONS
   ========================================================= */

twoPlayerButton.addEventListener("click", () => {

    mode = "2P";

    twoPlayerButton.classList.add("active");
    computerButton.classList.remove("active");

    startNewGame();
});

computerButton.addEventListener("click", () => {

    mode = "CPU";

    computerButton.classList.add("active");
    twoPlayerButton.classList.remove("active");

    startNewGame();
});

newGameButton.addEventListener(
    "click",
    startNewGame
);

/* =========================================================
   START
   ========================================================= */

fitGame();

</script>

</body>
</html>
