<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Game Room</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;

    font-family: Arial, Helvetica, sans-serif;

    overflow-x: hidden;
}

body {

    min-height: 100vh;

    background:
        linear-gradient(
            to bottom,
            #79c8ff 0%,
            #bde8ff 55%,
            #79bd45 56%,
            #3d852d 100%
        );

    color: white;

    position: relative;
}


/* =========================================================
   TITLE
   ========================================================= */

.title {

    text-align: center;

    padding-top: 18px;

    font-size: clamp(
        34px,
        8vw,
        64px
    );

    font-weight: 900;

    letter-spacing: 4px;

    text-shadow:
        0 4px 3px rgba(0,0,0,.45),
        0 0 12px rgba(255,255,255,.4);

    position: relative;

    z-index: 20;
}


.subtitle {

    text-align: center;

    font-size: clamp(
        14px,
        3vw,
        20px
    );

    margin-top: -5px;

    text-shadow:
        0 2px 3px rgba(0,0,0,.5);

    position: relative;

    z-index: 20;
}


/* =========================================================
   GAME MENU
   ========================================================= */

.menu {

    width: min(
        92vw,
        500px
    );

    margin: 22px auto 0;

    display: flex;

    flex-direction: column;

    gap: 12px;

    position: relative;

    z-index: 30;
}


.gameButton {

    display: block;

    width: 100%;

    padding: 16px 20px;

    border-radius: 14px;

    border: 3px solid rgba(
        255,
        255,
        255,
        .8
    );

    text-decoration: none;

    color: white;

    font-size: 22px;

    font-weight: bold;

    text-shadow:
        0 2px 3px black;

    background:
        linear-gradient(
            to bottom,
            #555,
            #111
        );

    box-shadow:
        0 7px 12px rgba(
            0,
            0,
            0,
            .45
        ),
        inset 0 2px 3px rgba(
            255,
            255,
            255,
            .35
        );

    transition:
        transform .15s,
        box-shadow .15s;
}

.gameButton:hover {

    transform:
        translateY(-3px)
        scale(1.02);

    box-shadow:
        0 11px 18px rgba(
            0,
            0,
            0,
            .5
        ),
        inset 0 2px 3px rgba(
            255,
            255,
            255,
            .4
        );
}

.gameButton:active {

    transform:
        translateY(2px)
        scale(.98);
}


/* =========================================================
   ANIMAL AREA
   ========================================================= */

.scene {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height: 43vh;

    min-height: 230px;

    overflow: hidden;

    pointer-events: none;

    z-index: 5;
}


/* =========================================================
   SUN
   ========================================================= */

.sun {

    position: absolute;

    width: 85px;
    height: 85px;

    border-radius: 50%;

    right: 8vw;
    top: 18px;

    background:
        radial-gradient(
            circle,
            #fffbd0,
            #ffe45b 55%,
            #ffc928
        );

    box-shadow:
        0 0 30px #fff5a0;
}


/* =========================================================
   CLOUDS
   ========================================================= */

.cloud {

    position: absolute;

    width: 130px;
    height: 38px;

    background: white;

    border-radius: 30px;

    opacity: .75;

    filter: blur(.2px);
}

.cloud::before,
.cloud::after {

    content: "";

    position: absolute;

    background: white;

    border-radius: 50%;
}

.cloud::before {

    width: 55px;
    height: 55px;

    left: 25px;
    bottom: 8px;
}

.cloud::after {

    width: 70px;
    height: 70px;

    right: 18px;
    bottom: 4px;
}

.cloud1 {

    top: 45px;
    left: 8%;

    transform: scale(.75);
}

.cloud2 {

    top: 100px;
    left: 55%;

    transform: scale(.55);
}


/* =========================================================
   GROUND
   ========================================================= */

.ground {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 65%;

    background:
        linear-gradient(
            to bottom,
            #5da83c,
            #397a29
        );
}


/* =========================================================
   GIRAFFE
   ========================================================= */

.giraffe {

    position: absolute;

    width: 105px;
    height: 175px;

    bottom: 34px;

    left: 46%;

    animation:
        giraffeWalk
        16s
        linear
        infinite;
}


/* body */

.giraffeBody {

    position: absolute;

    width: 76px;
    height: 55px;

    left: 15px;
    top: 78px;

    background:
        #d59a35;

    border-radius:
        45% 50% 40% 40%;

    border: 3px solid #75440f;

    box-shadow:
        inset 8px 7px 0 rgba(
            255,
            220,
            100,
            .25
        );
}


/* spots */

.giraffeBody::before {

    content: "";

    position: absolute;

    width: 20px;
    height: 16px;

    left: 12px;
    top: 12px;

    background: #70400f;

    border-radius: 45%;
    
    box-shadow:
        30px 6px 0 #70400f,
        16px 27px 0 #70400f;
}


/* neck */

.giraffeNeck {

    position: absolute;

    width: 28px;
    height: 95px;

    left: 58px;
    top: 5px;

    background:
        #d59a35;

    border: 3px solid #75440f;

    border-radius: 15px;

    transform:
        rotate(-3deg);

    z-index: 2;
}


/* neck spots */

.giraffeNeck::before {

    content: "";

    position: absolute;

    width: 10px;
    height: 13px;

    left: 5px;
    top: 15px;

    background: #70400f;

    border-radius: 40%;

    box-shadow:
        8px 25px 0 #70400f,
        4px 52px 0 #70400f;
}


/* head */

.giraffeHead {

    position: absolute;

    width: 58px;
    height: 42px;

    left: 47px;
    top: -5px;

    background:
        #d59a35;

    border: 3px solid #75440f;

    border-radius:
        45% 55% 45% 50%;

    transform:
        rotate(-4deg);

    z-index: 4;
}


/* muzzle */

.giraffeHead::before {

    content: "";

    position: absolute;

    width: 31px;
    height: 18px;

    right: -11px;
    bottom: 3px;

    background:
        #e5b55b;

    border-radius: 50%;
}


/* eye */

.giraffeHead::after {

    content: "";

    position: absolute;

    width: 7px;
    height: 7px;

    right: 12px;
    top: 11px;

    background: black;

    border-radius: 50%;
}


/* horns */

.giraffeHorn1,
.giraffeHorn2 {

    position: absolute;

    width: 8px;
    height: 18px;

    background:
        #75440f;

    border-radius:
        5px 5px 2px 2px;

    top: -18px;

    z-index: 5;
}

.giraffeHorn1 {

    left: 9px;
}

.giraffeHorn2 {

    left: 27px;
}


/* legs */

.giraffeLeg {

    position: absolute;

    width: 11px;
    height: 60px;

    background:
        #c9892e;

    border: 2px solid #75440f;

    border-radius:
        6px;

    top: 120px;

    transform-origin:
        top center;
}

.giraffeLeg1 {
    left: 25px;
}

.giraffeLeg2 {
    left: 47px;
}

.giraffeLeg3 {
    left: 68px;
}

.giraffeLeg4 {
    left: 82px;
}


/* =========================================================
   GIRAFFE WALK
   ========================================================= */

@keyframes giraffeWalk {

    0% {
        left: -140px;
    }

    35% {
        left: 38%;
    }

    48% {
        left: 46%;
    }

    62% {
        left: 55%;
    }

    100% {
        left: 110%;
    }
}


/* =========================================================
   BULLDOG
   ========================================================= */

.bulldog {

    position: absolute;

    width: 125px;
    height: 75px;

    bottom: 35px;

    left: -150px;

    animation:
        bulldogWalk
        16s
        linear
        infinite;

    z-index: 10;
}


/* body */

.bulldogBody {

    position: absolute;

    width: 78px;
    height: 48px;

    left: 25px;
    top: 17px;

    background:
        linear-gradient(
            145deg,
            #b9a48f,
            #796858
        );

    border: 3px solid #42362d;

    border-radius:
        48% 45% 40% 45%;

    box-shadow:
        inset 0 5px 5px rgba(
            255,
            255,
            255,
            .25
        );
}


/* head */

.bulldogHead {

    position: absolute;

    width: 60px;
    height: 52px;

    left: 5px;
    top: 8px;

    background:
        linear-gradient(
            145deg,
            #c8b5a2,
            #796858
        );

    border: 3px solid #42362d;

    border-radius:
        45% 45% 50% 50%;

    z-index: 3;
}


/* ears */

.bulldogEar1,
.bulldogEar2 {

    position: absolute;

    width: 22px;
    height: 27px;

    background:
        #594a3d;

    border: 3px solid #42362d;

    border-radius:
        45% 45% 50% 50%;

    top: -6px;
}

.bulldogEar1 {
    left: -4px;
    transform: rotate(-25deg);
}

.bulldogEar2 {
    right: -4px;
    transform: rotate(25deg);
}


/* muzzle */

.bulldogMuzzle {

    position: absolute;

    width: 37px;
    height: 26px;

    left: 11px;
    bottom: 3px;

    background:
        #e1d1bd;

    border-radius: 50%;

    z-index: 4;
}


/* nose */

.bulldogMuzzle::before {

    content: "";

    position: absolute;

    width: 15px;
    height: 10px;

    left: 11px;
    top: 2px;

    background: #211a17;

    border-radius: 50%;
}


/* eyes */

.bulldogHead::before,
.bulldogHead::after {

    content: "";

    position: absolute;

    width: 8px;
    height: 8px;

    background: #111;

    border-radius: 50%;

    top: 17px;
}

.bulldogHead::before {
    left: 11px;
}

.bulldogHead::after {
    right: 11px;
}


/* legs */

.bulldogLeg {

    position: absolute;

    width: 13px;
    height: 34px;

    background:
        #806f60;

    border: 2px solid #42362d;

    border-radius: 8px;

    top: 55px;

    transform-origin:
        top center;
}

.bulldogLeg1 {
    left: 37px;
}

.bulldogLeg2 {
    left: 61px;
}

.bulldogLeg3 {
    left: 79px;
}

.bulldogLeg4 {
    left: 96px;
}


/* tail */

.bulldogTail {

    position: absolute;

    width: 24px;
    height: 18px;

    right: 0;
    top: 15px;

    border:
        7px solid #796858;

    border-left: 0;

    border-bottom: 0;

    border-radius:
        0 18px 0 0;

    transform:
        rotate(15deg);
}


/* =========================================================
   BULLDOG WALK + BOTHER
   ========================================================= */

@keyframes bulldogWalk {

    0% {
        left: -150px;
        transform: scaleX(1);
    }

    30% {
        left: 22%;
        transform: scaleX(1);
    }

    /*
     * Approaches giraffe
     */

    43% {
        left: 39%;
        transform: scaleX(1);
    }

    /*
     * Gets right behind giraffe
     */

    49% {
        left: 44%;
        transform: scaleX(1);
    }

    /*
     * Bounces toward giraffe
     */

    52% {
        left: 47%;
        transform: scaleX(1.05);
    }

    55% {
        left: 43%;
        transform: scaleX(1);
    }

    /*
     * Follows giraffe
     */

    65% {
        left: 55%;
        transform: scaleX(1);
    }

    76% {
        left: 70%;
        transform: scaleX(1);
    }

    100% {
        left: 110%;
        transform: scaleX(1);
    }
}


/* =========================================================
   LITTLE GRASS
   ========================================================= */

.grass {

    position: absolute;

    bottom: 0;

    width: 100%;

    height: 15px;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0px,
            transparent 14px,
            rgba(0,0,0,.15) 15px,
            transparent 17px
        );
}


/* =========================================================
   LANDSCAPE PHONE
   ========================================================= */

@media (
    orientation: landscape
) and (
    max-height: 600px
) {

    .title {
        padding-top: 8px;
        font-size: 30px;
    }

    .subtitle {
        display: none;
    }

    .menu {
        width: 55vw;
        margin-top: 8px;
        gap: 7px;
    }

    .gameButton {
        padding: 10px;
        font-size: 18px;
    }

    .scene {
        height: 100vh;
        width: 40vw;
        left: auto;
    }
}

</style>

</head>


<body>


<div class="title">
    GAME ROOM
</div>


<div class="subtitle">
    Choose your battle
</div>


<div class="menu">

    <a
        class="gameButton"
        href="/ttt.html"
    >
        ✕ TIC-TAC-TOE
    </a>


    <a
        class="gameButton"
        href="/checkers.html"
    >
        🔴 CHECKERS
    </a>


    <a
        class="gameButton"
        href="/battleship.html"
    >
        ⚓ BATTLESHIP
    </a>

</div>


<!-- =======================================================
     ANIMAL SCENE
     ======================================================= -->

<div class="scene">

    <div class="sun"></div>

    <div class="cloud cloud1"></div>

    <div class="cloud cloud2"></div>


    <div class="ground"></div>


    <!-- ===================================================
         GIRAFFE
         =================================================== -->

    <div class="giraffe">

        <div class="giraffeNeck"></div>

        <div class="giraffeHorn1"></div>

        <div class="giraffeHorn2"></div>

        <div class="giraffeHead"></div>

        <div class="giraffeBody"></div>

        <div class="giraffeLeg giraffeLeg1"></div>

        <div class="giraffeLeg giraffeLeg2"></div>

        <div class="giraffeLeg giraffeLeg3"></div>

        <div class="giraffeLeg giraffeLeg4"></div>

    </div>


    <!-- ===================================================
         BULLDOG
         =================================================== -->

    <div class="bulldog">

        <div class="bulldogTail"></div>

        <div class="bulldogBody"></div>

        <div class="bulldogHead">

            <div class="bulldogEar1"></div>

            <div class="bulldogEar2"></div>

            <div class="bulldogMuzzle"></div>

        </div>


        <div class="bulldogLeg bulldogLeg1"></div>

        <div class="bulldogLeg bulldogLeg2"></div>

        <div class="bulldogLeg bulldogLeg3"></div>

        <div class="bulldogLeg bulldogLeg4"></div>

    </div>


    <div class="grass"></div>

</div>


</body>

</html>
