<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Room - Connect Four</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; width: 100%; min-height: 100%; }
body { font-family: Arial, Helvetica, sans-serif; color: #fff7dd; background: radial-gradient(circle at 50% 10%, #284b83, #101d3d 48%, #070e20); }
.game { min-height: 100dvh; padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 10px; overflow: hidden; }
h1 { margin: 0; font-size: clamp(28px, 5vw, 48px); letter-spacing: .13em; text-align: center; text-shadow: 0 4px 14px #050b1e; }
.subtitle { margin-top: -8px; font-size: 11px; letter-spacing: .26em; color: #bacbe8; }
.controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; }
button { font: inherit; cursor: pointer; }
.controls button { border: 1px solid #8199c8; border-radius: 9px; padding: 8px 11px; color: white; font-size: clamp(11px, 2.6vw, 14px); font-weight: bold; background: linear-gradient(#3c609b, #1a3264); box-shadow: 0 3px 8px #050a1c; }
.controls button:hover, .controls button:focus-visible { background: linear-gradient(#577bb8, #26477e); outline: 2px solid #ffdb6c; outline-offset: 2px; }
.controls .active { border-color: #ffdb6c; color: #ffe48a; }
.scoreboard { display: flex; justify-content: center; align-items: center; gap: clamp(12px, 5vw, 48px); width: 100%; max-width: 600px; }
.player { display: flex; align-items: center; gap: 8px; font-size: clamp(12px, 2.7vw, 16px); font-weight: bold; opacity: .64; }
.player.turn { opacity: 1; }
.sample { display: inline-block; width: 21px; height: 21px; border-radius: 50%; box-shadow: inset -3px -4px 5px #0005, 0 0 9px #0005; }
.sample.red { background: #ef4c4b; }.sample.yellow { background: #f9d44f; }
.status { min-height: 2em; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: bold; font-size: clamp(14px, 3vw, 19px); color: #ffe49a; }
.stage { flex: 1; width: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; }
.board { width: min(95vw, 72dvh, 700px); aspect-ratio: 7 / 6; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(6, 1fr); gap: clamp(3px, .9vw, 8px); padding: clamp(6px, 1.5vw, 14px); border-radius: 16px; background: linear-gradient(135deg, #2d80e7, #1556b9 55%, #063383); box-shadow: inset 0 2px 3px #b5d8ff99, inset 0 -9px 12px #001c54, 0 16px 25px #0008, 0 0 0 3px #142c63; }
.cell { display: grid; place-items: center; min-width: 0; min-height: 0; border: 0; border-radius: 50%; padding: 5%; background: radial-gradient(circle at 50% 43%, #091936, #06122a 70%, #00102d); box-shadow: inset 1px 3px 7px #000b, 0 1px 1px #a6d1ff77; touch-action: manipulation; }
.cell:focus-visible { outline: 3px solid #fff7b0; outline-offset: -2px; }
.board:not(.locked) .cell:not(.filled):hover { box-shadow: inset 0 0 0 4px #fff8, inset 1px 3px 7px #000b; }
.disc { width: 100%; height: 100%; border-radius: 50%; box-shadow: inset 3px 4px 5px #fff5, inset -5px -7px 8px #0005, 0 2px 3px #0005; }
.disc.R { background: radial-gradient(circle at 38% 30%, #ff8980, #e94143 60%, #ac192c); }
.disc.Y { background: radial-gradient(circle at 38% 30%, #fff8a0, #f9cb3c 60%, #d48a17); }
.disc.fresh { animation: drop .28s ease-out both; }
.disc.winning { box-shadow: 0 0 0 3px #fff, 0 0 17px 7px #ffe581, inset -5px -7px 8px #0005; animation: winPulse .8s ease-in-out infinite alternate; }
@keyframes drop { from { transform: translateY(-70px) scale(.83); opacity: .4; } to { transform: translateY(0) scale(1); opacity: 1; } }
@keyframes winPulse { to { filter: brightness(1.25); } }
.hint { margin: 0; font-size: 11px; color: #a5b8db; text-align: center; }
@media (max-height: 600px) { .game { gap: 5px; } .subtitle, .hint { display: none; } .controls button { padding: 5px 8px; } .board { width: min(90vw, 65dvh, 700px); } }
@media (prefers-reduced-motion: reduce) { .disc { animation: none !important; } }
</style>
</head>
<body>
<main class="game">
  <h1>CONNECT FOUR</h1>
  <div class="subtitle">GAME ROOM</div>
  <div class="controls">
    <button id="twoPlayer" type="button">2 PLAYERS</button>
    <button id="computer" type="button">VS COMPUTER</button>
    <button id="newGame" type="button">NEW GAME</button>
    <button id="menu" type="button">GAME ROOM</button>
  </div>
  <div class="scoreboard">
    <div class="player turn" id="redLabel"><span class="sample red"></span><span id="redName">RED</span></div>
    <div class="player" id="yellowLabel"><span class="sample yellow"></span><span id="yellowName">YELLOW</span></div>
  </div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="stage"><div class="board" id="board" role="grid" aria-label="Connect Four board"></div></div>
  <p class="hint">Tap a column to drop a disc. Four in a row wins.</p>
</main>
<script>
"use strict";
const ROWS = 6, COLS = 7, RED = "R", YELLOW = "Y", EMPTY = "";
const params = new URLSearchParams(location.search);
const roomId = params.get("room") || "";
const onlineMode = Boolean(roomId);
const rawPlayer = String(params.get("player") || "").trim().toLowerCase();
const playerNumber = ["2", "player2", "player 2", "p2"].includes(rawPlayer) ? 2 : 1;
const myColor = playerNumber === 1 ? RED : YELLOW;
const clientId = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
const boardElement = document.getElementById("board");
const statusElement = document.getElementById("status");
const redLabel = document.getElementById("redLabel"), yellowLabel = document.getElementById("yellowLabel");
const newGameButton = document.getElementById("newGame");
let board = emptyBoard(), currentPlayer = RED, gameOver = false, winner = EMPTY, winningCells = [];
let revision = 0, socket = null, socketOpen = false, reconnectTimer = null, cpuTimer = null;
let lastDrop = null;

function emptyBoard() { return Array.from({length: ROWS}, () => Array(COLS).fill(EMPTY)); }
function other(color) { return color === RED ? YELLOW : RED; }
function colorName(color) { return color === RED ? "RED" : "YELLOW"; }
function copyBoard(position) { return position.map(row => row.slice()); }
function drop(position, column, color) {
  if (!Number.isInteger(column) || column < 0 || column >= COLS) return -1;
  for (let row = ROWS - 1; row >= 0; row--) {
    if (position[row][column] === EMPTY) { position[row][column] = color; return row; }
  }
  return -1;
}
function winningLine(position, row, col, color) {
  for (const [dr, dc] of [[0,1],[1,0],[1,1],[1,-1]]) {
    const line = [[row,col]];
    for (const sign of [-1,1]) {
      let r = row + dr * sign, c = col + dc * sign;
      while (r >= 0 && r < ROWS && c >= 0 && c < COLS && position[r][c] === color) {
        line.push([r,c]); r += dr * sign; c += dc * sign;
      }
    }
    if (line.length >= 4) return line;
  }
  return [];
}
function state() { return {board: copyBoard(board), currentPlayer, gameOver, winner, revision}; }
function setStatus(message) { statusElement.textContent = message; }
function updateStatus() {
  redLabel.classList.toggle("turn", !gameOver && currentPlayer === RED);
  yellowLabel.classList.toggle("turn", !gameOver && currentPlayer === YELLOW);
  boardElement.classList.toggle("locked", gameOver || (onlineMode && (!socketOpen || currentPlayer !== myColor)));
  if (gameOver) { setStatus(winner ? colorName(winner) + " WINS!" : "DRAW GAME"); return; }
  if (onlineMode && !socketOpen) { setStatus("CONNECTING TO ROOM..."); return; }
  if (onlineMode) { setStatus(currentPlayer === myColor ? "YOUR TURN — " + colorName(myColor) : "OPPONENT'S TURN — " + colorName(currentPlayer)); return; }
  setStatus(currentPlayer === YELLOW ? "COMPUTER IS THINKING..." : "YOUR TURN — RED");
}
function render() {
  boardElement.innerHTML = "";
  const wins = new Set(winningCells.map(([r,c]) => r + "," + c));
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const cell = document.createElement("button");
    cell.type = "button"; cell.className = "cell" + (board[r][c] ? " filled" : "");
    cell.dataset.column = c;
    cell.setAttribute("role", "gridcell");
    cell.setAttribute("aria-label", "Column " + (c + 1) + ", row " + (r + 1) + ", " + (board[r][c] ? colorName(board[r][c]) : "empty"));
    if (board[r][c]) {
      const disc = document.createElement("span");
      disc.className = "disc " + board[r][c] + (lastDrop && lastDrop[0] === r && lastDrop[1] === c ? " fresh" : "") + (wins.has(r + "," + c) ? " winning" : "");
      cell.appendChild(disc);
    }
    boardElement.appendChild(cell);
  }
  updateStatus();
}
function play(column, color) {
  if (gameOver || color !== currentPlayer) return false;
  const row = drop(board, column, color);
  if (row < 0) return false;
  lastDrop = [row, column]; winningCells = winningLine(board, row, column, color);
  winner = winningCells.length ? color : EMPTY;
  gameOver = Boolean(winner) || board[0].every(value => value !== EMPTY);
  currentPlayer = other(color); revision++;
  render(); return true;
}
function reset() {
  if (cpuTimer) clearTimeout(cpuTimer);
  cpuTimer = null; board = emptyBoard(); currentPlayer = RED;
  gameOver = false; winner = EMPTY; winningCells = []; revision = 0; lastDrop = null;
  render();
}
function send(message) {
  if (!socketOpen || !socket || socket.readyState !== WebSocket.OPEN) return false;
  try { socket.send(JSON.stringify({game: "connectfour", room: roomId, clientId, player: playerNumber, ...message})); return true; }
  catch { return false; }
}
function validBoard(position) {
  return Array.isArray(position) && position.length === ROWS && position.every(row =>
    Array.isArray(row) && row.length === COLS && row.every(v => v === EMPTY || v === RED || v === YELLOW));
}
function installState(next) {
  if (!next || !validBoard(next.board) || !Number.isInteger(next.revision) || next.revision < 0 ||
      (next.currentPlayer !== RED && next.currentPlayer !== YELLOW) || typeof next.gameOver !== "boolean" ||
      ![EMPTY, RED, YELLOW].includes(next.winner)) return false;
  board = copyBoard(next.board); currentPlayer = next.currentPlayer;
  gameOver = next.gameOver; winner = next.winner; revision = next.revision;
  winningCells = []; lastDrop = null;
  if (winner) {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (board[r][c] === winner) { const line = winningLine(board, r, c, winner); if (line.length) { winningCells = line; break; } }
    }
  }
  render(); return true;
}
function onMessage(message) {
  if (!message || message.clientId === clientId || message.game !== "connectfour" ||
      String(message.room || "") !== roomId || String(message.player) === String(playerNumber)) return;
  if (message.type === "connectfourJoin") { send({type: "connectfourState", state: state()}); return; }
  if (message.type === "connectfourState") {
    if (message.state && message.state.revision > revision) installState(message.state);
    return;
  }
  if (message.type === "connectfourReset") { reset(); return; }
  if (message.type !== "connectfourMove" || !Number.isInteger(message.column) ||
      message.column < 0 || message.column >= COLS || gameOver ||
      currentPlayer !== (message.player === 1 ? RED : YELLOW) ||
      !message.state || message.state.revision !== revision + 1) return;
  const expected = copyBoard(board);
  if (drop(expected, message.column, currentPlayer) < 0 ||
      JSON.stringify(expected) !== JSON.stringify(message.state.board)) return;
  installState(message.state);
}
function connect() {
  if (!onlineMode || socketOpen || (socket && socket.readyState === WebSocket.CONNECTING)) return;
  const protocol = location.protocol === "https:" ? "wss:" : "ws:";
  socket = new WebSocket(protocol + "//" + location.host + "/checkers");
  socket.addEventListener("open", () => { socketOpen = true; send({type: "connectfourJoin"}); updateStatus(); });
  socket.addEventListener("message", event => { try { onMessage(JSON.parse(event.data)); } catch {} });
  socket.addEventListener("close", () => { socketOpen = false; setStatus("CONNECTION LOST — RECONNECTING..."); if (!reconnectTimer) reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, 1500); });
  socket.addEventListener("error", () => { socketOpen = false; setStatus("CONNECTION ERROR"); });
}
function bestComputerColumn() {
  const choices = [3,2,4,1,5,0,6].filter(c => board[0][c] === EMPTY);
  for (const color of [YELLOW, RED]) for (const c of choices) {
    const trial = copyBoard(board), row = drop(trial, c, color);
    if (winningLine(trial, row, c, color).length) return c;
  }
  return choices[Math.floor(Math.random() * Math.min(3, choices.length))];
}
boardElement.addEventListener("click", event => {
  const cell = event.target.closest(".cell"); if (!cell) return;
  if (onlineMode && (!socketOpen || currentPlayer !== myColor)) return;
  if (!onlineMode && currentPlayer !== RED) return;
  const column = Number(cell.dataset.column), color = onlineMode ? myColor : RED;
  if (!play(column, color)) return;
  if (onlineMode) send({type: "connectfourMove", column, state: state()});
  else if (!gameOver) cpuTimer = setTimeout(() => { cpuTimer = null; const choice = bestComputerColumn(); if (choice !== undefined) play(choice, YELLOW); }, 420);
});
document.getElementById("twoPlayer").addEventListener("click", () => { location.href = "rooms.html?game=connectfour"; });
document.getElementById("computer").addEventListener("click", () => { if (socket) socket.close(); location.href = "connectfour.html"; });
newGameButton.addEventListener("click", () => { if (onlineMode && !socketOpen) return; reset(); if (onlineMode) send({type: "connectfourReset"}); });
document.getElementById("menu").addEventListener("click", () => { if (socket) socket.close(); location.href = "index.html"; });
document.getElementById("twoPlayer").classList.toggle("active", onlineMode);
document.getElementById("computer").classList.toggle("active", !onlineMode);
document.getElementById("redName").textContent = onlineMode ? "PLAYER 1 · RED" : "YOU · RED";
document.getElementById("yellowName").textContent = onlineMode ? "PLAYER 2 · YELLOW" : "COMPUTER · YELLOW";
render(); if (onlineMode) connect();
</script>
</body>
</html>
