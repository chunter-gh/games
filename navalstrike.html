<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naval Strike</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020b12;
    font-family: Arial, Helvetica, sans-serif;
}

#viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
}

#stage {
    position: absolute;
    width: 1600px;
    height: 900px;
    left: 50%;
    top: 50%;
    transform-origin: center center;
}

/* =========================================================
   START SCREEN
   ========================================================= */

#startScreen {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 50% 45%, #124761 0%, #061b27 45%, #020b12 100%);
    overflow: hidden;
}

.startOcean {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 330px;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,0.035) 0px,
            rgba(255,255,255,0.035) 2px,
            transparent 2px,
            transparent 18px
        ),
        linear-gradient(#06334a, #020e18);
}

.startTitle {
    position: absolute;
    top: 105px;
    width: 100%;
    text-align: center;
    color: #dff8ff;
    font-size: 86px;
    font-weight: 900;
    letter-spacing: 12px;
    text-shadow:
        0 0 8px #39c9ff,
        0 0 25px #1688bd,
        4px 5px 0 #03131c;
}

.startSubtitle {
    position: absolute;
    top: 210px;
    width: 100%;
    text-align: center;
    color: #82c9df;
    font-size: 20px;
    letter-spacing: 7px;
}

.startButtons {
    position: absolute;
    top: 330px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 35px;
}

.modeButton {
    width: 285px;
    height: 85px;
    border: 2px solid #53cfff;
    border-radius: 8px;
    background:
        linear-gradient(
            180deg,
            rgba(22,91,122,0.95),
            rgba(5,32,46,0.98)
        );
    color: #e6fbff;
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 3px;
    cursor: pointer;
    box-shadow:
        inset 0 0 20px rgba(56,190,240,0.15),
        0 0 20px rgba(0,180,255,0.15);
    transition: 0.15s;
}

.modeButton:hover {
    transform: translateY(-3px);
    background:
        linear-gradient(
            180deg,
            rgba(35,119,153,0.98),
            rgba(7,44,61,1)
        );
    box-shadow:
        inset 0 0 25px rgba(56,190,240,0.25),
        0 0 30px rgba(0,180,255,0.3);
}

.startShip {
    position: absolute;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    height: 210px;
}

.startHull {
    position: absolute;
    bottom: 20px;
    left: 80px;
    width: 740px;
    height: 75px;
    background:
        linear-gradient(#44545d, #17242b 65%, #0a1115);
    clip-path: polygon(
        0 0,
        86% 0,
        100% 55%,
        91% 100%,
        12% 100%,
        0 48%
    );
    border-top: 4px solid #758992;
}

.startDeck {
    position: absolute;
    left: 175px;
    bottom: 90px;
    width: 530px;
    height: 32px;
    background: #53656d;
    transform: skewX(-15deg);
}

.startTower {
    position: absolute;
    left: 430px;
    bottom: 120px;
    width: 120px;
    height: 95px;
    background: linear-gradient(90deg, #29383f, #5c6d74, #243239);
    clip-path: polygon(
        18% 100%,
        18% 35%,
        0 35%,
        0 20%,
        100% 20%,
        100% 35%,
        82% 35%,
        82% 100%
    );
}

.startGun {
    position: absolute;
    left: 520px;
    bottom: 175px;
    width: 130px;
    height: 16px;
    background: #6d7d84;
    transform: rotate(-8deg);
    transform-origin: left center;
}

.startRadar {
    position: absolute;
    left: 462px;
    bottom: 190px;
    width: 55px;
    height: 55px;
    border: 3px solid #91a9b1;
    border-radius: 50%;
}

/* =========================================================
   GAME SCREEN
   ========================================================= */

#gameScreen {
    position: absolute;
    inset: 0;
    display: none;
    background:
        linear-gradient(
            180deg,
            #071d29 0%,
            #0a3143 40%,
            #0b4055 100%
        );
    overflow: hidden;
}

.sky {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(
            ellipse at 60% 30%,
            rgba(190,225,235,0.16),
            transparent 35%
        ),
        linear-gradient(
            180deg,
            rgba(108,171,194,0.15),
            transparent 55%
        );
}

.cloud {
    position: absolute;
    background: rgba(224,244,248,0.55);
    border-radius: 50%;
    filter: blur(8px);
}

.cloud.c1 {
    width: 430px;
    height: 100px;
    top: 105px;
    left: 820px;
}

.cloud.c2 {
    width: 300px;
    height: 80px;
    top: 165px;
    left: 1060px;
}

.cloud.c3 {
    width: 390px;
    height: 90px;
    top: 260px;
    left: 870px;
}

.ocean {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 530px;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(128,221,241,0.07) 0px,
            rgba(128,221,241,0.07) 2px,
            transparent 2px,
            transparent 30px
        ),
        linear-gradient(
            180deg,
            rgba(7,65,87,0.35),
            #031c2b
        );
}

.gameTitle {
    position: absolute;
    top: 22px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 43px;
    font-weight: 900;
    letter-spacing: 8px;
    color: #e8fbff;
    text-shadow:
        0 0 10px #31c6ff,
        3px 4px 0 #021017;
}

.topStatus {
    position: absolute;
    top: 82px;
    left: 50%;
    transform: translateX(-50%);
    color: #91d9ee;
    font-size: 18px;
    letter-spacing: 4px;
}

/* =========================================================
   RADAR
   ========================================================= */

#radarPanel {
    position: absolute;
    left: 55px;
    top: 140px;
    width: 470px;
    height: 570px;
    padding: 20px;
    border: 2px solid #3986a4;
    background:
        linear-gradient(
            145deg,
            rgba(5,28,39,0.94),
            rgba(3,18,28,0.96)
        );
    box-shadow:
        inset 0 0 35px rgba(0,170,220,0.08),
        0 0 25px rgba(0,0,0,0.5);
}

.panelLabel {
    color: #83d5ec;
    text-align: center;
    font-size: 20px;
    letter-spacing: 5px;
    margin-bottom: 13px;
}

#radar {
    width: 400px;
    height: 400px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);
    border: 2px solid #65c8e7;
    background:
        radial-gradient(
            circle,
            rgba(23,119,145,0.18),
            rgba(1,22,31,0.8)
        );
}

.radarCell {
    position: relative;
    border: 1px solid rgba(70,164,189,0.35);
    cursor: crosshair;
    transition: background 0.08s;
}

.radarCell:hover {
    background: rgba(67,188,218,0.16);
}

.radarCell::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    background: rgba(94,209,237,0.45);
}

.radarCell.hit {
    background:
        radial-gradient(
            circle,
            rgba(255,75,35,0.95),
            rgba(132,20,10,0.75)
        );
}

.radarCell.hit::after {
    content: "X";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 28px;
    font-weight: bold;
}

.radarCell.miss {
    background:
        radial-gradient(
            circle,
            rgba(80,205,236,0.55),
            rgba(9,62,79,0.7)
        );
}

.radarCell.miss::after {
    content: "•";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #d5f7ff;
    font-size: 30px;
}

.radarLabels {
    display: flex;
    justify-content: space-between;
    margin: 8px 4px 0;
    color: #558da1;
    font-size: 12px;
}

.statusBox {
    margin-top: 16px;
    padding: 12px;
    min-height: 50px;
    border: 1px solid #265a70;
    background: rgba(0,15,23,0.75);
    text-align: center;
    color: #a5e6f5;
    font-size: 15px;
    letter-spacing: 2px;
}

/* =========================================================
   DESTROYER
   ========================================================= */

#shipArea {
    position: absolute;
    left: 550px;
    top: 145px;
    width: 995px;
    height: 570px;
}

.shipLabel {
    position: absolute;
    left: 0;
    top: 0;
    color: #82cfe6;
    font-size: 19px;
    letter-spacing: 4px;
}

.destroyer {
    position: absolute;
    left: 50px;
    top: 70px;
    width: 820px;
    height: 455px;
}

.hull {
    position: absolute;
    left: 0;
    bottom: 55px;
    width: 820px;
    height: 155px;
    background:
        linear-gradient(
            180deg,
            #53656d 0%,
            #293940 28%,
            #101b20 72%,
            #070d11 100%
        );
    clip-path: polygon(
        0 0,
        90% 0,
        100% 25%,
        93% 78%,
        78% 100%,
        10% 100%,
        0 50%
    );
    border-top: 4px solid #8799a0;
}

.hullLine {
    position: absolute;
    left: 70px;
    bottom: 125px;
    width: 650px;
    height: 4px;
    background: #789099;
    opacity: 0.55;
}

.deck {
    position: absolute;
    left: 80px;
    bottom: 190px;
    width: 650px;
    height: 40px;
    background:
        repeating-linear-gradient(
            90deg,
            #65757b 0px,
            #65757b 30px,
            #4d5d63 30px,
            #4d5d63 34px
        );
    transform: skewX(-12deg);
    border-top: 3px solid #9caeb4;
}

.bridge {
    position: absolute;
    left: 365px;
    bottom: 220px;
    width: 180px;
    height: 145px;
    background:
        linear-gradient(
            90deg,
            #26373e,
            #65777e 50%,
            #25343a
        );
    clip-path: polygon(
        15% 100%,
        15% 40%,
        0 40%,
        0 22%,
        100% 22%,
        100% 40%,
        85% 40%,
        85% 100%
    );
}

.bridgeWindow {
    position: absolute;
    left: 382px;
    bottom: 315px;
    width: 145px;
    height: 25px;
    background:
        repeating-linear-gradient(
            90deg,
            #071b25 0px,
            #071b25 18px,
            #4b7887 18px,
            #4b7887 21px
        );
    transform: skewX(-8deg);
}

.mast {
    position: absolute;
    left: 445px;
    bottom: 350px;
    width: 8px;
    height: 90px;
    background: #75878e;
}

.mastArm {
    position: absolute;
    left: 410px;
    bottom: 420px;
    width: 100px;
    height: 5px;
    background: #75878e;
}

.gun {
    position: absolute;
    left: 180px;
    bottom: 235px;
    width: 135px;
    height: 42px;
    border-radius: 50% 50% 5px 5px;
    background: #3c4c53;
}

.gunBarrel {
    position: absolute;
    left: 230px;
    bottom: 258px;
    width: 150px;
    height: 16px;
    background: #73858c;
    transform: rotate(-3deg);
    transform-origin: left center;
}

/* =========================================================
   MISSILE BANK
   ========================================================= */

#missileBank {
    position: absolute;
    left: 540px;
    top: 70px;
    width: 330px;
    height: 370px;
    padding: 14px;
    border: 2px solid #60777f;
    background:
        linear-gradient(
            145deg,
            rgba(30,43,48,0.98),
            rgba(7,16,20,0.98)
        );
    box-shadow:
        inset 0 0 30px rgba(255,255,255,0.04),
        0 0 20px rgba(0,0,0,0.45);
}

.bankTitle {
    text-align: center;
    color: #c8d8dc;
    font-size: 15px;
    letter-spacing: 3px;
    margin-bottom: 10px;
}

#missileGrid {
    width: 300px;
    height: 300px;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);
    gap: 3px;
}

.missileCell {
    position: relative;
    border: 1px solid #53656b;
    background:
        linear-gradient(
            135deg,
            #66777d,
            #263239
        );
    border-radius: 2px;
}

.missileCell::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 4px;
    bottom: 4px;
    width: 5px;
    transform: translateX(-50%);
    border-radius: 3px;
    background:
        linear-gradient(
            180deg,
            #d6e2e5,
            #6f858d 35%,
            #27343a 100%
        );
}

.missileCell.used {
    opacity: 0.2;
}

.bankCount {
    text-align: center;
    color: #9db4bb;
    font-size: 14px;
    margin-top: 9px;
    letter-spacing: 2px;
}

/* =========================================================
   FIRE BUTTON
   ========================================================= */

#fireButton {
    position: absolute;
    right: 20px;
    bottom: 38px;
    width: 220px;
    height: 68px;
    border: 2px solid #e3a46b;
    border-radius: 7px;
    background:
        linear-gradient(
            180deg,
            #8b3d21,
            #39170e
        );
    color: #ffe4c9;
    font-size: 23px;
    font-weight: bold;
    letter-spacing: 3px;
    cursor: pointer;
    box-shadow:
        inset 0 0 18px rgba(255,150,80,0.15),
        0 0 20px rgba(255,80,30,0.12);
}

#fireButton:hover {
    background:
        linear-gradient(
            180deg,
            #a64d28,
            #4b1d10
        );
}

#fireButton:disabled {
    opacity: 0.4;
    cursor: default;
}

/* =========================================================
   GAME ROOM
   ========================================================= */

#roomButton {
    position: absolute;
    left: 30px;
    bottom: 25px;
    width: 185px;
    height: 48px;
    border: 1px solid #5190a8;
    background: rgba(4,26,37,0.9);
    color: #9ddbec;
    font-size: 15px;
    letter-spacing: 2px;
    cursor: pointer;
}

#roomButton:hover {
    background: rgba(16,63,80,0.95);
}

/* =========================================================
   MISSILE ANIMATION
   ========================================================= */

#missile {
    position: absolute;
    width: 18px;
    height: 80px;
    display: none;
    z-index: 100;
    transform-origin: center center;
}

.missileBody {
    position: absolute;
    left: 4px;
    top: 0;
    width: 10px;
    height: 57px;
    border-radius: 7px 7px 2px 2px;
    background:
        linear-gradient(
            90deg,
            #667b83,
            #e1ecef,
            #62777f
        );
    box-shadow: 0 0 8px rgba(255,255,255,0.3);
}

.missileNose {
    position: absolute;
    left: 4px;
    top: -9px;
    width: 10px;
    height: 14px;
    background: #d9e7ea;
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
}

.missileFlame {
    position: absolute;
    left: 3px;
    top: 52px;
    width: 12px;
    height: 35px;
    background:
        linear-gradient(
            180deg,
            #fff6c7,
            #ff9b32,
            transparent
        );
    filter: blur(1px);
    clip-path: polygon(
        30% 0,
        70% 0,
        100% 100%,
        50% 70%,
        0 100%
    );
}

/* =========================================================
   RESULT OVERLAY
   ========================================================= */

#resultOverlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,7,11,0.72);
    z-index: 200;
}

.resultBox {
    width: 600px;
    padding: 45px;
    border: 2px solid #56c8eb;
    background:
        linear-gradient(
            145deg,
            rgba(8,42,56,0.98),
            rgba(2,17,26,0.98)
        );
    text-align: center;
    box-shadow: 0 0 50px rgba(0,180,255,0.18);
}

#resultTitle {
    font-size: 60px;
    font-weight: 900;
    color: #e8fbff;
    letter-spacing: 8px;
    margin-bottom: 15px;
}

#resultText {
    color: #94d9eb;
    font-size: 20px;
    letter-spacing: 3px;
    margin-bottom: 30px;
}

.resultButton {
    width: 220px;
    height: 55px;
    margin: 8px;
    border: 1px solid #53c9ed;
    background: #082b3a;
    color: #d8f7ff;
    font-size: 16px;
    letter-spacing: 2px;
    cursor: pointer;
}

.resultButton:hover {
    background: #0e4b61;
}

/* =========================================================
   MOBILE / SMALL SCREEN
   ========================================================= */

@media (max-width: 700px) {
    .startTitle {
        font-size: 70px;
    }
}
</style>
</head>

<body>

<div id="viewport">

<div id="stage">

    <!-- =====================================================
         START SCREEN
         ===================================================== -->

    <div id="startScreen">

        <div class="startTitle">
            NAVAL STRIKE
        </div>

        <div class="startSubtitle">
            TACTICAL NAVAL COMBAT SYSTEM
        </div>

        <div class="startButtons">

            <button
                class="modeButton"
                id="twoPlayerButton">
                2 PLAYER
            </button>

            <button
                class="modeButton"
                id="computerButton">
                VS COMPUTER
            </button>

        </div>

        <div class="startShip">

            <div class="startHull"></div>
            <div class="startDeck"></div>
            <div class="startTower"></div>
            <div class="startGun"></div>
            <div class="startRadar"></div>

        </div>

        <div class="startOcean"></div>

    </div>


    <!-- =====================================================
         GAME SCREEN
         ===================================================== -->

    <div id="gameScreen">

        <div class="sky"></div>

        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
        <div class="cloud c3"></div>

        <div class="ocean"></div>

        <div class="gameTitle">
            NAVAL STRIKE
        </div>

        <div
            class="topStatus"
            id="turnDisplay">
            YOUR TURN
        </div>


        <!-- RADAR -->

        <div id="radarPanel">

            <div class="panelLabel">
                TARGETING RADAR
            </div>

            <div id="radar"></div>

            <div class="radarLabels">
                <span>1</span>
                <span>2</span>
                <span>3</span>
                <span>4</span>
                <span>5</span>
                <span>6</span>
                <span>7</span>
                <span>8</span>
                <span>9</span>
                <span>10</span>
            </div>

            <div
                class="statusBox"
                id="statusBox">
                SELECT A RADAR TARGET
            </div>

        </div>


        <!-- SHIP -->

        <div id="shipArea">

            <div class="shipLabel">
                FORWARD DESTROYER
            </div>

            <div class="destroyer">

                <div class="hull"></div>

                <div class="hullLine"></div>

                <div class="deck"></div>

                <div class="bridge"></div>

                <div class="bridgeWindow"></div>

                <div class="mast"></div>

                <div class="mastArm"></div>

                <div class="gun"></div>

                <div class="gunBarrel"></div>

            </div>


            <!-- MISSILE BANK -->

            <div id="missileBank">

                <div class="bankTitle">
                    MISSILE LAUNCH BANK — 100
                </div>

                <div id="missileGrid"></div>

                <div
                    class="bankCount"
                    id="ammoCount">
                    MISSILES READY: 100
                </div>

            </div>


            <button id="fireButton">
                FIRE MISSILE
            </button>

        </div>


        <button id="roomButton">
            GAME ROOM
        </button>


        <!-- FLYING MISSILE -->

        <div id="missile">

            <div class="missileNose"></div>
            <div class="missileBody"></div>
            <div class="missileFlame"></div>

        </div>


        <!-- RESULT -->

        <div id="resultOverlay">

            <div class="resultBox">

                <div id="resultTitle">
                    VICTORY
                </div>

                <div id="resultText">
                    ENEMY FLEET DESTROYED
                </div>

                <button
                    class="resultButton"
                    id="againButton">
                    PLAY AGAIN
                </button>

                <button
                    class="resultButton"
                    id="resultRoomButton">
                    GAME ROOM
                </button>

            </div>

        </div>

    </div>

</div>
</div>


<script>
/* =========================================================
   SCREEN SCALING
   ========================================================= */

const DESIGN_WIDTH = 1600;
const DESIGN_HEIGHT = 900;

const stage =
    document.getElementById("stage");

function resizeStage() {

    const availableWidth =
        window.innerWidth;

    const availableHeight =
        window.innerHeight;

    const scaleX =
        availableWidth / DESIGN_WIDTH;

    const scaleY =
        availableHeight / DESIGN_HEIGHT;

    const scale =
        Math.min(scaleX, scaleY);

    stage.style.transform =
        "translate(-50%, -50%) scale(" +
        scale +
        ")";

}

window.addEventListener(
    "resize",
    resizeStage
);

window.addEventListener(
    "orientationchange",
    resizeStage
);

if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "resize",
        resizeStage
    );

}

resizeStage();


/* =========================================================
   AUDIO ENGINE
   ========================================================= */

let audioContext = null;
let masterGain = null;
let oceanGain = null;
let oceanStarted = false;


/* Initialize audio after user interaction */

function initAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        masterGain =
            audioContext.createGain();

        masterGain.gain.value = 0.72;

        masterGain.connect(
            audioContext.destination
        );

        oceanGain =
            audioContext.createGain();

        oceanGain.gain.value = 0.035;

        oceanGain.connect(
            masterGain
        );

    }

    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }

    if (!oceanStarted) {

        startOceanSound();

        oceanStarted = true;

    }

}


/* Basic synthesized tone */

function tone(
    frequency,
    duration,
    type = "sine",
    volume = 0.1,
    slideTo = null
) {

    if (!audioContext) {
        return;
    }

    const now =
        audioContext.currentTime;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type =
        type;

    oscillator.frequency.setValueAtTime(
        frequency,
        now
    );

    if (slideTo !== null) {

        oscillator.frequency.exponentialRampToValueAtTime(
            slideTo,
            now + duration
        );

    }

    gain.gain.setValueAtTime(
        0.0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        now + 0.01
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );

    oscillator.connect(gain);
    gain.connect(masterGain);

    oscillator.start(now);
    oscillator.stop(
        now + duration + 0.01
    );

}


/* Noise */

function noise(
    duration,
    volume = 0.12
) {

    if (!audioContext) {
        return;
    }

    const bufferSize =
        audioContext.sampleRate *
        duration;

    const buffer =
        audioContext.createBuffer(
            1,
            bufferSize,
            audioContext.sampleRate
        );

    const data =
        buffer.getChannelData(0);

    for (
        let i = 0;
        i < bufferSize;
        i++
    ) {

        data[i] =
            Math.random() * 2 - 1;

    }

    const source =
        audioContext.createBufferSource();

    const gain =
        audioContext.createGain();

    source.buffer = buffer;

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioContext.currentTime +
        duration
    );

    source.connect(gain);
    gain.connect(masterGain);

    source.start();
}


/* Low ocean ambience */

function startOceanSound() {

    if (!audioContext) {
        return;
    }

    const bufferSize =
        audioContext.sampleRate * 2;

    const buffer =
        audioContext.createBuffer(
            1,
            bufferSize,
            audioContext.sampleRate
        );

    const data =
        buffer.getChannelData(0);

    for (
        let i = 0;
        i < bufferSize;
        i++
    ) {

        data[i] =
            Math.random() * 2 - 1;

    }

    const source =
        audioContext.createBufferSource();

    const filter =
        audioContext.createBiquadFilter();

    filter.type = "lowpass";
    filter.frequency.value = 600;

    source.buffer = buffer;
    source.loop = true;

    source.connect(filter);
    filter.connect(oceanGain);

    source.start();
}

/* =========================================================
   RADAR TARGETING SOUND
   MECHANICAL CLICK / CALIBRATION
   ========================================================= */

let radarSoundReady = true;

function soundRadar() {

    if (!audioContext) {
        return;
    }

    /*
       Prevent the radar from machine-gunning
       clicks when the mouse sweeps rapidly
       across several cells.
    */

    if (!radarSoundReady) {
        return;
    }

    radarSoundReady = false;

    setTimeout(() => {

        radarSoundReady = true;

    }, 65);


    const now =
        audioContext.currentTime;


    /*
       First sound:
       short hard mechanical switch/click
    */

    const click =
        audioContext.createOscillator();

    const clickGain =
        audioContext.createGain();

    click.type =
        "square";

    click.frequency.setValueAtTime(
        1450,
        now
    );

    clickGain.gain.setValueAtTime(
        0.0001,
        now
    );

    clickGain.gain.exponentialRampToValueAtTime(
        0.065,
        now + 0.003
    );

    clickGain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.032
    );

    click.connect(clickGain);
    clickGain.connect(masterGain);

    click.start(now);

    click.stop(
        now + 0.038
    );


    /*
       Second sound:
       tiny servo/calibration movement
    */

    setTimeout(() => {

        if (!audioContext) {
            return;
        }

        const t =
            audioContext.currentTime;

        const servo =
            audioContext.createOscillator();

        const servoGain =
            audioContext.createGain();

        servo.type =
            "triangle";

        servo.frequency.setValueAtTime(
            520,
            t
        );

        servo.frequency.exponentialRampToValueAtTime(
            280,
            t + 0.055
        );

        servoGain.gain.setValueAtTime(
            0.0001,
            t
        );

        servoGain.gain.exponentialRampToValueAtTime(
            0.04,
            t + 0.008
        );

        servoGain.gain.exponentialRampToValueAtTime(
            0.0001,
            t + 0.065
        );

        servo.connect(servoGain);
        servoGain.connect(masterGain);

        servo.start(t);

        servo.stop(
            t + 0.07
        );

    }, 35);

}

/* =========================================================
   GAME DATA
   ========================================================= */

let gameMode = null;

let selectedTarget = null;

let missilesRemaining = 100;

let gameOver = false;

let firing = false;


/*
   Hidden enemy fleet.

   Coordinates are row/column positions.
*/

let enemyFleet = [];


/* Standard naval fleet */

const fleetSizes = [
    5,
    4,
    3,
    3,
    2
];


/* =========================================================
   RANDOM FLEET GENERATION
   ========================================================= */

function generateFleet() {

    const occupied = new Set();

    const fleet = [];

    for (
        const size of fleetSizes
    ) {

        let placed = false;

        while (!placed) {

            const horizontal =
                Math.random() < 0.5;

            const row =
                Math.floor(
                    Math.random() * 10
                );

            const col =
                Math.floor(
                    Math.random() * 10
                );

            const cells = [];

            let valid = true;

            for (
                let i = 0;
                i < size;
                i++
            ) {

                const r =
                    horizontal
                        ? row
                        : row + i;

                const c =
                    horizontal
                        ? col + i
                        : col;

                if (
                    r < 0 ||
                    r >= 10 ||
                    c < 0 ||
                    c >= 10
                ) {

                    valid = false;
                    break;

                }

                const key =
                    r + "," + c;

                if (
                    occupied.has(key)
                ) {

                    valid = false;
                    break;

                }

                cells.push({
                    row: r,
                    col: c
                });

            }

            if (!valid) {
                continue;
            }

            cells.forEach(
                cell => {

                    occupied.add(
                        cell.row +
                        "," +
                        cell.col
                    );

                }
            );

            fleet.push({
                size,
                cells,
                hits: new Set()
            });

            placed = true;

        }

    }

    return fleet;
}


/* =========================================================
   BUILD RADAR
   ========================================================= */

const radar =
    document.getElementById("radar");

function buildRadar() {

    radar.innerHTML = "";

    for (
        let row = 0;
        row < 10;
        row++
    ) {

        for (
            let col = 0;
            col < 10;
            col++
        ) {

            const cell =
                document.createElement(
                    "div"
                );

            cell.className =
                "radarCell";

            cell.dataset.row =
                row;

            cell.dataset.col =
                col;

            cell.addEventListener(
                "mouseenter",
                () => {

                    if (
                        !gameOver &&
                        !firing
                    ) {

                        soundRadar();

                    }

                }
            );

            cell.addEventListener(
                "click",
                () => {

                    if (
                        gameOver ||
                        firing
                    ) {
                        return;
                    }

                    soundButton();

                    selectTarget(
                        row,
                        col
                    );

                }
            );

            radar.appendChild(
                cell
            );

        }

    }

}


/* =========================================================
   MISSILE BANK
   ========================================================= */

const missileGrid =
    document.getElementById(

function buildMissileBank() {

    missileGrid.innerHTML = "";

    for (

        i < 100;
        i++

/* =========================================================
   TARGET SELECTION
   ========================================================= */

function selectTarget(
    row,
    col
) {

    const cell =
        radar.children[
            row * 10 + col
        ];

    if (
        cell.classList.contains("hit") ||
        cell.classList.contains("miss")
    ) {

        return;

    }

    selectedTarget = {
        row,
        col
    };

    document
        .querySelectorAll(
            ".radarCell"
        )
        .forEach(
            c => {
                c.style.outline =
                    "none";
            }
        );

    cell.style.outline =
        "2px solid #ffffff";

    document.getElementById(
        "statusBox"
    ).textContent =
        "TARGET LOCKED — " +
        String.fromCharCode(
            65 + row
        ) +
        (col + 1) +
        " — FIRE WHEN READY";

}


/* =========================================================
   FIRE
   ========================================================= */

document
    .getElementById("fireButton")
    .addEventListener(
        "click",
        () => {

            if (
                !selectedTarget ||
                firing ||
                gameOver
            ) {

                return;

            }

            fireAt(
                selectedTarget.row,
                selectedTarget.col
            );

        }
    );


function fireAt(
    row,
    col
) {

    if (
        firing ||
        gameOver
    ) {

        return;

    }

    const cell =
        radar.children[
            row * 10 + col
        ];

    if (
        cell.classList.contains("hit") ||
        cell.classList.contains("miss")
    ) {

        return;

    }

    selectedTarget = {
        row,
        col
    };

    firing = true;

    document.getElementById(
        "fireButton"
    ).disabled = true;

    missilesRemaining--;

    updateAmmo();

    markMissileUsed();

    soundLaunch();

    launchMissile(
        row,
        col
    );

}


/* =========================================================
   MISSILE LAUNCH ANIMATION
   ========================================================= */

function launchMissile(
    row,
    col
) {

    const missile =
        document.getElementById(
            "missile"
        );

    const radarCell =
        radar.children[
            row * 10 + col
        ];

    const stageRect =
        stage.getBoundingClientRect();

    const cellRect =
        radarCell.getBoundingClientRect();

    const stageScale =
        stageRect.width /
        DESIGN_WIDTH;

    const targetX =
        (
            cellRect.left +
            cellRect.width / 2 -
            stageRect.left
        ) / stageScale;

    const targetY =
        (
            cellRect.top +
            cellRect.height / 2 -
            stageRect.top
        ) / stageScale;


    const startX = 895;
    const startY = 405;

    missile.style.left =
        startX + "px";

    missile.style.top =
        startY + "px";

    missile.style.display =
        "block";

    const dx =
        targetX - startX;

    const dy =
        targetY - startY;

    const angle =
        Math.atan2(
            dy,
            dx
        ) * 180 / Math.PI + 90;

    missile.style.transform =
        "rotate(" + angle + "deg)";


    soundFlight();


    const duration =
        900;


    const startTime =
        performance.now();


    function animate(
        currentTime
    ) {

        const elapsed =
            currentTime -
            startTime;

        const progress =
            Math.min(
                elapsed / duration,
                1
            );

        const eased =
            1 -
            Math.pow(
                1 - progress,
                2
            );

        const x =
            startX +
            dx * eased;

        const y =
            startY +
            dy * eased;

        missile.style.left =
            x + "px";

        missile.style.top =
            y + "px";

        if (
            progress < 1
        ) {

            requestAnimationFrame(
                animate
            );

        } else {

            missile.style.display =
                "none";

            resolveShot(
                row,
                col
            );

        }

    }

    requestAnimationFrame(
        animate
    );

}


/* =========================================================
   RESOLVE SHOT
   ========================================================= */

function resolveShot(
    row,
    col
) {

    const cell =
        radar.children[
            row * 10 + col
        ];

    let hit =
        false;

    for (
        const ship of enemyFleet
    ) {

        const matching =
            ship.cells.find(
                c =>
                    c.row === row &&
                    c.col === col
            );

        if (matching) {

            hit = true;

            ship.hits.add(
                row + "," + col
            );

            break;

        }

    }


    if (hit) {

        cell.classList.add(
            "hit"
        );

        soundHit();

        document.getElementById(
            "statusBox"
        ).textContent =
            "DIRECT HIT — TARGET DAMAGED";


        if (
            allShipsDestroyed()
        ) {

            setTimeout(
                showVictory,
                700
            );

            return;

        }

    } else {

        cell.classList.add(
            "miss"
        );

        soundMiss();

        document.getElementById(
            "statusBox"
        ).textContent =
            "MISS — WATER IMPACT";

    }


    selectedTarget = null;

    cell.style.outline =
        "none";

    firing = false;

    document.getElementById(
        "fireButton"
    ).disabled = false;

}


/* =========================================================
   CHECK FLEET
   ========================================================= */

function allShipsDestroyed() {

    return enemyFleet.every(
        ship =>
            ship.hits.size ===
            ship.cells.length
    );

}


/* =========================================================
   COMPUTER TURN
   ========================================================= */

function computerTurn() {

    /*
       Current prototype keeps
       the player's targeting flow.
       Full two-fleet computer combat
       can be added to the server game.
    */

    document.getElementById(
        "turnDisplay"
    ).textContent =
        "YOUR TURN";

    document.getElementById(
        "statusBox"
    ).textContent =
        "COMPUTER FIRED — YOUR TURN";

    soundTurn();

}


/* =========================================================
   AMMO
   ========================================================= */

function updateAmmo() {

    document.getElementById(
        "ammoCount"
    ).textContent =
        "MISSILES READY: " +
        missilesRemaining;

}


function markMissileUsed() {

    const used =
        100 -
        missilesRemaining;

    if (
        used >= 1 &&
        used <= 100
    ) {

        const cell =
            missileGrid.children[
                used - 1
            ];

        if (cell) {

            cell.classList.add(
                "used"
            );

        }

    }

}


/* =========================================================
   START GAME
   ========================================================= */

function startGame(
    mode
) {

    initAudio();

    soundButton();

    gameMode =
        mode;

    gameOver =
        false;

    firing =
        false;

    selectedTarget =
        null;

    missilesRemaining =
        100;

    enemyFleet =
        generateFleet();

    buildRadar();

    buildMissileBank();

    updateAmmo();

    document.getElementById(
        "turnDisplay"
    ).textContent =
        "YOUR TURN";

    document.getElementById(
        "statusBox"
    ).textContent =
        mode === "computer"
            ? "TARGETING COMPUTER FLEET"
            : "TARGETING ENEMY FLEET";

    document.getElementById(
        "fireButton"
    ).disabled =
        false;

    document.getElementById(
        "resultOverlay"
    ).style.display =
        "none";

    document.getElementById(
        "startScreen"
    ).style.display =
        "none";

    document.getElementById(
        "gameScreen"
    ).style.display =
        "block";

}


/* =========================================================

function showVictory() {
