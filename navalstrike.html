<script>
/* =========================================================
   SCREEN SCALING
   ========================================================= */

const DESIGN_WIDTH = 1600;
const DESIGN_HEIGHT = 900;

const stage =
    document.getElementById("stage");

function resizeStage() {

    const availableWidth =
        window.innerWidth;

    const availableHeight =
        window.innerHeight;

    const scaleX =
        availableWidth / DESIGN_WIDTH;

    const scaleY =
        availableHeight / DESIGN_HEIGHT;

    const scale =
        Math.min(
            scaleX,
            scaleY
        );

    stage.style.transform =
        "translate(-50%, -50%) scale(" +
        scale +
        ")";

}

window.addEventListener(
    "resize",
    resizeStage
);

window.addEventListener(
    "orientationchange",
    resizeStage
);

if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "resize",
        resizeStage
    );

}

resizeStage();


/* =========================================================
   AUDIO
   ========================================================= */

let audioContext = null;
let masterGain = null;
let oceanGain = null;
let oceanStarted = false;


/* =========================================================
   INITIALIZE AUDIO
   ========================================================= */

function initAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        masterGain =
            audioContext.createGain();

        masterGain.gain.value =
            0.9;

        masterGain.connect(
            audioContext.destination
        );

        oceanGain =
            audioContext.createGain();

        oceanGain.gain.value =
            0.025;

        oceanGain.connect(
            masterGain
        );

    }

    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }

    if (!oceanStarted) {

        startOceanSound();

        oceanStarted =
            true;

    }

}


/* =========================================================
   TONE
   ========================================================= */

function tone(
    frequency,
    duration,
    type = "sine",
    volume = 0.1,
    slideTo = null
) {

    if (!audioContext) {
        return;
    }

    const now =
        audioContext.currentTime;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type =
        type;

    oscillator.frequency.setValueAtTime(
        frequency,
        now
    );

    if (slideTo !== null) {

        oscillator.frequency.exponentialRampToValueAtTime(
            slideTo,
            now + duration
        );

    }

    gain.gain.setValueAtTime(
        0.0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        now + 0.008
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );

    oscillator.connect(gain);

    gain.connect(
        masterGain
    );

    oscillator.start(now);

    oscillator.stop(
        now + duration + 0.015
    );

}


/* =========================================================
   NOISE
   ========================================================= */

function noise(
    duration,
    volume = 0.15,
    filterFrequency = null
) {

    if (!audioContext) {
        return;
    }

    const bufferSize =
        Math.max(
            1,
            Math.floor(
                audioContext.sampleRate *
                duration
            )
        );

    const buffer =
        audioContext.createBuffer(
            1,
            bufferSize,
            audioContext.sampleRate
        );

    const data =
        buffer.getChannelData(0);

    for (
        let i = 0;
        i < bufferSize;
        i++
    ) {

        data[i] =
            Math.random() * 2 - 1;

    }

    const source =
        audioContext.createBufferSource();

    const gain =
        audioContext.createGain();

    source.buffer =
        buffer;

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioContext.currentTime +
        duration
    );

    if (filterFrequency) {

        const filter =
            audioContext.createBiquadFilter();

        filter.type =
            "lowpass";

        filter.frequency.value =
            filterFrequency;

        source.connect(filter);

        filter.connect(gain);

    } else {

        source.connect(gain);

    }

    gain.connect(
        masterGain
    );

    source.start();

}


/* =========================================================
   OCEAN
   ========================================================= */

function startOceanSound() {

    if (!audioContext) {

    ) {

    }

}

/* =========================================================
   GAME DATA
   ========================================================= */

let gameMode = null;

const fleetSizes = [
    5,
    4,
    3,
    3,
    2
];


/* =========================================================
   GENERATE ENEMY FLEET
   ========================================================= */

function generateFleet() {

    const occupied =
        new Set();

    const fleet =
        [];

    for (
        const size of fleetSizes
    ) {

        let placed =
            false;

        while (!placed) {

            const horizontal =
                Math.random() < 0.5;

            const row =
                Math.floor(
                    Math.random() * 10
                );

            const col =
                Math.floor(
                    Math.random() * 10
                );

            const cells =
                [];

            let valid =
                true;

            for (
                let i = 0;
                i < size;
                i++
            ) {

                const r =
                    horizontal
                        ? row
                        : row + i;

                const c =
                    horizontal
                        ? col + i
                        : col;

                if (
                    r < 0 ||
                    r >= 10 ||
                    c < 0 ||
                    c >= 10
                ) {

                    valid =
                        false;

                    break;

                }

                const key =
                    r + "," + c;

                if (
                    occupied.has(key)
                ) {

                    valid =
                        false;

                    break;

                }

                cells.push({
                    row: r,
                    col: c
                });

            }

            if (!valid) {
                continue;
            }

            cells.forEach(
                cell => {

                    occupied.add(
                        cell.row +
                        "," +
                        cell.col
                    );

                }
            );

            fleet.push({
                size: size,
                cells: cells,
                hits: new Set()
            });

            placed =
                true;

        }

    }

    return fleet;

}


/* =========================================================
   BUILD RADAR
   ========================================================= */

const radar =
    document.getElementById(
        "radar"
    );

function buildRadar() {

    radar.innerHTML =
        "";

    for (
        let row = 0;
        row < 10;
        row++
    ) {

        for (
            let col = 0;
            col < 10;
            col++
        ) {

            const cell =
                document.createElement(
                    "div"
                );

            cell.className =
                "radarCell";

            cell.dataset.row =
                row;

            cell.dataset.col =
                col;


            /* Hover = targeting/calibration */

            cell.addEventListener(
                "mouseenter",
                () => {

                    if (
                        !gameOver &&
                        !firing &&
                        !cell.classList.contains(
                            "hit"
                        ) &&
                        !cell.classList.contains(
                            "miss"
                        )
                    ) {

                        soundRadar();

                    }

                }
            );


            /* CLICK = FIRE IMMEDIATELY */

            cell.addEventListener(
                "click",
                () => {

                    if (
                        gameOver ||
                        firing
                    ) {

                        return;

                    }

                    fireAt(
                        row,
                        col
                    );

                }
            );

            radar.appendChild(
                cell
            );

        }

    }

}

/* =========================================================
   FIRE IMMEDIATELY
   ========================================================= */

function fireAt(
    row,
    col
) {

    if (
        firing ||
        gameOver
    ) {

        return;

    }

    const cell =
        radar.children[
            row * 10 + col
        ];

    if (
        cell.classList.contains(
            "hit"
        ) ||
        cell.classList.contains(
            "miss"
        )
    ) {

        return;

    }

    firing =
        true;

    cell.style.outline =
        "2px solid white";

    missilesRemaining--;

    updateAmmo();

    markMissileUsed();

    /*
       Clicking a radar square now
       directly launches the missile.
    */

    soundLaunch();

    launchMissile(
        row,
        col
    );

}


/* =========================================================
   LAUNCH MISSILE
   ========================================================= */

function launchMissile(
    row,
    col
) {

    const missile =
        document.getElementById(
            "missile"
        );

    const radarCell =
        radar.children[
            row * 10 + col
        ];

    const stageRect =
        stage.getBoundingClientRect();

    const cellRect =
        radarCell.getBoundingClientRect();

    const stageScale =
        stageRect.width /
        DESIGN_WIDTH;

    const targetX =
        (
            cellRect.left +
            cellRect.width / 2 -
            stageRect.left
        ) / stageScale;

    const targetY =
        (
            cellRect.top +
            cellRect.height / 2 -
            stageRect.top
        ) / stageScale;

    /*
       Missile launches from the destroyer.
    */

    const startX =
        895;

    const startY =
        405;

    missile.style.left =
        startX + "px";

    missile.style.top =
        startY + "px";

    missile.style.display =
        "block";

    const dx =
        targetX -
        startX;

    const dy =
        targetY -
        startY;

    const angle =
        Math.atan2(
            dy,
            dx
        ) * 180 / Math.PI + 90;

    missile.style.transform =
        "rotate(" +
        angle +
        "deg)";

    soundFlight();

    const duration =
        900;

    const startTime =
        performance.now();


    function animate(
        currentTime
    ) {

        const elapsed =
            currentTime -
            startTime;

        const progress =
            Math.min(
                elapsed /
                duration,
                1
            );

        const eased =
            1 -
            Math.pow(
                1 - progress,
                2
            );

        missile.style.left =
            (
                startX +
                dx * eased
            ) + "px";

        missile.style.top =
            (
                startY +
                dy * eased
            ) + "px";


        if (
            progress < 1
        ) {

            requestAnimationFrame(
                animate
            );

        } else {

            missile.style.display =
                "none";

            resolveShot(
                row,
                col
            );

        }

    }

    requestAnimationFrame(
        animate
    );

}


/* =========================================================
   RESOLVE SHOT
   ========================================================= */

function resolveShot(
    row,
    col
) {

    const cell =
        radar.children[
            row * 10 + col
        ];

    let hit =
        false;


    for (
        const ship of enemyFleet
    ) {

        const matching =
            ship.cells.find(
                c =>
                    c.row === row &&
                    c.col === col
            );

        if (matching) {

            hit =
                true;

            ship.hits.add(
                row + "," + col
            );

            break;

        }

    }


    if (hit) {

        cell.classList.add(
            "hit"
        );

        cell.style.outline =
            "none";

        soundHit();

        document.getElementById(
            "statusBox"
        ).textContent =
            "DIRECT HIT — TARGET DAMAGED";


        if (
            allShipsDestroyed()
        ) {

            setTimeout(
                showVictory,
                850
            );

            return;

        }

    } else {

        cell.classList.add(
            "miss"
        );

        cell.style.outline =
            "none";

        soundMiss();

        document.getElementById(
            "statusBox"
        ).textContent =
            "MISS — WATER IMPACT";

    }


    firing =
        false;

}


/* =========================================================
   CHECK FLEET
   ========================================================= */

function allShipsDestroyed() {

    return enemyFleet.every(
        ship =>
            ship.hits.size ===
            ship.cells.length
    );

}


/* =========================================================
   AMMO
   ========================================================= */

function updateAmmo() {

    document.getElementById(
        "ammoCount"

function markMissileUsed() {

    const used =
        100 -
        missilesRemaining;

    if (
        used >= 1 &&
        used <= 100
    ) {

        const cell =
            missileGrid.children[
                used - 1
            ];

        if (cell) {

            cell.classList.add(
                "used"
            );

        }

    }

}
