<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naval Strike</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #06121d;
    font-family: Arial, Helvetica, sans-serif;
}

#viewport {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

#stage {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 1600px;
    height: 900px;
    transform-origin: center center;
    background:
        linear-gradient(
            to bottom,
            #071a29 0%,
            #0c344d 40%,
            #0b5974 67%,
            #063e58 100%
        );
    overflow: hidden;
    border-radius: 10px;
    box-shadow: 0 0 40px rgba(0,0,0,.7);
}

/* =========================================================
   START SCREEN
========================================================= */

#startScreen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(
            ellipse at center,
            rgba(25,94,124,.65),
            rgba(2,13,22,.97) 72%
        );
    z-index: 50;
}

#startScreen h1 {
    margin: 0;
    font-size: 92px;
    letter-spacing: 12px;
    color: #f3f7fa;
    text-shadow:
        0 5px 0 #1d3745,
        0 0 25px rgba(90,210,255,.8);
}

.subtitle {
    margin-top: 8px;
    font-size: 23px;
    letter-spacing: 7px;
    color: #8fd8ef;
}

.startButtons {
    display: flex;
    gap: 35px;
    margin-top: 75px;
}

.startButton {
    width: 280px;
    height: 90px;
    border: 2px solid #63d7ff;
    border-radius: 12px;
    background:
        linear-gradient(
            180deg,
            rgba(30,102,133,.95),
            rgba(7,39,58,.98)
        );
    color: white;
    font-size: 27px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow:
        inset 0 0 20px rgba(0,210,255,.12),
        0 8px 25px rgba(0,0,0,.45);
    transition: .15s;
}

.startButton:hover {
    transform: translateY(-4px);
    background:
        linear-gradient(
            180deg,
            rgba(45,137,172,.98),
            rgba(8,54,76,.98)
        );
    box-shadow:
        0 0 25px rgba(61,205,255,.55),
        0 10px 30px rgba(0,0,0,.5);
}

.startButton:active {
    transform: translateY(1px);
}

.startFooter {
    position: absolute;
    bottom: 35px;
    color: #7ea5b6;
    font-size: 15px;
    letter-spacing: 3px;
}

/* =========================================================
   GAME SCREEN
========================================================= */

#gameScreen {
    position: absolute;
    inset: 0;
    display: none;
}

.topBar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 82px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 28px;

    background:
        linear-gradient(
            180deg,
            rgba(2,12,20,.96),
            rgba(5,26,39,.88)
        );

    border-bottom: 2px solid rgba(95,211,243,.35);
    z-index: 20;
}

.gameTitle {
    color: white;
    font-size: 35px;
    font-weight: bold;
    letter-spacing: 6px;
}

.turnDisplay {
    color: #8ce7ff;
    font-size: 21px;
    font-weight: bold;
    letter-spacing: 2px;
}

.roomButton {
    border: 1px solid #66d7f7;
    border-radius: 8px;
    padding: 12px 20px;
    background: #092638;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.roomButton:hover {
    background: #10425b;
}

/* =========================================================
   OCEAN
========================================================= */

#ocean {
    position: absolute;
    left: 430px;
    right: 0;
    top: 82px;
    bottom: 0;

    overflow: hidden;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.025) 0px,
            rgba(255,255,255,.025) 2px,
            transparent 2px,
            transparent 18px
        ),
        linear-gradient(
            180deg,
            #3e9ab5 0%,
            #17647f 48%,
            #083f5b 100%
        );
}

.wave {
    position: absolute;
    left: -10%;
    width: 120%;
    height: 100px;
    border-radius: 50%;
    border-top: 2px solid rgba(255,255,255,.16);
    opacity: .6;
}

.wave1 {
    top: 90px;
}

.wave2 {
    top: 240px;
    opacity: .35;
}

.wave3 {
    top: 430px;
    opacity: .25;
}

.wave4 {
    top: 650px;
    opacity: .2;
}

/* =========================================================
   CLOUDS
========================================================= */

.cloud {
    position: absolute;
    background: rgba(220,235,239,.86);
    border-radius: 100px;
    filter: blur(3px);
    opacity: .82;
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: inherit;
    border-radius: 50%;
}

.cloud::before {
    width: 100px;
    height: 80px;
    left: 45px;
    top: -38px;
}

.cloud::after {
    width: 130px;
    height: 90px;
    left: 115px;
    top: -45px;
}

.cloud1 {
    width: 230px;
    height: 55px;
    left: 520px;
    top: 145px;
}

.cloud2 {
    width: 280px;
    height: 65px;
    right: 80px;
    top: 300px;
    opacity: .5;
}

.cloud3 {
    width: 190px;
    height: 48px;
    left: 770px;
    bottom: 150px;
    opacity: .35;
}

/* =========================================================
   RADAR PANEL
========================================================= */

#radarPanel {
    position: absolute;
    left: 25px;
    top: 108px;
    width: 365px;
    height: 550px;

    padding: 20px;

    border-radius: 15px;

    background:
        linear-gradient(
            145deg,
            rgba(7,31,43,.98),
            rgba(3,17,27,.98)
        );

    border: 2px solid rgba(79,206,240,.4);

    box-shadow:
        inset 0 0 30px rgba(0,220,255,.05),
        0 15px 35px rgba(0,0,0,.45);

    z-index: 15;
}

.panelTitle {
    text-align: center;
    color: #8feaff;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 3px;
    margin-bottom: 18px;
}

#radar {
    width: 300px;
    height: 300px;
    margin: auto;

    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);

    border: 2px solid #50cde9;

    background:
        radial-gradient(
            circle,
            rgba(75,235,255,.2),
            rgba(0,45,60,.7)
        );

    box-shadow:
        0 0 25px rgba(0,210,255,.15),
        inset 0 0 25px rgba(0,210,255,.15);
}

.radarCell {
    position: relative;

    border-right: 1px solid rgba(98,218,239,.25);
    border-bottom: 1px solid rgba(98,218,239,.25);

    cursor: pointer;

    transition: background .1s;
}

.radarCell:hover {
    background: rgba(78,220,255,.22);
}

.radarCell.disabled {
    cursor: default;
}

.radarCell.hit::after {
    content: "✕";

    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #ff3d4f;
    font-size: 25px;
    font-weight: bold;

    text-shadow: 0 0 10px #ff3045;
}

.radarCell.miss::after {
    content: "•";

    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #d9f6ff;
    font-size: 27px;

    text-shadow: 0 0 10px #b8ecff;
}

.radarLabels {
    display: flex;
    justify-content: space-between;

    margin: 7px 4px 0;

    color: #78b5c6;
    font-size: 12px;
}

/* =========================================================
   STATUS
========================================================= */

#statusBox {
    margin-top: 20px;

    padding: 14px;

    border: 1px solid rgba(85,210,238,.3);
    border-radius: 8px;

    background: rgba(0,25,37,.6);

    color: #d4f7ff;

    text-align: center;
    font-size: 15px;
}

/* =========================================================
   DESTROYER
========================================================= */

#destroyer {
    position: absolute;

    left: 470px;
    bottom: 95px;

    width: 760px;
    height: 270px;

    z-index: 10;
}

.shipHull {
    position: absolute;

    left: 0;
    bottom: 20px;

    width: 760px;
    height: 145px;

    background:
        linear-gradient(
            170deg,
            #8c9ca4,
            #46545d 42%,
            #202d34 100%
        );

    clip-path: polygon(
        0 10%,
        82% 10%,
        100% 48%,
        88% 90%,
        16% 100%,
        0 65%
    );

    border: 2px solid #17242b;

    box-shadow:
        0 20px 30px rgba(0,0,0,.5);
}

.shipDeck {
    position: absolute;

    left: 80px;
    bottom: 105px;

    width: 570px;
    height: 65px;

    background:
        linear-gradient(
            180deg,
            #9da8ad,
            #515d62
        );

    transform: skewX(-18deg);

    border: 2px solid #26343a;
}

.bridge {
    position: absolute;

    left: 300px;
    bottom: 145px;

    width: 170px;
    height: 95px;

    background:
        linear-gradient(
            90deg,
            #52636a,
            #a0adb1,
            #536168
        );

    clip-path: polygon(
        0 100%,
        8% 25%,
        28% 0,
        85% 0,
        100% 28%,
        100% 100%
    );

    border: 2px solid #29383f;
}

.bridgeWindow {
    position: absolute;

    left: 320px;
    bottom: 198px;

    width: 130px;
    height: 25px;

    background:
        repeating-linear-gradient(
            90deg,
            #061b26 0 18px,
            #7ed7ed 19px 22px
        );

    transform: skewX(-8deg);

    box-shadow: 0 0 10px rgba(82,218,244,.25);
}

.mast {
    position: absolute;

    left: 375px;
    bottom: 238px;

    width: 8px;
    height: 55px;

    background: #394a52;
}

.mast::before {
    content: "";

    position: absolute;

    width: 90px;
    height: 5px;

    left: -40px;
    top: 15px;

    background: #394a52;
}

.gun {
    position: absolute;

    left: 520px;
    bottom: 160px;

    width: 100px;
    height: 32px;

    background: #3e4b51;

    border-radius: 15px 15px 5px 5px;

    border: 2px solid #222d32;
}

.gun::after {
    content: "";

    position: absolute;

    width: 100px;
    height: 11px;

    right: 75px;
    top: 8px;

    background: #313d43;
}

.shipWake {
    position: absolute;

    left: -35px;
    bottom: 8px;

    width: 760px;
    height: 60px;

    background:
        radial-gradient(
            ellipse,
            rgba(255,255,255,.5),
            transparent 65%
        );

    opacity: .55;
}

/* =========================================================
   MISSILE BANK
========================================================= */

#missileBank {
    position: absolute;

    left: 130px;
    bottom: 110px;

    width: 260px;
    height: 150px;

    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);

    gap: 3px;

    padding: 8px;

    background:
        linear-gradient(
            145deg,
            #27343a,
            #111b20
        );

    border: 2px solid #64747a;

    box-shadow:
        inset 0 0 15px rgba(0,0,0,.7),
        0 10px 20px rgba(0,0,0,.5);
}

.missileCell {
    background:
        linear-gradient(
            135deg,
            #6c7b80,
            #263238
        );

    border: 1px solid #8b9ba0;

    border-radius: 2px;

    position: relative;
}

.missileCell::after {
    content: "";

    position: absolute;

    width: 4px;
    height: 10px;

    left: 50%;
    top: 50%;

    transform: translate(-50%,-50%);

    background: #d7e0e2;

    border-radius: 3px;
}

.missileCell.used {
    background: #11181c;
    border-color: #20292d;
}

.missileCell.used::after {
    background: #252d30;
}

/* =========================================================
   FLYING MISSILE
========================================================= */

#flyingMissile {
    position: absolute;

    width: 13px;
    height: 60px;

    display: none;

    background:
        linear-gradient(
            90deg,
            #7f8c91,
            #e5eef1,
            #657278
        );

    border-radius: 50% 50% 15% 15%;

    box-shadow:
        0 0 10px rgba(255,170,60,.8);

    z-index: 30;
}

#flyingMissile::after {
    content: "";

    position: absolute;

    width: 22px;
    height: 55px;

    left: -5px;
    top: 45px;

    background:
        linear-gradient(
            to bottom,
            #ffef9a,
            #ff7328,
            transparent
        );

    border-radius: 50%;
}

/* =========================================================
   RESULT
========================================================= */

#resultOverlay {
    position: absolute;

    inset: 0;

    display: none;
    align-items: center;
    justify-content: center;

    background: rgba(0,8,14,.72);

    z-index: 100;
}

.resultBox {
    width: 540px;

    padding: 45px;

    text-align: center;

    border-radius: 18px;

    border: 2px solid #68dcfa;

    background:
        linear-gradient(
            145deg,
            #0d3548,
            #061923
        );

    box-shadow: 0 0 50px rgba(0,0,0,.7);
}

.resultBox h2 {
    margin: 0 0 15px;

    color: white;

    font-size: 48px;

    letter-spacing: 4px;
}

.resultBox p {
    color: #a8dbe9;

    font-size: 20px;
}

.resultButtons {
    display: flex;
    justify-content: center;
    gap: 15px;

    margin-top: 30px;
}

.resultButtons button {
    padding: 14px 24px;

    border-radius: 8px;

    border: 1px solid #64d8f7;

    background: #0a3042;

    color: white;

    font-weight: bold;

    cursor: pointer;
}

.resultButtons button:hover {
    background: #13506b;
}

/* =========================================================
   RESPONSIVE SCALE
========================================================= */

@media (max-width: 700px) {
    #stage {
        border-radius: 0;
    }
}
</style>
</head>

<body>

<div id="viewport">
    <div id="stage">

        <!-- =================================================
             START SCREEN
        ================================================== -->

        <div id="startScreen">

            <h1>NAVAL STRIKE</h1>

            <div class="subtitle">
                MODERN NAVAL COMBAT
            </div>

            <div class="startButtons">
                <button class="startButton" onclick="startGame('2player')">
                    2 PLAYER
                </button>

                <button class="startButton" onclick="startGame('computer')">
                    VS COMPUTER
                </button>
            </div>

            <div class="startFooter">
                SELECT YOUR TARGET • FIRE • DESTROY THE ENEMY FLEET
            </div>

        </div>

        <!-- =================================================
             GAME SCREEN
        ================================================== -->

        <div id="gameScreen">

            <div class="topBar">

                <div class="gameTitle">
                    NAVAL STRIKE
                </div>

                <div id="turnDisplay" class="turnDisplay">
                    READY
                </div>

                <button class="roomButton" onclick="returnToGameRoom()">
                    GAME ROOM
                </button>

            </div>

            <!-- RADAR -->

            <div id="radarPanel">

                <div class="panelTitle">
                    TARGETING RADAR
                </div>

                <div id="radar"></div>

                <div class="radarLabels">
                    <span>A</span>
                    <span>B</span>
                    <span>C</span>
                    <span>D</span>
                    <span>E</span>
                    <span>F</span>
                    <span>G</span>
                    <span>H</span>
                    <span>I</span>
                    <span>J</span>
                </div>

                <div id="statusBox">
                    SELECT A TARGET
                </div>

            </div>

            <!-- OCEAN -->

            <div id="ocean">

                <div class="cloud cloud1"></div>
                <div class="cloud cloud2"></div>
                <div class="cloud cloud3"></div>

                <div class="wave wave1"></div>
                <div class="wave wave2"></div>
                <div class="wave wave3"></div>
                <div class="wave wave4"></div>

            </div>

            <!-- DESTROYER -->

            <div id="destroyer">

                <div class="shipWake"></div>

                <div class="shipHull"></div>

                <div class="shipDeck"></div>

                <div class="bridge"></div>

                <div class="bridgeWindow"></div>

                <div class="mast"></div>

                <div class="gun"></div>

                <!-- 100 MISSILES -->

                <div id="missileBank"></div>

            </div>

            <div id="flyingMissile"></div>

        </div>

        <!-- RESULT -->

        <div id="resultOverlay">

            <div class="resultBox">

                <h2 id="resultTitle">
                    VICTORY
                </h2>

                <p id="resultMessage">
                    Enemy fleet destroyed.
                </p>

                <div class="resultButtons">

                    <button onclick="restartGame()">
                        PLAY AGAIN
                    </button>

                    <button onclick="returnToGameRoom()">
                        GAME ROOM
                    </button>

                </div>

            </div>

        </div>

    </div>
</div>

<script>

/* =========================================================
   SCREEN-SIZE SCALING
========================================================= */

const DESIGN_WIDTH = 1600;
const DESIGN_HEIGHT = 900;

const stage = document.getElementById("stage");

function resizeStage() {

    const availableWidth = window.innerWidth;
    const availableHeight = window.innerHeight;

    const scaleX = availableWidth / DESIGN_WIDTH;
    const scaleY = availableHeight / DESIGN_HEIGHT;

    const scale = Math.min(scaleX, scaleY);

    stage.style.transform =
        "translate(-50%, -50%) scale(" + scale + ")";
}

window.addEventListener("resize", resizeStage);
window.addEventListener("orientationchange", resizeStage);

if (window.visualViewport) {
    window.visualViewport.addEventListener(
        "resize",
        resizeStage
    );
}

resizeStage();

/* =========================================================
   GAME VARIABLES
========================================================= */

let gameMode = null;
let gameStarted = false;

let playerShots = [];
let enemyFleet = [];

let missilesRemaining = 100;
let gameOver = false;

const radar = document.getElementById("radar");
const missileBank = document.getElementById("missileBank");
const statusBox = document.getElementById("statusBox");
const turnDisplay = document.getElementById("turnDisplay");

const flyingMissile =
    document.getElementById("flyingMissile");

const resultOverlay =
    document.getElementById("resultOverlay");

const resultTitle =
    document.getElementById("resultTitle");

const resultMessage =
    document.getElementById("resultMessage");

/* =========================================================
   BUILD MISSILE BANK
========================================================= */

function buildMissileBank() {

    missileBank.innerHTML = "";

    for (let i = 0; i < 100; i++) {

        const cell = document.createElement("div");

        cell.className = "missileCell";

        cell.dataset.index = i;

        missileBank.appendChild(cell);
    }
}

/* =========================================================
   BUILD RADAR
========================================================= */

function buildRadar() {

    radar.innerHTML = "";

    for (let row = 0; row < 10; row++) {

        for (let col = 0; col < 10; col++) {

            const cell = document.createElement("div");

            cell.className = "radarCell";

            cell.dataset.row = row;
            cell.dataset.col = col;

            cell.addEventListener(
                "click",
                () => fireAt(row, col)
            );

            radar.appendChild(cell);
        }
    }
}

/* =========================================================
   RANDOM FLEET
========================================================= */

function createFleet() {

    const fleet = [];

    /*
       Simple fleet:

       Carrier 5
       Battleship 4
       Cruiser 3
       Submarine 3
       Destroyer 2
    */

    const ships = [
        5,
        4,
        3,
        3,
        2
    ];

    for (const length of ships) {

        let placed = false;

        while (!placed) {

            const horizontal =
                Math.random() < 0.5;

            const row =
                Math.floor(Math.random() * 10);

            const col =
                Math.floor(Math.random() * 10);

            const cells = [];

            for (let i = 0; i < length; i++) {

                const r =
                    horizontal ? row : row + i;

                const c =
                    horizontal ? col + i : col;

                if (
                    r < 0 ||
                    r >= 10 ||
                    c < 0 ||
                    c >= 10
                ) {
                    break;
                }

                cells.push(r + "," + c);
            }

            if (cells.length !== length) {
                continue;
            }

            let conflict = false;

            for (const existing of fleet) {

                for (const occupied of existing) {

                    if (cells.includes(occupied)) {
                        conflict = true;
                    }
                }
            }

            if (!conflict) {

                fleet.push(cells);

                placed = true;
            }
        }
    }

    return fleet;
}

/* =========================================================
   START GAME
========================================================= */

function startGame(mode) {

    gameMode = mode;

    gameStarted = true;
    gameOver = false;

    playerShots = [];

    missilesRemaining = 100;

    enemyFleet = createFleet();

    document.getElementById("startScreen").style.display =
        "none";

    document.getElementById("gameScreen").style.display =
        "block";

    resultOverlay.style.display =
        "none";

    buildRadar();
    buildMissileBank();

    statusBox.textContent =
        "SELECT A TARGET";

    turnDisplay.textContent =
        mode === "computer"
            ? "YOUR TURN"
            : "PLAYER 1 — YOUR TURN";
}

/* =========================================================
   FIRE
========================================================= */

function fireAt(row, col) {

    if (!gameStarted || gameOver) {
        return;
    }

    const key = row + "," + col;

    if (playerShots.includes(key)) {
        return;
    }

    if (missilesRemaining <= 0) {
        return;
    }

    playerShots.push(key);

    missilesRemaining--;

    markMissileUsed();

    disableRadarCell(row, col);

    animateMissile(row, col);
}

/* =========================================================
   MARK MISSILE
========================================================= */

function markMissileUsed() {

    const used =
        100 - missilesRemaining;

    const cell =
        missileBank.children[used - 1];

    if (cell) {
        cell.classList.add("used");
    }
}

/* =========================================================
   DISABLE CELL
========================================================= */

function disableRadarCell(row, col) {

    const index =
        row * 10 + col;

    const cell =
        radar.children[index];

    if (cell) {
        cell.classList.add("disabled");
    }
}

/* =========================================================
   MISSILE ANIMATION
========================================================= */

function animateMissile(row, col) {

    flyingMissile.style.display =
        "block";

    const radarCell =
        radar.children[row * 10 + col];

    const targetRect =
        radarCell.getBoundingClientRect();

    const stageRect =
        stage.getBoundingClientRect();

    const scale =
        stageRect.width / DESIGN_WIDTH;

    const targetX =
        (targetRect.left - stageRect.left) / scale +
        radarCell.offsetWidth / 2;

    const targetY =
        (targetRect.top - stageRect.top) / scale +
        radarCell.offsetHeight / 2;

    const startX = 850;
    const startY = 560;

    flyingMissile.style.left =
        startX + "px";

    flyingMissile.style.top =
        startY + "px";

    flyingMissile.style.transform =
        "rotate(0deg)";

    const distanceX =
        targetX - startX;

    const distanceY =
        targetY - startY;

    const angle =
        Math.atan2(
            distanceY,
            distanceX
        ) * 180 / Math.PI + 90;

    flyingMissile.style.transition =
        "left .65s ease-in, top .65s ease-in, transform .65s ease-in";

    requestAnimationFrame(() => {

        flyingMissile.style.left =
            (targetX - 6) + "px";

        flyingMissile.style.top =
            (targetY - 30) + "px";

        flyingMissile.style.transform =
            "rotate(" + angle + "deg)";
    });

    setTimeout(() => {

        flyingMissile.style.display =
            "none";

        resolveShot(row, col);

    }, 700);
}

/* =========================================================
   RESOLVE SHOT
========================================================= */

function resolveShot(row, col) {

    const key =
        row + "," + col;

    let hit = false;

    for (const ship of enemyFleet) {

        if (ship.includes(key)) {
            hit = true;
            break;
        }
    }

    const cell =
        radar.children[row * 10 + col];

    if (hit) {

        cell.classList.add("hit");

        statusBox.textContent =
            "DIRECT HIT!";

    } else {

        cell.classList.add("miss");

        statusBox.textContent =
            "MISS";
    }

    if (checkVictory()) {

        endGame(
            true,
            "Enemy fleet destroyed."
        );

        return;
    }

    if (gameMode === "computer") {

        turnDisplay.textContent =
            "COMPUTER TURN";

        setTimeout(
            computerTurn,
            900
        );

    } else {

        turnDisplay.textContent =
            "PLAYER 2 — YOUR TURN";
    }
}

/* =========================================================
   VICTORY CHECK
========================================================= */

function checkVictory() {

    for (const ship of enemyFleet) {

        for (const cell of ship) {

            if (!playerShots.includes(cell)) {
                return false;
            }
        }
    }

    return true;
}

/* =========================================================
   COMPUTER TURN
========================================================= */

function computerTurn() {

    if (gameOver) {
        return;
    }

    /*
       Placeholder computer action.

       The full two-fleet server-authoritative version
       will replace this with an actual opponent fleet.
    */

    turnDisplay.textContent =
        "YOUR TURN";

    statusBox.textContent =
        "COMPUTER FIRED — YOUR TURN";
}

/* =========================================================
   END GAME
========================================================= */

function endGame(won, message) {

    gameOver = true;

    resultTitle.textContent =
        won ? "VICTORY" : "DEFEAT";

    resultMessage.textContent =
        message;

    resultOverlay.style.display =
        "flex";
}

/* =========================================================
   RESTART
========================================================= */

function restartGame() {

    resultOverlay.style.display =
        "none";

    startGame(gameMode);
}

/* =========================================================
   GAME ROOM
========================================================= */

function returnToGameRoom() {

    window.location.href =
        "index.html";
}

</script>
