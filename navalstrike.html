<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Naval Strike</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #06121b;
    color: white;
    overflow-x: hidden;
}

body {
    min-height: 100vh;
}

/* =========================================================
   START SCREEN
   ========================================================= */

#startScreen {
    min-height: 100vh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 25%, rgba(47,111,145,.35), transparent 35%),
        linear-gradient(#071a27, #031019 70%, #02080d);
}

.oceanGlow {
    position: absolute;
    width: 140%;
    height: 55%;
    left: -20%;
    bottom: -20%;
    background:
        repeating-linear-gradient(
            175deg,
            rgba(40,120,155,.18) 0px,
            rgba(40,120,155,.18) 2px,
            transparent 2px,
            transparent 22px
        );
    transform: rotate(-2deg);
    opacity: .8;
}

.startPanel {
    position: relative;
    z-index: 5;
    width: min(92vw, 600px);
    padding: 42px 28px 38px;
    text-align: center;
    border: 2px solid #426b7d;
    border-radius: 24px;
    background: linear-gradient(
        145deg,
        rgba(11,34,47,.97),
        rgba(3,15,23,.97)
    );
    box-shadow:
        0 0 40px rgba(0,180,255,.15),
        inset 0 0 30px rgba(0,0,0,.55);
}

.gameLogo {
    font-size: clamp(42px, 10vw, 76px);
    font-weight: 900;
    letter-spacing: 5px;
    color: #e7f8ff;
    text-shadow:
        0 0 8px #4bd5ff,
        0 0 25px rgba(50,190,255,.6);
    margin-bottom: 5px;
}

.subtitle {
    color: #79b6c9;
    letter-spacing: 4px;
    font-size: 13px;
    margin-bottom: 35px;
}

.shipBadge {
    font-size: 70px;
    margin-bottom: 25px;
    filter: drop-shadow(0 5px 10px rgba(0,0,0,.7));
}

.modeButton {
    width: 100%;
    max-width: 390px;
    margin: 10px auto;
    display: block;
    padding: 17px 20px;
    border: 2px solid #3b91ae;
    border-radius: 12px;
    background: linear-gradient(#174b61, #0b2b3b);
    color: white;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,.4);
}

.modeButton:hover {
    background: linear-gradient(#216b87, #104258);
    border-color: #72dfff;
}

.modeButton:active {
    transform: scale(.98);
}

.gameRoomButton {
    margin-top: 24px;
    background: #101d24;
    border-color: #516771;
    font-size: 15px;
}

.gameRoomButton:hover {
    background: #182b34;
}

/* =========================================================
   GAME
   ========================================================= */

#gameScreen {
    display: none;
    min-height: 100vh;
    background:
        linear-gradient(
            to bottom,
            #071d2a 0%,
            #0a3142 32%,
            #0b4254 55%,
            #061923 100%
        );
    overflow: hidden;
}

.topBar {
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    border-bottom: 2px solid #315e6c;
    background: rgba(3,15,22,.9);
    position: relative;
    z-index: 20;
}

.topTitle {
    font-size: clamp(22px, 5vw, 34px);
    font-weight: 900;
    letter-spacing: 3px;
    text-shadow: 0 0 10px rgba(75,213,255,.5);
}

.roomButton {
    border: 1px solid #526b73;
    background: #14252d;
    color: #d9eef4;
    padding: 9px 13px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.roomButton:hover {
    background: #203b46;
}

/* =========================================================
   MAIN BATTLE AREA
   ========================================================= */

.battlefield {
    width: min(1400px, 100%);
    margin: auto;
    padding: 15px;
}

.statusBar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    padding: 9px 14px;
    background: rgba(2,13,20,.78);
    border: 1px solid #315d6c;
    border-radius: 10px;
    font-size: 14px;
}

.statusText {
    color: #8bdcff;
    font-weight: bold;
}

.ammoText {
    color: #c5dce4;
}

/* =========================================================
   OCEAN
   ========================================================= */

.ocean {
    position: relative;
    height: 250px;
    border-radius: 18px;
    overflow: hidden;
    border: 2px solid #386878;
    background:
        linear-gradient(
            to bottom,
            #a9d4df 0%,
            #6fa8b9 23%,
            #287187 48%,
            #0c4a60 75%,
            #062b3a 100%
        );
    box-shadow: inset 0 -40px 70px rgba(0,0,0,.45);
}

.cloud {
    position: absolute;
    border-radius: 50%;
    background: rgba(245,253,255,.72);
    filter: blur(7px);
}

.cloud.c1 {
    width: 190px;
    height: 55px;
    top: 25px;
    left: 5%;
}

.cloud.c2 {
    width: 250px;
    height: 65px;
    top: 55px;
    right: 7%;
}

.cloud.c3 {
    width: 300px;
    height: 65px;
    top: 105px;
    left: 34%;
}

.cloud.c4 {
    width: 170px;
    height: 50px;
    top: 145px;
    right: 35%;
}

.hiddenFleet {
    position: absolute;
    left: 50%;
    top: 43%;
    transform: translate(-50%, -50%);
    color: rgba(3,23,30,.22);
    font-size: 45px;
    letter-spacing: 25px;
    user-select: none;
}

.oceanLabel {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(2,19,27,.65);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 11px;
    letter-spacing: 3px;
    color: #b9e8f4;
}

/* =========================================================
   MISSILE TRAJECTORY
   ========================================================= */

.missile {
    position: absolute;
    width: 13px;
    height: 38px;
    border-radius: 8px 8px 3px 3px;
    background: linear-gradient(#ffffff, #9bdcff 45%, #21799c);
    box-shadow:
        0 0 8px #b9eeff,
        0 0 20px #32bfff;
    z-index: 15;
    display: none;
}

.missile::after {
    content: "";
    position: absolute;
    width: 10px;
    height: 30px;
    left: 1px;
    top: 30px;
    background: linear-gradient(
        transparent,
        #ffed8a,
        #ff7a19,
        transparent
    );
    filter: blur(2px);
}

/* =========================================================
   LOWER GAME AREA
   ========================================================= */

.lowerArea {
    display: grid;
    grid-template-columns: minmax(260px, 390px) 1fr;
    gap: 18px;
    margin-top: 16px;
}

/* =========================================================
   RADAR
   ========================================================= */

.radarPanel,
.shipPanel {
    border: 2px solid #315d6c;
    border-radius: 16px;
    background: rgba(3,16,24,.9);
    box-shadow: 0 8px 25px rgba(0,0,0,.3);
}

.panelHeader {
    padding: 11px 14px;
    border-bottom: 1px solid #315d6c;
    color: #9fe7fa;
    font-weight: 900;
    letter-spacing: 2px;
    font-size: 14px;
}

.radarWrap {
    padding: 13px;
}

.radar {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    aspect-ratio: 1 / 1;
    border: 2px solid #4287a0;
    background: #092531;
}

.radarCell {
    position: relative;
    border: 1px solid rgba(76,166,190,.35);
    background:
        radial-gradient(circle, rgba(45,170,190,.09), transparent 65%);
    cursor: pointer;
    transition: .15s;
}

.radarCell:hover {
    background: rgba(56,190,218,.22);
    box-shadow: inset 0 0 12px rgba(71,218,255,.35);
}

.radarCell.disabled {
    cursor: default;
}

.radarCell.hit::after {
    content: "✕";
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #ff4d4d;
    font-size: clamp(14px, 3vw, 26px);
    font-weight: 900;
    text-shadow: 0 0 8px #ff0000;
}

.radarCell.miss::after {
    content: "•";
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #8eeaff;
    font-size: clamp(18px, 3vw, 30px);
}

.radarCell.targeted {
    animation: radarFlash .35s;
}

@keyframes radarFlash {
    0%,100% { background: rgba(50,220,255,.1); }
    50% { background: rgba(50,220,255,.65); }
}

.radarLetters {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    margin-left: 2px;
    color: #669aaa;
    font-size: 9px;
    text-align: center;
    margin-top: 5px;
}

/* =========================================================
   SHIP
   ========================================================= */

.shipPanel {
    position: relative;
    overflow: hidden;
}

.shipDeck {
    position: relative;
    min-height: 430px;
    padding: 20px;
    background:
        linear-gradient(
            90deg,
            #10191d,
            #2b3638 17%,
            #59605e 50%,
            #2c3739 83%,
            #10191d
        );
    overflow: hidden;
}

.shipDeck::before {
    content: "";
    position: absolute;
    width: 82%;
    height: 125%;
    left: 9%;
    top: -12%;
    clip-path: polygon(27% 0, 73% 0, 100% 100%, 0 100%);
    background:
        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,.035) 0,
            rgba(255,255,255,.035) 2px,
            transparent 2px,
            transparent 22px
        ),
        linear-gradient(90deg, #252d2e, #616766 50%, #252d2e);
    border-left: 2px solid #111;
    border-right: 2px solid #111;
}

.shipBow {
    position: absolute;
    bottom: -90px;
    left: 50%;
    transform: translateX(-50%);
    width: 72%;
    height: 150px;
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
    background: linear-gradient(90deg, #263336, #707a79 50%, #263336);
    z-index: 3;
}

.shipTower {
    position: absolute;
    left: 50%;
    top: 18px;
    transform: translateX(-50%);
    width: 150px;
    height: 90px;
    background: linear-gradient(#536064, #222c2f);
    border: 2px solid #12191b;
    z-index: 4;
    clip-path: polygon(18% 0, 82% 0, 100% 100%, 0 100%);
}

.shipTower::before {
    content: "";
    position: absolute;
    width: 65px;
    height: 22px;
    left: 41px;
    top: 22px;
    background: #0d181c;
    border: 2px solid #7a9197;
}

.shipTower::after {
    content: "";
    position: absolute;
    width: 90px;
    height: 5px;
    left: 30px;
    bottom: 15px;
    background: #111a1c;
}

.missileBank {
    position: relative;
    z-index: 8;
    width: min(360px, 90%);
    margin: 125px auto 0;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 4px;
    padding: 9px;
    border: 2px solid #20282a;
    background: #101719;
    box-shadow:
        0 8px 15px rgba(0,0,0,.5),
        inset 0 0 15px rgba(0,0,0,.8);
}

.missileCell {
    aspect-ratio: 1 / 1;
    border-radius: 3px;
    background:
        linear-gradient(
            135deg,
            #cfd9d8,
            #657276 50%,
            #303b3d
        );
    border: 1px solid #12191b;
    box-shadow: inset 0 1px 2px rgba(255,255,255,.25);
    position: relative;
}

.missileCell::after {
    content: "";
    position: absolute;
    width: 55%;
    height: 55%;
    left: 22%;
    top: 20%;
    border-radius: 50%;
    background: #10191c;
}

.missileCell.fired {
    background: #171e20;
    opacity: .45;
}

.missileCell.fired::after {
    background: #05090a;
}

.ammoCaption {
    position: relative;
    z-index: 9;
    text-align: center;
    margin-top: 12px;
    color: #d6e2e4;
    font-size: 12px;
    letter-spacing: 2px;
}

/* =========================================================
   RESULT OVERLAY
   ========================================================= */

#resultOverlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    align-items: center;
    justify-content: center;
    background: rgba(0,8,13,.82);
    backdrop-filter: blur(5px);
}

.resultBox {
    width: min(90vw, 500px);
    padding: 38px 25px;
    text-align: center;
    background: linear-gradient(#102e3c, #06141c);
    border: 2px solid #4d91a8;
    border-radius: 20px;
    box-shadow: 0 0 50px rgba(0,190,255,.25);
}

.resultTitle {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 3px;
    margin-bottom: 12px;
}

.resultMessage {
    color: #a9d8e4;
    margin-bottom: 25px;
}

.restartButton {
    border: 2px solid #4c9ab4;
    background: #103b4c;
    color: white;
    padding: 13px 25px;
    border-radius: 10px;
    font-weight: 900;
    cursor: pointer;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 850px) {
    .lowerArea {
        grid-template-columns: 1fr;
    }

    .radarPanel {
        max-width: 480px;
        width: 100%;
        margin: auto;
    }

    .shipPanel {
        width: 100%;
    }

    .ocean {
        height: 190px;
    }

    .shipDeck {
        min-height: 390px;
    }
}

@media (max-width: 500px) {
    .battlefield {
        padding: 8px;
    }

    .topBar {
        height: 58px;
    }

    .statusBar {
        font-size: 11px;
    }

    .shipDeck {
        min-height: 350px;
        padding: 10px;
    }

    .missileBank {
        margin-top: 112px;
        gap: 3px;
        padding: 6px;
    }

    .shipTower {
        width: 120px;
        height: 75px;
    }

    .shipTower::before {
        left: 32px;
        width: 52px;
    }
}
</style>
</head>

<body>

<!-- =======================================================
     START SCREEN
     ======================================================= -->

<section id="startScreen">

    <div class="oceanGlow"></div>

    <div class="startPanel">

        <div class="shipBadge">⚓</div>

        <div class="gameLogo">NAVAL STRIKE</div>

        <div class="subtitle">COMMAND • TARGET • FIRE</div>

        <button class="modeButton" onclick="startGame('2PLAYER')">
            ⚓ 2 PLAYER
        </button>

        <button class="modeButton" onclick="startGame('COMPUTER')">
            🎯 VS COMPUTER
        </button>

        <button class="modeButton gameRoomButton" onclick="goGameRoom()">
            GAME ROOM
        </button>

    </div>
</section>


<!-- =======================================================
     GAME SCREEN
     ======================================================= -->

<section id="gameScreen">

    <div class="topBar">

        <div class="topTitle">
            NAVAL STRIKE
        </div>

        <button class="roomButton" onclick="goGameRoom()">
            GAME ROOM
        </button>

    </div>


    <main class="battlefield">

        <div class="statusBar">

            <div class="statusText" id="statusText">
                SELECT A RADAR TARGET
            </div>

            <div class="ammoText">
                MISSILES:
                <span id="ammoCount">100</span>
            </div>

        </div>


        <!-- OCEAN -->

        <section class="ocean" id="ocean">

            <div class="cloud c1"></div>
            <div class="cloud c2"></div>
            <div class="cloud c3"></div>
            <div class="cloud c4"></div>

            <div class="hiddenFleet">
                ⚓ 🚢 ⚓
            </div>

            <div class="oceanLabel">
                ENEMY WATERS
            </div>

            <div class="missile" id="missile"></div>

        </section>


        <section class="lowerArea">

            <!-- RADAR -->

            <div class="radarPanel">

                <div class="panelHeader">
                    RADAR TARGETING SYSTEM
                </div>

                <div class="radarWrap">

                    <div class="radar" id="radar"></div>

                    <div class="radarLetters">
                        <span>A</span>
                        <span>B</span>
                        <span>C</span>
                        <span>D</span>
                        <span>E</span>
                        <span>F</span>
                        <span>G</span>
                        <span>H</span>
                        <span>I</span>
                        <span>J</span>
                    </div>

                </div>

            </div>


            <!-- SHIP -->

            <div class="shipPanel">

                <div class="panelHeader">
                    FORWARD MISSILE DECK
                </div>

                <div class="shipDeck">

                    <div class="shipTower"></div>

                    <div class="missileBank" id="missileBank"></div>

                    <div class="ammoCaption">
                        100-CELL VERTICAL LAUNCH SYSTEM
                    </div>

                    <div class="shipBow"></div>

                </div>

            </div>

        </section>

    </main>

</section>


<!-- =======================================================
     RESULT
     ======================================================= -->

<div id="resultOverlay">

    <div class="resultBox">

        <div class="resultTitle" id="resultTitle">
            TARGET DESTROYED
        </div>

        <div class="resultMessage" id="resultMessage">
            Enemy fleet eliminated.
        </div>

        <button class="restartButton" onclick="restartGame()">
            PLAY AGAIN
        </button>

    </div>

</div>


<script>

/* =========================================================
   GAME VARIABLES
   ========================================================= */

let gameMode = null;
let missilesRemaining = 100;
let gameActive = false;

let enemyBoard = [];
let shots = [];

let shipsRemaining = 17;


/* =========================================================
   GAME ROOM
   ========================================================= */

function goGameRoom() {
    window.location.href = "index.html";
}


/* =========================================================
   START GAME
   ========================================================= */

function startGame(mode) {

    gameMode = mode;

    document.getElementById("startScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";

    createMissileBank();
    createRadar();
    createEnemyFleet();

    missilesRemaining = 100;
    shots = [];
    shipsRemaining = 17;
    gameActive = true;

    updateAmmo();

    if (mode === "COMPUTER") {
        setStatus("VS COMPUTER — SELECT A TARGET");
    } else {
        setStatus("2 PLAYER — SELECT A TARGET");
    }
}


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(text) {
    document.getElementById("statusText").textContent = text;
}


/* =========================================================
   MISSILE BANK
   ========================================================= */

function createMissileBank() {

    const bank = document.getElementById("missileBank");

    bank.innerHTML = "";

    for (let i = 0; i < 100; i++) {

        const cell = document.createElement("div");

        cell.className = "missileCell";
        cell.id = "missileCell" + i;

        bank.appendChild(cell);
    }
}


function updateAmmo() {

    document.getElementById("ammoCount").textContent =
        missilesRemaining;
}


/* =========================================================
   RADAR
   ========================================================= */

function createRadar() {

    const radar = document.getElementById("radar");

    radar.innerHTML = "";

    for (let i = 0; i < 100; i++) {

        const cell = document.createElement("div");

        cell.className = "radarCell";
        cell.dataset.index = i;

        cell.addEventListener("click", function() {
            fireAt(i);
        });

        radar.appendChild(cell);
    }
}


/* =========================================================
   ENEMY FLEET
   ========================================================= */

function createEnemyFleet() {

    enemyBoard = Array.from(
        { length: 10 },
        () => Array(10).fill(0)
    );

    /*
        Fleet:

        Carrier     5
        Battleship  4
        Cruiser     3
        Submarine   3
        Destroyer   2

        Total = 17
    */

    const ships = [5, 4, 3, 3, 2];

    ships.forEach(length => {
        placeShip(length);
    });
}


function placeShip(length) {

    let placed = false;

    while (!placed) {

        const horizontal =
            Math.random() < 0.5;

        const row =
            Math.floor(Math.random() * 10);

        const col =
            Math.floor(Math.random() * 10);

        if (horizontal) {

            if (col + length > 10)
                continue;

            let clear = true;

            for (let x = 0; x < length; x++) {

                if (enemyBoard[row][col + x] !== 0) {
                    clear = false;
                    break;
                }
            }

            if (!clear)
                continue;

            for (let x = 0; x < length; x++) {
                enemyBoard[row][col + x] = 1;
            }

            placed = true;

        } else {

            if (row + length > 10)
                continue;

            let clear = true;

            for (let y = 0; y < length; y++) {

                if (enemyBoard[row + y][col] !== 0) {
                    clear = false;
                    break;
                }
            }

            if (!clear)
                continue;

            for (let y = 0; y < length; y++) {
                enemyBoard[row + y][col] = 1;
            }

            placed = true;
        }
    }
}


/* =========================================================
   FIRE
   ========================================================= */

function fireAt(index) {

    if (!gameActive)
        return;

    if (missilesRemaining <= 0) {
        setStatus("NO MISSILES REMAIN");
        return;
    }

    if (shots.includes(index)) {
        setStatus("TARGET ALREADY FIRED UPON");
        return;
    }

    shots.push(index);

    missilesRemaining--;
    updateAmmo();

    const missileCell =
        document.getElementById(
            "missileCell" + missilesRemaining
        );

    if (missileCell) {
        missileCell.classList.add("fired");
    }

    const radarCell =
        document.querySelector(
            `.radarCell[data-index="${index}"]`
        );

    radarCell.classList.add("disabled");
    radarCell.classList.add("targeted");

    launchMissile(index, radarCell);
}


/* =========================================================
   MISSILE ANIMATION
   ========================================================= */

function launchMissile(index, radarCell) {

    const missile =
        document.getElementById("missile");

    const ocean =
        document.getElementById("ocean");

    const oceanRect =
        ocean.getBoundingClientRect();

    const targetRect =
        radarCell.getBoundingClientRect();

    const startX =
        oceanRect.width / 2 - 7;

    const startY =
        oceanRect.height - 15;

    const targetX =
        targetRect.left +
        targetRect.width / 2 -
        oceanRect.left -
        7;

    const targetY =
        targetRect.top +
        targetRect.height / 2 -
        oceanRect.top;

    missile.style.display = "block";
    missile.style.left = startX + "px";
    missile.style.top = startY + "px";
    missile.style.transform =
        "rotate(0deg)";

    const dx = targetX - startX;
    const dy = targetY - startY;

    const angle =
        Math.atan2(dy, dx) * 180 / Math.PI + 90;

    missile.style.transition =
        "left .75s cubic-bezier(.2,.7,.3,1), " +
        "top .75s cubic-bezier(.2,.7,.3,1), " +
        "transform .2s";

    missile.style.transform =
        `rotate(${angle}deg)`;

    requestAnimationFrame(() => {

        missile.style.left = targetX + "px";
        missile.style.top = targetY + "px";

    });

    setTimeout(() => {

        missile.style.display = "none";

        resolveShot(index, radarCell);

    }, 800);
}


/* =========================================================
   RESOLVE SHOT
   ========================================================= */

function resolveShot(index, radarCell) {

    const row = Math.floor(index / 10);
    const col = index % 10;

    if (enemyBoard[row][col] === 1) {

        radarCell.classList.remove("targeted");
        radarCell.classList.add("hit");

        shipsRemaining--;

        setStatus("DIRECT HIT!");

        if (shipsRemaining <= 0) {

            endGame(
                "TARGET DESTROYED",
                "The enemy fleet has been eliminated."
            );

            return;
        }

    } else {

        radarCell.classList.remove("targeted");
        radarCell.classList.add("miss");

        setStatus("MISS — SCANNING FOR TARGET");

    }

    if (missilesRemaining <= 0) {

        setTimeout(() => {

            if (gameActive) {

                endGame(
                    "OUT OF MISSILES",
                    "The enemy fleet survived the attack."
                );

            }

        }, 700);
    }
}


/* =========================================================
   END GAME
   ========================================================= */

function endGame(title, message) {

    gameActive = false;

    document.getElementById("resultTitle")
        .textContent = title;

    document.getElementById("resultMessage")
        .textContent = message;

    document.getElementById("resultOverlay")
        .style.display = "flex";
}


/* =========================================================
   RESTART
   ========================================================= */

function restartGame() {

    document.getElementById("resultOverlay")
        .style.display = "none";

    startGame(gameMode);
}

</script>
