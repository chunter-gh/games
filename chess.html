<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
    background:
        radial-gradient(circle at 50% 20%, #383838 0%, #151515 45%, #050505 100%);
    color: #eee;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    padding: 18px;
}

#app {
    width: min(1100px, 100%);
    text-align: center;
}

h1 {
    margin: 4px 0 4px;
    font-family: Georgia, serif;
    font-size: clamp(30px, 5vw, 52px);
    letter-spacing: 5px;
    color: #f3ead4;
    text-shadow:
        0 3px 0 #111,
        0 5px 10px #000;
}

#subtitle {
    color: #aaa;
    margin-bottom: 14px;
    letter-spacing: 2px;
}

#menu {
    margin-bottom: 14px;
}

button {
    border: 1px solid #777;
    border-radius: 8px;
    background:
        linear-gradient(#444, #1b1b1b);
    color: #eee;
    padding: 10px 18px;
    margin: 4px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    box-shadow:
        inset 0 1px 0 #777,
        0 3px 7px #000;
}

button:hover {
    background:
        linear-gradient(#555, #222);
}

button:active {
    transform: translateY(1px);
}

button.active {
    border-color: #e8d6aa;
    box-shadow:
        inset 0 0 0 1px #e8d6aa,
        0 3px 8px #000;
}

#gameArea {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 24px;
}

#boardWrap {
    position: relative;
    width: min(82vw, 700px);
    max-width: 700px;
    padding-bottom: 32px;
    perspective: 1000px;
}

#board {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    border: 12px solid #171717;
    border-radius: 8px;
    transform: rotateX(1deg);
    box-shadow:
        0 9px 0 #080808,
        0 17px 18px rgba(0,0,0,.8),
        inset 0 0 0 3px #555;
    overflow: hidden;
}

#board::after {
    content: "";
    position: absolute;
    left: -12px;
    right: -12px;
    bottom: -30px;
    height: 30px;
    background:
        linear-gradient(#222, #080808);
    border-radius: 0 0 10px 10px;
    box-shadow: 0 8px 12px #000;
    z-index: -1;
}

.square {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
    cursor: pointer;
}

.square.light {
    background:
        linear-gradient(135deg,
            #eee7d7 0%,
            #d9d0bc 45%,
            #bdb39e 100%);
}

.square.dark {
    background:
        linear-gradient(135deg,
            #252525 0%,
            #111 50%,
            #050505 100%);
}

.square.selected {
    box-shadow:
        inset 0 0 0 5px rgba(255, 215, 80, .9),
        inset 0 0 25px rgba(255, 215, 80, .4);
}

.square.lastMove {
    box-shadow:
        inset 0 0 0 4px rgba(90, 180, 255, .65);
}

.square.inCheck {
    box-shadow:
        inset 0 0 0 6px #c22,
        inset 0 0 25px rgba(255, 0, 0, .7);
}

.square.legal::after {
    content: "";
    position: absolute;
    width: 20%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: rgba(40, 160, 80, .72);
    box-shadow: 0 1px 4px #000;
}

.square.capture::after {
    content: "";
    position: absolute;
    inset: 9%;
    border: 5px solid rgba(210, 50, 40, .85);
    border-radius: 50%;
}

.coord {
    position: absolute;
    font-size: 10px;
    font-weight: bold;
    opacity: .7;
    pointer-events: none;
}

.rank {
    top: 3px;
    left: 4px;
}

.file {
    bottom: 3px;
    right: 4px;
}

.light .coord {
    color: #333;
}

.dark .coord {
    color: #ddd;
}

.piece {
    position: relative;
    z-index: 2;
    font-family:
        "DejaVu Sans",
        "Segoe UI Symbol",
        "Noto Sans Symbols 2",
        serif;
    font-size: clamp(34px, 7vw, 74px);
    line-height: 1;
    cursor: pointer;
    transform: translateY(-3%);
    filter: drop-shadow(0 5px 2px rgba(0,0,0,.8));
}

.whitePiece {
    color: #f7f1df;
    text-shadow:
        -1px -1px 0 #fff,
        1px -1px 0 #c8c0ad,
        -1px 1px 0 #aaa,
        2px 4px 3px #000,
        0 0 8px rgba(255,255,255,.25);
}

.blackPiece {
    color: #151515;
    text-shadow:
        -1px -1px 0 #555,
        1px -1px 0 #000,
        -1px 1px 0 #000,
        2px 5px 3px #000,
        0 0 5px rgba(255,255,255,.1);
}

#sidePanel {
    width: 250px;
    min-width: 220px;
    background:
        linear-gradient(145deg, #252525, #0d0d0d);
    border: 1px solid #555;
    border-radius: 12px;
    padding: 16px;
    box-shadow:
        0 8px 20px #000,
        inset 0 1px 0 #555;
}

.panelTitle {
    font-family: Georgia, serif;
    color: #e8d6aa;
    font-size: 21px;
    margin-bottom: 10px;
}

#status {
    min-height: 44px;
    padding: 10px;
    margin-bottom: 12px;
    border-radius: 7px;
    background: #080808;
    border: 1px solid #444;
    color: #eee;
    font-weight: bold;
}

#modeText,
#levelText {
    color: #bbb;
    font-size: 13px;
    margin: 6px 0;
}

#moves {
    height: 260px;
    overflow-y: auto;
    text-align: left;
    margin-top: 12px;
    padding: 8px;
    background: #070707;
    border: 1px solid #333;
    border-radius: 7px;
    font-family: monospace;
    font-size: 13px;
}

.moveRow {
    display: grid;
    grid-template-columns: 35px 1fr 1fr;
    padding: 3px 2px;
    border-bottom: 1px solid #222;
}

.moveNum {
    color: #777;
}

#promotion {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 100;
}

#promotionBox {
    background:
        linear-gradient(145deg, #303030, #111);
    border: 2px solid #777;
    border-radius: 14px;
    padding: 25px;
    box-shadow: 0 12px 40px #000;
}

#promotionBox h2 {
    margin-top: 0;
    color: #eee;
}

.promoButton {
    font-size: 42px;
    width: 75px;
    height: 75px;
    padding: 0;
}

#gameOver {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 90;
}

#gameOverBox {
    background:
        linear-gradient(145deg, #333, #0c0c0c);
    border: 2px solid #888;
    border-radius: 15px;
    padding: 30px;
    width: min(90vw, 420px);
    box-shadow: 0 15px 45px #000;
}

#gameOverTitle {
    font-family: Georgia, serif;
    font-size: 32px;
    color: #f0dfb7;
    margin-bottom: 10px;
}

#gameOverText {
    margin-bottom: 18px;
    color: #ccc;
}

@media (max-width: 900px) {
    #gameArea {
        flex-direction: column;
        align-items: center;
    }

    #sidePanel {
        width: min(700px, 82vw);
    }

    #moves {
        height: 150px;
    }
}

@media (max-width: 600px) {
    body {
        padding: 8px;
    }

    #boardWrap {
        width: 96vw;
    }

    #board {
        border-width: 7px;
    }

    #sidePanel {
        width: 96vw;
    }

    .piece {
        font-size: 11vw;
    }

    button {
        padding: 8px 11px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div id="app">

    <h1>CHESS</h1>
    <div id="subtitle">ONYX & IVORY • CLASSIC CHESS</div>

    <div id="menu">
        <button id="twoPlayerBtn" class="active">2 PLAYER</button>
        <button id="computerBtn">VS COMPUTER</button>
        <button id="level1Btn">LEVEL 1</button>
        <button id="level2Btn">LEVEL 2</button>
        <button id="level3Btn">LEVEL 3</button>
        <button id="newGameBtn">NEW GAME</button>
        <button id="flipBtn">FLIP BOARD</button>
        <button id="roomBtn">GAME ROOM</button>
    </div>

    <div id="gameArea">

        <div id="boardWrap">
            <div id="board"></div>
        </div>

        <div id="sidePanel">

            <div class="panelTitle">CHESS</div>

            <div id="status">WHITE TO MOVE</div>

            <div id="modeText">Mode: 2 Player</div>
            <div id="levelText">Computer: Level 1</div>

            <div style="margin-top:12px;font-weight:bold;color:#ddd;">
                MOVES
            </div>

            <div id="moves"></div>

        </div>

    </div>

</div>

<div id="promotion">
    <div id="promotionBox">
        <h2>PROMOTE PAWN</h2>
        <div id="promotionButtons"></div>
    </div>
</div>

<div id="gameOver">
    <div id="gameOverBox">
        <div id="gameOverTitle">GAME OVER</div>
        <div id="gameOverText"></div>
        <button id="gameOverNew">NEW GAME</button>
        <button id="gameOverRoom">GAME ROOM</button>
    </div>
</div>

<script>
/* =========================================================
   CHESS ENGINE
   ========================================================= */

const files = ["a","b","c","d","e","f","g","h"];

const PIECES = {
    w: {
        k: "♔",
        q: "♕",
        r: "♖",
        b: "♗",
        n: "♘",
        p: "♙"
    },
    b: {
        k: "♚",
        q: "♛",
        r: "♜",
        b: "♝",
        n: "♞",
        p: "♟"
    }
};

let board = [];
let turn = "w";
let selected = null;
let legalMovesForSelected = [];
let enPassant = null;
let castleRights = {
    wK: true,
    wQ: true,
    bK: true,
    bQ: true
};

let halfmoveClock = 0;
let fullmoveNumber = 1;

let moveHistory = [];
let positionHistory = {};

let gameMode = "2p";
let computerLevel = 1;
let flipped = false;
let gameOver = false;
let thinking = false;

let pendingPromotion = null;


/* =========================================================
   INITIAL POSITION
   ========================================================= */

function newGame() {

    board = Array.from({length:8}, () => Array(8).fill(null));

    const back = ["r","n","b","q","k","b","n","r"];

    for (let c = 0; c < 8; c++) {
        board[0][c] = { color:"b", type:back[c] };
        board[1][c] = { color:"b", type:"p" };

        board[6][c] = { color:"w", type:"p" };
        board[7][c] = { color:"w", type:back[c] };
    }

    turn = "w";
    selected = null;
    legalMovesForSelected = [];
    enPassant = null;

    castleRights = {
        wK:true,
        wQ:true,
        bK:true,
        bQ:true
    };

    halfmoveClock = 0;
    fullmoveNumber = 1;

    moveHistory = [];
    positionHistory = {};

    gameOver = false;
    thinking = false;
    pendingPromotion = null;

    document.getElementById("gameOver").style.display = "none";

    recordPosition();

    renderBoard();
    updateStatus();
    renderMoves();
}


/* =========================================================
   BOARD HELPERS
   ========================================================= */

function cloneBoard(src) {
    return src.map(row =>
        row.map(piece =>
            piece ? {...piece} : null
        )
    );
}

function inside(r,c) {
    return r >= 0 && r < 8 && c >= 0 && c < 8;
}

function opposite(color) {
    return color === "w" ? "b" : "w";
}

function squareName(r,c) {
    return files[c] + (8-r);
}

function findKing(b, color) {

    for (let r=0;r<8;r++) {
        for (let c=0;c<8;c++) {

            const p = b[r][c];

            if (p &&
                p.color === color &&
                p.type === "k") {

                return {r,c};
            }
        }
    }

    return null;
}


/* =========================================================
   ATTACK DETECTION
   ========================================================= */

function squareAttacked(b, r, c, byColor) {

    // Pawns
    const pawnRow = byColor === "w" ? r + 1 : r - 1;

    for (const dc of [-1,1]) {

        const pc = c + dc;

        if (inside(pawnRow,pc)) {

            const p = b[pawnRow][pc];

            if (p &&
                p.color === byColor &&
                p.type === "p") {

                return true;
            }
        }
    }


    // Knights
    const knightOffsets = [
        [-2,-1],[-2,1],
        [-1,-2],[-1,2],
        [1,-2],[1,2],
        [2,-1],[2,1]
    ];

    for (const [dr,dc] of knightOffsets) {

        const rr = r + dr;
        const cc = c + dc;

        if (!inside(rr,cc)) continue;

        const p = b[rr][cc];

        if (p &&
            p.color === byColor &&
            p.type === "n") {

            return true;
        }
    }


    // Kings
    for (let dr=-1;dr<=1;dr++) {
        for (let dc=-1;dc<=1;dc++) {

            if (dr===0 && dc===0) continue;

            const rr=r+dr;
            const cc=c+dc;

            if (!inside(rr,cc)) continue;

            const p=b[rr][cc];

            if (p &&
                p.color===byColor &&
                p.type==="k") {

                return true;
            }
        }
    }


    // Rook / Queen lines
    const straight = [
        [-1,0],[1,0],[0,-1],[0,1]
    ];

    for (const [dr,dc] of straight) {

        let rr=r+dr;
        let cc=c+dc;

        while (inside(rr,cc)) {

            const p=b[rr][cc];

            if (p) {

                if (p.color===byColor &&
                    (p.type==="r" || p.type==="q")) {

                    return true;
                }

                break;
            }

            rr += dr;
            cc += dc;
        }
    }


    // Bishop / Queen lines
    const diagonal = [
        [-1,-1],[-1,1],
        [1,-1],[1,1]
    ];

    for (const [dr,dc] of diagonal) {

        let rr=r+dr;
        let cc=c+dc;

        while (inside(rr,cc)) {

            const p=b[rr][cc];

            if (p) {

                if (p.color===byColor &&
                    (p.type==="b" || p.type==="q")) {

                    return true;
                }

                break;
            }

            rr += dr;
            cc += dc;
        }
    }

    return false;
}


function inCheck(b,color) {

    const king = findKing(b,color);

    if (!king) return true;

    return squareAttacked(
        b,
        king.r,
        king.c,
        opposite(color)
    );
}


/* =========================================================
   PSEUDO LEGAL MOVES
   ========================================================= */

function generatePseudoMoves(b,color,includeCastling=true) {

    const moves=[];

    for (let r=0;r<8;r++) {
        for (let c=0;c<8;c++) {

            const p=b[r][c];

            if (!p || p.color!==color) continue;

            if (p.type==="p") {

                const dir=color==="w" ? -1 : 1;
                const startRow=color==="w" ? 6 : 1;

                const oneR=r+dir;

                if (inside(oneR,c) && !b[oneR][c]) {

                    moves.push({
                        from:{r,c},
                        to:{r:oneR,c},
                        promotion:
                            (oneR===0 || oneR===7)
                            ? true
                            : null
                    });

                    const twoR=r+dir*2;

                    if (r===startRow &&
                        !b[twoR][c]) {

                        moves.push({
                            from:{r,c},
                            to:{r:twoR,c},
                            doublePawn:true
                        });
                    }
                }

                for (const dc of [-1,1]) {

                    const rr=r+dir;
                    const cc=c+dc;

                    if (!inside(rr,cc)) continue;

                    const target=b[rr][cc];

                    if (target &&
                        target.color!==color) {

                        moves.push({
                            from:{r,c},
                            to:{r:rr,c:cc},
                            capture:true,
                            promotion:
                                (rr===0 || rr===7)
                                ? true
                                : null
                        });
                    }

                    if (enPassant &&
                        enPassant.r===rr &&
                        enPassant.c===cc) {

                        moves.push({
                            from:{r,c},
                            to:{r:rr,c:cc},
                            enPassant:true
                        });
                    }
                }
            }


            if (p.type==="n") {

                const jumps=[
                    [-2,-1],[-2,1],
                    [-1,-2],[-1,2],
                    [1,-2],[1,2],
                    [2,-1],[2,1]
                ];

                for (const [dr,dc] of jumps) {

                    const rr=r+dr;
                    const cc=c+dc;

                    if (!inside(rr,cc)) continue;

                    const target=b[rr][cc];

                    if (!target ||
                        target.color!==color) {

                        moves.push({
                            from:{r,c},
                            to:{r:rr,c:cc},
                            capture:!!target
                        });
                    }
                }
            }


            if (["b","r","q"].includes(p.type)) {

                const dirs=[];

                if (p.type==="b" || p.type==="q") {
                    dirs.push(
                        [-1,-1],[-1,1],
                        [1,-1],[1,1]
                    );
                }

                if (p.type==="r" || p.type==="q") {
                    dirs.push(
                        [-1,0],[1,0],
                        [0,-1],[0,1]
                    );
                }

                for (const [dr,dc] of dirs) {

                    let rr=r+dr;
                    let cc=c+dc;

                    while (inside(rr,cc)) {

                        const target=b[rr][cc];

                        if (!target) {

                            moves.push({
                                from:{r,c},
                                to:{r:rr,c:cc}
                            });

                        } else {

                            if (target.color!==color) {

                                moves.push({
                                    from:{r,c},
                                    to:{r:rr,c:cc},
                                    capture:true
                                });
                            }

                            break;
                        }

                        rr+=dr;
                        cc+=dc;
                    }
                }
            }


            if (p.type==="k") {

                for (let dr=-1;dr<=1;dr++) {
                    for (let dc=-1;dc<=1;dc++) {

                        if (dr===0 && dc===0) continue;

                        const rr=r+dr;
                        const cc=c+dc;

                        if (!inside(rr,cc)) continue;

                        const target=b[rr][cc];

                        if (!target ||
                            target.color!==color) {

                            moves.push({
                                from:{r,c},
                                to:{r:rr,c:cc},
                                capture:!!target
                            });
                        }
                    }
                }


                // Castling
                if (includeCastling &&
                    !inCheck(b,color)) {

                    const row=color==="w" ? 7 : 0;

                    // Kingside
                    const kingSide =
                        color==="w"
                        ? castleRights.wK
                        : castleRights.bK;

                    if (kingSide &&
                        b[row][5]===null &&
                        b[row][6]===null &&
                        b[row][7] &&
                        b[row][7].type==="r" &&
                        b[row][7].color===color &&
                        !squareAttacked(
                            b,row,5,opposite(color)
                        ) &&
                        !squareAttacked(
                            b,row,6,opposite(color)
                        )) {

                        moves.push({
                            from:{r:row,c:4},
                            to:{r:row,c:6},
                            castle:"K"
                        });
                    }


                    // Queenside
                    const queenSide =
                        color==="w"
                        ? castleRights.wQ
                        : castleRights.bQ;

                    if (queenSide &&
                        b[row][1]===null &&
                        b[row][2]===null &&
                        b[row][3]===null &&
                        b[row][0] &&
                        b[row][0].type==="r" &&
                        b[row][0].color===color &&
                        !squareAttacked(
                            b,row,3,opposite(color)
                        ) &&
                        !squareAttacked(
                            b,row,2,opposite(color)
                        )) {

                        moves.push({
                            from:{r:row,c:4},
                            to:{r:row,c:2},
                            castle:"Q"
                        });
                    }
                }
            }
        }
    }

    return moves;
}


/* =========================================================
   MAKE / UNMAKE STYLE MOVE ON A CLONED POSITION
   ========================================================= */

function applyMoveToBoard(b,move,promotionPiece=null) {

    const next=cloneBoard(b);

    const piece=next[move.from.r][move.from.c];

    next[move.from.r][move.from.c]=null;

    if (move.enPassant) {

        const capturedPawnRow =
            move.to.r + (piece.color==="w" ? 1 : -1);

        next[capturedPawnRow][move.to.c]=null;
    }

    next[move.to.r][move.to.c]={
        ...piece
    };

    if (promotionPiece) {
        next[move.to.r][move.to.c].type=promotionPiece;
    }

    if (move.castle==="K") {

        const row=move.from.r;

        next[row][5]=next[row][7];
        next[row][7]=null;
    }

    if (move.castle==="Q") {

        const row=move.from.r;

        next[row][3]=next[row][0];
        next[row][0]=null;
    }

    return next;
}


/* =========================================================
   LEGAL MOVE GENERATION
   ========================================================= */

function generateLegalMoves(b,color) {

    const pseudo=generatePseudoMoves(
        b,
        color,
        true
    );

    const legal=[];

    for (const move of pseudo) {

        // Important: don't allow a king to capture the enemy king.
        const target=b[move.to.r][move.to.c];

        if (target && target.type==="k") {
            continue;
        }

        const next=applyMoveToBoard(
            b,
            move,
            move.promotion ? "q" : null
        );

        if (!inCheck(next,color)) {
            legal.push(move);
        }
    }

    return legal;
}


/* =========================================================
   POSITION KEY / DRAW RULES
   ========================================================= */

function positionKey() {

    let s="";

    for (let r=0;r<8;r++) {
        for (let c=0;c<8;c++) {

            const p=board[r][c];

            if (!p) {
                s+=".";
            } else {
                s+=p.color+p.type;
            }
        }
    }

    s+="|"+turn;

    s+="|"+
        (castleRights.wK?"K":"")+
        (castleRights.wQ?"Q":"")+
        (castleRights.bK?"k":"")+
        (castleRights.bQ?"q":"");

    if (enPassant) {
        s+="|"+enPassant.r+","+enPassant.c;
    } else {
        s+="|-";
    }

    return s;
}

function recordPosition() {

    const key=positionKey();

    positionHistory[key] =
        (positionHistory[key] || 0) + 1;
}

function insufficientMaterial() {

    const pieces=[];

    for (let r=0;r<8;r++) {
        for (let c=0;c<8;c++) {

            const p=board[r][c];

            if (p && p.type!=="k") {
                pieces.push({
                    ...p,
                    r,
                    c
                });
            }
        }
    }

    // King vs king
    if (pieces.length===0) {
        return true;
    }

    // King + one bishop/knight vs king
    if (pieces.length===1 &&
        (pieces[0].type==="b" ||
         pieces[0].type==="n")) {

        return true;
    }

    // King + bishop vs king + bishop,
    // with bishops on same color squares.
    if (pieces.length===2 &&
        pieces[0].type==="b" &&
        pieces[1].type==="b" &&
        pieces[0].color!==pieces[1].color) {

        const color1=(pieces[0].r+pieces[0].c)%2;
        const color2=(pieces[1].r+pieces[1].c)%2;

        return color1===color2;
    }

    return false;
}


/* =========================================================
   MOVE EXECUTION
   ========================================================= */

function makeMove(move,promotionType=null) {

    if (gameOver) return;

    const piece=board[move.from.r][move.from.c];

    if (!piece) return;

    const captured=board[move.to.r][move.to.c];

    const oldEnPassant=enPassant;

    let notation=createNotation(
        board,
        move,
        promotionType
    );

    board=applyMoveToBoard(
        board,
        move,
        promotionType
    );


    // Update castling rights
    if (piece.type==="k") {

        if (piece.color==="w") {
            castleRights.wK=false;
            castleRights.wQ=false;
        } else {
            castleRights.bK=false;
            castleRights.bQ=false;
        }
    }

    if (piece.type==="r") {

        if (piece.color==="w") {

            if (move.from.r===7 &&
                move.from.c===0) {

                castleRights.wQ=false;
            }

            if (move.from.r===7 &&
                move.from.c===7) {

                castleRights.wK=false;
            }

        } else {

            if (move.from.r===0 &&
                move.from.c===0) {

                castleRights.bQ=false;
            }

            if (move.from.r===0 &&
                move.from.c===7) {

                castleRights.bK=false;
            }
        }
    }


    // Capturing a rook also removes its castling rights.
    if (captured && captured.type==="r") {

        if (move.to.r===7 &&
            move.to.c===0 &&
            captured.color==="w") {

            castleRights.wQ=false;
        }

        if (move.to.r===7 &&
            move.to.c===7 &&
            captured.color==="w") {

            castleRights.wK=false;
        }

        if (move.to.r===0 &&
            move.to.c===0 &&
            captured.color==="b") {

            castleRights.bQ=false;
        }

        if (move.to.r===0 &&
            move.to.c===7 &&
            captured.color==="b") {

            castleRights.bK=false;
        }
    }


    // En passant target
    enPassant=null;

    if (piece.type==="p" &&
        Math.abs(move.to.r-move.from.r)===2) {

        enPassant={
            r:(move.from.r+move.to.r)/2,
            c:move.from.c
        };
    }


    // Halfmove clock
    if (piece.type==="p" ||
        captured ||
        move.enPassant) {

        halfmoveClock=0;

    } else {

        halfmoveClock++;
    }


    if (piece.color==="b") {
        fullmoveNumber++;
    }


    turn=opposite(turn);

    moveHistory.push({
        notation,
        color:piece.color,
        move,
        promotion:promotionType
    });

    recordPosition();

    selected=null;
    legalMovesForSelected=[];

    renderBoard();
    renderMoves();

    checkGameEnd();

    if (!gameOver &&
        gameMode==="computer" &&
        turn==="b") {

        thinking=true;

        updateStatus();

        setTimeout(computerMove,250);
    } else {

        updateStatus();
    }
}


/* =========================================================
   NOTATION
   ========================================================= */

function createNotation(b,move,promotionType) {

    const piece=b[move.from.r][move.from.c];

    if (move.castle==="K") return "O-O";
    if (move.castle==="Q") return "O-O-O";

    let text="";

    if (piece.type!=="p") {

        text=piece.type.toUpperCase();

        if (piece.type==="n") text="N";
    }

    let capture=!!b[move.to.r][move.to.c] ||
                move.enPassant;

    if (piece.type==="p" && capture) {
        text+=files[move.from.c];
    }

    if (capture) text+="x";

    text+=squareName(
        move.to.r,
        move.to.c
    );

    if (promotionType) {
        text+="="+promotionType.toUpperCase();
    }

    return text;
}


/* =========================================================
   CLICK HANDLING
   ========================================================= */

function handleSquareClick(r,c) {

    if (gameOver || thinking) return;

    if (gameMode==="computer" &&
        turn==="b") {

        return;
    }

    const clicked=board[r][c];

    if (selected) {

        const chosen=legalMovesForSelected.find(
            m =>
                m.to.r===r &&
                m.to.c===c
        );

        if (chosen) {

            if (chosen.promotion) {

                pendingPromotion=chosen;

                showPromotion();

            } else {

                makeMove(chosen);
            }

            return;
        }
    }


    if (clicked &&
        clicked.color===turn) {

        selected={r,c};

        legalMovesForSelected =
            generateLegalMoves(
                board,
                turn
            ).filter(
                m =>
                    m.from.r===r &&
                    m.from.c===c
            );

        renderBoard();

    } else {

        selected=null;
        legalMovesForSelected=[];
        renderBoard();
    }
}


/* =========================================================
   PROMOTION
   ========================================================= */

function showPromotion() {

    const container=
        document.getElementById("promotionButtons");

    container.innerHTML="";

    const color=turn;

    for (const type of ["q","r","b","n"]) {

        const button=
            document.createElement("button");

        button.className="promoButton";

        button.textContent=
            PIECES[color][type];

        if (color==="w") {
            button.classList.add("whitePiece");
        } else {
            button.classList.add("blackPiece");
        }

        button.onclick=()=>{

            document.getElementById(
                "promotion"
            ).style.display="none";

            makeMove(
                pendingPromotion,
                type
            );

            pendingPromotion=null;
        };

        container.appendChild(button);
    }

    document.getElementById(
        "promotion"
    ).style.display="flex";
}


/* =========================================================
   RENDER BOARD
   ========================================================= */

function renderBoard() {

    const boardElement=
        document.getElementById("board");

    boardElement.innerHTML="";

    const inCheckWhite=inCheck(board,"w");
    const inCheckBlack=inCheck(board,"b");

    for (let displayR=0;displayR<8;displayR++) {

        for (let displayC=0;displayC<8;displayC++) {

            const r=flipped ? 7-displayR : displayR;
            const c=flipped ? 7-displayC : displayC;

            const square=
                document.createElement("div");

            square.className=
                "square "+
                (((r+c)%2===0)
                    ? "light"
                    : "dark");

            square.dataset.r=r;
            square.dataset.c=c;

            if (selected &&
                selected.r===r &&
                selected.c===c) {

                square.classList.add("selected");
            }


            const legal=
                legalMovesForSelected.find(
                    m =>
                        m.to.r===r &&
                        m.to.c===c
                );

            if (legal) {

                if (board[r][c] ||
                    legal.enPassant) {

                    square.classList.add("capture");

                } else {

                    square.classList.add("legal");
                }
            }


            const historyLast=
                moveHistory.length
                    ? moveHistory[
                        moveHistory.length-1
                      ].move
                    : null;

            if (historyLast &&
                (
                    (
                        historyLast.from.r===r &&
                        historyLast.from.c===c
                    ) ||
                    (
                        historyLast.to.r===r &&
                        historyLast.to.c===c
                    )
                )) {

                square.classList.add("lastMove");
            }


            if (board[r][c] &&
                board[r][c].type==="k") {

                if (
                    (board[r][c].color==="w" &&
                     inCheckWhite) ||
                    (board[r][c].color==="b" &&
                     inCheckBlack)
                ) {

                    square.classList.add("inCheck");
                }
            }


            const piece=board[r][c];

            if (piece) {

                const pieceElement=
                    document.createElement("div");

                pieceElement.className=
                    "piece "+
                    (
                        piece.color==="w"
                        ? "whitePiece"
                        : "blackPiece"
                    );

                pieceElement.textContent=
                    PIECES[piece.color][piece.type];

                square.appendChild(pieceElement);
            }


            // Coordinates
            if (
                (!flipped && c===0) ||
                (flipped && c===7)
            ) {

                const rank=
                    document.createElement("span");

                rank.className="coord rank";

                rank.textContent=
                    8-r;

                square.appendChild(rank);
            }

            if (
                (!flipped && r===7) ||
                (flipped && r===0)
            ) {

                const file=
                    document.createElement("span");

                file.className="coord file";

                file.textContent=
                    files[c];

                square.appendChild(file);
            }


            square.addEventListener(
                "click",
                ()=>handleSquareClick(r,c)
            );

            boardElement.appendChild(square);
        }
    }
}


/* =========================================================
   STATUS
   ========================================================= */

function updateStatus() {

    const status=
        document.getElementById("status");

    const modeText=
        document.getElementById("modeText");

    const levelText=

    modeText.textContent=

        );

        status.textContent=

        return;
    }

        generateLegalMoves(

            turn
        );

    if (inCheck(board,turn)) {

        status.textContent=
            (
                turn==="w"
                ? "WHITE"
                : "BLACK"
            )+

    } else {

        status.textContent=

                ? "WHITE"
                : "BLACK"
            )+

    }
}


/* =========================================================
   MOVE LIST
   ========================================================= */

function renderMoves() {

    const movesElement=
        document.getElementById("moves");

    movesElement.innerHTML="";

    for (
        let i=0;
        i<moveHistory.length;
        i+=2
    ) {

            ? moveHistory[i].notation
            : "";

            ? moveHistory[i+1].notation
            : "";

        row.appendChild(number);
        row.appendChild(white);
        row.appendChild(black);

        movesElement.appendChild(row);
    }

    movesElement.scrollTop=
        movesElement.scrollHeight;
}


/* =========================================================
   GAME END / DRAW RULES
   ========================================================= */

function checkGameEnd() {

    const legal=
        generateLegalMoves(
            board,
            turn
        );

    const check=inCheck(board,turn);

    if (legal.length===0) {

        gameOver=true;

        if (check) {

            const winner=
                turn==="w"
                ? "BLACK"
                : "WHITE";

            finishGame(
                "CHECKMATE",
                winner+" WINS"
            );

        } else {

            finishGame(
                "STALEMATE",
                "DRAW"
            );
        }

        return;
    }


    // 75 move automatic draw
    if (halfmoveClock>=150) {

        gameOver=true;

        finishGame(
            "75-MOVE RULE",
            "DRAW"
        );

        return;
    }


    // Fivefold repetition
    const currentKey=positionKey();

    if (
        positionHistory[currentKey]>=5
    ) {

        gameOver=true;

        finishGame(
            "FIVEFOLD REPETITION",
            "DRAW"
        );

        return;
    }


    // 50 move claim-style draw
    if (halfmoveClock>=100) {

        gameOver=true;

        finishGame(
            "50-MOVE RULE",
            "DRAW"
        );

        return;
    }


    if (insufficientMaterial()) {

        gameOver=true;

        finishGame(
            "INSUFFICIENT MATERIAL",
            "DRAW"
        );

        return;
    }
}


function finishGame(title,text) {

    thinking=false;

    document.getElementById(
        "gameOverTitle"
    ).textContent=title;

    document.getElementById(
        "gameOverText"
    ).textContent=text;

    document.getElementById(
        "gameOver"
    ).style.display="flex";

    updateStatus();
}


/* =========================================================
   COMPUTER PLAYER
   ========================================================= */

function computerMove() {

    if (gameOver ||
        gameMode!=="computer" ||
        turn!=="b") {

        thinking=false;
        return;
    }

    const legal=
        generateLegalMoves(
            board,
            "b"
        );

    if (!legal.length) {

        thinking=false;
        checkGameEnd();

        return;
    }

    let chosen;


    if (computerLevel===1) {

        chosen=
            chooseEasyMove(legal);

    } else if (computerLevel===2) {

        chosen=
            chooseMediumMove(legal);

    } else {

        chosen=
            chooseHardMove(legal);
    }


    thinking=false;

    if (chosen.promotion) {

        // Computer always chooses queen unless
        // another promotion gives a higher score.
        makeMove(chosen,"q");

    } else {

        makeMove(chosen);
    }
}


/* =========================================================
   LEVEL 1
   ========================================================= */

function chooseEasyMove(legal) {

    // Mostly random, but captures are preferred.
    const captures=
        legal.filter(
            m =>
                board[m.to.r][m.to.c] ||
                m.enPassant
        );

    if (captures.length &&
        Math.random()<0.65) {

        return captures[
            Math.floor(
                Math.random()*captures.length
            )
        ];
    }

    return legal[
        Math.floor(
            Math.random()*legal.length
        )
    ];
}


/* =========================================================
   LEVEL 2
   ========================================================= */

function chooseMediumMove(legal) {

    let best=-Infinity;
    let choices=[];

    for (const move of legal) {

        const score=
            evaluateMove(move);

        if (score>best) {

            best=score;
            choices=[move];

        } else if (score===best) {

            choices.push(move);
        }
    }

    return choices[
        Math.floor(
            Math.random()*choices.length
        )
    ];
}


function evaluateMove(move) {

    let score=0;

    const target=
        board[move.to.r][move.to.c];

    if (target) {

        score += pieceValue(target.type)*10;
    }

    if (move.enPassant) {
        score+=100;
    }

    if (move.castle) {
        score+=80;
    }

    // Center control
    if (
        (move.to.r===3 || move.to.r===4) &&
        (move.to.c===3 || move.to.c===4)
    ) {

        score+=35;
    }

    // Give check?
    const next=
        applyMoveToBoard(
            board,
            move,
            move.promotion ? "q" : null
        );

    if (inCheck(next,"w")) {
        score+=90;
    }

    // Avoid obviously hanging pieces
    if (
        squareAttacked(
            next,
            move.to.r,
            move.to.c,
            "w"
        )
    ) {

        score-=pieceValue(
            board[move.from.r][move.from.c].type
        )*3;
    }

    score+=Math.random()*12;

    return score;
}


/* =========================================================
   LEVEL 3
   ========================================================= */

function chooseHardMove(legal) {

    let best=-Infinity;
    let bestMoves=[];

    for (const move of legal) {

        const next=
            applyMoveToBoard(
                board,
                move,
                move.promotion ? "q" : null
            );

        const oldBoard=board;
        const oldTurn=turn;

        board=next;
        turn="w";

        const score=
            minimax(
                2,
                -Infinity,
                Infinity,
                false
            );

        board=oldBoard;
        turn=oldTurn;

        const immediate=
            evaluateMove(move);

        const total=
            score+immediate;

        if (total>best) {

            best=total;
            bestMoves=[move];

        } else if (total===best) {

            bestMoves.push(move);
        }
    }

    return bestMoves[
        Math.floor(
            Math.random()*bestMoves.length
        )
    ];
}


/* =========================================================
   MINIMAX
   ========================================================= */

function minimax(
    depth,
    alpha,
    beta,
    maximizing
) {

    if (depth===0) {

        return evaluatePosition();
    }

    const color=
        maximizing
        ? "b"
        : "w";

    const moves=
        generateLegalMoves(
            board,
            color
        );

    if (!moves.length) {

        if (inCheck(board,color)) {

            return maximizing
                ? -100000
                : 100000;
        }

        return 0;
    }


    if (maximizing) {

        let value=-Infinity;

        for (const move of moves) {

            const oldBoard=board;

            board=
                applyMoveToBoard(
                    board,
                    move,
                    move.promotion ? "q" : null
                );

            value=Math.max(
                value,
                minimax(
                    depth-1,
                    alpha,
                    beta,
                    false
                )
            );

            board=oldBoard;

            alpha=Math.max(
                alpha,
                value
            );

            if (alpha>=beta) break;
        }

        return value;

    } else {

        let value=Infinity;

        for (const move of moves) {

            const oldBoard=board;

            board=
                applyMoveToBoard(
                    board,
                    move,
                    move.promotion ? "q" : null
                );

            value=Math.min(
                value,
                minimax(
                    depth-1,
                    alpha,
                    beta,
                    true
                )
            );

            board=oldBoard;

            beta=Math.min(
                beta,
                value
            );

            if (alpha>=beta) break;
        }

        return value;
    }
}


/* =========================================================
   POSITION EVALUATION
   ========================================================= */

function pieceValue(type) {

    switch(type) {

        case "p": return 100;
        case "n": return 320;
        case "b": return 330;
        case "r": return 500;
        case "q": return 900;
        case "k": return 20000;

        default: return 0;
    }
}


const pawnTable=[
     0,  0,  0,  0,  0,  0,  0,  0,
    50, 50, 50, 50, 50, 50, 50, 50,
    10, 10, 20, 30, 30, 20, 10, 10,
     5,  5, 10, 25, 25, 10,  5,  5,
     0,  0,  0, 20, 20,  0,  0,  0,
     5, -5,-10,  0,  0,-10, -5,  5,
     5, 10, 10,-20,-20, 10, 10,  5,
     0,  0,  0,  0,  0,  0,  0,  0
];

const knightTable=[
   -50,-40,-30,-30,-30,-30,-40,-50,
   -40,-20,  0,  0,  0,  0,-20,-40,
   -30,  0, 10, 15, 15, 10,  0,-30,
   -30,  5, 15, 20, 20, 15,  5,-30,
   -30,  0, 15, 20, 20, 15,  0,-30,
   -30,  5, 10, 15, 15, 10,  5,-30,
   -40,-20,  0,  5,  5,  0,-20,-40,
   -50,-40,-30,-30,-30,-30,-40,-50
];

const bishopTable=[
   -20,-10,-10,-10,-10,-10,-10,-20,
   -10,  0,  0,  0,  0,  0,  0,-10,
   -10,  0,  5, 10, 10,  5,  0,-10,
   -10,  5,  5, 10, 10,  5,  5,-10,
   -10,  0, 10, 10, 10, 10,  0,-10,
   -10, 10, 10, 10, 10, 10, 10,-10,
   -10,  5,  0,  0,  0,  0,  5,-10,
   -20,-10,-10,-10,-10,-10,-10,-20
];

const rookTable=[
     0,  0,  0,  0,  0,  0,  0,  0,
     5, 10, 10, 10, 10, 10, 10,  5,
    -5,  0,  0,  0,  0,  0,  0, -5,
    -5,  0,  0,  0,  0,  0,  0, -5,
    -5,  0,  0,  0,  0,  0,  0, -5,
    -5,  0,  0,  0,  0,  0,  0, -5,
    -5,  0,  0,  0,  0,  0,  0, -5,
     0,  0,  0,  5,  5,  0,  0,  0
];

const queenTable=[
   -20,-10,-10, -5, -5,-10,-10,-20,
   -10,  0,  0,  0,  0,  0,  0,-10,
   -10,  0,  5,  5,  5,  5,  0,-10,
    -5,  0,  5,  5,  5,  5,  0, -5,
     0,  0,  5,  5,  5,  5,  0, -5,
   -10,  5,  5,  5,  5,  5,  0,-10,
   -10,  0,  5,  0,  0,  0,  0,-10,
   -20,-10,-10, -5, -5,-10,-10,-20
];

const kingTable=[
   -30,-40,-40,-50,-50,-40,-40,-30,
   -30,-40,-40,-50,-50,-40,-40,-30,
   -30,-40,-40,-50,-50,-40,-40,-30,
   -30,-40,-40,-50,-50,-40,-40,-30,
   -20,-30,-30,-40,-40,-30,-30,-20,
   -10,-20,-20,-20,-20,-20,-20,-10,
    20, 20,  0,  0,  0,  0, 20, 20,
    20, 30, 10,  0,  0, 10, 30, 20
];


function evaluatePosition() {

    let score=0;

    for (let r=0;r<8;r++) {
        for (let c=0;c<8;c++) {

            const p=board[r][c];

            if (!p) continue;

            let value=
                pieceValue(p.type);

            let table=null;

            if (p.type==="p") table=pawnTable;
            if (p.type==="n") table=knightTable;
            if (p.type==="b") table=bishopTable;
            if (p.type==="r") table=rookTable;
            if (p.type==="q") table=queenTable;
            if (p.type==="k") table=kingTable;

            let index=r*8+c;

            if (p.color==="b") {
                index=(7-r)*8+c;
            }

            value+=table[index];

            if (p.color==="b") {
                score+=value;
            } else {
                score-=value;
            }
        }
    }

    return score;
}

    ).classList.remove("active");

    newGame();
};


document.getElementById(
    "computerBtn"
).onclick=function() {

    gameMode="computer";

    document.getElementById(
        "computerBtn"
    ).classList.add("active");

    document.getElementById(
        "twoPlayerBtn"
    ).classList.remove("active");

    newGame();
};


function setLevel(level) {

    computerLevel=level;

    document.getElementById(
        "level1Btn"
    ).classList.toggle(
        "active",
        level===1
    );

    document.getElementById(
        "level2Btn"
    ).classList.toggle(
        "active",
        level===2
    );

    document.getElementById(
        "level3Btn"
    ).classList.toggle(
        "active",
        level===3
    );

    updateStatus();
}

document.getElementById(
    "level1Btn"
).onclick=()=>setLevel(1);

document.getElementById(
    "level2Btn"
).onclick=()=>setLevel(2);

document.getElementById(
    "level3Btn"
).onclick=()=>setLevel(3);


document.getElementById(
    "newGameBtn"
).onclick=function() {

    newGame();
};


document.getElementById(
    "flipBtn"
).onclick=function() {

    flipped=!flipped;

    renderBoard();
};


document.getElementById(
    "roomBtn"
).onclick=function() {

    window.location.href="index.html";
};


document.getElementById(
    "gameOverNew"
).onclick=function() {

    document.getElementById(
        "gameOver"
    ).style.display="none";

    newGame();
};


document.getElementById(
    "gameOverRoom"
).onclick=function() {

    window.location.href="index.html";
};


/* =========================================================
   START
   ========================================================= */

newGame();

</script>

</body>
</html>
