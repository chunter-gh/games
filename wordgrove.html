<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Word Grove • Game Room</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,Arial,sans-serif}body{background:radial-gradient(circle at 50% -10%,#38685c,#163c39 56%,#102927);color:#f9f4df}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
.app{min-height:100dvh;max-width:1100px;margin:auto;padding:10px clamp(9px,2vw,24px) 18px;display:flex;flex-direction:column;align-items:center;gap:8px}.top{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}.back{color:#e5f9e9;text-decoration:none;font-weight:700;background:#ffffff16;border:1px solid #ffffff35;border-radius:12px;padding:8px 12px}.brand{text-align:center}.brand h1{font-family:Georgia,serif;letter-spacing:.06em;font-size:clamp(25px,5vw,42px);line-height:1;margin:0;color:#f8dc92;text-shadow:0 3px 8px #0008}.brand small{color:#b9d3bf;letter-spacing:.12em;text-transform:uppercase;font-size:10px}.new{border:1px solid #e3c889;background:#32584b;color:#fff4d2;border-radius:12px;padding:8px 12px;font-weight:700}
.scores{width:min(100%,670px);display:grid;grid-template-columns:1fr 1fr;gap:7px}.score{display:flex;justify-content:space-between;align-items:center;background:#0c292b9c;border:1px solid #a7c7ad5c;border-radius:13px;padding:7px 12px;min-width:0}.score.active{border-color:#f9da8a;box-shadow:0 0 0 2px #ffda7a35}.score strong{font-size:23px;color:#f8dc92}.score span{font-size:12px;letter-spacing:.07em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board-wrap{width:min(100%,660px,calc(100dvh - 280px));min-width:0;background:#a98558;padding:clamp(4px,1vw,9px);border:3px solid #e8c596;border-radius:17px;box-shadow:0 14px 30px #061b19aa,inset 0 0 0 3px #64492c}.board{display:grid;grid-template-columns:repeat(15,1fr);aspect-ratio:1;gap:2px;background:#446951;border:2px solid #3d5845;border-radius:8px;overflow:hidden}.cell{border:0;border-radius:3px;background:#d9e3bf;color:#50644c;min-width:0;min-height:0;padding:0;position:relative;display:grid;place-items:center;aspect-ratio:1;font-size:clamp(7px,1.2vw,11px);font-weight:900;line-height:1}.cell.tw{background:#e0a383;color:#683c34}.cell.dw{background:#efd5a7;color:#745325}.cell.tl{background:#9fbdb3;color:#315952}.cell.dl{background:#bbd7b5;color:#38604b}.cell.center{background:#e4bd7b}.cell.hint{outline:2px solid #fff6bd;outline-offset:-2px}.cell .mark{display:block;text-align:center;line-height:.95}.tile{width:100%;height:100%;border-radius:4px;background:linear-gradient(135deg,#fff3ce,#dfbb7e);border:1px solid #9c7546;box-shadow:inset 0 1px 1px #fff9,0 2px 2px #0005;display:grid;place-items:center;position:relative;color:#2a342d;font-family:Georgia,serif;font-weight:900;font-size:clamp(12px,2.45vw,26px)}.tile.pending{background:linear-gradient(135deg,#fff7d7,#e8ca8d);outline:2px solid #f6df87;outline-offset:-2px}.tile em{font:700 clamp(6px,1vw,10px) system-ui;position:absolute;right:9%;bottom:4%;font-style:normal}.tile.empty{opacity:.55}
.controls{width:min(100%,670px);display:flex;flex-direction:column;gap:7px}.rack{display:flex;justify-content:center;align-items:center;gap:clamp(3px,1vw,8px);min-height:clamp(40px,9vw,65px);background:#0b292b8a;border:1px solid #ffffff25;border-radius:14px;padding:6px}.rack button{width:clamp(35px,8vw,55px);height:clamp(35px,8vw,55px);flex:none;padding:0;border:0;background:transparent}.rack .tile{font-size:clamp(19px,4vw,29px)}.rack button.selected .tile{transform:translateY(-5px);outline:3px solid #ffe17c;outline-offset:1px}.rack button.exchanging .tile{outline:3px solid #d6837d;outline-offset:1px}.rack .cover{font-size:13px;color:#bdd8c9;text-align:center;padding:8px}.actions{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.actions button,.overlay button{background:#eacb88;border:0;border-radius:10px;padding:9px 12px;font-weight:800;color:#273d33;box-shadow:0 3px 0 #9d7343}.actions .quiet{background:#b8d0bb;box-shadow:0 3px 0 #607d65}.status{min-height:2.6em;text-align:center;line-height:1.3;font-size:13px;color:#e9efda}.foot{font-size:11px;color:#adc7b6;text-align:center}.overlay{position:fixed;inset:0;background:#071917d9;z-index:5;display:grid;place-items:center;padding:20px}.overlay[hidden]{display:none}.dialog{width:min(100%,420px);background:#21453d;border:2px solid #dfc18b;border-radius:20px;padding:23px;text-align:center;box-shadow:0 20px 50px #000a}.dialog h2{font-family:Georgia,serif;color:#f6dc9e;margin:0 0 10px}.dialog p{line-height:1.5}.letters{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:16px 0}.letters button{padding:7px 0}.dialog .secondary{background:#b9d4c0;margin-left:8px}
@media(max-width:560px){.app{gap:5px}.board-wrap{width:min(100%,calc(100dvh - 270px));padding:4px}.board{gap:1px}.score{padding:5px 8px}.score strong{font-size:19px}.actions button{padding:8px 9px;font-size:12px}.status{font-size:12px}.brand small{display:none}}@media(max-height:650px){.brand small,.foot{display:none}.app{gap:4px;padding-top:4px}.board-wrap{width:min(100%,calc(100dvh - 215px))}.status{min-height:1.4em}}
</style>
</head>
<body><main class="app">
<header class="top"><a class="back" href="index.html">← Games</a><div class="brand"><h1>Word Grove</h1><small>Plant words. Grow points.</small></div><button class="new" id="new">New game</button></header>
<section class="scores"><div class="score" id="score0"><span>PLAYER 1</span><strong>0</strong></div><div class="score" id="score1"><span>PLAYER 2</span><strong>0</strong></div></section>
<div class="board-wrap"><div class="board" id="board" role="grid" aria-label="15 by 15 word board"></div></div>
<section class="controls"><div class="rack" id="rack" aria-label="Letter rack"></div><div class="actions"><button id="play">Play word</button><button class="quiet" id="recall">Recall</button><button class="quiet" id="shuffle">Shuffle rack</button><button class="quiet" id="exchange">Exchange</button><button class="quiet" id="pass">Pass</button></div><div class="status" id="status" role="status"></div></section>
<div class="foot">Tap a tile, then a square. Tap a placed tile to return it. Blank tiles let you choose a letter. Dictionary: SCOWL. <a href="wordgrove-dictionary-credits.txt" style="color:#d6eabb">Credits and license</a>.</div>
</main><div class="overlay" id="overlay" hidden><div class="dialog" id="dialog"></div></div>
<script src="wordgrove-words.js"></script><script>
"use strict";
const N=15,CENTER=7,POINTS={A:1,B:3,C:3,D:2,E:1,F:4,G:2,H:4,I:1,J:8,K:5,L:1,M:3,N:1,O:1,P:3,Q:10,R:1,S:1,T:1,U:1,V:4,W:4,X:8,Y:4,Z:10,"?":0};
const COUNTS={A:9,B:2,C:2,D:4,E:12,F:2,G:3,H:2,I:9,J:1,K:1,L:4,M:2,N:6,O:8,P:2,Q:1,R:6,S:4,T:6,U:4,V:2,W:2,X:1,Y:2,Z:1,"?":2};
const DICTIONARY=new Set((window.WORD_GROVE_WORDS||"").split(" "));
const boardEl=document.getElementById("board"),rackEl=document.getElementById("rack"),statusEl=document.getElementById("status"),overlay=document.getElementById("overlay"),dialog=document.getElementById("dialog");
let board,bag,racks,scores,turn,pending,chosen,exchangeMode,exchangeSet,consecutivePasses,finished,nextId,hiddenRack;
const key=(r,c)=>r+","+c,inside=(r,c)=>r>=0&&r<N&&c>=0&&c<N;
function premium(r,c){
  if(r===7&&c===7)return "dw";
  const a=Math.min(r,14-r),b=Math.min(c,14-c);
  if((a===1&&b===1)||(a===1&&b===7)||(a===7&&b===1))return "tw";
  if((a===2&&b===2)||(a===4&&b===4)||(a===6&&b===6))return "dw";
  if((a===0&&b===4)||(a===4&&b===0)||(a===3&&b===7)||(a===7&&b===3))return "tl";
  if((a===0&&b===2)||(a===2&&b===0)||(a===5&&b===5)||(a===7&&b===5)||(a===5&&b===7))return "dl";
  return "";
}
function tile(letter){return {id:nextId++,letter,value:POINTS[letter],blank:letter==="?"};}
function fillRack(p){while(racks[p].length<7&&bag.length)racks[p].push(bag.pop());}
function message(s){statusEl.textContent=s;}
function start(){nextId=1;board=Array.from({length:N},()=>Array(N).fill(null));bag=[];for(const [letter,count] of Object.entries(COUNTS))for(let i=0;i<count;i++)bag.push(tile(letter));for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}racks=[[],[]];fillRack(0);fillRack(1);scores=[0,0];turn=0;pending=new Map();chosen=null;exchangeMode=false;exchangeSet=new Set();consecutivePasses=0;finished=false;hiddenRack=false;overlay.hidden=true;render();message("Player 1 begins. Place a word across the center flower.");}
function at(r,c){return pending.get(key(r,c))||board[r][c];}
function makeTile(t,temporary=false){const el=document.createElement("span");el.className="tile"+(temporary?" pending":"");el.textContent=t.letter;const score=document.createElement("em");score.textContent=t.value;el.appendChild(score);return el;}
function render(){
  boardEl.replaceChildren();const frag=document.createDocumentFragment();
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const cell=document.createElement("button");cell.type="button";cell.className="cell "+premium(r,c)+(r===7&&c===7?" center":"");cell.setAttribute("role","gridcell");cell.dataset.r=r;cell.dataset.c=c;
    const t=at(r,c);if(t)cell.appendChild(makeTile(t,pending.has(key(r,c))));else{const label=premium(r,c)==="tw"?"3×<br>word":premium(r,c)==="dw"?"2×<br>word":premium(r,c)==="tl"?"3×<br>letter":premium(r,c)==="dl"?"2×<br>letter":r===7&&c===7?"✿":"";if(label){const mark=document.createElement("span");mark.className="mark";mark.innerHTML=label;cell.appendChild(mark);}}
    cell.setAttribute("aria-label",String.fromCharCode(65+c)+(r+1)+(t?" "+t.letter:"")+(premium(r,c)?" "+premium(r,c):""));frag.appendChild(cell);
  }boardEl.appendChild(frag);
  for(let p=0;p<2;p++){const box=document.getElementById("score"+p);box.classList.toggle("active",p===turn&&!finished);box.querySelector("strong").textContent=scores[p];}
  rackEl.replaceChildren();if(hiddenRack){const cover=document.createElement("div");cover.className="cover";cover.textContent="Tiles hidden until Player "+(turn+1)+" is ready";rackEl.appendChild(cover);}else for(const t of racks[turn]){const b=document.createElement("button");b.type="button";b.dataset.id=t.id;b.setAttribute("aria-label",(t.blank?"blank":t.letter)+" tile, "+t.value+" points");if(chosen===t.id)b.classList.add("selected");if(exchangeSet.has(t.id))b.classList.add("exchanging");b.appendChild(makeTile(t));rackEl.appendChild(b);}
  document.getElementById("play").disabled=finished||hiddenRack||!pending.size||exchangeMode;document.getElementById("recall").disabled=finished||hiddenRack||!pending.size;document.getElementById("shuffle").disabled=finished||hiddenRack||exchangeMode;document.getElementById("exchange").disabled=finished||hiddenRack||(!exchangeMode&&(!bag.length||pending.size>0));document.getElementById("exchange").textContent=exchangeMode?"Swap "+exchangeSet.size:"Exchange";document.getElementById("pass").disabled=finished||hiddenRack;document.getElementById("pass").textContent=exchangeMode?"Cancel swap":"Pass";
}
function showDialog(title,body,buttons){overlay.hidden=false;dialog.replaceChildren();const h=document.createElement("h2");h.textContent=title;dialog.appendChild(h);const p=document.createElement("p");p.textContent=body;dialog.appendChild(p);for(const [label,action,secondary] of buttons){const b=document.createElement("button");b.textContent=label;if(secondary)b.className="secondary";b.onclick=action;dialog.appendChild(b);}}
function chooseBlank(callback){showDialog("Choose a letter","Your blank tile scores zero points.",[]);const letters=document.createElement("div");letters.className="letters";for(const ch of "ABCDEFGHIJKLMNOPQRSTUVWXYZ"){const b=document.createElement("button");b.textContent=ch;b.onclick=()=>{overlay.hidden=true;callback(ch);};letters.appendChild(b);}dialog.appendChild(letters);const cancel=document.createElement("button");cancel.textContent="Cancel";cancel.className="secondary";cancel.onclick=()=>overlay.hidden=true;dialog.appendChild(cancel);}
function place(r,c){if(finished||hiddenRack||exchangeMode)return;const k=key(r,c);if(pending.has(k)){const t=pending.get(k);pending.delete(k);racks[turn].push({...t,letter:t.blank?"?":t.letter});chosen=t.id;render();return;}if(board[r][c]||chosen===null)return;const i=racks[turn].findIndex(t=>t.id===chosen);if(i<0)return;const t=racks[turn][i];const commit=letter=>{racks[turn].splice(i,1);pending.set(k,{...t,letter});chosen=null;render();};if(t.blank)chooseBlank(commit);else commit(t.letter);}
function wordAt(r,c,dr,dc){while(inside(r-dr,c-dc)&&at(r-dr,c-dc)){r-=dr;c-=dc;}const cells=[];while(inside(r,c)&&at(r,c)){cells.push({r,c,t:at(r,c)});r+=dr;c+=dc;}return cells;}
function checkMove(){
  const ps=[...pending.keys()].map(k=>k.split(",").map(Number)),first=ps[0];if(!first)return {error:"Place some tiles first."};
  const sameRow=ps.every(p=>p[0]===first[0]),sameCol=ps.every(p=>p[1]===first[1]);if(!sameRow&&!sameCol)return {error:"Place tiles in one row or column."};
  if(!board.some(row=>row.some(Boolean))&&!pending.has(key(7,7)))return {error:"The first word must cover the center flower."};
  if(board.some(row=>row.some(Boolean))&&!ps.some(([r,c])=>[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].some(([y,x])=>inside(y,x)&&board[y][x])))return {error:"Your word must touch a word already on the board."};
  let main;if(ps.length>1){const dir=sameRow?[0,1]:[1,0];const ordered=ps.map(p=>sameRow?p[1]:p[0]).sort((a,b)=>a-b);for(let n=ordered[0];n<=ordered.at(-1);n++)if(!at(sameRow?first[0]:n,sameRow?n:first[1]))return {error:"Fill the gaps between your tiles."};main=wordAt(first[0],first[1],...dir);}else{const h=wordAt(first[0],first[1],0,1),v=wordAt(first[0],first[1],1,0);main=h.length>=v.length?h:v;}
  const words=[],seen=new Set();const add=cells=>{if(cells.length<2)return;const k=key(cells[0].r,cells[0].c)+"/"+key(cells.at(-1).r,cells.at(-1).c);if(!seen.has(k)){seen.add(k);words.push(cells);}};add(main);
  const perp=main.length>1&&main[0].r===main.at(-1).r?[1,0]:[0,1];for(const [r,c] of ps)add(wordAt(r,c,...perp));
  if(!words.length)return {error:"Make a word of at least two letters."};
  const invalid=words.map(w=>w.map(x=>x.t.letter).join("")).filter(w=>!DICTIONARY.has(w));if(invalid.length)return {error:"Not in this dictionary: "+invalid.join(", ")};
  let total=0;const details=[];for(const word of words){let points=0,mult=1;for(const {r,c,t} of word){let v=t.value;if(pending.has(key(r,c))){const p=premium(r,c);if(p==="dl")v*=2;if(p==="tl")v*=3;if(p==="dw")mult*=2;if(p==="tw")mult*=3;}points+=v;}const score=points*mult;total+=score;details.push(word.map(x=>x.t.letter).join("")+" +"+score);}if(ps.length===7)total+=40;return {total,details};
}
function nextTurn(note){chosen=null;exchangeMode=false;exchangeSet.clear();turn=1-turn;hiddenRack=true;render();showDialog("Pass the board",note+" Hand the device to Player "+(turn+1)+".",[["Player "+(turn+1)+" ready",()=>{overlay.hidden=true;hiddenRack=false;render();message("Player "+(turn+1)+": your turn. "+bag.length+" tiles remain in the bag.");}]]);}
function endGame(reason){finished=true;hiddenRack=false;for(let p=0;p<2;p++)scores[p]-=racks[p].reduce((n,t)=>n+t.value,0);if(!racks[turn].length)scores[turn]+=racks[1-turn].reduce((n,t)=>n+t.value,0);render();const winner=scores[0]===scores[1]?"It's a tie!":"Player "+(scores[0]>scores[1]?1:2)+" wins!";message(reason+" "+winner);showDialog("Game over",reason+" Final score: "+scores[0]+"–"+scores[1]+". "+winner,[["Play again",start],["View board",()=>overlay.hidden=true,true]]);}
function play(){const result=checkMove();if(result.error){message(result.error);return;}for(const [k,t] of pending){const [r,c]=k.split(",").map(Number);board[r][c]=t;}const count=pending.size;pending.clear();scores[turn]+=result.total;fillRack(turn);consecutivePasses=0;render();const note="Player "+(turn+1)+" played "+result.details.join(" · ")+" = "+result.total+(count===7?" (seven tile bonus included)":"")+".";if(!bag.length&&!racks[turn].length){endGame(note);return;}nextTurn(note);}
function swap(){if(!exchangeMode){if(pending.size){message("Recall your tiles before exchanging.");return;}if(!bag.length){message("The bag is empty.");return;}exchangeMode=true;exchangeSet.clear();chosen=null;render();message("Select tiles to exchange, then tap Swap.");return;}if(!exchangeSet.size){message("Select at least one tile.");return;}if(exchangeSet.size>bag.length){message("Only "+bag.length+" tiles remain in the bag.");return;}const old=racks[turn].filter(t=>exchangeSet.has(t.id));racks[turn]=racks[turn].filter(t=>!exchangeSet.has(t.id));for(let i=0;i<old.length;i++)racks[turn].push(bag.pop());bag.push(...old.map(t=>({...t,letter:t.blank?"?":t.letter})));for(let i=bag.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}consecutivePasses++;if(consecutivePasses>=6)endGame("Six turns without a word.");else nextTurn("Player "+(turn+1)+" exchanged "+old.length+" tile"+(old.length===1?"":"s")+".");}
boardEl.addEventListener("click",e=>{const cell=e.target.closest(".cell");if(cell)place(+cell.dataset.r,+cell.dataset.c);});rackEl.addEventListener("click",e=>{const b=e.target.closest("button[data-id]");if(!b||hiddenRack)return;const id=+b.dataset.id;if(exchangeMode){if(exchangeSet.has(id))exchangeSet.delete(id);else exchangeSet.add(id);}else chosen=chosen===id?null:id;render();});
document.getElementById("play").onclick=play;document.getElementById("recall").onclick=()=>{for(const t of pending.values())racks[turn].push({...t,letter:t.blank?"?":t.letter});pending.clear();chosen=null;render();message("Tiles returned to the rack.");};document.getElementById("shuffle").onclick=()=>{racks[turn].sort(()=>Math.random()-.5);render();};document.getElementById("exchange").onclick=swap;document.getElementById("pass").onclick=()=>{if(exchangeMode){exchangeMode=false;exchangeSet.clear();render();message("Exchange canceled.");return;}if(pending.size){message("Recall your tiles before passing.");return;}consecutivePasses++;if(consecutivePasses>=6)endGame("Six turns without a word.");else nextTurn("Player "+(turn+1)+" passed.");};document.getElementById("new").onclick=()=>showDialog("New game?","The current board and scores will be replaced.",[["Start fresh",start],["Keep playing",()=>overlay.hidden=true,true]]);
start();
</script></body></html>
