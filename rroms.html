<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Game Lobby</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        Arial,
        sans-serif;
}

body {

    background:
        radial-gradient(
            circle at 50% 10%,
            #244b72 0%,
            #10243c 45%,
            #06101d 100%
        );

    color: white;
}

.room-page {

    width: 100%;
    height: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    padding:
        22px
        16px;
}


/* TITLE */

.title {

    margin: 0;

    font-size:
        clamp(
            28px,
            8vw,
            52px
        );

    font-weight: 900;

    letter-spacing: 3px;

    text-align: center;

    text-shadow:
        0 3px 0 #14283e,
        0 6px 12px rgba(0,0,0,.8);
}

.subtitle {

    margin-top: 6px;

    color: #b9d7ee;

    letter-spacing: 3px;

    font-size: 12px;

    text-align: center;
}


/* NAME PANEL */

.identity {

    width:
        min(
            100%,
            500px
        );

    margin-top: 22px;

    padding: 18px;

    border-radius: 20px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.16),
            rgba(255,255,255,.04)
        );

    border:
        1px solid
        rgba(255,255,255,.25);

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.35);
}

.identity label {

    display: block;

    margin-bottom: 8px;

    font-size: 13px;

    font-weight: bold;

    color: #c9e5fa;
}

.name-row {

    display: flex;

    gap: 8px;
}

.name-input {

    flex: 1;

    min-width: 0;

    height: 48px;

    border: none;

    border-radius: 12px;

    padding:
        0 14px;

    font-size: 17px;

    outline: none;
}

.anonymous-row {

    margin-top: 12px;

    display: flex;

    align-items: center;

    gap: 9px;

    font-size: 14px;

    color: #d4e8f7;
}

.anonymous-row input {

    width: 18px;
    height: 18px;
}


/* BUTTONS */

button {

    border: none;

    cursor: pointer;

    font-weight: 900;
}

.join-button {

    height: 48px;

    padding:
        0 18px;

    border-radius: 12px;

    background:
        linear-gradient(
            180deg,
            #46a6ef,
            #1766a5
        );

    color: white;

    box-shadow:
        0 6px 14px
        rgba(0,0,0,.35);
}

.join-button:active {

    transform: scale(.96);
}


/* LOBBY */

.lobby {

    width:
        min(
            100%,
            600px
        );

    flex: 1;

    min-height: 0;

    margin-top: 18px;

    display: none;

    flex-direction: column;
}

.lobby.visible {

    display: flex;
}


/* STATUS */

.status {

    padding: 12px;

    border-radius: 12px;

    background:
        rgba(0,0,0,.25);

    text-align: center;

    color: #c9e5fa;

    font-size: 14px;

    margin-bottom: 10px;
}


/* RANDOM */

.random-button {

    width: 100%;

    min-height: 58px;

    border-radius: 16px;

    margin-bottom: 12px;

    background:
        linear-gradient(
            135deg,
            #32a852,
            #146c2c
        );

    color: white;

    font-size: 17px;

    box-shadow:
        0 8px 18px
        rgba(0,0,0,.35);
}

.random-button:active {

    transform: scale(.97);
}


/* PLAYER LIST */

.player-list {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding-right: 3px;
}

.player {

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 13px;

    margin-bottom: 8px;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.14),
            rgba(255,255,255,.05)
        );

    border:
        1px solid
        rgba(255,255,255,.18);
}

.player-icon {

    width: 42px;
    height: 42px;

    flex-shrink: 0;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        #1c5c89;

    font-size: 20px;
}

.player-info {

    flex: 1;

    min-width: 0;
}

.player-name {

    font-weight: 900;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.player-state {

    margin-top: 3px;

    font-size: 11px;

    color: #a9c7dc;
}

.invite-button {

    height: 40px;

    padding:
        0 14px;

    border-radius: 10px;

    background:
        #28699e;

    color: white;
}

.invite-button:active {

    transform: scale(.94);
}


/* EMPTY */

.empty {

    text-align: center;

    padding: 35px 15px;

    color: #9fb9cc;

    font-size: 14px;
}


/* INVITATION */

.invitation {

    position: fixed;

    left: 50%;

    top: 50%;

    transform:
        translate(
            -50%,
            -50%
        );

    width:
        min(
            90vw,
            420px
        );

    padding: 24px;

    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            #21496c,
            #10283f
        );

    border:
        1px solid
        rgba(255,255,255,.35);

    box-shadow:
        0 25px 60px
        rgba(0,0,0,.65);

    z-index: 100;

    display: none;

    text-align: center;
}

.invitation.visible {

    display: block;
}

.invitation h2 {

    margin:
        0 0 10px;

    font-size: 25px;
}

.invitation p {

    margin:
        7px 0;

    color: #c9e5fa;
}

.invite-actions {

    display: flex;

    gap: 10px;

    margin-top: 20px;
}

.accept-button,
.decline-button {

    flex: 1;

    height: 48px;

    border-radius: 12px;

    color: white;

    font-size: 15px;
}

.accept-button {

    background:
        #2d9b4b;
}

.decline-button {

    background:
        #7a3030;
}


/* ROOM */

.room-screen {

    position: fixed;

    inset: 0;

    background:
        radial-gradient(
            circle at 50% 15%,
            #244b72 0%,
            #10243c 45%,
            #06101d 100%
        );

    z-index: 200;

    display: none;

    flex-direction: column;

    align-items: center;

    padding: 25px;
}

.room-screen.visible {

    display: flex;
}

.room-title {

    font-size: 30px;

    font-weight: 900;

    letter-spacing: 3px;
}

.room-id {

    margin-top: 8px;

    color: #9fc6e2;

    font-size: 12px;

    letter-spacing: 2px;
}

.opponent-box {

    width:
        min(
            100%,
            500px
        );

    margin-top: 25px;

    padding: 20px;

    border-radius: 18px;

    background:
        rgba(255,255,255,.09);

    text-align: center;
}

.opponent-name {

    font-size: 25px;

    font-weight: 900;
}

.room-status {

    margin-top: 8px;

    color: #b9d7ee;
}


/* CHAT */

.chat {

    width:
        min(
            100%,
            500px
        );

    flex: 1;

    min-height: 0;

    margin-top: 15px;

    display: flex;

    flex-direction: column;
}

.chat-messages {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding: 10px;

    border-radius: 16px;

    background:
        rgba(0,0,0,.25);
}

.chat-message {

    margin-bottom: 9px;

    line-height: 1.35;
}

.chat-name {

    font-weight: 900;

    color: #7ec8ff;
}

.chat-input {

    display: flex;

    gap: 8px;

    margin-top: 8px;
}

.chat-input input {

    flex: 1;

    min-width: 0;

    height: 46px;

    border: none;

    border-radius: 11px;

    padding:
        0 12px;

    font-size: 16px;
}

.chat-input button {

    height: 46px;

    padding:
        0 15px;

    border-radius: 11px;

    background:
        #28699e;

    color: white;
}

.back-button {

    margin-top: 15px;

    height: 45px;

    padding:
        0 20px;

    border-radius: 11px;

    background:
        #384d5d;

    color: white;
}

</style>
</head>

<body>

<div class="room-page">

    <h1 class="title"
        id="gameTitle">
        GAME LOBBY
    </h1>

    <div class="subtitle">
        FIND ANOTHER PLAYER
    </div>


    <!-- IDENTITY -->

    <div class="identity"
         id="identity">

        <label>
            PLAYER NAME
        </label>

        <div class="name-row">

            <input
                class="name-input"
                id="nameInput"
                maxlength="24"
                placeholder="Enter your name">

            <button
                class="join-button"
                id="joinButton">
                ENTER
            </button>

        </div>

        <label
            class="anonymous-row">

            <input
                type="checkbox"
                id="anonymous">

            Play anonymously

        </label>

    </div>


    <!-- LOBBY -->

    <div
        class="lobby"
        id="lobby">

        <div
            class="status"
            id="status">
            Connecting...
        </div>

        <button
            class="random-button"
            id="randomButton">

            FIND RANDOM PLAYER

        </button>

        <div
            class="player-list"
            id="playerList">
        </div>

    </div>

</div>


<!-- INVITATION -->

<div
    class="invitation"
    id="invitation">

    <h2>
        GAME INVITATION
    </h2>

    <p>
        <strong id="inviterName">
        Player
        </strong>
        wants to play.
    </p>

    <p id="inviteGame">
        GAME
    </p>

    <div class="invite-actions">

        <button
            class="accept-button"
            id="acceptButton">
            ACCEPT
        </button>

        <button
            class="decline-button"
            id="declineButton">
            DECLINE
        </button>

    </div>

</div>


<!-- PRIVATE ROOM -->

<div
    class="room-screen"
    id="roomScreen">

    <div class="room-title">
        PRIVATE ROOM
    </div>

    <div
        class="room-id"
        id="roomId">
    </div>

    <div class="opponent-box">

        <div>
            OPPONENT
        </div>

        <div
            class="opponent-name"
            id="opponentName">
        </div>

        <div
            class="room-status"
            id="roomStatus">
            Waiting for game...
        </div>

    </div>


    <div class="chat">

        <div
            class="chat-messages"
            id="chatMessages">
        </div>

        <div class="chat-input">

            <input
                id="chatInput"
                placeholder="Type a message...">

            <button
                id="chatSend">
                SEND
            </button>

        </div>

    </div>


    <button
        class="back-button"
        id="leaveRoom">
        LEAVE ROOM
    </button>

</div>


<script>

const params =
    new URLSearchParams(
        location.search
    );


const game =
    (
        params.get("game") ||
        "unknown"
    )
    .replace(
        /\.html$/i,
        ""
    )
    .toLowerCase();


const gameNames = {

    checkers:
        "CHECKERS",

    chess:
        "CHESS",

    navalstrike:
        "NAVAL STRIKE",

    carrierstrike:
        "CARRIER STRIKE",

    ttt:
        "TIC-TAC-TOE"
};


const gameName =
    gameNames[game] ||
    game.toUpperCase();


document.title =
    gameName +
    " LOBBY";


document.getElementById(
    "gameTitle"
).textContent =
    gameName +
    " LOBBY";


const identity =
    document.getElementById(
        "identity"
    );

const lobby =
    document.getElementById(
        "lobby"
    );

const nameInput =
    document.getElementById(
        "nameInput"
    );

const anonymous =
    document.getElementById(
        "anonymous"
    );

const joinButton =
    document.getElementById(
        "joinButton"
    );

const randomButton =
    document.getElementById(
        "randomButton"
    );

const status =
    document.getElementById(
        "status"
    );

const playerList =
    document.getElementById(
        "playerList"
    );

const invitation =
    document.getElementById(
        "invitation"
    );

const inviterName =
    document.getElementById(
        "inviterName"
    );

const inviteGame =
    document.getElementById(
        "inviteGame"
    );

const acceptButton =
    document.getElementById(
        "acceptButton"
    );

const declineButton =
    document.getElementById(
        "declineButton"
    );


const roomScreen =
    document.getElementById(
        "roomScreen"
    );

const roomId =
    document.getElementById(
        "roomId"
    );

const opponentName =
    document.getElementById(
        "opponentName"
    );

const roomStatus =
    document.getElementById(
        "roomStatus"
    );

const chatMessages =
    document.getElementById(
        "chatMessages"
    );

const chatInput =
    document.getElementById(
        "chatInput"
    );

const chatSend =
    document.getElementById(
        "chatSend"
    );

const leaveRoom =
    document.getElementById(
        "leaveRoom"
    );


let socket = null;
let pendingInvitation = false;


/* =========================================================
   CONNECT
========================================================= */

function connect() {

    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";


    socket =
        new WebSocket(
            protocol +
            "//" +
            location.host +
            "/rooms"
        );


    socket.onopen = () => {

        status.textContent =
            "Connected. Enter your name to join.";

    };


    socket.onclose = () => {

        status.textContent =
            "Connection lost.";

        joinButton.disabled =
            true;

        randomButton.disabled =
            true;
    };


    socket.onerror = () => {

        status.textContent =
            "Could not connect to server.";

    };


    socket.onmessage =
        event => {

            let data;


            try {

                data =
                    JSON.parse(
                        event.data
                    );

            } catch {

                return;
            }


            handleMessage(
                data
            );
        };
}


/* =========================================================
   MESSAGE HANDLER
========================================================= */

function handleMessage(
    data
) {

    switch (
        data.type
    ) {

        case "roomsConnected":

            break;


        case "lobbyJoined":

            identity.style.display =
                "none";

            lobby.classList.add(
                "visible"
            );

            status.textContent =
                "Waiting for another player...";

            break;


        case "lobbyUpdate":

            renderPlayers(
                data.players || []
            );

            break;


        case "noMatch":

            status.textContent =
                data.message ||
                "No player available yet.";

            break;


        case "inviteSent":

            status.textContent =
                "Invitation sent to " +
                data.target.name +
                ".";

            break;


        case "invitation":

            pendingInvitation =
                true;

            inviterName.textContent =
                data.from.name;

            inviteGame.textContent =
                data.gameName;

            invitation.classList.add(
                "visible"
            );

            break;


        case "inviteDeclined":

            status.textContent =
                data.player.name +
                " declined the invitation.";

            break;


        case "inviteCancelled":

            invitation.classList.remove(
                "visible"
            );

            pendingInvitation =
                false;

            break;


        case "inviteError":

            status.textContent =
                data.message;

            break;


        case "roomMatched":

            enterPrivateRoom(
                data
            );

            break;


        case "roomChat":

            addChatMessage(
                data.playerName,
                data.message
            );

            break;


        case "opponentLeft":

            roomStatus.textContent =
                "The other player left the room.";

            break;


        case "error":

            status.textContent =
                data.message;

            break;
    }
}


/* =========================================================
   JOIN
========================================================= */

function joinLobby() {

    if (
        !socket ||
        socket.readyState !==
            WebSocket.OPEN
    ) {
        return;
    }


    const isAnonymous =
        anonymous.checked;


    const name =
        nameInput.value.trim();


    if (
        !isAnonymous &&
        !name
    ) {

        nameInput.focus();

        return;
    }


    socket.send(
        JSON.stringify({

            type:
                "joinLobby",

            game,

            name,

            anonymous:
                isAnonymous
        })
    );
}


joinButton.onclick =
    joinLobby;


nameInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            joinLobby();
        }
    }
);


/* =========================================================
   RANDOM
========================================================= */

randomButton.onclick =
    () => {

        if (
            !socket ||
            socket.readyState !==
                WebSocket.OPEN
        ) {
            return;
        }


        status.textContent =
            "Looking for a player...";


        socket.send(
            JSON.stringify({

                type:
                    "findRandom"
            })
        );
    };


/* =========================================================
   PLAYER LIST
========================================================= */

function renderPlayers(
    players
) {

    playerList.innerHTML =
        "";


    const available =
        players.filter(
            player =>
                player
        );


    if (
        available.length === 0
    ) {

        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "empty";

        empty.textContent =
            "No other players are waiting yet.";

        playerList.appendChild(
            empty
        );

        return;
    }


    for (
        const player of
            available
    ) {

        const row =
            document.createElement(
                "div"
            );

        row.className =
            "player";


        const icon =
            document.createElement(
                "div"
            );

        icon.className =
            "player-icon";

        icon.textContent =
            "👤";


        const info =
            document.createElement(
                "div"
            );

        info.className =
            "player-info";


        const playerName =
            document.createElement(
                "div"
            );

        playerName.className =
            "player-name";

        playerName.textContent =
            player.name;


        const state =
            document.createElement(
                "div"
            );

        state.className =
            "player-state";

        state.textContent =
            "WAITING TO PLAY";


        info.appendChild(
            playerName
        );

        info.appendChild(
            state
        );


        const invite =
            document.createElement(
                "button"
            );

        invite.className =
            "invite-button";

        invite.textContent =
            "PLAY";


        invite.onclick =
            () => {

                socket.send(
                    JSON.stringify({

                        type:
                            "invite",

                        playerId:
                            player.id
                    })
                );
            };


        row.appendChild(
            icon
        );

        row.appendChild(
            info
        );

        row.appendChild(
            invite
        );


        playerList.appendChild(
            row
        );
    }
}


/* =========================================================
   ACCEPT
========================================================= */

acceptButton.onclick =
    () => {

        invitation.classList.remove(
            "visible"
        );

        pendingInvitation =
            false;


        socket.send(
            JSON.stringify({

                type:
                    "acceptInvite"
            })
        );
    };


/* =========================================================
   DECLINE
========================================================= */

declineButton.onclick =
    () => {

        invitation.classList.remove(
            "visible"
        );

        pendingInvitation =
            false;


        socket.send(
            JSON.stringify({

                type:
                    "declineInvite"
            })
        );
    };


/* =========================================================
   PRIVATE ROOM
========================================================= */

function enterPrivateRoom(
    data
) {

    lobby.classList.remove(
        "visible"
    );


    invitation.classList.remove(
        "visible"
    );


    roomScreen.classList.add(
        "visible"
    );


    roomId.textContent =
        data.roomId;


    opponentName.textContent =
        data.opponent.name;


    roomStatus.textContent =
        "MATCH FOUND — ROOM READY";


    addSystemMessage(
        "You are connected with " +
        data.opponent.name +
        "."
    );
}


/* =========================================================
   CHAT
========================================================= */

function addSystemMessage(
    message
) {

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "chat-message";

    div.textContent =
        message;

    chatMessages.appendChild(
        div
    );

    chatMessages.scrollTop =
        chatMessages.scrollHeight;
}


function addChatMessage(
    name,
    message
) {

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "chat-message";


    const nameSpan =
        document.createElement(
            "span"
        );

    nameSpan.className =
        "chat-name";

    nameSpan.textContent =
        name +
        ": ";


    const messageSpan =
        document.createElement(
            "span"
        );

    messageSpan.textContent =
        message;


    div.appendChild(
        nameSpan
    );

    div.appendChild(
        messageSpan
    );


    chatMessages.appendChild(
        div
    );


    chatMessages.scrollTop =
        chatMessages.scrollHeight;
}


function sendChat() {

    const message =
        chatInput.value.trim();


    if (
        !message ||
        !socket ||
        socket.readyState !==
            WebSocket.OPEN
    ) {
        return;
    }


    socket.send(
        JSON.stringify({

            type:
                "roomChat",

            message
        })
    );


    chatInput.value =
        "";

    chatInput.focus();
}


chatSend.onclick =
    sendChat;


chatInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            sendChat();
        }
    }
);


/* =========================================================
   LEAVE ROOM
========================================================= */

leaveRoom.onclick =
    () => {

        if (
            socket &&
            socket.readyState ===
                WebSocket.OPEN
        ) {

            socket.send(
                JSON.stringify({

                    type:
                        "leaveRoom"
                })
            );
        }


        roomScreen.classList.remove(
            "visible"
        );


        lobby.classList.add(
            "visible"
        );


        status.textContent =
            "Waiting for another player...";
    };


/* =========================================================
   START
========================================================= */

connect();

</script>

</body>
</html>
