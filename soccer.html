<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Room - Soccer</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{background:radial-gradient(circle at 50% 0,#243b58,#091827 65%);color:#fff}
.game{max-width:1200px;min-height:100dvh;margin:auto;padding:max(10px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:9px}
h1{margin:0;font-size:clamp(27px,5vw,46px);letter-spacing:.12em;text-shadow:0 3px 8px #000}
.top{display:flex;align-items:center;justify-content:center;gap:clamp(15px,5vw,65px);width:100%}
.score{display:flex;gap:18px;align-items:center;font-size:clamp(20px,4vw,34px);font-weight:900}
.score .you{color:#8fd9ff}.score .cpu{color:#ffad9d}.score small{font-size:12px;color:#ddd;display:block;text-align:center}
button{font:inherit;cursor:pointer;border:1px solid #a7c8cb;border-radius:9px;background:linear-gradient(#386c79,#194351);color:#fff;padding:9px 16px;font-weight:800;touch-action:manipulation}
button:focus-visible{outline:3px solid #ffe075;outline-offset:2px}
button:hover{filter:brightness(1.15)}
.controls,.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.controls button{font-size:12px}
.actions button{min-width:100px;background:linear-gradient(#27754d,#135334)}
.actions .shoot{background:linear-gradient(#b8573a,#8d3024)}
.status{min-height:2.2em;display:grid;place-items:center;text-align:center;color:#ffefab;font-size:clamp(14px,2.8vw,19px);font-weight:bold}
.pitch-wrap{width:100%;max-width:1100px;position:relative;border-radius:14px;padding:5px;background:#092e28;box-shadow:0 10px 30px #0009,0 0 0 2px #ffffff40}
canvas{display:block;width:100%;height:auto;aspect-ratio:1000/560;border-radius:10px;touch-action:none;cursor:crosshair}
.help{margin:1px 0 0;text-align:center;line-height:1.35;color:#d5e9e6;font-size:clamp(11px,2.2vw,14px)}
@media(max-width:640px){.game{gap:6px;padding-left:5px;padding-right:5px}.top{gap:12px}h1{font-size:26px}.controls button{padding:6px 8px;font-size:10px}.actions button{padding:8px 10px;min-width:77px;font-size:12px}.pitch-wrap{padding:3px}}
</style>
</head>
<body>
<main class="game">
<div class="top"><h1>SOCCER</h1><div class="score"><div class="you"><small>YOU</small><span id="homeScore">0</span></div><span>:</span><div class="cpu"><small>COMPUTER</small><span id="awayScore">0</span></div></div></div>
<div class="controls"><button id="twoPlayer">2 PLAYERS</button><button id="computer">VS COMPUTER</button><button id="newGame">NEW GAME</button><button id="menu">GAME ROOM</button></div>
<div class="status" id="status" role="status" aria-live="polite">Your kickoff. Take the ball upfield!</div>
<div class="pitch-wrap"><canvas id="pitch" width="1000" height="560" aria-label="Soccer field, your blue team attacks to the right"></canvas></div>
<div class="actions"><button id="pass">PASS</button><button id="shoot" class="shoot">SHOOT</button><button id="switch">SWITCH PLAYER</button></div>
<p class="help">Blue attacks right; red attacks left. Move the mouse to steer, left click to pass, right click to shoot. Tap and drag on touch. Each team has a goalie and two forwards. First to 3 wins.</p>
</main>
<script>
"use strict";
const params=new URLSearchParams(location.search),room=params.get("room")||"";
const me=["2","player2","player 2","p2"].includes(String(params.get("player")||"").toLowerCase())?2:1;
const online=Boolean(room),myTeam=me-1,clientId=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
const canvas=document.getElementById("pitch"),ctx=canvas.getContext("2d");
const statusEl=document.getElementById("status");
const homeEl=document.getElementById("homeScore"),awayEl=document.getElementById("awayScore");
const W=1000,H=560,L=34,R=966,T=34,B=526,goalTop=214,goalBottom=346;
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const roles=["GOALIE","FORWARD","FORWARD"];
let players=[],ball={},selected=1,remoteSelected=1,remotePointer=null,remoteDragging=false;
let score=[0,0],pointer=null,dragging=false,frame=0,lastTime=0,freeze=0,matchOver=false,lastTouch=0,messageUntil=0;
let socket=null,socketOpen=false,reconnectTimer=null,lastSnapshot=0,lastInput=0;
function announce(text,seconds=2){statusEl.textContent=text;messageUntil=performance.now()+seconds*1000;}
function makePlayer(team,id,x,y){return {team,id,role:roles[id],x,y,r:19,stepX:x,stepY:y,hasBall:false,stealAt:0,actAt:0,tackleTime:0};}
function kickoff(team=0){
  players=[
    makePlayer(0,0,108,280),makePlayer(0,1,340,218),makePlayer(0,2,290,390),
    makePlayer(1,0,892,280),makePlayer(1,1,670,218),makePlayer(1,2,710,390)
  ];
  selected=1;remoteSelected=1;remotePointer=null;remoteDragging=false;
  const carrier=team===0?players[1]:players[4];
  carrier.hasBall=true;
  ball={x:carrier.x+(team===0?24:-24),y:carrier.y,vx:0,vy:0,owner:carrier,flight:false,from:team,kind:"",power:0,age:0,possessionTime:0,passTarget:-1};
  pointer=null;dragging=false;freeze=1.1;
}
function newGame(){
  if(online&&me===2){send({type:"soccerNewGameRequest"});return;}
  score=[0,0];homeEl.textContent="0";awayEl.textContent="0";matchOver=false;
  kickoff(0);announce("Your kickoff. Drag a blue player to move upfield.",3);
}
function current(){return players[selected];}
function ownerBallPosition(){
  if(!ball.owner)return;
  const p=ball.owner,side=p.team===0?1:-1;
  ball.x=p.x+side*24;ball.y=p.y;
}
function releaseBall(p,vx,vy,kind){
  p.hasBall=false;ball.owner=null;ball.flight=true;ball.from=p.team;ball.kind=kind;
  ball.x=p.x+(p.team===0?23:-23);ball.y=p.y;ball.vx=vx;ball.vy=vy;ball.age=0;
  ball.possessionTime=0;ball.passTarget=-1;players.forEach(q=>q.tackleTime=0);
  p.actAt=frame+24;
}
function passTo(target,team=0){
  const p=ball.owner;
  if(!p||!target||p.team!==team||target.team!==team||freeze>0||matchOver||target===p)return;
  const dx=target.x-p.x,dy=target.y-p.y,length=Math.hypot(dx,dy)||1;
  releaseBall(p,dx/length*510,dy/length*510,"pass");
  ball.passTarget=players.indexOf(target);
  if(team===0)selected=target.id;else remoteSelected=target.id;
  announce("Pass!",1.2);
}
function pass(team=0){
  const p=ball.owner;
  if(!p||p.team!==team)return;
  const mates=players.filter(q=>q.team===team&&q!==p);
  const direction=team===0?1:-1;
  const value=q=>(q.x-p.x)*direction*.35-distance(p,q)*.18;
  passTo(mates.sort((a,b)=>value(b)-value(a))[0],team);
}
function shoot(team=0){
  const p=ball.owner;
  if(!p||p.team!==team||freeze>0||matchOver)return;
  const aimY=clamp(p.y+(Math.random()-.5)*52,goalTop+22,goalBottom-22);
  const dx=(team===0?R:L)-p.x,dy=aimY-p.y,length=Math.hypot(dx,dy)||1;
  releaseBall(p,dx/length*750,dy/length*750,"shot");
  announce("SHOT!",1.1);
}
function switchPlayer(team=0){
  if(team===0)selected=(selected+1)%3;else remoteSelected=(remoteSelected+1)%3;
  announce("Player selected.",1.2);
}
function moveTowards(p,x,y,speed,dt){
  const dx=x-p.x,dy=y-p.y,d=Math.hypot(dx,dy);
  if(d<1)return;
  const step=Math.min(d,speed*dt);
  p.x=clamp(p.x+dx/d*step,L+22,R-22);
  p.y=clamp(p.y+dy/d*step,T+22,B-22);
}
function supportForward(p,holder,dt){
  const direction=p.team===0?1:-1;
  const lane=p.id===1?-1:1;
  const x=clamp(holder.x+direction*155,L+45,R-45);
  const y=clamp(holder.y+lane*105,T+45,B-45);
  moveTowards(p,x,y,245,dt);
}
function controlTeam(dt){
  const selectedPlayer=current();
  if(dragging&&pointer)moveTowards(selectedPlayer,pointer.x,pointer.y,270,dt);
  for(const p of players.filter(q=>q.team===0&&q!==selectedPlayer)){
    if(p.id===0){
      const track=ball.owner&&ball.owner.team===1?ball.owner.y:ball.y;
      moveTowards(p,110,clamp(track,goalTop-50,goalBottom+50),115,dt);
    }else if(!p.hasBall){
      const holder=ball.owner?.team===0?ball.owner:
        ball.kind==="pass"&&ball.from===0?players[ball.passTarget]:null;
      if(holder&&holder.id!==0&&holder!==p)supportForward(p,holder,dt);
      else{
        const x=ball.owner&&ball.owner.team===1?clamp(ball.x-110,200,560):(p.id===1?355:295);
        const y=p.id===1?clamp(ball.y-100,105,270):clamp(ball.y+100,290,460);
        moveTowards(p,x,y,85,dt);
      }
    }
  }
}
function onlineOpponent(dt){
  const side=players.filter(p=>p.team===1),goalie=side[0],forwards=side.slice(1),active=side[remoteSelected];
  if(remoteDragging&&remotePointer)moveTowards(active,remotePointer.x,remotePointer.y,270,dt);
  if(goalie!==active)moveTowards(goalie,890,clamp(ball.y,goalTop-45,goalBottom+45),115,dt);
  for(const p of forwards){
    if(p===active||p.hasBall)continue;
    if(ball.owner&&ball.owner.team===0)moveTowards(p,ball.owner.x,ball.owner.y,105,dt);
    else{
      const holder=ball.owner?.team===1?ball.owner:
        ball.kind==="pass"&&ball.from===1?players[ball.passTarget]:null;
      if(holder&&holder.id!==0&&holder!==p)supportForward(p,holder,dt);
      else moveTowards(p,p.id===1?660:710,p.id===1?190:370,80,dt);
    }
  }
}
function computerTeam(dt){
  const cpu=players.filter(p=>p.team===1),goalie=cpu[0],forwards=cpu.slice(1);
  moveTowards(goalie,890,clamp(ball.y,goalTop-45,goalBottom+45),150,dt);
  const holder=ball.owner;
  if(holder&&holder.team===1){
    const p=holder;
    if(p.id!==0){
      moveTowards(p,175,clamp(p.y+(280-p.y)*.14,110,450),130,dt);
      if(p.x<460&&frame>p.actAt){
        const aimY=clamp(p.y+(Math.random()-.5)*95,goalTop+14,goalBottom-14);
        const dx=L-p.x,dy=aimY-p.y,d=Math.hypot(dx,dy)||1;
        releaseBall(p,dx/d*690,dy/d*690,"shot");
        announce("Computer shoots! Defend the left goal.",1.4);
      }
    }else if(frame>p.actAt){
      const target=forwards[Math.floor(Math.random()*2)];
      const dx=target.x-p.x,dy=target.y-p.y,d=Math.hypot(dx,dy)||1;
      releaseBall(p,dx/d*470,dy/d*470,"pass");
    }
  }
  forwards.forEach((p,i)=>{
    if(p.hasBall)return;
    if(holder&&holder.team===0){
      const closest=forwards[0]===p?forwards[1]:forwards[0];
      const chase=distance(p,holder)<=distance(closest,holder);
      if(chase)moveTowards(p,holder.x,holder.y,165,dt);
      else moveTowards(p,clamp(holder.x+110,490,800),i?390:185,100,dt);
    }else if(!holder){
      const receiver=ball.kind==="pass"&&ball.from===1?players[ball.passTarget]:null;
      if(receiver&&receiver.id!==0&&receiver!==p)supportForward(p,receiver,dt);
      else moveTowards(p,ball.x,ball.y,155,dt);
    }else if(holder.id!==0){
      supportForward(p,holder,dt);
    }else{
      moveTowards(p,clamp(holder.x-145,330,800),i?385:180,120,dt);
    }
  });
}
function scoreGoal(team){
  score[team]++;homeEl.textContent=score[0];awayEl.textContent=score[1];
  if(score[team]>=3){
    matchOver=true;freeze=999;
    announce(team===0?"BLUE WINS 3 GOALS!":"RED WINS 3 GOALS!",999);
  }else{
    kickoff(1-team);
    announce(team===0?"GOAL FOR BLUE!":"GOAL FOR RED!",2.5);
  }
}
function updateBall(dt){
  if(ball.owner){ownerBallPosition();return;}
  ball.age+=dt;
  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  ball.vx*=Math.pow(.995,dt*60);ball.vy*=Math.pow(.995,dt*60);
  if(ball.y<T+9||ball.y>B-9){ball.y=clamp(ball.y,T+9,B-9);ball.vy*=-.65;}
  if(ball.x<L+5||ball.x>R-5){
    const side=ball.x>R-5?0:1;
    if(ball.y>goalTop&&ball.y<goalBottom&&ball.kind==="shot"){
      scoreGoal(side);return;
    }
    ball.x=clamp(ball.x,L+5,R-5);ball.vx*=-.55;
  }
  if(ball.age>.14){
    const intercept=players.filter(p=>distance(p,ball)<p.r+12).sort((a,b)=>distance(a,ball)-distance(b,ball))[0];
    if(intercept&&frame>intercept.actAt){
      ball.owner=intercept;ball.flight=false;intercept.hasBall=true;ball.vx=0;ball.vy=0;
      ball.possessionTime=0;ball.passTarget=-1;players.forEach(q=>q.tackleTime=0);
      lastTouch=intercept.team;
      if(intercept.team===0){selected=intercept.id;announce("Blue has the ball!",1.5);}
      else {if(online)remoteSelected=intercept.id;announce("Red has the ball!",1.5);}
    }
  }
  if(ball.age>5&&Math.hypot(ball.vx,ball.vy)<30){ball.vx=0;ball.vy=0;}
}
function tackles(dt){
  const holder=ball.owner;
  if(!holder||freeze>0)return;
  ball.possessionTime=(ball.possessionTime||0)+dt;
  for(const p of players){
    if(p.team===holder.team)continue;
    const inRange=distance(p,holder)<p.r+holder.r-12;
    p.tackleTime=inRange?(p.tackleTime||0)+dt:0;
    if(!inRange||ball.possessionTime<.55||frame<p.stealAt||frame<holder.actAt)continue;
    if(p.tackleTime<(p.team===1&&!online?.48:.32))continue;
    holder.hasBall=false;p.hasBall=true;ball.owner=p;
    ball.possessionTime=0;ball.passTarget=-1;players.forEach(q=>q.tackleTime=0);
    p.stealAt=frame+90;holder.stealAt=frame+90;p.actAt=frame+45;
    ownerBallPosition();
    if(p.team===0){selected=p.id;announce("Blue wins the ball!",1.2);}
    else {if(online)remoteSelected=p.id;announce("Red wins the ball!",1.2);}
    break;
  }
}
function line(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function drawPitch(){
  ctx.fillStyle="#207c42";ctx.fillRect(0,0,W,H);
  for(let i=0;i<10;i++){ctx.fillStyle=i%2?"#248849":"#1c7840";ctx.fillRect(L+i*(R-L)/10,T,(R-L)/10,B-T);}
  ctx.strokeStyle="#f2fae4";ctx.lineWidth=3;ctx.strokeRect(L,T,R-L,B-T);
  line(W/2,T,W/2,B);
  ctx.beginPath();ctx.arc(W/2,H/2,72,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(W/2,H/2,3,0,Math.PI*2);ctx.fillStyle="#f2fae4";ctx.fill();
  ctx.strokeRect(L,145,145,270);ctx.strokeRect(R-145,145,145,270);
  ctx.strokeRect(L,205,53,150);ctx.strokeRect(R-53,205,53,150);
  ctx.beginPath();ctx.arc(140,280,3,0,7);ctx.arc(860,280,3,0,7);ctx.fill();
  ctx.strokeStyle="#e9f4e4";ctx.lineWidth=6;
  ctx.strokeRect(5,goalTop,29,goalBottom-goalTop);ctx.strokeRect(R,goalTop,29,goalBottom-goalTop);
  ctx.fillStyle="#ffffff21";ctx.fillRect(6,goalTop,28,goalBottom-goalTop);ctx.fillRect(R,goalTop,28,goalBottom-goalTop);
  ctx.fillStyle="#ffffffbd";ctx.font="bold 15px Arial";ctx.textAlign="center";
  ctx.fillText("BLUE GOAL",112,55);ctx.fillText("RED GOAL",850,55);
}
function drawPlayer(p){
  ctx.save();
  ctx.shadowColor="#001820aa";ctx.shadowBlur=8;ctx.shadowOffsetY=4;
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
  ctx.fillStyle=p.team===0?"#1388ce":"#e5483d";ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle=p.team===0?"#b8edff":"#ffd0b9";ctx.stroke();
  ctx.restore();
  if(p.team===myTeam&&p.id===selected){
    ctx.beginPath();ctx.arc(p.x,p.y,p.r+7,0,Math.PI*2);
    ctx.strokeStyle="#ffe36c";ctx.lineWidth=4;ctx.stroke();
  }
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillStyle="#fff";ctx.font="bold 19px Arial";ctx.fillText(p.id===0?"G":String(p.id),p.x,p.y+1);
  if(p.hasBall){
    ctx.beginPath();ctx.arc(p.x,p.y-31,4,0,7);ctx.fillStyle="#ffe576";ctx.fill();
  }
}
function draw(){
  drawPitch();
  if(!players.length){ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="bold 30px Arial";ctx.fillText("CONNECTING TO ROOM...",500,280);return;}
  for(const p of players)drawPlayer(p);
  ctx.save();ctx.shadowColor="#0009";ctx.shadowBlur=8;ctx.shadowOffsetY=3;
  ctx.beginPath();ctx.arc(ball.x,ball.y,11,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();
  ctx.lineWidth=2;ctx.strokeStyle="#1d2732";ctx.stroke();ctx.restore();
  ctx.fillStyle="#1d2732";ctx.beginPath();ctx.arc(ball.x,ball.y,4,0,7);ctx.fill();
  if(freeze>0&&!matchOver){
    ctx.fillStyle="#082b35aa";ctx.fillRect(380,242,240,75);
    ctx.fillStyle="white";ctx.textAlign="center";ctx.font="bold 27px Arial";ctx.fillText("KICKOFF",500,290);
  }
}
function tick(time){
  const dt=Math.min((time-lastTime)/1000||0,.045);lastTime=time;frame++;
  if((!online||me===1)&&freeze>0)freeze=Math.max(0,freeze-dt);
  if((!online||me===1)&&!matchOver&&freeze===0){
    controlTeam(dt);
    if(online)onlineOpponent(dt);else computerTeam(dt);
    tackles(dt);updateBall(dt);
  }else if((!online||me===1)&&ball.owner)ownerBallPosition();
  if(online&&me===1&&socketOpen&&time-lastSnapshot>100){sendSnapshot();lastSnapshot=time;}
  if(time>messageUntil&&!matchOver&&freeze===0&&players.length){
    statusEl.textContent=ball.owner?.team===myTeam?"Your ball: move, pass, or shoot.":ball.owner?"Opponent has the ball. Intercept it!":"Loose ball: chase it!";
  }
  draw();requestAnimationFrame(tick);
}
function point(event){
  const r=canvas.getBoundingClientRect();
  return {x:clamp((event.clientX-r.left)*W/r.width,0,W),y:clamp((event.clientY-r.top)*H/r.height,0,H)};
}
function send(message){
  if(!online||!socketOpen||!socket||socket.readyState!==WebSocket.OPEN)return;
  socket.send(JSON.stringify({game:"soccer",room,clientId,player:me,...message}));
}
function sendSnapshot(){
  if(me!==1||!players.length)return;
  const state={players,ball:{x:ball.x,y:ball.y,vx:ball.vx,vy:ball.vy,flight:ball.flight,
    from:ball.from,kind:ball.kind,power:ball.power,age:ball.age,possessionTime:ball.possessionTime,passTarget:ball.passTarget,ownerIndex:players.indexOf(ball.owner)},
    score,selected,remoteSelected,freeze,matchOver};
  send({type:"soccerState",state});
}
function input(action,extra={}){
  if(me===2){send({type:"soccerInput",action,...extra});return;}
  if(action==="pass")pass();
  if(action==="shoot")shoot();
  if(action==="switch")switchPlayer();
  if(action==="select")selected=extra.id;
  if(action==="passTo")passTo(players.find(p=>p.team===0&&p.id===extra.id));
}
function receive(message){
  if(!message||message.game!=="soccer"||String(message.room||"")!==room||
      message.clientId===clientId||Number(message.player)===me)return;
  if(me===1){
    if(message.type==="soccerJoin"){sendSnapshot();return;}
    if(message.type==="soccerNewGameRequest"){newGame();sendSnapshot();return;}
    if(message.type!=="soccerInput")return;
    const id=Number(message.id);
    if(message.action==="move"&&Number.isFinite(message.x)&&Number.isFinite(message.y)){
      remotePointer={x:clamp(message.x,L,R),y:clamp(message.y,T,B)};remoteDragging=true;
    }else if(message.action==="stop"){remoteDragging=false;remotePointer=null;}
    else if(message.action==="select"&&[0,1,2].includes(id))remoteSelected=id;
    else if(message.action==="passTo"&&[0,1,2].includes(id))passTo(players[3+id],1);
    else if(message.action==="pass")pass(1);
    else if(message.action==="shoot")shoot(1);
    else if(message.action==="switch")switchPlayer(1);
    sendSnapshot();
    return;
  }
  if(message.type!=="soccerState"||!message.state)return;
  const state=message.state;
  if(!Array.isArray(state.players)||state.players.length!==6||
      !Array.isArray(state.score)||state.score.length!==2||!state.ball)return;
  players=state.players;score=state.score;ball=state.ball;
  ball.owner=players[ball.ownerIndex]||null;
  selected=state.remoteSelected;freeze=state.freeze;matchOver=state.matchOver;
  homeEl.textContent=score[0];awayEl.textContent=score[1];
  statusEl.textContent=matchOver?(score[1]>score[0]?"YOU WIN!":"BLUE WINS. TRY AGAIN!"):
    freeze>0?"KICKOFF":ball.owner?.team===1?"Your ball: move, pass, or shoot.":
    ball.owner?"Blue has the ball. Intercept it!":"Loose ball: chase it!";
  messageUntil=performance.now()+.3e3;
}
function connect(){
  if(!online||socketOpen||(socket&&socket.readyState===WebSocket.CONNECTING))return;
  socket=new WebSocket((location.protocol==="https:"?"wss:":"ws:")+"//"+location.host+"/checkers");
  socket.addEventListener("open",()=>{socketOpen=true;send({type:"soccerJoin"});if(me===1)sendSnapshot();});
  socket.addEventListener("message",event=>{try{receive(JSON.parse(event.data));}catch{}});
  socket.addEventListener("close",()=>{
    socketOpen=false;
    if(!reconnectTimer)reconnectTimer=setTimeout(()=>{reconnectTimer=null;connect();},1500);
  });
  socket.addEventListener("error",()=>{socketOpen=false;});
}
canvas.addEventListener("pointerdown",event=>{
  if(matchOver||!players.length)return;
  const pos=point(event),mate=players.filter(p=>p.team===myTeam).find(p=>distance(p,pos)<p.r+13);
  if(event.pointerType==="mouse"){
    pointer=pos;dragging=true;
    if(me===2)send({type:"soccerInput",action:"move",x:pos.x,y:pos.y});
    if(event.button===2){input("shoot");event.preventDefault();return;}
    if(event.button!==0)return;
    if(mate&&(!ball.owner||ball.owner.team!==myTeam))input("select",{id:mate.id});
    else if(mate&&ball.owner&&mate!==ball.owner)input("passTo",{id:mate.id});
    else input("pass");
    event.preventDefault();return;
  }
  if(mate){
    if(ball.owner&&ball.owner.team===myTeam&&mate!==ball.owner&&freeze===0){
      input("passTo",{id:mate.id});return;
    }
    input("select",{id:mate.id});
  }else if(ball.owner&&ball.owner.team===myTeam&&
           (myTeam===0?pos.x>R-60:pos.x<L+60)&&pos.y>goalTop-35&&pos.y<goalBottom+35){
    input("shoot");return;
  }
  pointer=pos;dragging=true;
  if(me===2)send({type:"soccerInput",action:"move",x:pos.x,y:pos.y});
  canvas.setPointerCapture(event.pointerId);event.preventDefault();
});
canvas.addEventListener("pointermove",event=>{
  if(event.pointerType==="mouse"&&!matchOver){pointer=point(event);dragging=true;}
  else if(dragging)pointer=point(event);
  if(online&&me===2&&dragging&&pointer&&performance.now()-lastInput>50){
    send({type:"soccerInput",action:"move",x:pointer.x,y:pointer.y});
    lastInput=performance.now();
  }
});
canvas.addEventListener("contextmenu",event=>event.preventDefault());
function endPointer(){
  dragging=false;pointer=null;
  if(online&&me===2)send({type:"soccerInput",action:"stop"});
}
canvas.addEventListener("pointerup",event=>{if(event.pointerType!=="mouse")endPointer();});
canvas.addEventListener("pointercancel",endPointer);
canvas.addEventListener("pointerleave",event=>{if(event.pointerType==="mouse")endPointer();});
document.getElementById("pass").addEventListener("click",()=>input("pass"));
document.getElementById("shoot").addEventListener("click",()=>input("shoot"));
document.getElementById("switch").addEventListener("click",()=>input("switch"));
document.getElementById("twoPlayer").addEventListener("click",()=>{if(socket)socket.close();location.href="rooms.html?game=soccer";});
document.getElementById("computer").addEventListener("click",()=>{if(socket)socket.close();location.href="soccer.html";});
document.getElementById("newGame").addEventListener("click",newGame);
document.getElementById("menu").addEventListener("click",()=>{if(socket)socket.close();location.href="index.html";});
if(online){
  document.querySelector(".you small").textContent="BLUE";
  document.querySelector(".cpu small").textContent="RED";
  statusEl.textContent="Connecting to the room...";
  if(me===1)newGame();
  connect();
}else newGame();
requestAnimationFrame(tick);
</script>
</body>
</html>
