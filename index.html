<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Game Room</title>

<style>

/* =========================================================
   PAGE
========================================================= */

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at center,
            #173d68 0%,
            #092542 45%,
            #041425 100%
        );

    color: white;
}


/* =========================================================
   GAME ROOM
========================================================= */

.game-room {
    position: relative;

    width: 100%;
    height: 100vh;

    overflow: hidden;
}

.title {
    position: absolute;

    top: 8%;

    width: 100%;

    text-align: center;

    font-size: clamp(38px, 7vw, 72px);

    font-weight: 900;

    letter-spacing: 5px;

    text-shadow:
        0 4px 12px rgba(0,0,0,.7);
}

.subtitle {
    position: absolute;

    top: 17%;

    width: 100%;

    text-align: center;

    font-size: 16px;

    letter-spacing: 4px;

    color: #a9c9e8;
}


/* =========================================================
   GAME BUTTONS
========================================================= */

.game-menu {
    position: absolute;

    top: 28%;

    left: 50%;

    transform: translateX(-50%);

    width: min(560px, 88%);

    display: flex;

    flex-direction: column;

    gap: 16px;

    z-index: 20;
}

.game-button {
    width: 100%;

    min-height: 82px;

    border: 2px solid rgba(255,255,255,.22);

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            rgba(33,75,116,.95),
            rgba(8,32,57,.97)
        );

    color: white;

    display: flex;

    align-items: center;

    padding: 14px 20px;

    box-sizing: border-box;

    cursor: pointer;

    text-align: left;

    box-shadow:
        0 10px 24px rgba(0,0,0,.4),
        inset 0 1px 0 rgba(255,255,255,.08);

    transition:
        transform .18s ease,
        border-color .18s ease,
        background .18s ease;
}

.game-button:hover {
    transform: translateY(-3px) scale(1.015);

    border-color:
        rgba(255,255,255,.5);

    background:
        linear-gradient(
            135deg,
            rgba(42,91,139,.98),
            rgba(10,39,67,.98)
        );
}

.game-button:active {
    transform:
        translateY(1px)
        scale(.99);
}

.icon {
    width: 62px;

    font-size: 40px;

    text-align: center;

    margin-right: 16px;
}

.button-text {
    flex: 1;
}

.button-title {
    font-size: 22px;

    font-weight: 900;

    letter-spacing: 2px;
}

.button-subtitle {
    margin-top: 5px;

    font-size: 13px;

    color: #9dbbd7;

    letter-spacing: 1px;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {
    position: absolute;

    bottom: 5%;

    width: 100%;

    text-align: center;

    font-size: 12px;

    letter-spacing: 3px;

    color: #7698b8;

    z-index: 20;
}


/* =========================================================
   GIRAFFE
========================================================= */

.giraffe-wrapper {
    position: absolute;

    z-index: 10;

    width: 190px;
    height: 230px;

    bottom: 38px;

    left: -220px;

    animation:
        giraffeWalk 15s linear infinite;
}

@keyframes giraffeWalk {

    0% {
        left: -220px;
    }

    100% {
        left: calc(100% + 220px);
    }
}

.giraffe {
    position: relative;

    width: 190px;
    height: 230px;

    animation:
        giraffeBounce .55s ease-in-out infinite alternate;
}

@keyframes giraffeBounce {

    from {
        transform: translateY(1px);
    }

    to {
        transform: translateY(-3px);
    }
}


/* Giraffe body */

.giraffe .body {
    position: absolute;

    left: 43px;
    top: 88px;

    width: 105px;
    height: 70px;

    background:
        #e1b34e;

    border-radius:
        48% 48% 42% 45%;

    border: 4px solid #8b6428;

    box-shadow:
        inset -8px -8px 10px rgba(90,50,10,.18);
}


/* Giraffe neck */

.giraffe .neck {
    position: absolute;

    left: 110px;
    top: 20px;

    width: 37px;
    height: 108px;

    background:
        #e1b34e;

    border: 4px solid #8b6428;

    border-radius:
        20px 20px 13px 13px;

    transform:
        rotate(-4deg);
}


/* Neck spots */

.giraffe .neck::before,
.giraffe .neck::after {
    content: "";

    position: absolute;

    width: 13px;
    height: 15px;

    background: #9b6c28;

    border-radius: 35%;
}

.giraffe .neck::before {
    left: 6px;
    top: 24px;
}

.giraffe .neck::after {
    right: 5px;
    top: 62px;
}


/* Giraffe head */

.giraffe .head {
    position: absolute;

    left: 91px;
    top: 3px;

    width: 77px;
    height: 58px;

    background:
        #e1b34e;

    border: 4px solid #8b6428;

    border-radius:
        48% 55% 45% 48%;

    transform:
        rotate(-8deg);

    transform-origin:
        65% 70%;
}


/* Snout */

.giraffe .snout {
    position: absolute;

    right: -19px;
    top: 25px;

    width: 40px;
    height: 25px;

    background:
        #e1b34e;

    border: 4px solid #8b6428;

    border-radius:
        50%;
}


/* Nose */

.giraffe .nose {
    position: absolute;

    right: -16px;
    top: 32px;

    width: 13px;
    height: 9px;

    background: #392818;

    border-radius: 50%;
}


/* Eye */

.giraffe .eye {
    position: absolute;

    right: 20px;
    top: 19px;

    width: 9px;
    height: 9px;

    background: #111;

    border-radius: 50%;
}


/* Ossicones */

.giraffe .horn {
    position: absolute;

    top: -20px;

    width: 9px;
    height: 24px;

    background: #e1b34e;

    border:
        3px solid #8b6428;

    border-radius: 8px;
}

.giraffe .horn.one {
    left: 20px;
}

.giraffe .horn.two {
    left: 45px;
}


/* Horn tips */

.giraffe .horn::after {
    content: "";

    position: absolute;

    left: -2px;
    top: -7px;

    width: 9px;
    height: 9px;

    background: #5b4022;

    border-radius: 50%;
}


/* Giraffe ears */

.giraffe .ear {
    position: absolute;

    top: -3px;

    width: 23px;
    height: 14px;

    background: #d49f3e;

    border:
        3px solid #8b6428;

    border-radius: 70% 30% 70% 30%;
}

.giraffe .ear.one {
    left: 2px;

    transform:
        rotate(-25deg);
}

.giraffe .ear.two {
    left: 57px;

    transform:
        rotate(25deg);
}


/* Giraffe legs */

.giraffe .leg {
    position: absolute;

    top: 145px;

    width: 18px;
    height: 73px;

    background: #e1b34e;

    border:
        4px solid #8b6428;

    border-radius:
        10px 10px 5px 5px;

    transform-origin:
        top center;
}

.giraffe .leg.one {
    left: 53px;

    animation:
        giraffeLeg1 .55s ease-in-out infinite alternate;
}

.giraffe .leg.two {
    left: 79px;

    animation:
        giraffeLeg2 .55s ease-in-out infinite alternate;
}

.giraffe .leg.three {
    left: 107px;

    animation:
        giraffeLeg2 .55s ease-in-out infinite alternate;
}

.giraffe .leg.four {
    left: 130px;

    animation:
        giraffeLeg1 .55s ease-in-out infinite alternate;
}

@keyframes giraffeLeg1 {

    from {
        transform: rotate(7deg);
    }

    to {
        transform: rotate(-7deg);
    }
}

@keyframes giraffeLeg2 {

    from {
        transform: rotate(-7deg);
    }

    to {
        transform: rotate(7deg);
    }
}


/* Giraffe tail */

.giraffe .tail {
    position: absolute;

    left: 42px;
    top: 92px;

    width: 40px;
    height: 34px;

    border-top:
        5px solid #8b6428;

    border-left:
        5px solid #8b6428;

    border-radius:
        70% 0 0 0;

    transform-origin:
        right bottom;

    animation:
        giraffeTail .5s ease-in-out infinite alternate;
}

@keyframes giraffeTail {

    from {
        transform: rotate(-10deg);
    }

    to {
        transform: rotate(16deg);
    }
}


/* Giraffe body spots */

.giraffe .spot {
    position: absolute;

    background: #9b6c28;

    border-radius: 35%;
}

.giraffe .spot.one {
    left: 60px;
    top: 102px;

    width: 22px;
    height: 18px;
}

.giraffe .spot.two {
    left: 94px;
    top: 125px;

    width: 17px;
    height: 20px;
}

.giraffe .spot.three {
    left: 120px;
    top: 99px;

    width: 20px;
    height: 16px;
}

.giraffe .spot.four {
    left: 80px;
    top: 91px;

    width: 14px;
    height: 14px;
}


/* =========================================================
   GIRAFFE REACTION
========================================================= */

.giraffe-wrapper.look {
    z-index: 12;
}

.giraffe-wrapper.look .head {
    transform:
        rotate(18deg)
        translateY(3px);

    transition:
        transform .35s ease;
}

.giraffe-wrapper.frightened {
    animation:
        giraffeEscape 7s linear forwards;
}

@keyframes giraffeEscape {

    0% {
        left: 25%;
    }

    15% {
        left: 30%;
    }

    100% {
        left: calc(100% + 220px);
    }
}

.giraffe-wrapper.frightened .head {
    transform:
        rotate(-20deg);

    transition:
        transform .25s ease;
}


/* =========================================================
   BULLDOG
========================================================= */

.bulldog-wrapper {
    position: absolute;

    z-index: 11;

    width: 190px;
    height: 150px;

    bottom: 45px;

    right: -210px;

    animation:
        bulldogWalk 24s linear infinite;
}


/*
   Dog travels RIGHT -> LEFT.
   His head is visually facing LEFT,
   so he walks forward rather than backward.
*/

@keyframes bulldogWalk {

    0% {
        right: -210px;
    }

    35% {
        right: 22%;
    }

    42% {
        right: 35%;
    }

    48% {
        right: 48%;
    }

    55% {
        right: 58%;
    }

    100% {
        right: calc(100% + 210px);
    }
}


.bulldog {
    position: relative;

    width: 190px;
    height: 150px;

    animation:
        dogBounce .32s ease-in-out infinite alternate;
}

@keyframes dogBounce {

    from {
        transform:
            translateY(1px);
    }

    to {
        transform:
            translateY(-3px);
    }
}


/* Body */

.dog-body {
    position: absolute;

    left: 42px;
    top: 58px;

    width: 105px;
    height: 62px;

    background:
        linear-gradient(
            145deg,
            #d6c6ae,
            #a9957c
        );

    border:
        4px solid #594b3d;

    border-radius:
        48% 45% 40% 50%;

    box-shadow:
        inset -8px -8px 10px rgba(50,40,30,.22),
        7px 9px 12px rgba(0,0,0,.35);
}


/* Chest */

.dog-chest {
    position: absolute;

    left: 93px;
    top: 65px;

    width: 43px;
    height: 50px;

    background: #eee4d4;

    border:
        2px solid #776856;

    border-radius:
        50% 55% 45% 50%;
}


/* Head */

.dog-head {
    position: absolute;

    left: 82px;
    top: 20px;

    width: 83px;
    height: 72px;

    background:
        linear-gradient(
            145deg,
            #cdbba1,
            #9d8970
        );

    border:
        4px solid #594b3d;

    border-radius:
        45% 48% 42% 50%;

    box-shadow:
        inset -8px -8px 10px rgba(50,40,30,.2),
        6px 8px 12px rgba(0,0,0,.35);

    transform-origin:
        65% 65%;
}


/* Face */

.dog-face {
    position: absolute;

    left: 25px;
    top: 16px;

    width: 48px;
    height: 48px;

    background: #eee4d4;

    border-radius: 48%;

    border:
        2px solid #9a8872;
}


/* Ears */

.dog-ear {
    position: absolute;

    width: 35px;
    height: 39px;

    background: #655444;

    border:
        4px solid #493d32;

    border-radius:
        45% 55% 45% 60%;

    z-index: -1;
}

.dog-ear.left {
    left: -18px;
    top: 7px;

    transform:
        rotate(28deg);
}

.dog-ear.right {
    right: -16px;
    top: 8px;

    transform:
        rotate(-28deg);
}


/* Eyes */

.dog-eye {
    position: absolute;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: #111;

    top: 28px;

    box-shadow:
        0 0 0 3px rgba(255,255,255,.25);
}

.dog-eye.left {
    left: 21px;
}

.dog-eye.right {
    right: 19px;
}


/* Muzzle */

.dog-muzzle {
    position: absolute;

    left: 19px;
    top: 42px;

    width: 55px;
    height: 32px;

    background: #d9c9b3;

    border:
        3px solid #756451;

    border-radius: 48%;
}


/* Nose */

.dog-nose {
    position: absolute;

    left: 35px;
    top: 42px;

    width: 25px;
    height: 17px;

    background: #211b18;

    border-radius:
        48% 48% 55% 55%;

    z-index: 3;
}

.dog-nose::after {
    content: "";

    position: absolute;

    left: 10px;
    top: 12px;

    width: 5px;
    height: 10px;

    background: #211b18;

    border-radius: 50%;
}


/* Jowls */

.jowl {
    position: absolute;

    top: 54px;

    width: 25px;
    height: 24px;

    background: #e4d7c4;

    border:
        2px solid #877661;

    border-radius: 50%;
}

.jowl.left {
    left: 9px;
}

.jowl.right {
    right: 8px;
}


/* Tongue */

.dog-tongue {
    position: absolute;

    left: 38px;
    top: 65px;

    width: 17px;
    height: 4px;

    background: #d96f7d;

    border:
        2px solid #944852;

    border-radius:
        5px 5px 50% 50%;

    z-index: 4;

    transform-origin:
        top center;

    animation:
        tongueOut 5s ease-in-out infinite;
}

@keyframes tongueOut {

    0%,
    45%,
    85%,
    100% {
        height: 4px;
        transform: rotate(0deg);
    }

    50%,
    75% {
        height: 28px;
        transform: rotate(4deg);
    }
}


/* Tail */

.dog-tail {
    position: absolute;

    left: 30px;
    top: 59px;

    width: 43px;
    height: 40px;

    border-top:
        9px solid #75604b;

    border-left:
        8px solid #75604b;

    border-radius:
        70% 20% 0 30%;

    transform-origin:
        right bottom;

    animation:
        dogTailWag .35s ease-in-out infinite alternate;
}

@keyframes dogTailWag {

    from {
        transform:
            rotate(-18deg);
    }

    to {
        transform:
            rotate(22deg);
    }
}


/* Legs */

.dog-leg {
    position: absolute;

    top: 103px;

    width: 21px;
    height: 46px;

    background:
        linear-gradient(
            90deg,
            #8d7963,
            #c6b49b,
            #806d58
        );

    border:
        3px solid #594b3d;

    border-radius:
        10px 10px 7px 7px;

    transform-origin:
        top center;
}

.dog-leg.one {
    left: 56px;

    animation:
        dogLeg1 .32s ease-in-out infinite alternate;
}

.dog-leg.two {
    left: 82px;

    animation:
        dogLeg2 .32s ease-in-out infinite alternate;
}

.dog-leg.three {
    left: 116px;

    animation:
        dogLeg2 .32s ease-in-out infinite alternate;
}

.dog-leg.four {
    left: 139px;

    animation:
        dogLeg1 .32s ease-in-out infinite alternate;
}

@keyframes dogLeg1 {

    from {
        transform:
            rotate(9deg);
    }

    to {
        transform:
            rotate(-9deg);
    }
}

@keyframes dogLeg2 {

    from {
        transform:
            rotate(-9deg);
    }

    to {
        transform:
            rotate(9deg);
    }
}


/* =========================================================
   DOG BARK / CHASE
========================================================= */

.bulldog-wrapper.bark {
    animation-play-state:
        paused;
}


/* Dog chase animation */

.bulldog-wrapper.chase {
    animation:
        bulldogChase 4s linear forwards;
}

@keyframes bulldogChase {

    0% {
        right: 42%;
    }

    100% {
        right: 72%;
    }
}


/* Dog gets extra excited */

.bulldog-wrapper.chase .bulldog {
    animation:
        dogBounce .18s ease-in-out infinite alternate;
}


/* Bark bubble */

.bark-bubble {
    position: absolute;

    left: -5px;
    top: -35px;

    padding:
        5px 10px;

    border-radius:
        14px;

    background:
        white;

    color:
        #222;

    font-weight:
        900;

    font-size:
        13px;

    box-shadow:
        0 4px 8px rgba(0,0,0,.4);

    opacity:
        0;

    transform:
        scale(.5);

    pointer-events:
        none;
}

.bulldog-wrapper.bark .bark-bubble {
    animation:
        barkPop .65s ease-out forwards;
}

@keyframes barkPop {

    0% {
        opacity: 0;
        transform:
            scale(.5);
    }

    30% {
        opacity: 1;
        transform:
            scale(1.15);
    }

    70% {
        opacity: 1;
        transform:
            scale(1);
    }

    100% {
        opacity: 0;
        transform:
            scale(.9)
            translateY(-8px);
    }
}

</style>
</head>


<body>

<div class="game-room">


    <!-- =====================================================
         TITLE
    ====================================================== -->

    <div class="title">
        GAME ROOM
    </div>

    <div class="subtitle">
        CHOOSE YOUR GAME
    </div>


    <!-- =====================================================
         GAME MENU
    ====================================================== -->

    <div class="game-menu">


        <!-- TIC TAC TOE -->

        <button
            class="game-button"
            onclick="location.href='ttt.html'">

            <div class="icon">
                ❌⭕
            </div>

            <div class="button-text">

                <div class="button-title">
                    TIC-TAC-TOE
                </div>

                <div class="button-subtitle">
                    Classic • Two Players
                </div>

            </div>

        </button>


        <!-- CHECKERS -->

        <button
            class="game-button"
            onclick="location.href='checkers.html'">

            <div class="icon">
                🔴⚫
            </div>

            <div class="button-text">

                <div class="button-title">
                    CHECKERS
                </div>

                <div class="button-subtitle">
                    Classic • Two Players
                </div>

            </div>

        </button>


        <!-- CARRIER STRIKE -->

        <button
            class="game-button"
            onclick="location.href='carrierstrike.html'">

            <div class="icon">
                ⚓
            </div>

            <div class="button-text">

                <div class="button-title">
                    CARRIER STRIKE
                </div>

                <div class="button-subtitle">
                    Hunt • Strike • Destroy
                </div>

            </div>

        </button>


    </div>


    <!-- =====================================================
         GIRAFFE
    ====================================================== -->

    <div
        class="giraffe-wrapper"
        id="giraffeWrapper">

        <div class="giraffe">

            <div class="body"></div>

            <div class="neck"></div>

            <div class="head">

                <div class="horn one"></div>
                <div class="horn two"></div>

                <div class="ear one"></div>
                <div class="ear two"></div>

                <div class="eye"></div>

                <div class="snout"></div>

                <div class="nose"></div>

            </div>

            <div class="spot one"></div>
            <div class="spot two"></div>
            <div class="spot three"></div>
            <div class="spot four"></div>

            <div class="leg one"></div>
            <div class="leg two"></div>
            <div class="leg three"></div>
            <div class="leg four"></div>

            <div class="tail"></div>

        </div>

    </div>


    <!-- =====================================================
         BULLDOG
    ====================================================== -->

    <div
        class="bulldog-wrapper"
        id="bulldogWrapper">

        <div class="bulldog">

            <div class="dog-tail"></div>

            <div class="dog-body"></div>

            <div class="dog-chest"></div>

            <div class="dog-leg one"></div>
            <div class="dog-leg two"></div>
            <div class="dog-leg three"></div>
            <div class="dog-leg four"></div>

            <div class="dog-head">

                <div class="dog-ear left"></div>
                <div class="dog-ear right"></div>

                <div class="dog-face"></div>

                <div class="dog-eye left"></div>
                <div class="dog-eye right"></div>

                <div class="dog-muzzle"></div>

                <div class="jowl left"></div>
                <div class="jowl right"></div>

                <div class="dog-nose"></div>

                <div class="dog-tongue"></div>

            </div>

        </div>

        <div class="bark-bubble">
            WOOF!
        </div>

    </div>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <div class="footer">
        TWO PLAYERS • ONE SCREEN • LET'S PLAY
    </div>


</div>


<script>

/* =========================================================
   GIRAFFE + BULLDOG INTERACTION
========================================================= */

(function () {

    const giraffe =
        document.getElementById("giraffeWrapper");

    const bulldog =
        document.getElementById("bulldogWrapper");


    if (!giraffe || !bulldog) {
        return;
    }


    let busy = false;


    function encounter() {

        if (busy) {
            return;
        }


        const g =
            giraffe.getBoundingClientRect();

        const b =
            bulldog.getBoundingClientRect();


        /*
         * Find the center of each animal.
         */

        const giraffeCenter =
            g.left + g.width / 2;

        const dogCenter =
            b.left + b.width / 2;


        const distance =
            Math.abs(
                giraffeCenter -
                dogCenter
            );


        /*
         * They must be reasonably close
         * horizontally and vertically.
         */

        const verticalOverlap =
            b.top < g.bottom &&
            b.bottom > g.top;


        if (
            distance > 150 ||
            !verticalOverlap
        ) {
            return;
        }


        /*
         * BEGIN ENCOUNTER
         */

        busy = true;


        /* DOG BARKS */

        bulldog.classList.add("bark");


        /*
         * GIRAFFE HEARS HIM
         * AND TURNS ITS HEAD.
         */

        setTimeout(function () {

            giraffe.classList.add("look");

        }, 250);


        /*
         * GIRAFFE GETS STARTLED
         * AND RUNS AWAY.
         */

        setTimeout(function () {

            giraffe.classList.remove("look");

            giraffe.classList.add("frightened");

        }, 1300);


        /*
         * DOG CHASES BRIEFLY.
         */

        setTimeout(function () {

            bulldog.classList.remove("bark");

            bulldog.classList.add("chase");

        }, 1500);


        /*
         * END THE CHASE.
         */

        setTimeout(function () {

            bulldog.classList.remove("chase");

            giraffe.classList.remove("frightened");

            busy = false;

        }, 5500);

    }


    /*
     * Check every half second.
     */

    setInterval(
        encounter,
        500
    );

})();

</script>

</body>
</html>
