<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>GAME ROOM</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background:
        radial-gradient(circle at 50% 20%, #26364a 0%, #101722 55%, #080c12 100%);
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

body {
    min-height: 100dvh;
}

/* =========================
   MAIN PAGE
   ========================= */

.page {
    width: 100%;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding:
        clamp(14px, 3vw, 30px)
        clamp(12px, 4vw, 40px)
        120px;
    position: relative;
    overflow: hidden;
}

/* =========================
   HEADER
   ========================= */

.header {
    width: min(1100px, 100%);
    text-align: center;
    position: relative;
    z-index: 5;
}

.header h1 {
    margin: 0;
    font-size: clamp(2rem, 6vw, 4.5rem);
    letter-spacing: clamp(4px, 1vw, 12px);
    font-weight: 900;
    text-shadow:
        0 3px 0 #000,
        0 8px 20px rgba(0,0,0,.65);
}

.header p {
    margin: 8px 0 0;
    color: #b8c7d8;
    font-size: clamp(.8rem, 2vw, 1.1rem);
    letter-spacing: 3px;
}

/* =========================
   GAME GRID
   ========================= */

.games {
    width: min(1100px, 100%);
    margin-top: clamp(25px, 5vh, 55px);

    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(min(100%, 230px), 1fr));

    gap: clamp(14px, 2.5vw, 25px);

    position: relative;
    z-index: 5;
}

/* =========================
   GAME CARD
   ========================= */

.game-card {
    min-height: clamp(150px, 20vw, 205px);

    border-radius: 22px;
    border: 1px solid rgba(255,255,255,.16);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.035)
        );

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        0 15px 35px rgba(0,0,0,.45);

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 20px;
    text-decoration: none;
    color: white;

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        background .18s ease;

    cursor: pointer;
}

.game-card:hover {
    transform: translateY(-6px);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.18),
            rgba(255,255,255,.055)
        );

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.2),
        0 22px 45px rgba(0,0,0,.55);
}

.game-card:active {
    transform: translateY(-1px) scale(.985);
}

.game-icon {
    font-size: clamp(2.8rem, 7vw, 4.2rem);
    line-height: 1;
    margin-bottom: 14px;

    filter:
        drop-shadow(0 5px 5px rgba(0,0,0,.55));
}

.game-title {
    font-size: clamp(1.1rem, 3vw, 1.55rem);
    font-weight: 900;
    letter-spacing: 2px;
    text-align: center;
}

.game-subtitle {
    margin-top: 7px;
    color: #aebdcd;
    font-size: .82rem;
    text-align: center;
}

/* =========================
   LOADING / EMPTY
   ========================= */

.message {
    grid-column: 1 / -1;

    text-align: center;
    padding: 35px 20px;

    color: #aebdcd;
    font-size: 1rem;
}

.spinner {
    width: 34px;
    height: 34px;

    border: 3px solid rgba(255,255,255,.15);
    border-top-color: white;

    border-radius: 50%;

    animation: spin .8s linear infinite;

    margin: 0 auto 15px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================
   GIRAFFE
   ========================= */

.giraffe {
    position: fixed;
    left: -160px;
    bottom: 18px;

    width: 125px;
    height: 145px;

    z-index: 20;

    animation:
        giraffeWalk 28s linear infinite;
}

.giraffe-body {
    position: absolute;

    left: 25px;
    bottom: 20px;

    width: 75px;
    height: 62px;

    background: #d79b45;

    border-radius: 45% 50% 40% 45%;

    border: 3px solid #8b5b25;

    box-shadow:
        inset 10px 8px 0 rgba(255,255,255,.1),
        0 5px 8px rgba(0,0,0,.35);
}

.giraffe-neck {
    position: absolute;

    left: 73px;
    bottom: 63px;

    width: 27px;
    height: 70px;

    background: #d79b45;

    border: 3px solid #8b5b25;

    border-radius: 15px;
}

.giraffe-head {
    position: absolute;

    left: 63px;
    bottom: 115px;

    width: 53px;
    height: 38px;

    background: #d79b45;

    border: 3px solid #8b5b25;

    border-radius: 45% 55% 45% 35%;
}

.giraffe-eye {
    position: absolute;

    right: 10px;
    top: 10px;

    width: 7px;
    height: 7px;

    background: #111;
    border-radius: 50%;
}

.giraffe-ear {
    position: absolute;

    width: 15px;
    height: 10px;

    background: #d79b45;
    border: 3px solid #8b5b25;

    border-radius: 50%;
}

.giraffe-ear.one {
    left: 3px;
    top: -8px;
}

.giraffe-ear.two {
    right: 5px;
    top: -8px;
}

.giraffe-leg {
    position: absolute;

    bottom: 0;

    width: 11px;
    height: 32px;

    background: #d79b45;
    border: 3px solid #8b5b25;

    border-radius: 8px;
}

.giraffe-leg.one {
    left: 35px;
}

.giraffe-leg.two {
    left: 65px;
}

@keyframes giraffeWalk {
    0% {
        transform: translateX(0);
    }

    45% {
        transform: translateX(calc(100vw + 220px));
    }

    50% {
        transform: translateX(calc(100vw + 220px));
    }

    95% {
        transform: translateX(0);
    }

    100% {
        transform: translateX(0);
    }
}

/* =========================
   DOG
   ========================= */

.dog {
    position: fixed;

    right: -120px;
    bottom: 25px;

    width: 105px;
    height: 90px;

    z-index: 21;

    animation:
        dogWalk 22s linear infinite;
}

.dog-body {
    position: absolute;

    left: 20px;
    bottom: 20px;

    width: 65px;
    height: 43px;

    background: #b87542;

    border: 3px solid #663b20;

    border-radius: 45%;
}

.dog-head {
    position: absolute;

    left: 4px;
    bottom: 43px;

    width: 43px;
    height: 40px;

    background: #b87542;

    border: 3px solid #663b20;

    border-radius: 48%;
}

.dog-ear {
    position: absolute;

    left: 1px;
    top: 3px;

    width: 16px;
    height: 29px;

    background: #663b20;

    border-radius: 50%;
}

.dog-eye {
    position: absolute;

    right: 8px;
    top: 11px;

    width: 6px;
    height: 6px;

    background: #111;
    border-radius: 50%;
}

.dog-leg {
    position: absolute;

    bottom: 0;

    width: 9px;
    height: 27px;

    background: #b87542;

    border: 3px solid #663b20;

    border-radius: 7px;
}

.dog-leg.one {
    left: 27px;
}

.dog-leg.two {
    left: 60px;
}

.dog-tail {
    position: absolute;

    right: 1px;
    bottom: 51px;

    width: 32px;
    height: 12px;

    border-top: 6px solid #663b20;

    border-radius: 50%;

    transform: rotate(25deg);
}

@keyframes dogWalk {
    0% {
        transform: translateX(0);
    }

    47% {
        transform: translateX(calc(-100vw - 230px));
    }

    52% {
        transform: translateX(calc(-100vw - 230px));
    }

    100% {
        transform: translateX(0);
    }
}

/* =========================
   LADYBUG
   ========================= */

.ladybug {
    position: fixed;

    width: 28px;
    height: 28px;

    left: 8%;
    top: 18%;

    z-index: 30;

    animation:
        bugMove 18s ease-in-out infinite;
}

.ladybug-body {
    width: 28px;
    height: 28px;

    background: #d92727;

    border: 2px solid #111;

    border-radius: 50%;

    position: relative;

    box-shadow:
        0 4px 8px rgba(0,0,0,.35);
}

.ladybug-body::before {
    content: "";

    position: absolute;

    left: 12px;
    top: 1px;

    width: 2px;
    height: 24px;

    background: #111;
}

.ladybug-body::after {
    content: "•  •";

    position: absolute;

    left: 5px;
    top: 5px;

    color: #111;
    font-size: 10px;
    line-height: 10px;

    letter-spacing: 4px;
}

@keyframes bugMove {
    0% {
        left: 8%;
        top: 18%;
    }

    25% {
        left: 88%;
        top: 25%;
    }

    50% {
        left: 72%;
        top: 65%;
    }

    75% {
        left: 12%;
        top: 72%;
    }

    100% {
        left: 8%;
        top: 18%;
    }
}

/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

    .page {
        padding-bottom: 90px;
    }

    .games {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
    }

    .game-card {
        min-height: 145px;
        padding: 14px;
        border-radius: 18px;
    }

    .game-icon {
        font-size: 2.7rem;
        margin-bottom: 10px;
    }

    .game-title {
        font-size: 1rem;
        letter-spacing: 1px;
    }

    .game-subtitle {
        font-size: .7rem;
    }

    .giraffe {
        transform: scale(.72);
        transform-origin: bottom left;
    }

    .dog {
        transform: scale(.65);
        transform-origin: bottom right;
    }
}

/* =========================
   VERY SMALL SCREENS
   ========================= */

@media (max-width: 360px) {

    .games {
        grid-template-columns: 1fr;
    }

    .game-card {
        min-height: 125px;
    }
}

/* =========================
   REDUCED MOTION
   ========================= */

@media (prefers-reduced-motion: reduce) {

    .giraffe,
    .dog,
    .ladybug {
        animation: none;
    }

    .game-card {
        transition: none;
    }
}
</style>
</head>

<body>

<div class="page">

    <header class="header">
        <h1>GAME ROOM</h1>
        <p>CHOOSE YOUR GAME</p>
    </header>

    <main id="games" class="games">
        <div class="message">
            <div class="spinner"></div>
            LOADING GAMES...
        </div>
    </main>

</div>


<!-- GIRAFFE -->
<div class="giraffe">

    <div class="giraffe-head">
        <div class="giraffe-eye"></div>
        <div class="giraffe-ear one"></div>
        <div class="giraffe-ear two"></div>
    </div>

    <div class="giraffe-neck"></div>

    <div class="giraffe-body"></div>

    <div class="giraffe-leg one"></div>
    <div class="giraffe-leg two"></div>

</div>


<!-- DOG -->
<div class="dog">

    <div class="dog-head">
        <div class="dog-eye"></div>
        <div class="dog-ear"></div>
    </div>

    <div class="dog-body"></div>

    <div class="dog-leg one"></div>
    <div class="dog-leg two"></div>

    <div class="dog-tail"></div>

</div>


<!-- LADYBUG -->
<div class="ladybug">
    <div class="ladybug-body"></div>
</div>


<script>
/*
    AUTOMATIC GAME DISCOVERY

    The server provides:
        GET /games

    Example response:
        [
            "ttt.html",
            "checkers.html",
            "navalstrike.html",
            "chess.html",
            "solitaire.html"
        ]

    This page then builds the menu automatically.
*/

const gamesContainer = document.getElementById("games");


/*
    Nice display information.

    The actual GAME LIST is NOT stored here.
    These are only visual details for known games.

    Unknown games automatically get a generic card.
*/

const gameAppearance = {

    "ttt.html": {
        icon: "⭕",
        title: "TIC-TAC-TOE",
        subtitle: "2 Player"
    },

    "checkers.html": {
        icon: "♟",
        title: "CHECKERS",
        subtitle: "2 Player"
    },

    "navalstrike.html": {
        icon: "⚓",
        title: "NAVAL STRIKE",
        subtitle: "2 Player • Computer"
    },

    "chess.html": {
        icon: "♛",
        title: "CHESS",
        subtitle: "2 Player • Computer • 3 Levels"
    },

    "solitaire.html": {
        icon: "🃏",
        title: "SOLITAIRE",
        subtitle: "Classic Klondike"
    }
};


/*
    Convert filename into a readable title
    for games we haven't specifically styled yet.
*/

function makeTitle(filename) {

    let name = filename
        .replace(/\.html$/i, "")
        .replace(/[-_]+/g, " ")
        .trim();

    return name
        .split(" ")
        .map(word =>
            word.charAt(0).toUpperCase() +
            word.slice(1).toLowerCase()
        )
        .join(" ");
}


/*
    Choose a generic icon for unknown games.
*/

function genericIcon(filename) {

    const name = filename.toLowerCase();

    if (name.includes("card") ||
        name.includes("poker") ||
        name.includes("solitaire")) {
        return "🃏";
    }

    if (name.includes("ship") ||
        name.includes("naval") ||
        name.includes("battle")) {
        return "⚓";
    }

    if (name.includes("chess")) {
        return "♟";
    }

    if (name.includes("check")) {
        return "♟";
    }

    if (name.includes("dice")) {
        return "🎲";
    }

    if (name.includes("word")) {
        return "🔤";
    }

    return "🎮";
}


/*
    Build one menu card.
*/

function createGameCard(filename) {

    const appearance =
        gameAppearance[filename] || {};

    const title =
        appearance.title ||
        makeTitle(filename);

    const icon =
        appearance.icon ||
        genericIcon(filename);

    const subtitle =
        appearance.subtitle ||
        "Game";

    const link =
        document.createElement("a");

    link.className = "game-card";

    link.href = filename;

    link.innerHTML = `
        <div class="game-icon">${icon}</div>
        <div class="game-title">${title}</div>
        <div class="game-subtitle">${subtitle}</div>
    `;

    return link;
}


/*
    Load games from the server.
*/

async function loadGames() {

    try {

        const response =
            await fetch("/games", {
                cache: "no-store"
            });

        if (!response.ok) {
            throw new Error("Game list unavailable");
        }

        const games =
            await response.json();

        if (!Array.isArray(games)) {
            throw new Error("Invalid game list");
        }

        const htmlGames =
            games
                .filter(game =>
                    typeof game === "string" &&
                    /\.html$/i.test(game) &&
                    game.toLowerCase() !== "index.html"
                )
                .sort((a, b) =>
                    a.localeCompare(
                        b,
                        undefined,
                        { sensitivity: "base" }
                    )
                );

        gamesContainer.innerHTML = "";

        if (htmlGames.length === 0) {

            gamesContainer.innerHTML = `
                <div class="message">
                    NO GAMES FOUND
                </div>
            `;

            return;
        }

        for (const game of htmlGames) {

            gamesContainer.appendChild(
                createGameCard(game)
            );
        }

    } catch (error) {

        console.error(
            "Could not load games:",
            error
        );

        gamesContainer.innerHTML = `
            <div class="message">
                <strong>GAME LIST UNAVAILABLE</strong>
                <br><br>
                The game server is not providing
                the automatic game list yet.
            </div>
        `;
    }
}


loadGames();
</script>

</body>
</html>
