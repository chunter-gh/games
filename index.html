<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Room</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background:
        radial-gradient(circle at 50% 35%, #183d6b 0%, #0c2343 45%, #061326 100%);
    color: white;
}

/* =========================
   MENU
   ========================= */

.menu {
    position: relative;
    z-index: 20;
    text-align: center;
    padding-top: 35px;
}

h1 {
    margin: 0;
    font-size: clamp(38px, 7vw, 72px);
    letter-spacing: 8px;
    text-shadow: 0 4px 12px #000;
}

.subtitle {
    margin-top: 8px;
    font-size: 18px;
    letter-spacing: 5px;
    color: #d7e8ff;
}

.buttons {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
}

.buttons a {
    text-decoration: none;
    color: white;
    background: linear-gradient(#28598d, #173a63);
    border: 2px solid #5e91c5;
    border-radius: 12px;
    padding: 15px 25px;
    min-width: 155px;
    font-size: 18px;
    font-weight: bold;
    box-shadow:
        0 5px 12px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.25);
    transition: .2s;
}

.buttons a:hover {
    transform: translateY(-3px);
    background: linear-gradient(#3471ad, #1c4776);
}

/* =========================
   GROUND
   ========================= */

.ground {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 105px;
    background:
        linear-gradient(#172b27 0 3px, #10201d 4px 100%);
    border-top: 3px solid #284b42;
    z-index: 1;
}

.ground::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 20px;
    height: 2px;
    background: rgba(94,139,119,.22);
}

/* =========================
   ANIMAL STAGE
   ========================= */

.animal-stage {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 72px;
    height: 300px;
    z-index: 5;
    pointer-events: none;
}

/* =========================
   GIRAFFE
   ========================= */

.giraffe-wrapper {
    position: absolute;
    left: -235px;
    bottom: 0;
    width: 210px;
    height: 270px;
    animation: giraffeWalk 15s linear infinite;
    transform-origin: center bottom;
}

.giraffe {
    position: relative;
    width: 210px;
    height: 270px;
    transform-origin: center bottom;
}

/* body */

.giraffe-body {
    position: absolute;
    width: 112px;
    height: 72px;
    left: 58px;
    top: 125px;
    background: #d89a36;
    border-radius: 50% 48% 45% 50%;
    border: 3px solid #9a6620;
    box-shadow: inset -8px -7px 0 rgba(126,77,20,.12);
}

.patch {
    position: absolute;
    background: #8c561c;
    border-radius: 45%;
}

.patch.p1 {
    width: 27px;
    height: 24px;
    left: 15px;
    top: 12px;
}

.patch.p2 {
    width: 21px;
    height: 25px;
    left: 58px;
    top: 30px;
}

.patch.p3 {
    width: 19px;
    height: 18px;
    left: 85px;
    top: 8px;
}

.patch.p4 {
    width: 23px;
    height: 19px;
    left: 37px;
    top: 4px;
}

/* neck */

.giraffe-neck {
    position: absolute;
    left: 116px;
    top: 24px;
    width: 46px;
    height: 130px;
    background: #d89a36;
    border: 3px solid #9a6620;
    border-radius: 22px;
    transform: rotate(-5deg);
    transform-origin: bottom center;
}

.giraffe-neck::before {
    content: "";
    position: absolute;
    inset: 7px;
    background:
        radial-gradient(ellipse at 30% 18%, #8c561c 0 18%, transparent 20%),
        radial-gradient(ellipse at 70% 42%, #8c561c 0 17%, transparent 19%),
        radial-gradient(ellipse at 32% 66%, #8c561c 0 19%, transparent 21%),
        radial-gradient(ellipse at 72% 82%, #8c561c 0 17%, transparent 19%);
    border-radius: 18px;
}

/* head */

.giraffe-head {
    position: absolute;
    left: 103px;
    top: 0;
    width: 91px;
    height: 67px;
    background: #d89a36;
    border: 3px solid #9a6620;
    border-radius: 48% 55% 45% 42%;
    transform: rotate(3deg);
}

.giraffe-head::before {
    content: "";
    position: absolute;
    width: 28px;
    height: 31px;
    left: -14px;
    top: 27px;
    background: #e4ad54;
    border: 3px solid #9a6620;
    border-radius: 45%;
}

.giraffe-muzzle {
    position: absolute;
    width: 40px;
    height: 25px;
    left: -21px;
    top: 34px;
    background: #e7b866;
    border-radius: 50%;
    border: 2px solid #9a6620;
}

.giraffe-eye {
    position: absolute;
    width: 10px;
    height: 10px;
    background: #111;
    border-radius: 50%;
    left: 39px;
    top: 21px;
    box-shadow: 2px 2px 0 white;
}

.giraffe-ear {
    position: absolute;
    width: 23px;
    height: 32px;
    background: #b97827;
    border: 3px solid #895519;
    border-radius: 50% 50% 40% 40%;
    top: -15px;
}

.giraffe-ear.left {
    left: 12px;
    transform: rotate(-25deg);
}

.giraffe-ear.right {
    right: 9px;
    transform: rotate(25deg);
}

.horn {
    position: absolute;
    width: 10px;
    height: 27px;
    background: #76501e;
    border-radius: 7px;
    top: -27px;
}

.horn::after {
    content: "";
    position: absolute;
    width: 15px;
    height: 12px;
    background: #8e6025;
    border-radius: 50%;
    left: -2px;
    top: -5px;
}

.horn.left {
    left: 28px;
    transform: rotate(-7deg);
}

.horn.right {
    left: 58px;
    transform: rotate(7deg);
}

.mane {
    position: absolute;
    left: 103px;
    top: 42px;
    width: 12px;
    height: 108px;
    background: #754716;
    clip-path: polygon(
        0 0,100% 5%,35% 12%,100% 20%,
        35% 29%,100% 38%,35% 47%,
        100% 57%,35% 67%,100% 76%,
        35% 87%,100% 96%,0 100%
    );
}

/* legs */

.giraffe-leg {
    position: absolute;
    width: 16px;
    height: 92px;
    background: #d89a36;
    border: 3px solid #9a6620;
    border-radius: 10px;
    transform-origin: top center;
}

.giraffe-leg::after {
    content: "";
    position: absolute;
    bottom: -6px;
    left: -3px;
    width: 20px;
    height: 11px;
    background: #69451c;
    border-radius: 5px;
}

.giraffe-leg.one {
    left: 68px;
    top: 181px;
}

.giraffe-leg.two {
    left: 94px;
    top: 183px;
}

.giraffe-leg.three {
    left: 132px;
    top: 181px;
}

.giraffe-leg.four {
    left: 157px;
    top: 183px;
}

/* tail */

.giraffe-tail {
    position: absolute;
    width: 55px;
    height: 13px;
    left: 42px;
    top: 137px;
    border-top: 5px solid #9a6620;
    border-radius: 50%;
    transform: rotate(15deg);
    transform-origin: right center;
}

.giraffe-tail::after {
    content: "";
    position: absolute;
    width: 19px;
    height: 19px;
    background: #69451c;
    border-radius: 50%;
    left: -8px;
    top: -10px;
}

/* giraffe walking */

@keyframes giraffeWalk {
    0% {
        left: -235px;
        transform: translateY(0);
    }
    10% {
        transform: translateY(-3px);
    }
    20% {
        transform: translateY(0);
    }
    30% {
        transform: translateY(-3px);
    }
    40% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-3px);
    }
    60% {
        transform: translateY(0);
    }
    70% {
        transform: translateY(-3px);
    }
    80% {
        transform: translateY(0);
    }
    100% {
        left: calc(100% + 25px);
        transform: translateY(0);
    }
}

@keyframes giraffeLeg1 {
    0%,100% { transform: rotate(10deg); }
    50% { transform: rotate(-12deg); }
}

@keyframes giraffeLeg2 {
    0%,100% { transform: rotate(-12deg); }
    50% { transform: rotate(10deg); }
}

.giraffe-leg.one,
.giraffe-leg.three {
    animation: giraffeLeg1 .65s ease-in-out infinite;
}

.giraffe-leg.two,
.giraffe-leg.four {
    animation: giraffeLeg2 .65s ease-in-out infinite;
}

.giraffe-tail {
    animation: tailWag .9s ease-in-out infinite;
}

@keyframes tailWag {
    0%,100% { transform: rotate(10deg); }
    50% { transform: rotate(27deg); }
}

/* =========================
   LABRADOR / GREYHOUND
   ========================= */

.labrador-wrapper {
    position: absolute;
    right: -250px;
    bottom: 2px;
    width: 235px;
    height: 155px;
    animation: labradorWalk 18s linear infinite;
    transform-origin: center bottom;
}

.labrador {
    position: relative;
    width: 235px;
    height: 155px;
}

/*
   Lean Greyhound-influenced body,
   Labrador head/ears/muzzle/coat.
*/

.lab-body {
    position: absolute;
    left: 65px;
    top: 54px;
    width: 125px;
    height: 55px;
    background: #b87538;
    border: 3px solid #74451f;
    border-radius: 55% 48% 48% 52%;
    transform: rotate(-3deg);
    box-shadow: inset -8px -5px 0 rgba(80,40,15,.12);
}

.lab-chest {
    position: absolute;
    left: 51px;
    top: 57px;
    width: 49px;
    height: 69px;
    background: #c48142;
    border: 3px solid #74451f;
    border-radius: 48% 42% 35% 45%;
}

.lab-head {
    position: absolute;
    left: 18px;
    top: 31px;
    width: 73px;
    height: 68px;
    background: #b87538;
    border: 3px solid #74451f;
    border-radius: 50% 48% 46% 50%;
    transform: rotate(-3deg);
}

/* Labrador floppy ears */

.lab-ear {
    position: absolute;
    width: 29px;
    height: 54px;
    background: #75451f;
    border: 3px solid #593316;
    border-radius: 55% 45% 55% 45%;
    top: 39px;
    z-index: -1;
}

.lab-ear.left {
    left: 11px;
    transform: rotate(19deg);
}

.lab-ear.right {
    left: 69px;
    transform: rotate(-25deg);
}

/* Labrador muzzle */

.lab-muzzle {
    position: absolute;
    left: -8px;
    top: 61px;
    width: 49px;
    height: 31px;
    background: #d59a5c;
    border: 3px solid #74451f;
    border-radius: 52%;
}

.lab-nose {
    position: absolute;
    left: -7px;
    top: 68px;
    width: 20px;
    height: 14px;
    background: #17130f;
    border-radius: 50%;
}

.lab-eye {
    position: absolute;
    width: 9px;
    height: 9px;
    background: #111;
    border-radius: 50%;
    left: 43px;
    top: 55px;
    box-shadow: 2px 2px 0 white;
}

.lab-collar {
    position: absolute;
    left: 70px;
    top: 50px;
    width: 13px;
    height: 58px;
    background: #263f70;
    border: 2px solid #152846;
    border-radius: 5px;
    transform: rotate(-3deg);
}

.lab-tag {
    position: absolute;
    left: 67px;
    top: 101px;
    width: 14px;
    height: 16px;
    background: #d6b75b;
    border-radius: 50%;
    border: 2px solid #806a27;
}

/* Long Greyhound-like legs */

.lab-leg {
    position: absolute;
    width: 12px;
    height: 76px;
    background: #a96632;
    border: 3px solid #70411d;
    border-radius: 9px;
    transform-origin: top center;
}

.lab-leg::after {
    content: "";
    position: absolute;
    left: -4px;
    bottom: -5px;
    width: 17px;
    height: 9px;
    background: #57341c;
    border-radius: 5px;
}

.lab-leg.front1 {
    left: 71px;
    top: 93px;
}

.lab-leg.front2 {
    left: 91px;
    top: 91px;
}

.lab-leg.back1 {
    left: 157px;
    top: 92px;
}

.lab-leg.back2 {
    left: 178px;
    top: 91px;
}

/* long lean tail */

.lab-tail {
    position: absolute;
    left: 180px;
    top: 53px;
    width: 58px;
    height: 17px;
    border-top: 6px solid #74451f;
    border-radius: 50%;
    transform: rotate(13deg);
    transform-origin: left center;
}

.lab-tail::after {
    content: "";
    position: absolute;
    right: -5px;
    top: -7px;
    width: 16px;
    height: 16px;
    background: #74451f;
    border-radius: 50%;
}

/* Labrador/Greyhound walking gait */

@keyframes labradorWalk {
    0% {
        right: -250px;
        transform: translateY(0);
    }
    10% {
        transform: translateY(-2px);
    }
    20% {
        transform: translateY(0);
    }
    30% {
        transform: translateY(-2px);
    }
    40% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-2px);
    }
    60% {
        transform: translateY(0);
    }
    70% {
        transform: translateY(-2px);
    }
    80% {
        transform: translateY(0);
    }
    100% {
        right: calc(100% + 30px);
        transform: translateY(0);
    }
}

@keyframes labLegA {
    0%,100% { transform: rotate(12deg); }
    50% { transform: rotate(-14deg); }
}

@keyframes labLegB {
    0%,100% { transform: rotate(-14deg); }
    50% { transform: rotate(12deg); }
}

.lab-leg.front1,
.lab-leg.back1 {
    animation: labLegA .58s ease-in-out infinite;
}

.lab-leg.front2,
.lab-leg.back2 {
    animation: labLegB .58s ease-in-out infinite;
}

.lab-tail {
    animation: dogTail .8s ease-in-out infinite;
}

@keyframes dogTail {
    0%,100% { transform: rotate(8deg); }
    50% { transform: rotate(23deg); }
}

/* =========================
   INTERACTION
   ========================= */

.animal-stage.meeting .giraffe-wrapper,
.animal-stage.meeting .labrador-wrapper {
    animation-play-state: paused;
}

.sniff-bubble,
.bark-bubble {
    position: absolute;
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    font-weight: bold;
    white-space: nowrap;
}

.sniff-bubble {
    left: 50%;
    bottom: 125px;
    transform: translateX(-50%);
    font-size: 18px;
    color: #d9e9ff;
}

.bark-bubble {
    left: 50%;
    bottom: 165px;
    transform: translateX(-50%);
    background: white;
    color: #17253a;
    padding: 8px 13px;
    border-radius: 15px;
    font-size: 17px;
    box-shadow: 0 3px 8px rgba(0,0,0,.4);
}

.sniff-bubble.show {
    opacity: 1;
}

.bark-bubble.show {
    opacity: 1;
}

/* dog sniffing */

.labrador-wrapper.sniffing .lab-head {
    transform: rotate(7deg) translateX(-5px);
}

.labrador-wrapper.sniffing .lab-muzzle {
    transform: translateX(-5px);
}

/* bark */

.labrador-wrapper.barking .lab-head {
    animation: barkHead .16s ease-in-out 3;
}

@keyframes barkHead {
    0%,100% { transform: rotate(-3deg); }
    50% { transform: rotate(4deg) translateX(-3px); }
}

/* giraffe startled */

.giraffe-wrapper.startled .giraffe {
    animation: startled .18s ease-in-out 3;
}

@keyframes startled {
    0%,100% {
        transform: translateX(0);
    }
    50% {
        transform: translateX(-8px);
    }
}

/*
   Horizontal flip exactly when startled.
   Then the whole giraffe runs left.
*/

.giraffe-wrapper.escape .giraffe {
    transform: scaleX(-1);
}

.giraffe-wrapper.escape {
    animation:
        giraffeEscape 2.3s linear forwards !important;
}

@keyframes giraffeEscape {
    0% {
        left: var(--escape-start);
    }
    100% {
        left: -270px;
    }
}

/* =========================
   MOBILE
   ========================= */

@media (max-width: 700px) {

    .menu {
        padding-top: 22px;
    }

    h1 {
        letter-spacing: 4px;
    }

    .subtitle {
        font-size: 13px;
        letter-spacing: 3px;
    }

    .buttons {
        margin-top: 20px;
        gap: 9px;
    }

    .buttons a {
        min-width: 125px;
        padding: 11px 13px;
        font-size: 15px;
    }

    .animal-stage {
        transform: scale(.78);
        transform-origin: bottom center;
        width: 128%;
        left: -14%;
    }
}
</style>
</head>

<body>

<div class="menu">
    <h1>GAME ROOM</h1>
    <div class="subtitle">CHOOSE YOUR GAME</div>

    <div class="buttons">
        <a href="ttt.html">TIC-TAC-TOE</a>
        <a href="checkers.html">CHECKERS</a>
        <a href="carrierstrike.html">CARRIER STRIKE</a>
    </div>
</div>

<div class="animal-stage" id="animalStage">

    <!-- ================= GIRAFFE ================= -->

    <div class="giraffe-wrapper" id="giraffe">
        <div class="giraffe">

            <div class="giraffe-tail"></div>

            <div class="giraffe-body">
                <div class="patch p1"></div>
                <div class="patch p2"></div>
                <div class="patch p3"></div>
                <div class="patch p4"></div>
            </div>

            <div class="giraffe-neck"></div>

            <div class="mane"></div>

            <div class="giraffe-head">
                <div class="giraffe-ear left"></div>
                <div class="giraffe-ear right"></div>

                <div class="horn left"></div>
                <div class="horn right"></div>

                <div class="giraffe-eye"></div>
                <div class="giraffe-muzzle"></div>
            </div>

            <div class="giraffe-leg one"></div>
            <div class="giraffe-leg two"></div>
            <div class="giraffe-leg three"></div>
            <div class="giraffe-leg four"></div>

        </div>
    </div>

    <!-- ================= LABRADOR / GREYHOUND ================= -->

    <div class="labrador-wrapper" id="labrador">
        <div class="labrador">

            <div class="lab-tail"></div>

            <div class="lab-body"></div>
            <div class="lab-chest"></div>

            <div class="lab-ear left"></div>
            <div class="lab-ear right"></div>

            <div class="lab-head">
                <div class="lab-muzzle"></div>
                <div class="lab-nose"></div>
                <div class="lab-eye"></div>
            </div>

            <div class="lab-collar"></div>
            <div class="lab-tag"></div>

            <div class="lab-leg front1"></div>
            <div class="lab-leg front2"></div>
            <div class="lab-leg back1"></div>
            <div class="lab-leg back2"></div>

        </div>
    </div>

    <div class="sniff-bubble" id="sniffBubble">
        sniff...
    </div>

    <div class="bark-bubble" id="barkBubble">
        WOOF!
    </div>

</div>

<div class="ground"></div>

<script>
const stage = document.getElementById("animalStage");
const giraffe = document.getElementById("giraffe");
const labrador = document.getElementById("labrador");
const sniffBubble = document.getElementById("sniffBubble");
const barkBubble = document.getElementById("barkBubble");

let interactionRunning = false;

/* ---------------------------------
   Check when the animals meet
---------------------------------- */

function checkForMeeting() {

    if (interactionRunning) return;

    const g = giraffe.getBoundingClientRect();
    const d = labrador.getBoundingClientRect();

    /*
       They are considered to have met when
       their horizontal bodies overlap and
       they are on the same ground level.
    */

    const horizontalOverlap =
        g.right > d.left + 8 &&
        g.left < d.right - 8;

    const verticalOverlap =
        g.bottom > d.top + 25 &&
        g.top < d.bottom - 15;

    if (horizontalOverlap && verticalOverlap) {
        startEncounter();
    }
}

/* ---------------------------------
   Exact encounter sequence
---------------------------------- */

function startEncounter() {

    if (interactionRunning) return;

    interactionRunning = true;

    stage.classList.add("meeting");

    /* DOG SNIFFS */

    setTimeout(() => {
        labrador.classList.add("sniffing");
        sniffBubble.classList.add("show");
    }, 250);

    /* DOG BARKS */

    setTimeout(() => {
        labrador.classList.remove("sniffing");
        sniffBubble.classList.remove("show");

        labrador.classList.add("barking");
        barkBubble.classList.add("show");
    }, 1900);

    /* GIRAFFE STARTLES */

    setTimeout(() => {
        labrador.classList.remove("barking");
        barkBubble.classList.remove("show");

        giraffe.classList.add("startled");
    }, 2400);

    /* GIRAFFE FLIPS AND RUNS LEFT */

    setTimeout(() => {

        giraffe.classList.remove("startled");

        /*
           Save its current left position so the
           escape animation starts exactly where
           the giraffe was standing.
        */

        const rect = giraffe.getBoundingClientRect();
        const stageRect = stage.getBoundingClientRect();

        const currentLeft = rect.left - stageRect.left;

        giraffe.style.setProperty(
            "--escape-start",
            currentLeft + "px"
        );

        giraffe.classList.add("escape");

    }, 2900);

    /*
       After the giraffe has run completely off
       the left side, restart the normal scene.
       The dog NEVER disappears.
    */

    setTimeout(() => {

        giraffe.classList.remove("escape");

        /*
           Force the giraffe's original CSS walking
           animation to restart from the left side.
        */

        giraffe.style.animation = "none";
        void giraffe.offsetWidth;
        giraffe.style.animation = "";

        /*
           The dog is already traveling normally
           toward the left. Restart its animation
           only if necessary.
        */

        labrador.style.animation = "none";
        void labrador.offsetWidth;
        labrador.style.animation = "";

        stage.classList.remove("meeting");

        interactionRunning = false;

    }, 5500);
}

/* Check continuously while both animals are moving */

setInterval(checkForMeeting, 80);

/*
   If a browser has resized, keep everything
   alive and restart cleanly.
*/

window.addEventListener("resize", () => {
    if (!interactionRunning) {
        giraffe.style.animation = "none";
        labrador.style.animation = "none";

        void giraffe.offsetWidth;
        void labrador.offsetWidth;

        giraffe.style.animation = "";
        labrador.style.animation = "";
    }
});
</script>

</body>
