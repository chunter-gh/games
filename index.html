<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe</title><style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.game {
    width: min(92vw, 500px);
    text-align: center;
}

h1 {
    margin-bottom: 10px;
}

#status {
    min-height: 28px;
    margin-bottom: 15px;
    font-size: 18px;
}

.board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: 100%;
    aspect-ratio: 1;
    perspective: 800px;
}

.cell {
    background: linear-gradient(145deg, #333, #111);
    border: 2px solid #555;
    border-radius: 12px;
    box-shadow:
        6px 6px 12px #050505,
        -4px -4px 10px #444;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: clamp(50px, 16vw, 90px);
    font-weight: bold;
    cursor: pointer;
    user-select: none;
    transition: transform 0.1s;
}

.cell:active {
    transform: translateY(3px);
}

button {
    margin-top: 20px;
    padding: 12px 24px;
    border: none;
    border-radius: 10px;
    background: #333;
    color: white;
    font-size: 16px;
}

#connection {
    margin-top: 12px;
    font-size: 14px;
    color: #aaa;
}
</style></head><body><div class="game"><h1>Tic-Tac-Toe</h1>

<div id="status">Connecting...</div>

<div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
</div>

<button id="newGame">New Game</button>

<div id="connection">Connecting to game server...</div>

</div><script>

const SERVER_URL = "wss://games-z5k2.onrender.com";

let socket = null;
let mySymbol = null;
let board = Array(9).fill(null);
let currentPlayer = "X";
let gameOver = false;

const cells = document.querySelectorAll(".cell");
const status = document.getElementById("status");
const connection = document.getElementById("connection");
const newGameButton = document.getElementById("newGame");

function connect() {

    status.textContent = "Connecting...";
    connection.textContent = "Connecting to game server...";

    socket = new WebSocket(SERVER_URL);

    socket.addEventListener("open", () => {
        connection.textContent = "Connected to game server";
    });

    socket.addEventListener("message", (event) => {

        try {
            const data = JSON.parse(event.data);
            handleServerMessage(data);
        } catch (error) {
            console.error("Invalid server message:", error);
        }

    });

    socket.addEventListener("close", () => {
        connection.textContent = "Disconnected from game server";
        status.textContent = "Connection lost.";
    });

    socket.addEventListener("error", () => {
        connection.textContent = "Server connection error";
    });
}

function handleServerMessage(data) {

    if (data.type === "assign") {

        mySymbol = data.symbol;

        status.textContent =
            "You are " + mySymbol + ". Waiting for opponent...";

        return;
    }

    if (data.type === "state") {

        board = data.board;
        currentPlayer = data.currentPlayer;

        drawBoard();

        if (data.winner) {

            gameOver = true;

            status.textContent =
                data.winner === mySymbol
                ? "You win!"
                : "Opponent wins!";

            return;
        }

        if (data.draw) {

            gameOver = true;
            status.textContent = "Draw!";

            return;
        }

        gameOver = false;

        if (!data.players.X || !data.players.O) {

            status.textContent = "Waiting for opponent...";

            return;
        }

        if (currentPlayer === mySymbol) {
            status.textContent = "Your turn";
        } else {
            status.textContent = "Opponent's turn";
        }
    }

    if (data.type === "error") {
        status.textContent = data.message || "Server error.";
    }
}

function drawBoard() {

    cells.forEach((cell, index) => {
        cell.textContent = board[index] || "";
    });

}

cells.forEach((cell) => {

    cell.addEventListener("click", () => {

        if (!socket) return;
        if (socket.readyState !== WebSocket.OPEN) return;
        if (!mySymbol) return;
        if (gameOver) return;
        if (currentPlayer !== mySymbol) return;

        const index = Number(cell.dataset.index);

        if (board[index] !== null) return;

        socket.send(JSON.stringify({
            type: "move",
            index: index,
            symbol: mySymbol
        }));

    });

});

newGameButton.addEventListener("click", () => {

    if (!socket) return;
    if (socket.readyState !== WebSocket.OPEN) return;

    socket.send(JSON.stringify({
        type: "new_game"
    }));

});

connect();

</script></body>
</html>
