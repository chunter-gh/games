<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Game Room</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body {
    background:
        radial-gradient(circle at 50% 15%, #244b72 0%, #10243c 45%, #06101d 100%);
    color: white;
}

.game-room {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
}

/* ATMOSPHERE */

.glow {
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.12), transparent 70%);
    left: 50%;
    top: -130px;
    transform: translateX(-50%);
}

/* TITLE */

.title-area {
    position: relative;
    z-index: 50;
    text-align: center;
    padding-top: clamp(12px, 3vh, 28px);
}

.title {
    margin: 0;
    font-size: clamp(34px, 8vw, 62px);
    font-weight: 900;
    letter-spacing: 4px;
    color: #fff;
    text-shadow:
        0 3px 0 #14283e,
        0 6px 12px rgba(0,0,0,.8),
        0 0 20px rgba(120,200,255,.45);
}

.subtitle {
    margin-top: 5px;
    font-size: clamp(10px, 1.7vw, 13px);
    letter-spacing: 5px;
    color: #b9d7ee;
}

/* MENU */

.menu {
    position: absolute;
    z-index: 40;

    width: min(88vw, 420px);

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    display: flex;
    flex-direction: column;

    gap: clamp(7px, 1.5vh, 16px);
}

.game-button {
    position: relative;

    width: 100%;
    height: clamp(62px, 10vh, 82px);

    margin: 0;

    border: 1px solid rgba(255,255,255,.35);
    border-radius: 22px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.28),
            rgba(255,255,255,.05) 45%,
            rgba(0,0,0,.18)
        ),
        linear-gradient(135deg, #28699e, #123557);

    box-shadow:
        inset 0 2px 2px rgba(255,255,255,.35),
        inset 0 -7px 12px rgba(0,0,0,.25),
        0 10px 20px rgba(0,0,0,.45);

    color: white;
    cursor: pointer;

    display: flex;
    align-items: center;

    padding: 0 25px;

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}

.game-button:active {
    transform: scale(.96);

    box-shadow:
        inset 0 5px 12px rgba(0,0,0,.35),
        0 4px 8px rgba(0,0,0,.4);
}

.icon {
    width: 55px;
    flex-shrink: 0;

    font-size: 38px;
    text-align: center;

    filter:
        drop-shadow(0 4px 4px rgba(0,0,0,.65));
}

.button-text {
    text-align: left;
    margin-left: 15px;
}

.button-title {
    font-size: clamp(19px, 5vw, 25px);
    font-weight: 900;
    letter-spacing: 1px;
    text-shadow: 0 2px 4px #000;
}

.button-subtitle {
    margin-top: 3px;
    font-size: 12px;
    color: #c9e5fa;
}

/* GROUND */

.ground {
    position: absolute;

    left: -10%;
    bottom: 0;

    width: 120%;
    height: clamp(75px, 14vh, 115px);

    background:
        linear-gradient(
            180deg,
            #182e26,
            #091610
        );

    border-top:
        2px solid rgba(130,190,130,.25);

    box-shadow:
        0 -12px 30px rgba(0,0,0,.25);
}

/* =========================================================
   GIRAFFE
   ORIGINAL ARTWORK
========================================================= */

.giraffe-wrapper {
    position: absolute;

    z-index: 10;

    bottom: clamp(35px, 6vh, 45px);
    left: -230px;

    width: 210px;
    height: 250px;

    animation:
        giraffeWalk 15s linear infinite;
}

@keyframes giraffeWalk {
    0% {
        left: -230px;
    }

    100% {
        left: calc(100% + 30px);
    }
}

.giraffe {
    position: relative;

    width: 210px;
    height: 250px;

    animation:
        bodyBounce .42s ease-in-out infinite alternate;
}

@keyframes bodyBounce {
    from {
        transform: translateY(1px);
    }

    to {
        transform: translateY(-4px);
    }
}

/* Body */

.body {
    position: absolute;

    left: 35px;
    top: 105px;

    width: 125px;
    height: 75px;

    border-radius: 52% 48% 45% 48%;

    background:
        radial-gradient(
            circle at 35% 28%,
            #f5d66f 0 10%,
            #d9a93e 11% 100%
        );

    border: 3px solid #8b6424;

    box-shadow:
        inset -12px -12px 15px rgba(90,55,10,.28),
        8px 12px 15px rgba(0,0,0,.35);
}

/* Patches */

.patch {
    position: absolute;
    background: #9b6928;
    border: 1px solid rgba(80,45,10,.3);
}

.p1 {
    width: 27px;
    height: 24px;
    border-radius: 45%;
    left: 65px;
    top: 116px;
}

.p2 {
    width: 19px;
    height: 27px;
    border-radius: 50%;
    left: 111px;
    top: 142px;
}

.p3 {
    width: 24px;
    height: 18px;
    border-radius: 50%;
    left: 42px;
    top: 153px;
}

.p4 {
    width: 16px;
    height: 18px;
    border-radius: 45%;
    left: 87px;
    top: 112px;
}

/* Neck */

.neck {
    position: absolute;

    left: 125px;
    top: 32px;

    width: 42px;
    height: 115px;

    border-radius: 22px;

    background:
        linear-gradient(
            90deg,
            #c89432,
            #efd16b 48%,
            #b77d26
        );

    border: 3px solid #815c20;

    transform: rotate(-7deg);

    transform-origin: bottom center;

    box-shadow:
        inset -7px 0 8px rgba(80,45,5,.22);
}

.neck::before,
.neck::after {
    content: "";
    position: absolute;
    background: #996528;
    border-radius: 45%;
}

.neck::before {
    width: 18px;
    height: 20px;
    top: 18px;
    left: 5px;
}

.neck::after {
    width: 14px;
    height: 17px;
    top: 55px;
    right: 4px;
}

/* Head */

.head {
    position: absolute;

    left: 135px;
    top: 5px;

    width: 67px;
    height: 55px;

    border-radius: 48% 55% 42% 48%;

    background:
        linear-gradient(
            135deg,
            #f0ce67,
            #c58b2e
        );

    border: 3px solid #80591e;

    transform: rotate(-8deg);

    box-shadow:
        inset -8px -8px 12px rgba(80,45,5,.2),
        5px 7px 10px rgba(0,0,0,.35);
}

.muzzle {
    position: absolute;

    right: -14px;
    top: 27px;

    width: 28px;
    height: 20px;

    border-radius: 50%;

    background: #dcae4d;
    border: 2px solid #875e20;
}

.muzzle::after {
    content: "";

    position: absolute;
    right: 5px;
    top: 6px;

    width: 5px;
    height: 3px;

    border-radius: 50%;

    background: #392613;

    box-shadow: 10px 0 #392613;
}

.eye {
    position: absolute;

    right: 18px;
    top: 18px;

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #111;

    box-shadow:
        0 0 0 3px rgba(255,255,255,.35);

    transition: transform .15s;
}

/* Ears */

.ear {
    position: absolute;

    width: 27px;
    height: 18px;

    background: #c08b2e;

    border: 3px solid #80591e;

    border-radius: 80% 20% 70% 25%;
}

.ear.left {
    left: -12px;
    top: 7px;
    transform: rotate(25deg);
}

.ear.right {
    right: 8px;
    top: -8px;
    transform: rotate(-25deg);
}

/* Horns */

.horn {
    position: absolute;

    width: 8px;
    height: 19px;

    background: #795524;
    border-radius: 5px;
    top: -14px;
}

.horn.one {
    left: 18px;
}

.horn.two {
    left: 42px;
}

/* Mane */

.mane {
    position: absolute;

    left: 119px;
    top: 42px;

    width: 11px;
    height: 85px;

    background:
        repeating-linear-gradient(
            180deg,
            #633d18 0 7px,
            transparent 7px 12px
        );
}

/* Tail */

.tail {
    position: absolute;

    left: 28px;
    top: 112px;

    width: 55px;
    height: 65px;

    border-left: 7px solid #b17c29;

    border-radius: 50%;

    transform: rotate(20deg);

    transform-origin: top;

    animation: giraffeTail .8s ease-in-out infinite alternate;
}

@keyframes giraffeTail {
    from { transform: rotate(16deg); }
    to   { transform: rotate(29deg); }
}

.tail-tip {
    position: absolute;

    left: -11px;
    bottom: -4px;

    width: 20px;
    height: 24px;

    border-radius: 50% 50% 45% 45%;

    background: #54341a;
}

/* Legs */

.leg {
    position: absolute;

    top: 164px;

    width: 22px;
    height: 82px;

    border-radius: 12px 12px 8px 8px;

    background:
        linear-gradient(
            90deg,
            #b77f28,
            #e4bd57,
            #a86f20
        );

    border: 3px solid #7d581e;

    transform-origin: top center;
}

.leg.back1 {
    left: 52px;
    animation: legBack1 .42s ease-in-out infinite alternate;
}

.leg.back2 {
    left: 83px;
    animation: legBack2 .42s ease-in-out infinite alternate;
}

.leg.front1 {
    left: 119px;
    animation: legFront1 .42s ease-in-out infinite alternate;
}

.leg.front2 {
    left: 145px;
    animation: legFront2 .42s ease-in-out infinite alternate;
}

@keyframes legBack1 {
    from { transform: rotate(14deg); }
    to   { transform: rotate(-14deg); }
}

@keyframes legBack2 {
    from { transform: rotate(-14deg); }
    to   { transform: rotate(14deg); }
}

@keyframes legFront1 {
    from { transform: rotate(-14deg); }
    to   { transform: rotate(14deg); }
}

@keyframes legFront2 {
    from { transform: rotate(14deg); }
    to   { transform: rotate(-14deg); }
}

.leg::after {
    content: "";

    position: absolute;

    bottom: -3px;
    left: -3px;

    width: 22px;
    height: 12px;

    border-radius: 4px;

    background: #54351a;
}

/* =========================================================
   BULLDOG
========================================================= */

.bulldog-wrapper {
    position: absolute;

    z-index: 11;

    bottom: clamp(35px, 6vh, 45px);

    left: -210px;

    width: 205px;
    height: 125px;

    animation: bulldogWalk 18s linear infinite;

    pointer-events: none;
}

@keyframes bulldogWalk {
    0% {
        left: -220px;
    }

    100% {
        left: calc(100% + 20px);
    }
}

.bulldog {
    position: relative;

    width: 205px;
    height: 125px;

    animation: dogBounce .28s ease-in-out infinite alternate;
}

@keyframes dogBounce {
    from { transform: translateY(1px); }
    to   { transform: translateY(-3px); }
}

/* Dog shadow */

.dog-shadow {
    position: absolute;

    left: 30px;
    top: 106px;

    width: 150px;
    height: 14px;

    border-radius: 50%;

    background: rgba(0,0,0,.35);

    filter: blur(4px);
}

/* Body */

.dog-body {
    position: absolute;

    left: 45px;
    top: 48px;

    width: 112px;
    height: 58px;

    border-radius: 48% 45% 42% 48%;

    background:
        radial-gradient(
            circle at 35% 25%,
            #f7f2e8 0 9%,
            #d8d0c4 10% 42%,
            #aaa095 70%,
            #756b65 100%
        );

    border: 3px solid #4b4541;

    box-shadow:
        inset -12px -10px 15px rgba(45,35,30,.25),
        7px 10px 13px rgba(0,0,0,.38);
}

/* Chest */

.dog-chest {
    position: absolute;

    left: 42px;
    top: 57px;

    width: 45px;
    height: 45px;

    border-radius: 50% 50% 45% 45%;

    background:
        linear-gradient(
            145deg,
            #f4eee4,
            #c8bfb5
        );

    opacity: .95;
}

/* Bulldog head */

.dog-head {
    position: absolute;

    left: 4px;
    top: 18px;

    width: 78px;
    height: 70px;

    border-radius: 42% 45% 48% 45%;

    background:
        radial-gradient(
            circle at 35% 25%,
            #f9f4e9 0 9%,
            #d9d1c6 10% 45%,
            #a59a91 70%,
            #6c625d 100%
        );

    border: 3px solid #49423e;

    box-shadow:
        inset -8px -10px 14px rgba(45,35,30,.25),
        5px 9px 12px rgba(0,0,0,.42);

    z-index: 5;
}

/* Wrinkles */

.dog-head::before {
    content: "";

    position: absolute;

    left: 10px;
    top: 17px;

    width: 42px;
    height: 10px;

    border-top: 3px solid rgba(80,70,65,.35);
    border-bottom: 3px solid rgba(80,70,65,.2);

    border-radius: 50%;
}

/* Bulldog ears */

.dog-ear {
    position: absolute;

    width: 30px;
    height: 27px;

    background:
        linear-gradient(
            135deg,
            #81766f,
            #514943
        );

    border: 3px solid #403a36;

    z-index: -1;
}

.dog-ear.left {
    left: -15px;
    top: 5px;

    border-radius: 75% 25% 65% 30%;
    transform: rotate(-28deg);
}

.dog-ear.right {
    right: -12px;
    top: 5px;

    border-radius: 25% 75% 30% 65%;
    transform: rotate(25deg);
}

/* White blaze */

.dog-blaze {
    position: absolute;

    left: 31px;
    top: -2px;

    width: 20px;
    height: 45px;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.8),
            #eee7dc,
            rgba(255,255,255,.75)
        );

    border-radius: 50%;

    transform: rotate(3deg);

    opacity: .9;
}

/* Eyes */

.dog-eye {
    position: absolute;

    top: 29px;

    width: 12px;
    height: 12px;

    border-radius: 50%;

    background: #171412;

    border: 2px solid #302a26;

    box-shadow:
        0 0 0 2px rgba(255,255,255,.22),
        inset 2px 2px 2px rgba(255,255,255,.3);
}

.dog-eye.left {
    left: 16px;
}

.dog-eye.right {
    left: 49px;
}

/* Eye brows */

.brow {
    position: absolute;

    width: 24px;
    height: 7px;

    border-top: 4px solid #605750;

    border-radius: 50%;
}

.brow.left {
    left: 11px;
    top: 20px;
    transform: rotate(8deg);
}

.brow.right {
    left: 45px;
    top: 20px;
    transform: rotate(-8deg);
}

/* Muzzle */

.dog-muzzle {
    position: absolute;

    left: 14px;
    top: 43px;

    width: 57px;
    height: 31px;

    border-radius: 45% 45% 48% 48%;

    background:
        radial-gradient(
            circle at 50% 25%,
            #eee8df,
            #bcb2a8
        );

    border: 2px solid #625952;
}

/* Nose */

.dog-nose {
    position: absolute;

    left: 29px;
    top: 43px;

    width: 27px;
    height: 18px;

    border-radius: 48% 48% 42% 42%;

    background:
        radial-gradient(
            circle at 35% 25%,
            #665e59,
            #171514 55%,
            #050505 100%
        );

    z-index: 3;

    box-shadow:
        2px 3px 4px rgba(0,0,0,.4);
}

/* Mouth */

.dog-mouth {
    position: absolute;

    left: 31px;
    top: 57px;

    width: 24px;
    height: 14px;

    border-bottom: 3px solid #332a27;

    border-radius: 0 0 50% 50%;

    z-index: 4;
}

/* Tongue */

.dog-tongue {
    position: absolute;

    left: 38px;
    top: 67px;

    width: 17px;
    height: 25px;

    border-radius: 7px 7px 50% 50%;

    background:
        linear-gradient(
            90deg,
            #a74752,
            #e07880,
            #a53e49
        );

    border: 2px solid #72313a;

    transform-origin: top;

    animation: tonguePant .55s ease-in-out infinite alternate;

    z-index: 2;
}

@keyframes tonguePant {
    from {
        transform: translateY(0) scaleY(.85);
    }

    to {
        transform: translateY(5px) scaleY(1);
    }
}

/* Collar */

.collar {
    position: absolute;

    left: 61px;
    top: 75px;

    width: 61px;
    height: 13px;

    border-radius: 50%;

    background:
        linear-gradient(
            180deg,
            #b92d35,
            #70171d
        );

    border: 2px solid #4b1115;

    transform: rotate(8deg);

    z-index: 6;

    box-shadow:
        0 3px 5px rgba(0,0,0,.3);
}

/* Tag */

.tag {
    position: absolute;

    left: 86px;
    top: 82px;

    width: 12px;
    height: 15px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff5a8,
            #d3a72f 65%,
            #805d14
        );

    border: 1px solid #70500f;

    z-index: 7;

    animation: tagSwing .5s ease-in-out infinite alternate;
}

@keyframes tagSwing {
    from { transform: rotate(-10deg); }
    to   { transform: rotate(12deg); }
}

/* Dog legs */

.dog-leg {
    position: absolute;

    top: 87px;

    width: 20px;
    height: 38px;

    border-radius: 10px 10px 7px 7px;

    background:
        linear-gradient(
            90deg,
            #81766d,
            #d5cdc3,
            #71665f
        );

    border: 3px solid #514a45;

    transform-origin: top center;
}

.dog-leg::after {
    content: "";

    position: absolute;

    left: -3px;
    bottom: -4px;

    width: 20px;
    height: 10px;

    border-radius: 50%;

    background: #403934;
}

.dog-leg.one {
    left: 60px;
    animation: dogLeg1 .28s ease-in-out infinite alternate;
}

.dog-leg.two {
    left: 86px;
    animation: dogLeg2 .28s ease-in-out infinite alternate;
}

.dog-leg.three {
    left: 119px;
    animation: dogLeg2 .28s ease-in-out infinite alternate;
}

.dog-leg.four {
    left: 143px;
    animation: dogLeg1 .28s ease-in-out infinite alternate;
}

@keyframes dogLeg1 {
    from { transform: rotate(12deg); }
    to   { transform: rotate(-12deg); }
}

@keyframes dogLeg2 {
    from { transform: rotate(-12deg); }
    to   { transform: rotate(12deg); }
}

/* Tail */

.dog-tail {
    position: absolute;

    left: 151px;
    top: 43px;

    width: 40px;
    height: 35px;

    border-top: 10px solid #777069;

    border-right: 7px solid #777069;

    border-radius: 0 70% 20% 0;

    transform: rotate(-12deg);

    transform-origin: left center;

    animation: dogTailWag .22s ease-in-out infinite alternate;
}

@keyframes dogTailWag {
    from { transform: rotate(-25deg); }
    to   { transform: rotate(15deg); }
}

/* =========================================================
   DOG/GIRAFFE REACTION STATES
========================================================= */

/* Giraffe looks toward dog */

.giraffe-wrapper.look {
    animation-play-state: paused;
}

.giraffe-wrapper.look .head {
    animation: giraffeLook .45s ease forwards;
}

@keyframes giraffeLook {
    to {
        transform: rotate(13deg) translateX(-7px);
    }
}

/* Giraffe runs */

.giraffe-wrapper.escape {
    animation:
        giraffeEscape 2.7s cubic-bezier(.2,.8,.2,1) forwards;
}

.giraffe-wrapper.escape .giraffe {
    animation:
        bodyBounce .22s ease-in-out infinite alternate;
}

.giraffe-wrapper.escape .leg.back1,
.giraffe-wrapper.escape .leg.back2,
.giraffe-wrapper.escape .leg.front1,
.giraffe-wrapper.escape .leg.front2 {
    animation-duration: .22s;
}

/* Dog chase */

.bulldog-wrapper.chase {
    animation:
        bulldogChase 2.25s cubic-bezier(.25,.7,.15,1) forwards;
}

.bulldog-wrapper.chase .bulldog {
    animation:
        dogBounce .16s ease-in-out infinite alternate;
}

.bulldog-wrapper.chase .dog-leg {
    animation-duration: .16s;
}

@keyframes giraffeEscape {
    0% {
        transform: translateX(0);
    }

    100% {
        transform: translateX(105vw);
    }
}

@keyframes bulldogChase {
    0% {
        transform: translateX(0);
    }

    65% {
        transform: translateX(55vw);
    }

    100% {
        transform: translateX(30vw);
    }
}

/* Bark bubble */

.bark {
    position: fixed;

    z-index: 100;

    left: 0;
    top: 0;

    padding: 8px 12px;

    border-radius: 15px;

    background: rgba(255,255,255,.95);
    color: #1a1a1a;

    font-size: 14px;
    font-weight: 900;

    box-shadow:
        0 5px 15px rgba(0,0,0,.4);

    opacity: 0;
    pointer-events: none;

    transform: scale(.5);

    transition:
        opacity .15s,
        transform .15s;
}

.bark.show {
    opacity: 1;
    transform: scale(1);
}

.bark::after {
    content: "";

    position: absolute;

    bottom: -7px;
    left: 16px;

    border-width: 7px 7px 0 0;
    border-style: solid;
    border-color: white transparent transparent transparent;
}

/* FOOTER */

.footer {
    position: absolute;

    z-index: 30;

    bottom: 10px;
    left: 0;

    width: 100%;

    text-align: center;

    color: rgba(255,255,255,.35);

    font-size: 10px;

    letter-spacing: 2px;
}

/* SMALL HEIGHT SCREENS */

@media (max-height: 650px) {

    .title-area {
        padding-top: 8px;
    }

    .subtitle {

    .button-title {

    }

    .giraffe-wrapper,
    .bulldog-wrapper {
        transform: scale(.72);
        transform-origin: bottom left;
    }
}

/* VERY SHORT SCREEN */

@media (max-height: 500px) {

    .title {
        font-size: 30px;
    }

        width: min(70vw, 380px);
        top: 52%;

        height: 48px;
    }

    .button-subtitle {
        display: none;
    }

    .footer {
        display: none;
    }
}
</style>
</head>

<script>

/* =========================================================
   CHARACTER INTERACTION
========================================================= */

const giraffe = document.getElementById("giraffe");
const bulldog = document.getElementById("bulldog");
const bark = document.getElementById("bark");

let interactionRunning = false;

function showBark() {

    const dogRect = bulldog.getBoundingClientRect();

    bark.style.left =
        Math.max(10, dogRect.left + 35) + "px";

    bark.style.top =
        Math.max(20, dogRect.top - 35) + "px";

    bark.classList.add("show");

    setTimeout(() => {
        bark.classList.remove("show");
    }, 650);
}

function barkSound() {

    /*
       Browser-safe bark using Web Audio.
       No sound file required.
    */

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) return;

        const ctx = new AudioContext();

        const now = ctx.currentTime;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sawtooth";

        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(
            75,
            now + .16
        );

        gain.gain.setValueAtTime(.0001, now);

        gain.gain.exponentialRampToValueAtTime(
            .22,
            now + .015
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            now + .18
        );

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + .2);

    } catch (e) {
        /* Sound is optional. */
    }
}

function dogBarks() {

    showBark();
    barkSound();

    setTimeout(() => {
        showBark();
        barkSound();
    }, 430);
}


function interaction() {

    if (interactionRunning) return;

    interactionRunning = true;

    /*
       Pause the normal walking animation.
       The characters remain where they naturally
       are before the encounter.
    */

    giraffe.style.animationPlayState = "paused";
    bulldog.style.animationPlayState = "paused";

    dogBarks();

    setTimeout(() => {

        /*
           Giraffe notices the dog.
        */

        giraffe.classList.add("look");

    }, 500);


    setTimeout(() => {

        /*
           Second bark.
        */

        showBark();
        barkSound();

    }, 1100);


    setTimeout(() => {

        /*
           Giraffe panics and runs.
        */

        giraffe.classList.remove("look");
        giraffe.classList.add("escape");

    }, 1450);


    setTimeout(() => {

        /*
           Bulldog gives chase.
        */

        bulldog.classList.add("chase");

    }, 1600);


    setTimeout(() => {

        /*
           End chase and reset.
        */

        giraffe.classList.remove("escape");
        bulldog.classList.remove("chase");

        giraffe.style.animationPlayState = "";
        bulldog.style.animationPlayState = "";

        /*
           Re-trigger the CSS walking animations so
           the next pass starts naturally.
        */

        giraffe.style.animation = "none";
        bulldog.style.animation = "none";

        void giraffe.offsetWidth;
        void bulldog.offsetWidth;

        giraffe.style.animation =
            "giraffeWalk 15s linear infinite";

        bulldog.style.animation =
            "bulldogWalk 18s linear infinite";

        interactionRunning = false;

    }, 4700);
}


/*
   Characters normally cross the screen independently.

   Every so often the dog gets curious.
*/

function scheduleEncounter() {

    const delay =
        6500 +
        Math.random() * 9000;

    setTimeout(() => {

        if (!interactionRunning) {
            interaction();
        }

        scheduleEncounter();

    }, delay);
}

scheduleEncounter();


/*
   Occasional individual bark while walking.
*/

setInterval(() => {

    if (
        !interactionRunning &&
        Math.random() < .22
    ) {
        showBark();
        barkSound();
    }

}, 11500);

</script>
