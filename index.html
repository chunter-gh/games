<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Game Room</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body {
    background:
        radial-gradient(circle at 50% 15%, #244b72 0%, #10243c 45%, #06101d 100%);
    color: white;
}

/* -------------------------
   MAIN SCREEN
------------------------- */

.game-room {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
}

.glow {
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.12), transparent 70%);
    left: 50%;
    top: -130px;
    transform: translateX(-50%);
}

/* -------------------------
   TITLE
------------------------- */

.title-area {
    position: relative;
    z-index: 5;
    text-align: center;
    padding-top: 28px;
}

.title {
    margin: 0;
    font-size: clamp(38px, 11vw, 62px);
    font-weight: 900;
    letter-spacing: 4px;
    color: #fff;

    text-shadow:
        0 3px 0 #14283e,
        0 6px 12px rgba(0,0,0,.8),
        0 0 20px rgba(120,200,255,.45);
}

.subtitle {
    margin-top: 5px;
    font-size: 13px;
    letter-spacing: 5px;
    color: #b9d7ee;
}

/* -------------------------
   GAME BUTTONS
------------------------- */

.menu {
    position: absolute;
    z-index: 20;

    width: min(88%, 420px);

    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%);
}

.game-button {
    position: relative;

    width: 100%;
    height: 72px;

    margin: 11px 0;

    border: 1px solid rgba(255,255,255,.35);
    border-radius: 22px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.28),
            rgba(255,255,255,.05) 45%,
            rgba(0,0,0,.18)
        ),
        linear-gradient(135deg, #28699e, #123557);

    box-shadow:
        inset 0 2px 2px rgba(255,255,255,.35),
        inset 0 -7px 12px rgba(0,0,0,.25),
        0 10px 20px rgba(0,0,0,.45);

    color: white;

    cursor: pointer;

    display: flex;
    align-items: center;

    padding: 0 25px;

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}

.game-button:active {
    transform: scale(.96);

    box-shadow:
        inset 0 5px 12px rgba(0,0,0,.35),
        0 4px 8px rgba(0,0,0,.4);
}

.icon {
    width: 55px;
    font-size: 38px;
    text-align: center;

    filter:
        drop-shadow(0 4px 4px rgba(0,0,0,.65));
}

.button-text {
    text-align: left;
    margin-left: 15px;
}

.button-title {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 1px;

    text-shadow: 0 2px 4px #000;
}

.button-subtitle {
    margin-top: 3px;
    font-size: 12px;
    color: #c9e5fa;
}

/* -------------------------
   GROUND
------------------------- */

.ground {
    position: absolute;

    left: -10%;
    bottom: 0;

    width: 120%;
    height: 115px;

    background:
        linear-gradient(
            180deg,
            #182e26,
            #091610
        );

    border-top:
        2px solid rgba(130,190,130,.25);

    box-shadow:
        0 -12px 30px rgba(0,0,0,.25);
}

/* -------------------------
   GIRAFFE
------------------------- */

.giraffe-wrapper {
    position: absolute;

    z-index: 10;

    bottom: 45px;
    left: -230px;

    width: 210px;
    height: 250px;

    animation:
        giraffeWalk 15s linear infinite;
}

@keyframes giraffeWalk {
    0% {
        left: -230px;
    }

    100% {
        left: calc(100% + 30px);
    }
}

/* Giraffe occasionally turns away */

.giraffe-wrapper.turn-away {
    animation-name: giraffeWalk;
}

.giraffe-wrapper.turn-away .giraffe {
    animation:
        bodyBounce .42s ease-in-out infinite alternate,
        giraffeTurn 1.2s ease-in-out;
}

@keyframes giraffeTurn {
    0% {
        transform: scaleX(1) translateY(0);
    }

    45% {
        transform: scaleX(-1) translateY(-2px);
    }

    100% {
        transform: scaleX(-1) translateY(0);
    }
}

/* Whole body bounce */

.giraffe {
    position: relative;

    width: 210px;
    height: 250px;

    animation:
        bodyBounce .42s ease-in-out infinite alternate;
}

@keyframes bodyBounce {
    from {
        transform: translateY(1px);
    }

    to {
        transform: translateY(-4px);
    }
}

/* Body */

.body {
    position: absolute;

    left: 35px;
    top: 105px;

    width: 125px;
    height: 75px;

    border-radius: 52% 48% 45% 48%;

    background:
        radial-gradient(
            circle at 35% 28%,
            #f5d66f 0 10%,
            #d9a93e 11% 100%
        );

    border: 3px solid #8b6424;

    box-shadow:
        inset -12px -12px 15px rgba(90,55,10,.28),
        8px 12px 15px rgba(0,0,0,.35);
}

/* Giraffe patches */

.patch {
    position: absolute;

    background: #9b6928;

    border: 1px solid rgba(80,45,10,.3);
}

.p1 {
    width: 27px;
    height: 24px;
    border-radius: 45%;
    left: 65px;
    top: 116px;
}

.p2 {
    width: 19px;
    height: 27px;
    border-radius: 50%;
    left: 111px;
    top: 142px;
}

.p3 {
    width: 24px;
    height: 18px;
    border-radius: 50%;
    left: 42px;
    top: 153px;
}

.p4 {
    width: 16px;
    height: 18px;
    border-radius: 45%;
    left: 87px;
    top: 112px;
}

/* Neck */

.neck {
    position: absolute;

    left: 125px;
    top: 32px;

    width: 42px;
    height: 115px;

    border-radius: 22px;

    background:
        linear-gradient(
            90deg,
            #c89432,
            #efd16b 48%,
            #b77d26
        );

    border: 3px solid #815c20;

    transform:
        rotate(-7deg);

    transform-origin: bottom center;

    box-shadow:
        inset -7px 0 8px rgba(80,45,5,.22);
}

/* Neck patches */

.neck::before,
.neck::after {
    content: "";

    position: absolute;

    background: #996528;

    border-radius: 45%;
}

.neck::before {
    width: 18px;
    height: 20px;
    top: 18px;
    left: 5px;
}

.neck::after {
    width: 14px;
    height: 17px;
    top: 55px;
    right: 4px;
}

/* Head */

.head {
    position: absolute;

    left: 135px;
    top: 5px;

    width: 67px;
    height: 55px;

    border-radius: 48% 55% 42% 48%;

    background:
        linear-gradient(
            135deg,
            #f0ce67,
            #c58b2e
        );

    border: 3px solid #80591e;

    transform:
        rotate(-8deg);

    box-shadow:
        inset -8px -8px 12px rgba(80,45,5,.2),
        5px 7px 10px rgba(0,0,0,.35);
}

/* Muzzle */

.muzzle {
    position: absolute;

    right: -14px;
    top: 27px;

    width: 28px;
    height: 20px;

    border-radius: 50%;

    background: #dcae4d;

    border: 2px solid #875e20;
}

.muzzle::after {
    content: "";

    position: absolute;

    right: 5px;
    top: 6px;

    width: 5px;
    height: 3px;

    border-radius: 50%;

    background: #392613;

    box-shadow: 10px 0 #392613;
}

/* Eye */

.eye {
    position: absolute;

    right: 18px;
    top: 18px;

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #111;

    box-shadow:
        0 0 0 3px rgba(255,255,255,.35);
}

/* Ears */

.ear {
    position: absolute;

    width: 27px;
    height: 18px;

    background: #c08b2e;

    border: 3px solid #80591e;

    border-radius: 80% 20% 70% 25%;
}

.ear.left {
    left: -12px;
    top: 7px;
    transform: rotate(25deg);
}

.ear.right {
    right: 8px;
    top: -8px;
    transform: rotate(-25deg);
}

/* Horns */

.horn {
    position: absolute;

    width: 8px;
    height: 19px;

    background: #795524;

    border-radius: 5px;

    top: -14px;
}

.horn.one {
    left: 18px;
}

.horn.two {
    left: 42px;
}

/* Mane */

.mane {
    position: absolute;

    left: 119px;
    top: 42px;

    width: 11px;
    height: 85px;

    background:
        repeating-linear-gradient(
            180deg,
            #633d18 0 7px,
            transparent 7px 12px
        );
}

/* Tail */

.tail {
    position: absolute;

    left: 28px;
    top: 112px;

    width: 55px;
    height: 65px;

    border-left: 7px solid #b17c29;

    border-radius: 50%;

    transform: rotate(20deg);

    transform-origin: top;
}

.tail-tip {
    position: absolute;

    left: -11px;
    bottom: -4px;

    width: 20px;
    height: 24px;

    border-radius: 50% 50% 45% 45%;

    background: #54341a;
}

/* Legs */

.leg {
    position: absolute;

    top: 164px;

    width: 22px;
    height: 82px;

    border-radius: 12px 12px 8px 8px;

    background:
        linear-gradient(
            90deg,
            #b77f28,
            #e4bd57,
            #a86f20
        );

    border: 3px solid #7d581e;

    transform-origin: top center;
}

.leg.back1 {
    left: 52px;
    animation: legBack1 .42s ease-in-out infinite alternate;
}

.leg.back2 {
    left: 83px;
    animation: legBack2 .42s ease-in-out infinite alternate;
}

.leg.front1 {
    left: 119px;
    animation: legFront1 .42s ease-in-out infinite alternate;
}

.leg.front2 {
    left: 145px;
    animation: legFront2 .42s ease-in-out infinite alternate;
}

@keyframes legBack1 {
    from { transform: rotate(14deg); }
    to   { transform: rotate(-14deg); }
}

@keyframes legBack2 {
    from { transform: rotate(-14deg); }
    to   { transform: rotate(14deg); }
}

@keyframes legFront1 {
    from { transform: rotate(-14deg); }
    to   { transform: rotate(14deg); }
}

@keyframes legFront2 {
    from { transform: rotate(14deg); }
    to   { transform: rotate(-14deg); }
}

.leg::after {
    content: "";

    position: absolute;

    bottom: -3px;
    left: -3px;

    width: 22px;
    height: 12px;

    border-radius: 4px;

    background: #54351a;
}

/* =====================================================
   BULLDOG
===================================================== */

.bulldog-wrapper {
    position: absolute;

    z-index: 11;

    bottom: 45px;
    right: -230px;

    width: 210px;
    height: 155px;

    animation:
        bulldogWalk 19s linear infinite;
}

@keyframes bulldogWalk {
    0% {
        right: -230px;
    }

    100% {
        right: calc(100% + 30px);
    }
}

.bulldog {
    position: relative;

    width: 210px;
    height: 155px;

    animation:
        dogBounce .28s ease-in-out infinite alternate;
}

@keyframes dogBounce {
    from {
        transform: translateY(1px);
    }

    to {
        transform: translateY(-3px);
    }
}

/* Dog body */

.dog-body {
    position: absolute;

    left: 45px;
    top: 63px;

    width: 120px;
    height: 65px;

    border-radius: 45% 48% 38% 45%;

    background:
        linear-gradient(
            135deg,
            #f4f1e9,
            #c7c1b7
        );

    border: 3px solid #746d65;

    box-shadow:
        inset -10px -9px 14px rgba(50,45,40,.2),
        8px 10px 15px rgba(0,0,0,.4);
}

/* Bulldog chest */

.dog-chest {
    position: absolute;

    left: 47px;
    top: 71px;

    width: 48px;
    height: 53px;

    border-radius: 50%;

    background:
        linear-gradient(
            90deg,
            #e8e3da,
            #fffdf7,
            #c9c2b8
        );
}

/* Bulldog head */

.dog-head {
    position: absolute;

    left: 7px;
    top: 27px;

    width: 78px;
    height: 72px;

    border-radius: 45% 48% 42% 45%;

    background:
        radial-gradient(
            circle at 35% 25%,
            #fffdf8 0 15%,
            #d7d1c8 50%,
            #a9a29a 100%
        );

    border: 3px solid #69635c;

    box-shadow:
        inset -8px -10px 14px rgba(50,45,40,.22),
        5px 9px 12px rgba(0,0,0,.4);
}

/* Bulldog forehead */

.dog-forehead {
    position: absolute;

    left: 32px;
    top: 29px;

    width: 28px;
    height: 35px;

    border-radius: 45%;

    background: #b7afa5;

    transform: rotate(-8deg);

    opacity: .8;
}

/* Bulldog ears */

.dog-ear {
    position: absolute;

    width: 30px;
    height: 38px;

    background: #817a72;

    border: 3px solid #5e5852;

    z-index: -1;
}

.dog-ear.left {
    left: -10px;
    top: 22px;

    border-radius: 55% 25% 65% 35%;

    transform: rotate(25deg);
}

.dog-ear.right {
    right: -8px;
    top: 24px;

    border-radius: 25% 55% 35% 65%;

    transform: rotate(-25deg);
}

/* Bulldog muzzle */

.dog-muzzle {
    position: absolute;

    left: 22px;
    top: 56px;

    width: 54px;
    height: 31px;

    border-radius: 48%;

    background: #eee9e1;

    border: 2px solid #777069;
}

/* Nose */

.dog-nose {
    position: absolute;

    left: 42px;
    top: 55px;

    width: 22px;
    height: 15px;

    border-radius: 48% 48% 55% 55%;

    background: #191817;

    box-shadow:
        inset 0 3px 3px rgba(255,255,255,.15);
}

/* Eyes */

.dog-eye {
    position: absolute;

    top: 48px;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: #171514;

    box-shadow:
        0 0 0 3px rgba(255,255,255,.25);
}

.dog-eye.left {
    left: 24px;
}

.dog-eye.right {
    left: 60px;
}

/* Bulldog jowls */

.jowl {
    position: absolute;

    width: 30px;
    height: 24px;

    background: #ddd7cf;

    border-radius: 50%;

    top: 70px;
}

.jowl.left {
    left: 17px;
}

.jowl.right {
    left: 51px;
}

/* Tongue */

.tongue {
    position: absolute;

    left: 42px;
    top: 82px;

    width: 19px;
    height: 28px;

    border-radius: 5px 5px 12px 12px;

    background: #d98591;

    border: 2px solid #9b535e;

    transform-origin: top;

    animation:
        tongueMove 2.8s ease-in-out infinite;
}

@keyframes tongueMove {
    0%, 55% {
        transform: scaleY(.15);
        opacity: .15;
    }

    65%, 85% {
        transform: scaleY(1);
        opacity: 1;
    }

    100% {
        transform: scaleY(.15);
        opacity: .15;
    }
}

/* Bulldog legs */

.dog-leg {
    position: absolute;

    top: 108px;

    width: 24px;
    height: 43px;

    border-radius: 12px 12px 7px 7px;

    background:
        linear-gradient(
            90deg,
            #a8a19a,
            #e3ded6,
            #918a83
        );

    border: 3px solid #69625c;

    transform-origin: top center;
}

.dog-leg.one {
    left: 57px;
    animation: dogLeg1 .28s ease-in-out infinite alternate;
}

.dog-leg.two {
    left: 86px;
    animation: dogLeg2 .28s ease-in-out infinite alternate;
}

.dog-leg.three {
    left: 119px;
    animation: dogLeg2 .28s ease-in-out infinite alternate;
}

.dog-leg.four {
    left: 143px;
    animation: dogLeg1 .28s ease-in-out infinite alternate;
}

@keyframes dogLeg1 {
    from { transform: rotate(9deg); }
    to   { transform: rotate(-9deg); }
}

@keyframes dogLeg2 {
    from { transform: rotate(-9deg); }
    to   { transform: rotate(9deg); }
}

/* Paws */

.dog-leg::after {
    content: "";

    position: absolute;

    left: -3px;
    bottom: -3px;

    width: 24px;
    height: 12px;

    border-radius: 50%;

    background: #716a63;
}

/* Bulldog tail */

.dog-tail {
    position: absolute;

    left: 151px;
    top: 63px;

    width: 43px;
    height: 35px;

    border-top: 9px solid #aaa39b;

    border-right: 9px solid #aaa39b;

    border-radius: 50%;

    transform-origin: left center;

    animation:
        tailWag .32s ease-in-out infinite alternate;
}

@keyframes tailWag {
    from {
        transform: rotate(12deg);
    }

    to {
        transform: rotate(-18deg);
    }
}

/* -------------------------
   FOOTER
------------------------- */

.footer {
    position: absolute;

    z-index: 30;

    bottom: 10px;
    left: 0;

    width: 100%;

    text-align: center;

    color: rgba(255,255,255,.35);

    font-size: 10px;

    letter-spacing: 2px;
}
</style>
</head>

    </div>

    <!-- GAME MENU -->

        </button>


        <button
            class="game-button"

                <div class="dog-ear left"></div>

                <div class="dog-forehead"></div>

        TWO PLAYERS • ONE SCREEN • LET'S PLAY
    </div>

</div>


<script>

/*
    Bulldog occasionally approaches the giraffe.
    The giraffe reacts by turning away.
*/

const giraffe = document.getElementById("giraffe");

function giraffeReact() {

    giraffe.classList.add("turn-away");

    setTimeout(() => {
        giraffe.classList.remove("turn-away");
    }, 1300);
}

/*
    Random encounters keep the scene from becoming predictable.
*/

function scheduleEncounter() {

    const delay =
        9000 +
        Math.random() * 11000;

    setTimeout(() => {

        giraffeReact();

        scheduleEncounter();

    }, delay);
}

scheduleEncounter();

</script>
