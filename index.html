<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Room</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: white;

    background:
        radial-gradient(
            circle at 50% 0%,
            #263b72 0%,
            #101a39 42%,
            #060b19 100%
        );
}

.game-room {
    width: 100%;
    height: 100dvh;

    display: flex;
    flex-direction: column;
    align-items: center;

    position: relative;
    overflow: hidden;

    padding:
        clamp(10px, 3vh, 35px)
        clamp(10px, 4vw, 50px);
}

/* =========================================================
   HEADER
   ========================================================= */

.header {
    text-align: center;
    flex-shrink: 0;
}

.title {
    margin: 0;

    font-size:
        clamp(32px, 7vw, 72px);

    letter-spacing:
        clamp(4px, 1vw, 12px);

    font-weight: 900;

    text-shadow:
        0 4px 8px rgba(0,0,0,.7),
        0 0 25px rgba(255,255,255,.12);
}

.subtitle {
    margin-top: 4px;

    font-size:
        clamp(10px, 1.8vw, 17px);

    letter-spacing:
        clamp(2px, .5vw, 5px);

    opacity: .72;
}

/* =========================================================
   GAME BUTTON AREA
   ========================================================= */

.games {
    flex: 1;

    width: min(100%, 760px);

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    gap:
        clamp(8px, 2vh, 18px);

    min-height: 0;

    position: relative;
    z-index: 10;
}

.game-button {
    width: min(100%, 650px);

    height:
        clamp(62px, 11vh, 105px);

    min-height: 58px;

    border: 1px solid rgba(255,255,255,.25);
    border-radius:
        clamp(12px, 2vw, 20px);

    background:
        linear-gradient(
            145deg,
            #394e82,
            #18264d
        );

    color: white;

    display: flex;
    align-items: center;

    padding:
        0 clamp(14px, 3vw, 30px);

    cursor: pointer;

    box-shadow:
        0 8px 18px rgba(0,0,0,.45),
        inset 0 1px 2px rgba(255,255,255,.16),
        inset 0 -2px 4px rgba(0,0,0,.3);

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        background .18s ease;
}

.game-button:hover {
    transform:
        translateY(-3px)
        scale(1.015);

    background:
        linear-gradient(
            145deg,
            #4c649f,
            #223665
        );

    box-shadow:
        0 12px 24px rgba(0,0,0,.55),
        0 0 20px rgba(100,140,255,.12),
        inset 0 1px 2px rgba(255,255,255,.2);
}

.game-button:active {
    transform:
        translateY(1px)
        scale(.995);
}

/* =========================================================
   BUTTON ICONS
   ========================================================= */

.icon {
    width:
        clamp(52px, 9vw, 82px);

    height:
        clamp(52px, 9vw, 82px);

    flex-shrink: 0;

    margin-right:
        clamp(14px, 3vw, 28px);

    display: flex;
    justify-content: center;
    align-items: center;

    font-size:
        clamp(28px, 5vw, 52px);

    filter:
        drop-shadow(0 3px 3px rgba(0,0,0,.55));
}

.button-text {
    text-align: left;
    flex: 1;
}

.button-title {
    font-size:
        clamp(18px, 3vw, 30px);

    font-weight: 900;

    letter-spacing:
        clamp(1px, .3vw, 3px);
}

.button-description {
    margin-top: 4px;

    font-size:
        clamp(9px, 1.5vw, 14px);

    opacity: .62;

    letter-spacing:
        clamp(.5px, .15vw, 1.5px);
}

/* =========================================================
   FOOTER
   ========================================================= */

.footer {
    flex-shrink: 0;

    text-align: center;

    font-size:
        clamp(8px, 1.3vw, 12px);

    letter-spacing:
        clamp(1px, .3vw, 3px);

    opacity: .38;

    padding-top:
        clamp(5px, 1vh, 12px);
}

/* =========================================================
   GIRAFFE
   ========================================================= */

.giraffe {
    position: absolute;

    bottom:
        clamp(4px, 2vh, 20px);

    left: -180px;

    width: 135px;
    height: 150px;

    z-index: 3;

    animation:
        giraffeWalk
        24s
        linear
        infinite;
}

.giraffe-body {
    position: absolute;

    left: 35px;
    bottom: 22px;

    width: 70px;
    height: 52px;

    border-radius: 45%;

    background:
        linear-gradient(
            135deg,
            #ffd75a,
            #d99319
        );

    border: 2px solid #8b5a0b;

    box-shadow:
        inset 0 5px 7px rgba(255,255,255,.3),
        0 4px 5px rgba(0,0,0,.35);
}

.giraffe-neck {
    position: absolute;

    left: 78px;
    bottom: 58px;

    width: 27px;
    height: 80px;

    border-radius: 16px 16px 8px 8px;

    background:
        linear-gradient(
            90deg,
            #d8931a,
            #ffd65b,
            #c47a0d
        );

    border: 2px solid #8b5a0b;

    transform: rotate(-7deg);
}

.giraffe-head {
    position: absolute;

    left: 75px;
    bottom: 128px;

    width: 62px;
    height: 35px;

    border-radius: 50% 48% 42% 45%;

    background:
        linear-gradient(
            135deg,
            #ffda63,
            #d98e14
        );

    border: 2px solid #8b5a0b;

    transform:
        rotate(-4deg);
}

.giraffe-ear {
    position: absolute;

    width: 15px;
    height: 10px;

    background: #e5a326;

    border: 2px solid #8b5a0b;

    border-radius: 70% 20%;

    top: -7px;
}

.giraffe-ear.one {
    left: 9px;
}

.giraffe-ear.two {
    right: 8px;
}

.giraffe-eye {
    position: absolute;

    right: 14px;
    top: 9px;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #111;
}

.giraffe-leg {
    position: absolute;

    width: 10px;
    height: 45px;

    bottom: -15px;

    background:
        linear-gradient(
            90deg,
            #d38a13,
            #f6c648
        );

    border: 2px solid #8b5a0b;

    transform-origin: top;
}

.giraffe-leg.one {
    left: 47px;
    animation: legA .55s ease-in-out infinite alternate;
}

.giraffe-leg.two {
    left: 67px;
    animation: legB .55s ease-in-out infinite alternate;
}

.giraffe-leg.three {
    left: 88px;
    animation: legB .55s ease-in-out infinite alternate;
}

.giraffe-leg.four {
    left: 105px;
    animation: legA .55s ease-in-out infinite alternate;
}

.giraffe-spots {
    position: absolute;

    inset: 0;

    border-radius: inherit;

    background:
        radial-gradient(
            circle at 25% 30%,
            #a96d10 0 7px,
            transparent 8px
        ),
        radial-gradient(
            circle at 65% 55%,
            #a96d10 0 8px,
            transparent 9px
        ),
        radial-gradient(
            circle at 42% 75%,
            #a96d10 0 6px,
            transparent 7px
        );

    opacity: .65;
}

/* =========================================================
   BULLDOG
   ========================================================= */

.bulldog {
    position: absolute;

    bottom:
        clamp(5px, 2vh, 20px);

    left: -180px;

    width: 145px;
    height: 85px;

    z-index: 4;

    animation:
        bulldogWalk
        28s
        linear
        infinite;
}

.dog-body {
    position: absolute;

    left: 38px;
    bottom: 18px;

    width: 78px;
    height: 50px;

    border-radius: 42%;

    background:
        linear-gradient(
            145deg,
            #d5d5d5,
            #777,
            #3d3d3d
        );

    border: 2px solid #222;

    box-shadow:
        inset 0 5px 7px rgba(255,255,255,.22),
        0 5px 6px rgba(0,0,0,.45);
}

.dog-head {
    position: absolute;

    left: 98px;
    bottom: 37px;

    width: 55px;
    height: 50px;

    border-radius:
        45%
        48%
        42%
        44%;

    background:
        linear-gradient(
            145deg,
            #e0e0e0,
            #858585,
            #424242
        );

    border: 2px solid #222;

    box-shadow:
        inset 0 4px 6px rgba(255,255,255,.25),
        0 4px 5px rgba(0,0,0,.45);
}

.dog-muzzle {
    position: absolute;

    left: 34px;
    top: 23px;

    width: 28px;
    height: 21px;

    border-radius: 45%;

    background:
        linear-gradient(
            145deg,
            #777,
            #303030
        );
}

.dog-nose {
    position: absolute;

    left: 50px;
    top: 19px;

    width: 12px;
    height: 10px;

    border-radius: 50%;

    background: #111;
}

.dog-eye {
    position: absolute;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #111;

    top: 15px;
}

.dog-eye.one {
    left: 13px;
}

.dog-eye.two {
    left: 32px;
}

.dog-ear {
    position: absolute;

    width: 19px;
    height: 20px;

    border-radius: 50%;

    background: #505050;

    border: 2px solid #222;

    top: -8px;
}

.dog-ear.one {
    left: 5px;
}

.dog-ear.two {
    right: 5px;
}

.dog-leg {
    position: absolute;

    width: 13px;
    height: 38px;

    bottom: -15px;

    border-radius: 6px;

    background:
        linear-gradient(
            90deg,
            #444,
            #999,
            #333
        );

    border: 2px solid #222;

    transform-origin: top;
}

.dog-leg.one {
    left: 50px;
    animation: dogLegA .42s ease-in-out infinite alternate;
}

.dog-leg.two {
    left: 73px;
    animation: dogLegB .42s ease-in-out infinite alternate;
}

.dog-leg.three {
    left: 92px;
    animation: dogLegB .42s ease-in-out infinite alternate;
}

.dog-leg.four {
    left: 108px;
    animation: dogLegA .42s ease-in-out infinite alternate;
}

.dog-tail {
    position: absolute;

    left: 22px;
    bottom: 53px;

    width: 30px;
    height: 13px;

    border-top: 7px solid #777;

    border-radius: 50%;

    transform-origin: right center;

    animation:
        tailWag
        .32s
        ease-in-out
        infinite alternate;
}

/* =========================================================
   ANIMATIONS
   ========================================================= */

@keyframes giraffeWalk {

    0% {
        left: -180px;
    }

    45% {
        left: 35%;
    }

    50% {
        left: 45%;
    }

    55% {
        left: 60%;
    }

    100% {
        left: calc(100% + 180px);
    }
}

@keyframes bulldogWalk {

    0% {
        left: -180px;
    }

    30% {
        left: 10%;
    }

    55% {
        left: 32%;
    }

    75% {
        left: 55%;
    }

    100% {
        left: calc(100% + 180px);
    }
}

@keyframes tailWag {

    from {
        transform: rotate(-20deg);
    }

    to {
        transform: rotate(25deg);
    }
}

@keyframes legA {

    from {
        transform: rotate(18deg);
    }

    to {
        transform: rotate(-18deg);
    }
}

@keyframes legB {

    from {
        transform: rotate(-18deg);
    }

    to {
        transform: rotate(18deg);
    }
}

@keyframes dogLegA {

    from {
        transform: rotate(15deg);
    }

    to {
        transform: rotate(-15deg);
    }
}

@keyframes dogLegB {

    from {
        transform: rotate(-15deg);
    }

    to {
        transform: rotate(15deg);
    }
}

/* =========================================================
   SHORT WINDOWS
   ========================================================= */

@media (max-height: 600px) {

    .game-room {
        padding-top: 5px;
        padding-bottom: 5px;
    }

    .title {
        font-size: clamp(25px, 6vw, 42px);
    }

    .subtitle {
        margin-top: 0;
    }

    .games {
        gap: 5px;
    }

    .game-button {
        height: clamp(50px, 14vh, 70px);
        min-height: 48px;
    }

    .button-description {
        display: none;
    }

    .icon {
        width: 48px;
        height: 48px;
        font-size: 30px;
    }

    .footer {
        display: none;
    }

    .giraffe,
    .bulldog {
        transform: scale(.75);
        transform-origin: bottom;
    }
}

/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media (max-width: 380px) {

    .game-button {
        padding: 0 10px;
    }

    .icon {
        margin-right: 10px;
        width: 44px;
    }

    .button-title {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="game-room">

    <div class="header">

        <h1 class="title">
            GAME ROOM
        </h1>

        <div class="subtitle">
            CHOOSE YOUR GAME
        </div>

    </div>


    <div class="games">

        <!-- TIC TAC TOE -->

        <button
            class="game-button"
            onclick="location.href='ttt.html'"
        >

            <div class="icon">
                ❌⭕
            </div>

            <div class="button-text">

                <div class="button-title">
                    TIC-TAC-TOE
                </div>

                <div class="button-description">
                    CLASSIC TWO PLAYER
                </div>

            </div>

        </button>


        <!-- CHECKERS -->

        <button
            class="game-button"
            onclick="location.href='checkers.html'"
        >

            <div class="icon">
                🔴⚫
            </div>

            <div class="button-text">

                <div class="button-title">
                    CHECKERS
                </div>

                <div class="button-description">
                    CLASSIC • TWO PLAYER • COMPUTER
                </div>

            </div>

        </button>


        <!-- CARRIER STRIKE -->

        <button
            class="game-button"
            onclick="location.href='carrierstrike.html'"
        >

            <div class="icon">
                🚢
            </div>

            <div class="button-text">

                <div class="button-title">
                    CARRIER STRIKE
                </div>

                <div class="button-description">
                    NAVAL BATTLE
                </div>

            </div>

        </button>

    </div>


    <div class="footer">
        TWO PLAYERS • ONE SCREEN • LET'S PLAY
    </div>


    <!-- GIRAFFE -->

    <div class="giraffe">

        <div class="giraffe-neck">
            <div class="giraffe-spots"></div>
        </div>

        <div class="giraffe-head">

            <div class="giraffe-ear one"></div>
            <div class="giraffe-ear two"></div>

            <div class="giraffe-eye"></div>

        </div>

        <div class="giraffe-body">
            <div class="giraffe-spots"></div>
        </div>

        <div class="giraffe-leg one"></div>
        <div class="giraffe-leg two"></div>
        <div class="giraffe-leg three"></div>
        <div class="giraffe-leg four"></div>

    </div>


    <!-- BULLDOG -->

    <div class="bulldog">

        <div class="dog-body"></div>

        <div class="dog-head">

            <div class="dog-ear one"></div>
            <div class="dog-ear two"></div>

            <div class="dog-eye one"></div>
            <div class="dog-eye two"></div>

            <div class="dog-muzzle"></div>

        </div>

        <div class="dog-nose"></div>

        <div class="dog-tail"></div>

        <div class="dog-leg one"></div>
        <div class="dog-leg two"></div>
        <div class="dog-leg three"></div>
        <div class="dog-leg four"></div>

    </div>

</div>


<script>

/*
   Keep the entire Game Room fitted to the current
   available browser window.

   This is intentionally lightweight:
   no fixed page height,
   no vertical scrolling,
   no server changes.
*/

function fitGameRoom() {

    const room =
        document.querySelector(".game-room");

    if (!room) return;

    room.style.height =
        window.innerHeight + "px";
}

window.addEventListener(
    "resize",
    fitGameRoom
);

if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "resize",
        fitGameRoom
    );
}

fitGameRoom();

</script>

</body>
</html>
