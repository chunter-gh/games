<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Game Room</title>

<style>

/* =========================================================
   PAGE
========================================================= */

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;

    background:
        radial-gradient(
            circle at center,
            #173d68 0%,
            #092542 45%,
            #041425 100%
        );

    color: white;
}

.game-room {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}


/* =========================================================
   TITLE
========================================================= */

.title {
    position: absolute;
    top: 8%;
    width: 100%;

    text-align: center;

    font-size: clamp(38px, 7vw, 72px);
    font-weight: 900;

    letter-spacing: 5px;

    text-shadow:
        0 4px 12px rgba(0,0,0,.7);
}

.subtitle {
    position: absolute;
    top: 17%;
    width: 100%;

    text-align: center;

    font-size: 16px;
    letter-spacing: 4px;

    color: #a9c9e8;
}


/* =========================================================
   GAME MENU
========================================================= */

.game-menu {
    position: absolute;

    top: 28%;
    left: 50%;

    transform: translateX(-50%);

    width: min(560px, 88%);

    display: flex;
    flex-direction: column;

    gap: 16px;

    z-index: 20;
}

.game-button {
    width: 100%;
    min-height: 82px;

    border: 2px solid rgba(255,255,255,.22);

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            rgba(33,75,116,.95),
            rgba(8,32,57,.97)
        );

    color: white;

    display: flex;
    align-items: center;

    padding: 14px 20px;

    box-sizing: border-box;

    cursor: pointer;

    text-align: left;

    box-shadow:
        0 10px 24px rgba(0,0,0,.4),
        inset 0 1px 0 rgba(255,255,255,.08);

    transition:
        transform .18s ease,
        border-color .18s ease,
        background .18s ease;
}

.game-button:hover {
    transform:
        translateY(-3px)
        scale(1.015);

    border-color:
        rgba(255,255,255,.5);

    background:
        linear-gradient(
            135deg,
            rgba(42,91,139,.98),
            rgba(10,39,67,.98)
        );
}

.game-button:active {
    transform:
        translateY(1px)
        scale(.99);
}


/*
   MORE SPACE FOR THE ICONS.

   This moves ALL game words farther
   to the right so emojis/icons don't
   cover them.
*/

.icon {
    width: 92px;
    min-width: 92px;
    flex: 0 0 92px;

    font-size: 38px;

    text-align: center;

    margin-right: 25px;
}

.button-text {
    flex: 1;

    padding-left: 8px;
}

.button-title {
    font-size: 22px;

    font-weight: 900;

    letter-spacing: 2px;

    white-space: nowrap;
}

.button-subtitle {
    margin-top: 5px;

    font-size: 13px;

    color: #9dbbd7;

    letter-spacing: 1px;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {
    position: absolute;

    bottom: 5%;

    width: 100%;

    text-align: center;

    font-size: 12px;

    letter-spacing: 3px;

    color: #7698b8;

    z-index: 20;
}


/* =========================================================
   GIRAFFE
========================================================= */

.giraffe-wrapper {
    position: absolute;

    z-index: 10;

    width: 190px;
    height: 230px;

    bottom: 38px;

    left: -220px;

    animation:
        giraffeWalk 15s linear infinite;
}


/*
   Giraffe is now visibly taller/larger.
*/

.giraffe {
    position: relative;

    width: 190px;
    height: 230px;

    animation:
        giraffeBounce .55s ease-in-out infinite alternate;
}

@keyframes giraffeWalk {

    0% {
        left: -220px;
    }

    100% {
        left: calc(100% + 220px);
    }
}

@keyframes giraffeBounce {

    from {
        transform:
            scale(1.18)
            translateY(2px);
    }

    to {
        transform:
            scale(1.18)
            translateY(-3px);
    }
}


/* BODY */

.giraffe .body {
    position: absolute;

    left: 43px;
    top: 88px;

    width: 105px;
    height: 70px;

    background: #e1b34e;

    border-radius:
        48% 48% 42% 45%;

    border: 4px solid #8b6428;

    box-shadow:
        inset -8px -8px 10px rgba(90,50,10,.18);
}


/* NECK */

.giraffe .neck {
    position: absolute;

    left: 110px;
    top: 20px;

    width: 37px;
    height: 108px;

    background: #e1b34e;

    border: 4px solid #8b6428;

    border-radius:
        20px 20px 13px 13px;

    transform:
        rotate(-4deg);
}

.giraffe .neck::before,
.giraffe .neck::after {
    content: "";

    position: absolute;

    width: 13px;
    height: 15px;

    background: #9b6c28;

    border-radius: 35%;
}

.giraffe .neck::before {
    left: 6px;
    top: 24px;
}

.giraffe .neck::after {
    right: 5px;
    top: 62px;
}


/* HEAD */

.giraffe .head {
    position: absolute;

    left: 91px;
    top: 3px;

    width: 77px;
    height: 58px;

    background: #e1b34e;

    border: 4px solid #8b6428;

    border-radius:
        48% 55% 45% 48%;

    transform:
        rotate(-8deg);

    transform-origin:
        65% 70%;
}


/* SNOUT */

.giraffe .snout {
    position: absolute;

    right: -19px;
    top: 25px;

    width: 40px;
    height: 25px;

    background: #e1b34e;

    border: 4px solid #8b6428;

    border-radius: 50%;
}


/* NOSE */

.giraffe .nose {
    position: absolute;

    right: -16px;
    top: 32px;

    width: 13px;
    height: 9px;

    background: #392818;

    border-radius: 50%;
}


/* EYE */

.giraffe .eye {
    position: absolute;

    right: 20px;
    top: 19px;

    width: 9px;
    height: 9px;

    background: #111;

    border-radius: 50%;
}


/* HORNS */

.giraffe .horn {
    position: absolute;

    top: -20px;

    width: 9px;
    height: 24px;

    background: #e1b34e;

    border:
        3px solid #8b6428;

    border-radius: 8px;
}

.giraffe .horn.one {
    left: 20px;
}

.giraffe .horn.two {
    left: 45px;
}

.giraffe .horn::after {
    content: "";

    position: absolute;

    left: -2px;
    top: -7px;

    width: 9px;
    height: 9px;

    background: #5b4022;

    border-radius: 50%;
}


/* EARS */

.giraffe .ear {
    position: absolute;

    top: -3px;

    width: 23px;
    height: 14px;

    background: #d49f3e;

    border:
        3px solid #8b6428;

    border-radius:
        70% 30% 70% 30%;
}

.giraffe .ear.one {
    left: 2px;

    transform:
        rotate(-25deg);
}

.giraffe .ear.two {
    left: 57px;

    transform:
        rotate(25deg);
}


/* LEGS */

.giraffe .leg {
    position: absolute;

    top: 145px;

    width: 18px;
    height: 73px;

    background: #e1b34e;

    border:
        4px solid #8b6428;

    border-radius:
        10px 10px 5px 5px;

    transform-origin:
        top center;
}

.giraffe .leg.one {
    left: 53px;

    animation:
        giraffeLeg1 .55s ease-in-out infinite alternate;
}

.giraffe .leg.two {
    left: 79px;

    animation:
        giraffeLeg2 .55s ease-in-out infinite alternate;
}

.giraffe .leg.three {
    left: 107px;

    animation:
        giraffeLeg2 .55s ease-in-out infinite alternate;
}

.giraffe .leg.four {
    left: 130px;

    animation:
        giraffeLeg1 .55s ease-in-out infinite alternate;
}

@keyframes giraffeLeg1 {

    from {
        transform: rotate(7deg);
    }

    to {
        transform: rotate(-7deg);
    }
}

@keyframes giraffeLeg2 {

    from {
        transform: rotate(-7deg);
    }

    to {
        transform: rotate(7deg);
    }
}


/* TAIL */

.giraffe .tail {
    position: absolute;

    left: 42px;
    top: 92px;

    width: 40px;
    height: 34px;

    border-top:
        5px solid #8b6428;

    border-left:
        5px solid #8b6428;

    border-radius:
        70% 0 0 0;

    transform-origin:
        right bottom;

    animation:
        giraffeTail .5s ease-in-out infinite alternate;
}

@keyframes giraffeTail {

    from {
        transform:
            rotate(-10deg);
    }

    to {
        transform:
            rotate(16deg);
    }
}


/* SPOTS */

.giraffe .spot {
    position: absolute;

    background: #9b6c28;

    border-radius: 35%;
}

.giraffe .spot.one {
    left: 60px;
    top: 102px;

    width: 22px;
    height: 18px;
}

.giraffe .spot.two {
    left: 94px;
    top: 125px;

    width: 17px;
    height: 20px;
}

.giraffe .spot.three {
    left: 120px;
    top: 99px;

    width: 20px;
    height: 16px;
}

.giraffe .spot.four {
    left: 80px;
    top: 91px;

    width: 14px;
    height: 14px;
}


/* =========================================================
   GIRAFFE REACTION
========================================================= */

.giraffe-wrapper.look {
    z-index: 12;
}


/*
   Because the dog is behind the giraffe,
   the giraffe looks BACK toward him.
*/

.giraffe-wrapper.look .head {
    transform:
        rotate(-28deg)
        translateY(4px);

    transition:
        transform .3s ease;
}


/*
   Giraffe suddenly speeds up.
*/

.giraffe-wrapper.frightened {
    animation:
        giraffeEscape 6s linear forwards;
}

@keyframes giraffeEscape {

    0% {
        left: 25%;
    }

    12% {
        left: 29%;
    }

    100% {
        left: calc(100% + 220px);
    }
}


/* =========================================================
   BULLDOG
========================================================= */

.bulldog-wrapper {
    position: absolute;

    z-index: 11;

    width: 190px;
    height: 150px;

    bottom: 45px;

    /*
       DOG STARTS ON LEFT
       AND WALKS RIGHT.
    */

    left: -210px;

    animation:
        bulldogWalk 18s linear infinite;
}


/*
   IMPORTANT:

   The dog's HEAD is on the RIGHT side
   of his body.

   Therefore he walks LEFT -> RIGHT
   and is facing forward.
*/

@keyframes bulldogWalk {

    0% {
        left: -210px;
    }

    35% {
        left: 18%;
    }

    48% {
        left: 38%;
    }

    60% {
        left: 55%;
    }

    75% {
        left: 72%;
    }

    100% {
        left: calc(100% + 210px);
    }
}


/* DOG BODY */

.bulldog {
    position: relative;

    width: 190px;
    height: 150px;

    animation:
        dogBounce .32s ease-in-out infinite alternate;
}

@keyframes dogBounce {

    from {
        transform:
            translateY(1px);
    }

    to {
        transform:
            translateY(-3px);
    }
}


/* BODY */

.dog-body {
    position: absolute;

    /*
       BODY IS BEHIND THE HEAD.
    */

    left: 35px;
    top: 58px;

    width: 105px;
    height: 62px;

    background:
        linear-gradient(
            145deg,
            #d6c6ae,
            #a9957c
        );

    border:
        4px solid #594b3d;

    border-radius:
        48% 45% 40% 50%;

    box-shadow:
        inset -8px -8px 10px rgba(50,40,30,.22),
        7px 9px 12px rgba(0,0,0,.35);
}


/* CHEST */

.dog-chest {
    position: absolute;

    left: 43px;
    top: 65px;

    width: 43px;
    height: 50px;

    background: #eee4d4;

    border:
        2px solid #776856;

    border-radius:
        50% 55% 45% 50%;
}


/* =========================================================
   DOG HEAD
========================================================= */

.dog-head {
    position: absolute;

    /*
       HEAD IS NOW CLEARLY ON THE
       FRONT / RIGHT SIDE.
    */

    left: 100px;
    top: 20px;

    width: 83px;
    height: 72px;

    background:
        linear-gradient(
            145deg,
            #cdbba1,
            #9d8970
        );

    border:
        4px solid #594b3d;

    border-radius:
        45% 48% 42% 50%;

    box-shadow:
        inset -8px -8px 10px rgba(50,40,30,.2),
        6px 8px 12px rgba(0,0,0,.35);

    transform-origin:
        35% 65%;
}


/* FACE */

.dog-face {
    position: absolute;

    left: 25px;
    top: 16px;

    width: 48px;
    height: 48px;

    background: #eee4d4;

    border-radius: 48%;

    border:
        2px solid #9a8872;
}


/* EARS */

.dog-ear {
    position: absolute;

    width: 35px;
    height: 39px;

    background: #655444;

    border:
        4px solid #493d32;

    border-radius:
        45% 55% 45% 60%;

    z-index: -1;
}

.dog-ear.left {
    left: -18px;
    top: 7px;

    transform:
        rotate(28deg);
}

.dog-ear.right {
    right: -16px;
    top: 8px;

    transform:
        rotate(-28deg);
}


/* EYES */

.dog-eye {
    position: absolute;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: #111;

    top: 28px;

    box-shadow:
        0 0 0 3px rgba(255,255,255,.25);
}

.dog-eye.left {
    left: 21px;
}

.dog-eye.right {
    right: 19px;
}


/* MUZZLE */

.dog-muzzle {
    position: absolute;

    left: 19px;
    top: 42px;

    width: 55px;
    height: 32px;

    background: #d9c9b3;

    border:
        3px solid #756451;

    border-radius: 48%;
}


/* NOSE */

.dog-nose {
    position: absolute;

    left: 35px;
    top: 42px;

    width: 25px;
    height: 17px;

    background: #211b18;

    border-radius:
        48% 48% 55% 55%;

    z-index: 3;
}

.dog-nose::after {
    content: "";

    position: absolute;

    left: 10px;
    top: 12px;

    width: 5px;
    height: 10px;

    background: #211b18;

    border-radius: 50%;
}


/* JOWLS */

.jowl {
    position: absolute;

    top: 54px;

    width: 25px;
    height: 24px;

    background: #e4d7c4;

    border:
        2px solid #877661;

    border-radius: 50%;
}

.jowl.left {
    left: 9px;
}

.jowl.right {
    right: 8px;
}


/* TONGUE */

.dog-tongue {
    position: absolute;

    left: 38px;
    top: 65px;

    width: 17px;
    height: 4px;

    background: #d96f7d;

    border:
        2px solid #944852;

    border-radius:
        5px 5px 50% 50%;

    z-index: 4;

    transform-origin:
        top center;

    animation:
        tongueOut 5s ease-in-out infinite;
}

@keyframes tongueOut {

    0%,
    45%,
    85%,
    100% {
        height: 4px;
        transform: rotate(0deg);
    }

    50%,
    75% {
        height: 28px;
        transform: rotate(4deg);
    }
}


/* =========================================================
   DOG TAIL
========================================================= */

/*
   TAIL IS NOW ON THE LEFT/BACK SIDE
   OF THE DOG.
*/

.dog-tail {
    position: absolute;

    left: 8px;
    top: 59px;

    width: 43px;
    height: 40px;

    border-top:
        9px solid #75604b;

    border-left:
        8px solid #75604b;

    border-radius:
        70% 20% 0 30%;

    transform-origin:
        right bottom;

    animation:
        dogTailWag .35s ease-in-out infinite alternate;
}

@keyframes dogTailWag {

    from {
        transform:
            rotate(-18deg);
    }

    to {
        transform:
            rotate(22deg);
    }
}


/* =========================================================
   DOG LEGS
========================================================= */

.dog-leg {
    position: absolute;

    top: 103px;

    width: 21px;
    height: 46px;

    background:
        linear-gradient(
            90deg,
            #8d7963,
            #c6b49b,
            #806d58
        );

    border:
        3px solid #594b3d;

    border-radius:
        10px 10px 7px 7px;

    transform-origin:
        top center;
}

.dog-leg.one {
    left: 42px;

    animation:
        dogLeg1 .32s ease-in-out infinite alternate;
}

.dog-leg.two {
    left: 68px;

    animation:
        dogLeg2 .32s ease-in-out infinite alternate;
}

.dog-leg.three {
    left: 101px;

    animation:
        dogLeg2 .32s ease-in-out infinite alternate;
}

.dog-leg.four {
    left: 125px;

    animation:
        dogLeg1 .32s ease-in-out infinite alternate;
}

@keyframes dogLeg1 {

    from {
        transform:
            rotate(9deg);
    }

    to {
        transform:
            rotate(-9deg);
    }
}

@keyframes dogLeg2 {

    from {
        transform:
            rotate(-9deg);
    }

    to {
        transform:
            rotate(9deg);
    }
}


/* =========================================================
   DOG / GIRAFFE INTERACTION
========================================================= */

.bulldog-wrapper.bark {
    animation-play-state:
        paused;
}


/*
   DOG GETS EXCITED DURING CHASE.
*/

.bulldog-wrapper.chase {
    animation:
        bulldogChase 5s linear forwards;
}

.bulldog-wrapper.chase .bulldog {
    animation:
        dogBounce .18s ease-in-out infinite alternate;
}


/*
   DOG CHASES TO THE RIGHT.
*/

@keyframes bulldogChase {

    0% {
        left: 40%;
    }

    25% {
        left: 48%;
    }

    55% {
        left: 60%;
    }

    100% {
        left: 78%;
    }
}


/*
   GIRAFFE RUNS FASTER.
*/

.giraffe-wrapper.frightened {
    animation:
        giraffeEscape 5s linear forwards;
}

@keyframes giraffeEscape {

    0% {
        left: 35%;
    }

    15% {
        left: 40%;
    }

    100% {
        left: calc(100% + 220px);
    }
}


/*
   GIRAFFE LOOKS BACK AT THE DOG.
*/

.giraffe-wrapper.look .head {
    transform:
        rotate(-30deg)
        translateY(4px);

    transition:
        transform .3s ease;
}


/*
   GIRAFFE LOOKS FORWARD AGAIN
   WHEN IT RUNS.
*/

.giraffe-wrapper.frightened .head {
    transform:
        rotate(-5deg);

    transition:
        transform .25s ease;
}


/* =========================================================
   BARK BUBBLE
========================================================= */

.bark-bubble {
    position: absolute;

    left: 128px;
    top: -35px;

    padding:
        6px 11px;

    border-radius:
        14px;

    background: white;

    color: #222;

    font-weight: 900;

    font-size: 14px;

    box-shadow:
        0 4px 8px rgba(0,0,0,.4);

    opacity: 0;

    transform:
        scale(.5);

    pointer-events: none;
}

.bulldog-wrapper.bark .bark-bubble {
    animation:
        barkPop .7s ease-out forwards;
}

@keyframes barkPop {

    0% {
        opacity: 0;

        transform:
            scale(.5);
    }

    25% {
        opacity: 1;

        transform:
            scale(1.2);
    }

    60% {
        opacity: 1;

        transform:
            scale(1);
    }

    100% {
        opacity: 0;

        transform:
            scale(.9)
            translateY(-10px);
    }
}


/* =========================================================
   SECOND LITTLE BARK
========================================================= */

.bulldog-wrapper.second-bark .bark-bubble {
    animation:
        barkPop .7s ease-out forwards;
}


/* =========================================================
   MOBILE BUTTON FIX
========================================================= */

@media (max-width: 600px) {

    .game-menu {
        width: 92%;
    }

    .game-button {
        padding:
            12px 12px;
    }

    .icon {
        width: 75px;
        min-width: 75px;
        flex-basis: 75px;

        font-size: 31px;

        margin-right: 18px;
    }

    .button-text {
        padding-left: 8px;
    }

    .button-title {
        font-size: 17px;
        letter-spacing: 1px;
    }

    .button-subtitle {
        font-size: 11px;
    }
}

</style>
</head>


<body>

<div class="game-room">


    <!-- =====================================================
         TITLE
    ====================================================== -->

    <div class="title">
        GAME ROOM
    </div>

    <div class="subtitle">
        CHOOSE YOUR GAME
    </div>


    <!-- =====================================================
         GAME BUTTONS
    ====================================================== -->

    <div class="game-menu">


        <!-- TIC TAC TOE -->

        <button
            class="game-button"
            onclick="location.href='ttt.html'">

            <div class="icon">
                ❌⭕
            </div>

            <div class="button-text">

                <div class="button-title">
                    TIC-TAC-TOE
                </div>

                <div class="button-subtitle">
                    Classic • Two Players
                </div>

            </div>

        </button>


        <!-- CHECKERS -->

        <button
            class="game-button"
            onclick="location.href='checkers.html'">

            <div class="icon">
                🔴⚫
            </div>

            <div class="button-text">

                <div class="button-title">
                    CHECKERS
                </div>

                <div class="button-subtitle">
                    Classic • Two Players
                </div>

            </div>

        </button>


        <!-- CARRIER STRIKE -->

        <button
            class="game-button"
            onclick="location.href='carrierstrike.html'">

            <div class="icon">
                ⚓
            </div>

            <div class="button-text">

                <div class="button-title">
                    CARRIER STRIKE
                </div>

                <div class="button-subtitle">
                    Hunt • Strike • Destroy
                </div>

            </div>

        </button>


    </div>


    <!-- =====================================================
         GIRAFFE
    ====================================================== -->

    <div
        class="giraffe-wrapper"
        id="giraffeWrapper">

        <div class="giraffe">

            <div class="body"></div>

            <div class="neck"></div>

    <div
        class="bulldog-wrapper"
        id="bulldogWrapper">

        <div class="bulldog">

            <!-- BACK OF DOG -->

         FOOTER
    ====================================================== -->

        TWO PLAYERS • ONE SCREEN • LET'S PLAY
    </div>


</div>


<script>

/* =========================================================
   DOG + GIRAFFE INTERACTION
========================================================= */

(function () {

    const giraffe =
        document.getElementById("giraffeWrapper");

    const bulldog =
        document.getElementById("bulldogWrapper");


    if (!giraffe || !bulldog) {
        return;
    }


    let busy = false;


    function checkAnimals() {

        if (busy) {
            return;
        }


        const g =
            giraffe.getBoundingClientRect();

        const b =
            bulldog.getBoundingClientRect();


        /*
         * The dog is approaching the giraffe
         * from behind.
         */

        const dogFront =
            b.right;

        const giraffeBack =
            g.left;


        const distance =
            giraffeBack - dogFront;


        /*
         * They are close enough.
         */

        const close =
            distance > -35 &&
            distance < 115;


        /*
         * Make sure they are actually
         * on the same level.
         */

        const sameLevel =
            b.bottom > g.top + 45 &&
            b.top < g.bottom;


        if (!close || !sameLevel) {
            return;
        }


        /*
         * START THE EVENT
         */

        busy = true;


        /* DOG BARKS */

        bulldog.classList.add("bark");


        /*
         * GIRAFFE HEARS IT.
         *
         * It turns its head back.
         */

        setTimeout(function () {

            giraffe.classList.add("look");

        }, 300);


        /*
         * DOG BARKS AGAIN A MOMENT LATER.
         */

        setTimeout(function () {

            bulldog.classList.remove("bark");

            bulldog.classList.add("second-bark");

            setTimeout(function () {

                bulldog.classList.remove("second-bark");

            }, 700);

        }, 950);


        /*
         * GIRAFFE PANICS AND TAKES OFF.
         */

        setTimeout(function () {

            giraffe.classList.remove("look");

            giraffe.classList.add("frightened");

        }, 1500);


        /*
         * DOG CHASES.
         */

        setTimeout(function () {

            bulldog.classList.remove("bark");

            bulldog.classList.add("chase");

        }, 1650);


        /*
         * AFTER A FEW SECONDS,
         * THE DOG GIVES UP.
         */

        setTimeout(function () {

            bulldog.classList.remove("chase");

            giraffe.classList.remove("frightened");

            busy = false;

        }, 6000);

    }


    /*
     * Check frequently enough
     * to catch the animals as
     * they pass one another.
     */

    setInterval(
        checkAnimals,
        100
    );

})();

</script>
