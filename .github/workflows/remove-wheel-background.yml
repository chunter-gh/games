name: Remove wheel background

on:
  push:
    paths:
      - '.github/workflows/remove-wheel-background.yml'

permissions:
  contents: write

jobs:
  remove-background:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove decorative wheel backing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          pattern = r'\n\.game-wheel::before\s*\{.*?\n\}\n'
          updated, count = re.subn(pattern, '\n', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Expected .game-wheel::before block was not found exactly once')
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove wheel background panel"
          git push
