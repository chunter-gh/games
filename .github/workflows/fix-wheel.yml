name: Fix wheel center freeze

on:
  push:
    paths:
      - '.github/workflows/fix-wheel.yml'

permissions:
  contents: write

jobs:
  fix-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve wheel position when pausing or reversing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          old = '''function setWheelMotion(direction) {
              const moving = direction === "up" || direction === "down";
              wheelStage.dataset.wheelMotion = moving ? "running" : "paused";
              wheelStage.style.setProperty("--wheel-duration", moving ? "7s" : "32s");
              wheelStage.style.setProperty(
                  "--wheel-direction",
                  direction === "down" ? "reverse" : "normal"
              );
          }'''

          new = '''function setWheelMotion(direction) {
              const animations = [
                  ...gameMenu.getAnimations(),
                  ...[...gameMenu.querySelectorAll(".game-button")]
                      .flatMap(button => button.getAnimations())
              ];

              if (direction !== "up" && direction !== "down") {
                  wheelStage.dataset.wheelMotion = "paused";
                  animations.forEach(animation => animation.pause());
                  return;
              }

              wheelStage.dataset.wheelMotion = "running";
              const playbackRate = direction === "down" ? -4.5 : 4.5;

              animations.forEach(animation => {
                  if (typeof animation.updatePlaybackRate === "function") {
                      animation.updatePlaybackRate(playbackRate);
                  } else {
                      animation.playbackRate = playbackRate;
                  }
                  animation.play();
              });
          }'''

          if old not in text:
              raise SystemExit('Expected wheel motion block not found; index.html left unchanged.')

          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Freeze game wheel exactly on center hover"
          git push
