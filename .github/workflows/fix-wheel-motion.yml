name: One-shot wheel motion fix

on:
  push:
    paths:
      - '.github/workflows/fix-wheel-motion.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch wheel motion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''const gameMenu = document.getElementById("gameMenu");
          const wheelStage = document.getElementById("wheelStage");

          function setWheelMotion(direction) {
              const animations = [
                  ...gameMenu.getAnimations(),
                  ...[...gameMenu.querySelectorAll(".game-button")]
                      .flatMap(button => button.getAnimations())
              ];

              if (direction !== "up" && direction !== "down") {
                  wheelStage.dataset.wheelMotion = "paused";
                  animations.forEach(animation => animation.pause());
                  return;
              }

              wheelStage.dataset.wheelMotion = "running";
              const playbackRate = direction === "down" ? -4.5 : 4.5;

              animations.forEach(animation => {
                  if (typeof animation.updatePlaybackRate === "function") {
                      animation.updatePlaybackRate(playbackRate);
                  } else {
                      animation.playbackRate = playbackRate;
                  }
                  animation.play();
              });
          }

          wheelStage.addEventListener("pointermove", event => {
              if (event.pointerType === "touch") return;

              const bounds = wheelStage.getBoundingClientRect();
              const verticalPosition = (event.clientY - bounds.top) / bounds.height;

              if (verticalPosition < 0.32) {
                  setWheelMotion("up");
              } else if (verticalPosition > 0.68) {
                  setWheelMotion("down");
              } else {
                  setWheelMotion("center");
              }
          });

          wheelStage.addEventListener("pointerleave", () => setWheelMotion("center"));
          wheelStage.addEventListener("focusin", () => setWheelMotion("center"));'''
          new = '''const gameMenu = document.getElementById("gameMenu");
          const wheelStage = document.getElementById("wheelStage");
          let lastWheelDirection = "up";

          function setWheelMotion(direction, fast = false) {
              const animations = [
                  ...gameMenu.getAnimations(),
                  ...[...gameMenu.querySelectorAll(".game-button")]
                      .flatMap(button => button.getAnimations())
              ];

              if (direction !== "up" && direction !== "down") {
                  wheelStage.dataset.wheelMotion = "paused";
                  animations.forEach(animation => animation.pause());
                  return;
              }

              lastWheelDirection = direction;
              wheelStage.dataset.wheelMotion = "running";
              const speed = fast ? 4.5 : 1;
              const playbackRate = direction === "down" ? -speed : speed;

              animations.forEach(animation => {
                  if (typeof animation.updatePlaybackRate === "function") {
                      animation.updatePlaybackRate(playbackRate);
                  } else {
                      animation.playbackRate = playbackRate;
                  }
                  animation.play();
              });
          }

          wheelStage.addEventListener("pointermove", event => {
              if (event.pointerType === "touch") return;

              const bounds = wheelStage.getBoundingClientRect();
              const verticalPosition = (event.clientY - bounds.top) / bounds.height;

              if (verticalPosition < 0.32) {
                  setWheelMotion("up", true);
              } else if (verticalPosition > 0.68) {
                  setWheelMotion("down", true);
              } else {
                  setWheelMotion("center");
              }
          });

          wheelStage.addEventListener("pointerleave", () => setWheelMotion(lastWheelDirection, false));'''
          if old not in s:
              raise SystemExit('Expected wheel block not found; refusing to change index.html')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/fix-wheel-motion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-wheel-motion.yml
          git commit -m "Fix game wheel sticking after hover"
          git push
