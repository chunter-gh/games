name: Widen wheel tiles

on:
  push:
    paths:
      - '.github/workflows/widen-wheel-tiles.yml'

permissions:
  contents: write

jobs:
  widen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Widen wheel tiles
        run: |
          sed -i 's/width: clamp(190px, 27vw, 300px);/width: clamp(225px, 31vw, 350px);/' index.html
          sed -i 's/width: min(68vw, 250px); height: 58px;/width: min(78vw, 290px); height: 58px;/' index.html
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Widen rotating game tiles"
          git push
