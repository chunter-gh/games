name: One-shot video poker card proportion fix

on:
  push:
    paths:
      - '.github/workflows/shorten-video-poker-cards.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Give video poker cards standard playing-card proportions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('videopoker.html')
          s = p.read_text()
          old_slot = '.card-slot{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:stretch;gap:clamp(4px,.6dvh,7px)}'
          new_slot = '.card-slot{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:clamp(4px,.6dvh,7px)}'
          old_card = '.card{position:relative;flex:1 1 auto;min-height:0;width:100%;'
          new_card = '.card{position:relative;flex:0 0 auto;min-height:0;width:100%;aspect-ratio:5/7;'
          if old_slot not in s or old_card not in s:
              raise SystemExit('Expected current card CSS not found; refusing to alter videopoker.html')
          s = s.replace(old_slot, new_slot, 1)
          s = s.replace(old_card, new_card, 1)
          p.write_text(s)
          PY
      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/shorten-video-poker-cards.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videopoker.html .github/workflows/shorten-video-poker-cards.yml
          git commit -m "Shorten video poker cards to standard proportions"
          git push