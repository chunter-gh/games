<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiny Checkers</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 50% 15%, #3d4654 0%, #141821 42%, #050609 100%);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 18px;
}

.game {
    width: min(96vw, 760px);
    text-align: center;
}

h1 {
    margin: 0 0 4px;
    font-size: clamp(32px, 7vw, 58px);
    letter-spacing: 4px;
    text-shadow:
        0 3px 5px #000,
        0 0 18px rgba(255,255,255,.18);
}

.subtitle {
    color: #c9ced6;
    margin-bottom: 16px;
    font-size: 14px;
    letter-spacing: 2px;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 9px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

button, select {
    min-height: 44px;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 10px;
    padding: 9px 14px;
    color: white;
    background: linear-gradient(#343b47, #171b22);
    box-shadow:
        inset 0 1px 2px rgba(255,255,255,.18),
        0 3px 8px rgba(0,0,0,.5);
    font-size: 14px;
    cursor: pointer;
}

button:hover, select:hover {
    background: linear-gradient(#444c59, #1b2028);
}

button:active {
    transform: translateY(1px);
}

select {
    min-width: 125px;
}

.status {
    min-height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 14px;
    padding: 9px 14px;
    border-radius: 12px;
    background: linear-gradient(145deg, #202630, #0b0d11);
    border: 1px solid rgba(255,255,255,.13);
    box-shadow:
        inset 0 1px 5px rgba(255,255,255,.05),
        0 5px 15px rgba(0,0,0,.4);
    font-weight: bold;
    letter-spacing: .5px;
}

.board-wrap {
    padding: 9px;
    border-radius: 18px;
    background:
        linear-gradient(135deg, #555b65, #090b0e 35%, #424750 50%, #08090b);
    box-shadow:
        0 12px 35px rgba(0,0,0,.75),
        inset 0 2px 3px rgba(255,255,255,.25),
        inset 0 -3px 5px rgba(0,0,0,.8);
}

.board {
    width: min(88vw, 690px);
    aspect-ratio: 1;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    overflow: hidden;
    border-radius: 7px;
    border: 3px solid #090909;
    box-shadow:
        inset 0 0 10px rgba(0,0,0,.9),
        0 2px 8px #000;
    touch-action: manipulation;
}

.square {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    aspect-ratio: 1;
}

.light {
    background:
        linear-gradient(135deg,
            #f34b4b 0%,
            #a90d16 42%,
            #560308 100%);
}

.dark {
    background:
        linear-gradient(135deg,
            #16191e 0%,
            #050608 45%,
            #24272d 100%);
}

.square::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.20),
            transparent 30%,
            transparent 70%,
            rgba(0,0,0,.20)
        );
}

.square.selected {
    box-shadow:
        inset 0 0 0 4px #ffe84a,
        inset 0 0 20px rgba(255,235,50,.7);
}

.square.move-target {
    cursor: pointer;
}

.square.move-target::before {
    content: "";
    position: absolute;
    width: 25%;
    height: 25%;
    border-radius: 50%;
    background: rgba(255,255,255,.8);
    box-shadow:
        0 0 12px rgba(255,255,255,.9),
        0 0 3px #fff;
    z-index: 3;
}

.square.capture-target {
    box-shadow:
        inset 0 0 0 4px #fff,
        inset 0 0 22px rgba(255,255,255,.6);
}

.piece {
    position: relative;
    width: 76%;
    height: 76%;
    border-radius: 50%;
    z-index: 4;
    cursor: pointer;

    box-shadow:
        0 7px 7px rgba(0,0,0,.75),
        0 2px 3px rgba(0,0,0,.9),
        inset 0 4px 5px rgba(255,255,255,.55),
        inset 0 -7px 10px rgba(0,0,0,.55);

    transition:
        transform .12s ease,
        box-shadow .12s ease;
}

.piece:hover {
    transform: translateY(-2px) scale(1.03);
}

.piece.red {
    background:
        radial-gradient(
            circle at 32% 23%,
            #fff 0%,
            #ffb0b0 4%,
            #ff3c3c 11%,
            #e00012 35%,
            #9b000a 65%,
            #4b0005 100%
        );
    border: 3px solid #ff6a6a;
}

.piece.black {
    background:
        radial-gradient(
            circle at 32% 23%,
            #fff 0%,
            #c9c9c9 3%,
            #686868 9%,
            #242424 28%,
            #080808 60%,
            #000 100%
        );
    border: 3px solid #777;
}

.piece::before {
    content: "";
    position: absolute;
    left: 13%;
    right: 13%;
    top: 10%;
    height: 17%;
    border-radius: 50%;
    background: linear-gradient(
        rgba(255,255,255,.65),
        rgba(255,255,255,0)
    );
    filter: blur(1px);
}

.piece::after {
    content: "";
    position: absolute;
    left: 9%;
    right: 9%;
    bottom: 8%;
    height: 17%;
    border-radius: 50%;
    border-bottom: 3px solid rgba(0,0,0,.4);
}

.king {
    box-shadow:
        0 7px 7px rgba(0,0,0,.8),
        inset 0 4px 5px rgba(255,255,255,.6),
        inset 0 -8px 10px rgba(0,0,0,.6),
        0 0 8px rgba(255,215,0,.35);
}

.king::marker {
    display: none;
}

.king-symbol {
    position: absolute;
    z-index: 8;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -52%);
    width: 55%;
    height: 55%;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,.85);
    color: #fff;
    font-size: clamp(14px, 3vw, 25px);
    font-weight: 900;
    line-height: 1.3;
    text-shadow: 0 2px 3px #000;
    box-shadow:
        inset 0 2px 3px rgba(255,255,255,.35),
        0 1px 3px #000;
}

.black .king-symbol {
    color: #ffd92f;
    border-color: #ffd92f;
}

.red .king-symbol {
    color: #fff;
}

.legend {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin-top: 14px;
    font-size: 13px;
    color: #c7ccd3;
}

.dot {
    display: inline-block;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    vertical-align: -2px;
    margin-right: 5px;
    box-shadow: 0 2px 4px #000;
}

.red-dot {
    background: radial-gradient(circle at 30% 25%, #fff, #e00012 45%, #500);
}

.black-dot {
    background: radial-gradient(circle at 30% 25%, #aaa, #111 45%, #000);
}

.computer-thinking {
    animation: pulse 1s infinite alternate;
}

@keyframes pulse {
    from { opacity: .65; }
    to { opacity: 1; }
}

@media (max-width: 500px) {
    body {
        padding: 9px;
    }

    .board-wrap {
        padding: 5px;
        border-radius: 12px;
    }

    .board {
        width: 94vw;
    }

    h1 {
        font-size: 34px;
        letter-spacing: 2px;
    }

    .controls {
        gap: 6px;
    }

    button, select {
        padding: 8px 10px;
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="game">

    <h1>CHECKERS</h1>
    <div class="subtitle">CLASSIC • GLOSSY • TWO WAYS TO PLAY</div>

    <div class="controls">
        <button id="twoPlayerBtn" type="button">👥 2 PLAYERS</button>
        <button id="computerBtn" type="button">🤖 VS COMPUTER</button>

        <select id="difficulty" aria-label="Computer difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
        </select>

        <button id="newGameBtn" type="button">NEW GAME</button>
    </div>

    <div id="status" class="status" aria-live="polite">
        Red's turn
    </div>

    <div class="board-wrap">
        <div id="board" class="board"></div>
    </div>

    <div class="legend">
        <span><span class="dot red-dot"></span>RED</span>
        <span><span class="dot black-dot"></span>BLACK</span>
    </div>

</div>

<script>
(() => {
    "use strict";

    const boardElement = document.getElementById("board");
    const statusElement = document.getElementById("status");
    const twoPlayerBtn = document.getElementById("twoPlayerBtn");
    const computerBtn = document.getElementById("computerBtn");
    const difficultySelect = document.getElementById("difficulty");
    const newGameBtn = document.getElementById("newGameBtn");

    const SIZE = 8;

    let board = [];
    let currentPlayer = "red";
    let selected = null;
    let forcedPiece = null;
    let gameOver = false;
    let mode = "computer";
    let computerThinking = false;

    /*
       Piece:
       {
           color: "red" | "black",
           king: true | false
       }
    */

    function createStartingBoard() {
        const newBoard = Array.from(
            { length: SIZE },
            () => Array(SIZE).fill(null)
        );

        // Black starts at the top.
        for (let row = 0; row < 3; row++) {
            for (let col = 0; col < SIZE; col++) {
                if ((row + col) % 2 === 1) {
                    newBoard[row][col] = {
                        color: "black",
                        king: false
                    };
                }
            }
        }

        // Red starts at the bottom.
        for (let row = 5; row < 8; row++) {
            for (let col = 0; col < SIZE; col++) {
                if ((row + col) % 2 === 1) {
                    newBoard[row][col] = {
                        color: "red",
                        king: false
                    };
                }
            }
        }

        return newBoard;
    }

    function resetGame() {
        board = createStartingBoard();
        currentPlayer = "red";
        selected = null;
        forcedPiece = null;
        gameOver = false;
        computerThinking = false;

        statusElement.classList.remove("computer-thinking");
        updateStatus();
        render();
    }

    function inside(row, col) {
        return row >= 0 &&
               row < SIZE &&
               col >= 0 &&
               col < SIZE;
    }

    function directionsFor(piece) {
        if (!piece) return [];

        if (piece.king) {
            return [
                [-1, -1],
                [-1, 1],
                [1, -1],
                [1, 1]
            ];
        }

        if (piece.color === "red") {
            return [
                [-1, -1],
                [-1, 1]
            ];
        }

        return [
            [1, -1],
            [1, 1]
        ];
    }

    function getSimpleMoves(row, col) {
        const piece = board[row][col];
        if (!piece) return [];

        const moves = [];

        for (const [dr, dc] of directionsFor(piece)) {
            const nr = row + dr;
            const nc = col + dc;

            if (inside(nr, nc) && !board[nr][nc]) {
                moves.push({
                    from: { row, col },
                    to: { row: nr, col: nc },
                    capture: null
                });
            }
        }

        return moves;
    }

    function getCaptures(row, col) {
        const piece = board[row][col];
        if (!piece) return [];

        const moves = [];

        for (const [dr, dc] of directionsFor(piece)) {
            const middleRow = row + dr;
            const middleCol = col + dc;
            const landingRow = row + dr * 2;
            const landingCol = col + dc * 2;

            if (!inside(landingRow, landingCol) ||
                !inside(middleRow, middleCol)) {
                continue;
            }

            const middlePiece = board[middleRow][middleCol];

            if (
                middlePiece &&
                middlePiece.color !== piece.color &&
                !board[landingRow][landingCol]
            ) {
                moves.push({
                    from: { row, col },
                    to: { row: landingRow, col: landingCol },
                    capture: {
                        row: middleRow,
                        col: middleCol
                    }
                });
            }
        }

        return moves;
    }

    function allMovesFor(color) {
        const captures = [];
        const moves = [];

        for (let row = 0; row < SIZE; row++) {
            for (let col = 0; col < SIZE; col++) {
                const piece = board[row][col];

                if (!piece || piece.color !== color) continue;

                captures.push(...getCaptures(row, col));
                moves.push(...getSimpleMoves(row, col));
            }
        }

        return captures.length > 0 ? captures : moves;
    }

    function legalMovesForPiece(row, col) {
        const piece = board[row][col];

        if (!piece || piece.color !== currentPlayer) {
            return [];
        }

        if (forcedPiece &&
            (forcedPiece.row !== row || forcedPiece.col !== col)) {
            return [];
        }

        const captures = getCaptures(row, col);

        if (captures.length) {
            return captures;
        }

        if (forcedPiece) {
            return [];
        }

        const allCaptures = [];

        for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
                const p = board[r][c];

                if (p && p.color === currentPlayer) {
                    allCaptures.push(...getCaptures(r, c));
                }
            }
        }

        if (allCaptures.length) {
            return [];
        }

        return getSimpleMoves(row, col);
    }

    function performMove(move) {
        const piece = board[move.from.row][move.from.col];

        if (!piece) return;

        board[move.from.row][move.from.col] = null;
        board[move.to.row][move.to.col] = piece;

        if (move.capture) {
            board[move.capture.row][move.capture.col] = null;
        }

        let becameKing = false;

        if (
            !piece.king &&
            (
                (piece.color === "red" && move.to.row === 0) ||
                (piece.color === "black" && move.to.row === 7)
            )
        ) {
            piece.king = true;
            becameKing = true;
        }

        // A capture can lead to another jump.
        if (move.capture && !becameKing) {
            const nextCaptures = getCaptures(
                move.to.row,
                move.to.col
            );

            if (nextCaptures.length) {
                forcedPiece = {
                    row: move.to.row,
                    col: move.to.col
                };

                selected = {
                    row: move.to.row,
                    col: move.to.col
                };

                render();
                updateStatus();
                return;
            }
        }

        forcedPiece = null;
        selected = null;

        currentPlayer = currentPlayer === "red" ? "black" : "red";

        checkGameEnd();
        render();
        updateStatus();

        if (
            !gameOver &&
            mode === "computer" &&
            currentPlayer === "black"
        ) {
            computerMove();
        }
    }

    function checkGameEnd() {
        const pieces = countPieces(currentPlayer);
        const moves = allMovesFor(currentPlayer);

        if (pieces === 0 || moves.length === 0) {
            gameOver = true;

            const winner =
                currentPlayer === "red" ? "BLACK" : "RED";

            statusElement.textContent =
                `🏆 ${winner} WINS!`;
        }
    }

    function countPieces(color) {
        let count = 0;

        for (let row = 0; row < SIZE; row++) {
            for (let col = 0; col < SIZE; col++) {
                if (board[row][col]?.color === color) {
                    count++;
                }
            }
        }

        return count;
    }

    function render() {
        boardElement.innerHTML = "";

        for (let row = 0; row < SIZE; row++) {
            for (let col = 0; col < SIZE; col++) {
                const square = document.createElement("div");

                square.className =
                    "square " +
                    ((row + col) % 2 === 0 ? "light" : "dark");

                square.dataset.row = row;
                square.dataset.col = col;

                if (
                    selected &&
                    selected.row === row &&
                    selected.col === col
                ) {
                    square.classList.add("selected");
                }

                const piece = board[row][col];

                if (piece) {
                    const pieceElement =
                        document.createElement("div");

                    pieceElement.className =
                        `piece ${piece.color}`;

                    if (piece.king) {
                        pieceElement.classList.add("king");

                        const kingSymbol =
                            document.createElement("div");

                        kingSymbol.className = "king-symbol";
                        kingSymbol.textContent = "K";

                        pieceElement.appendChild(kingSymbol);
                    }

                    square.appendChild(pieceElement);
                }

                if (
                    selected &&
                    legalMovesForPiece(
                        selected.row,
                        selected.col
                    ).some(
                        move =>
                            move.to.row === row &&
                            move.to.col === col
                    )
                ) {
                    square.classList.add("move-target");

                    if (
                        board[row][col] === null
                    ) {
                        // normal target
                    }
                }

                boardElement.appendChild(square);
            }
        }
    }

    function updateStatus() {
        if (gameOver) return;

        if (computerThinking) {
            statusElement.textContent =
                "🤖 Computer is thinking...";
            statusElement.classList.add("computer-thinking");
            return;
        }

        statusElement.classList.remove("computer-thinking");

        if (forcedPiece) {
            statusElement.textContent =
                `${capitalize(currentPlayer)} must continue the jump!`;
            return;
        }

        if (mode === "computer") {
            statusElement.textContent =
                currentPlayer === "red"
                    ? "🔴 Your turn"
                    : "⚫ Computer's turn";
        } else {
            statusElement.textContent =
                `${currentPlayer === "red" ? "🔴 Red" : "⚫ Black"}'s turn`;
        }
    }

    function capitalize(text) {
        return text.charAt(0).toUpperCase() + text.slice(1);
    }

    function handleSquareClick(row, col) {
        if (gameOver || computerThinking) return;

        if (mode === "computer" && currentPlayer === "black") {
            return;
        }

        const piece = board[row][col];

        // Selecting a piece.
        if (!selected) {
            if (piece && piece.color === currentPlayer) {
                const legal = legalMovesForPiece(row, col);

                if (legal.length) {
                    selected = { row, col };
                    render();
                }
            }

            return;
        }

        // Clicking another own piece changes selection.
        if (
            piece &&
            piece.color === currentPlayer &&
            !forcedPiece
        ) {
            const legal = legalMovesForPiece(row, col);

            if (legal.length) {
                selected = { row, col };
                render();
            }

            return;
        }

        const moves = legalMovesForPiece(
            selected.row,
            selected.col
        );

        const chosen = moves.find(
            move =>
                move.to.row === row &&
                move.to.col === col
        );

        if (chosen) {
            performMove(chosen);
        }
    }

    boardElement.addEventListener("click", event => {
        const square =
            event.target.closest(".square");

        if (!square) return;

        handleSquareClick(
            Number(square.dataset.row),
            Number(square.dataset.col)
        );
    });

    /*
       COMPUTER AI
       Easy:
         Random legal move.

       Medium:
         Captures + simple positional evaluation.

       Hard:
         Minimax with alpha-beta pruning.
    */

    function computerMove() {
        if (
            gameOver ||
            mode !== "computer" ||
            currentPlayer !== "black"
        ) {
            return;
        }

        computerThinking = true;
        updateStatus();

        const delay =
            difficultySelect.value === "easy"
                ? 350
                : 500;

        setTimeout(() => {
            if (gameOver || currentPlayer !== "black") {
                computerThinking = false;
                return;
            }

            let move;

            if (difficultySelect.value === "easy") {
                move = chooseEasyMove();
            } else if (difficultySelect.value === "medium") {
                move = chooseMediumMove();
            } else {
                move = chooseHardMove();
            }

            if (!move) {
                computerThinking = false;
                checkGameEnd();
                updateStatus();
                return;
            }

            computerThinking = false;
            performMove(move);
        }, delay);
    }

    function chooseEasyMove() {
        const moves = allMovesFor("black");

        if (!moves.length) return null;

        return moves[
            Math.floor(Math.random() * moves.length)
        ];
    }

    function chooseMediumMove() {
        const moves = allMovesFor("black");

        if (!moves.length) return null;

        let bestScore = -Infinity;
        let bestMoves = [];

        for (const move of moves) {
            const score = evaluateMove(move);

            if (score > bestScore) {
                bestScore = score;
                bestMoves = [move];
            } else if (score === bestScore) {
                bestMoves.push(move);
            }
        }

        return bestMoves[
            Math.floor(Math.random() * bestMoves.length)
        ];
    }

    function evaluateMove(move) {
        let score = 0;

        if (move.capture) {
            score += 100;
        }

        if (move.to.row === 7) {
            score += 50;
        }

        if (move.to.col >= 2 && move.to.col <= 5) {
            score += 10;
        }

        const piece = board[
            move.from.row
        ][move.from.col];

        if (piece?.king) {
            score += 20;
        }

        return score + Math.random() * 3;
    }

    function cloneBoard(source) {
        return source.map(row =>
            row.map(piece =>
                piece
                    ? {
                        color: piece.color,
                        king: piece.king
                    }
                    : null
            )
        );
    }

    function applyMoveToBoard(source, move) {
        const copy = cloneBoard(source);

        const piece =
            copy[move.from.row][move.from.col];

        copy[move.from.row][move.from.col] = null;
        copy[move.to.row][move.to.col] = piece;

        if (move.capture) {
            copy[move.capture.row][move.capture.col] = null;
        }

        if (
            !piece.king &&
            (
                (piece.color === "red" && move.to.row === 0) ||
                (piece.color === "black" && move.to.row === 7)
            )
        ) {
            piece.king = true;
        }

        return copy;
    }

    function getMovesForBoard(source, color) {
        const captures = [];
        const moves = [];

        for (let row = 0; row < SIZE; row++) {
            for (let col = 0; col < SIZE; col++) {
                const piece = source[row][col];

                if (!piece || piece.color !== color) continue;

                const directions =
                    directionsFor(piece);

                for (const [dr, dc] of directions) {
                    const nr = row + dr;
                    const nc = col + dc;

                    if (
                        inside(nr, nc) &&
                        !source[nr][nc]
                    ) {
                        moves.push({
                            from: { row, col },
                            to: { row: nr, col: nc },
                            capture: null
                        });
                    }

                    const mr = row + dr;
                    const mc = col + dc;
                    const lr = row + dr * 2;
                    const lc = col + dc * 2;

                    if (
                        inside(lr, lc) &&
                        source[mr][mc] &&
                        source[mr][mc].color !== color &&
                        !source[lr][lc]
                    ) {
                        captures.push({
                            from: { row, col },
                            to: { row: lr, col: lc },
                            capture: {
                                row: mr,
                                col: mc
                            }
                        });
                    }
                }
            }
        }

        return captures.length ? captures : moves;
    }

    function evaluateBoard(source) {
        let score = 0;

        for (let row = 0; row < SIZE; row++) {
            for (let col = 0; col < SIZE; col++) {
                const piece = source[row][col];

                if (!piece) continue;

                let value = piece.king ? 175 : 100;

                if (!piece.king) {
                    if (piece.color === "black") {
                        value += row * 4;
                    } else {
                        value += (7 - row) * 4;
                    }
                }

                if (col >= 2 && col <= 5) {
                    value += 4;
                }

                if (piece.color === "black") {
                    score += value;
                } else {
                    score -= value;
                }
            }
        }

        return score;
    }

    function chooseHardMove() {
        const moves = getMovesForBoard(
            board,
            "black"
        );

        if (!moves.length) return null;

        let bestScore = -Infinity;
        let bestMove = moves[0];

        for (const move of moves) {
            const next = applyMoveToBoard(
                board,
                move
            );

            const score = minimax(
                next,
                "red",
                4,
                -Infinity,
                Infinity
            );

            if (score > bestScore) {
                bestScore = score;
                bestMove = move;
            }
        }

        return bestMove;
    }

    function minimax(
        position,
        player,
        depth,
        alpha,
        beta
    ) {
        const moves =
            getMovesForBoard(position, player);

        if (depth === 0 || moves.length === 0) {
            return evaluateBoard(position);
        }

        if (player === "black") {
            let best = -Infinity;

            for (const move of moves) {
                const next =
                    applyMoveToBoard(position, move);

                best = Math.max(
                    best,
                    minimax(
                        next,
                        "red",
                        depth - 1,
                        alpha,
                        beta
                    )
                );

                alpha = Math.max(alpha, best);

                if (beta <= alpha) break;
            }

            return best;
        }

        let best = Infinity;

        for (const move of moves) {
            const next =
                applyMoveToBoard(position, move);

            best = Math.min(
                best,
                minimax(
                    next,
                    "black",
                    depth - 1,
                    alpha,
                    beta
                )
            );

            beta = Math.min(beta, best);

            if (beta <= alpha) break;
        }

        return best;
    }

    twoPlayerBtn.addEventListener("click", () => {
        mode = "two-player";
        resetGame();
    });

    computerBtn.addEventListener("click", () => {
        mode = "computer";
        resetGame();
    });

    difficultySelect.addEventListener("change", () => {
        if (mode === "computer") {
            resetGame();
        }
    });

    newGameBtn.addEventListener("click", resetGame);

    resetGame();

})();
</script>
