<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Game Room - Checkers</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 50% 0%, #263b72 0%, #101a39 42%, #060b19 100%);
    color: white;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

.game {
    width: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 10px;
    overflow: hidden;
}

h1 {
    margin: 0;
    font-size: clamp(22px, 4vw, 40px);
    letter-spacing: 4px;
    text-shadow:
        0 2px 4px #000,
        0 0 15px rgba(255,255,255,.15);
    flex-shrink: 0;
}

.subtitle {
    margin: 1px 0 5px;
    font-size: clamp(10px, 1.7vw, 15px);
    letter-spacing: 2px;
    opacity: .75;
    flex-shrink: 0;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 5px;
    margin-bottom: 5px;
    flex-shrink: 0;
}

button,
select {
    border: 1px solid rgba(255,255,255,.28);
    border-radius: 8px;
    background:
        linear-gradient(145deg, #394e82, #18264d);
    color: white;
    font-weight: bold;
    padding: 6px 10px;
    font-size: clamp(10px, 1.6vw, 14px);
    box-shadow:
        0 3px 7px rgba(0,0,0,.45),
        inset 0 1px 1px rgba(255,255,255,.15);
}

button {
    cursor: pointer;
}

button:hover {
    background:
        linear-gradient(145deg, #4c649f, #223665);
}

button:active {
    transform: translateY(1px);
}

select {
    cursor: pointer;
}

.status {
    min-height: 24px;
    padding: 3px 12px;
    margin-bottom: 4px;
    border-radius: 20px;
    background: rgba(0,0,0,.30);
    border: 1px solid rgba(255,255,255,.14);
    font-size: clamp(11px, 1.8vw, 16px);
    font-weight: bold;
    text-align: center;
    flex-shrink: 0;
}

.board-area {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.board {
    width: var(--board-size);
    height: var(--board-size);
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);

    border-radius: 12px;
    padding: 5px;

    background:
        linear-gradient(145deg, #080b12, #222838 45%, #05070c);

    box-shadow:
        0 12px 30px rgba(0,0,0,.65),
        0 0 0 2px rgba(255,255,255,.10),
        inset 0 2px 3px rgba(255,255,255,.18),
        inset 0 -4px 8px rgba(0,0,0,.75);

    flex-shrink: 0;
}

.square {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: visible;
}

.light {
    background:
        linear-gradient(135deg,
            #b52a2a 0%,
            #7d1117 42%,
            #48080d 100%);
    box-shadow:
        inset 1px 1px 2px rgba(255,255,255,.16),
        inset -2px -2px 4px rgba(0,0,0,.30);
}

.dark {
    background:
        linear-gradient(135deg,
            #121722 0%,
            #070a10 45%,
            #020307 100%);
    box-shadow:
        inset 1px 1px 2px rgba(255,255,255,.09),
        inset -2px -2px 4px rgba(0,0,0,.55);
}

.square.selected {
    box-shadow:
        inset 0 0 0 3px #ffd84a,
        inset 0 0 15px rgba(255,216,74,.45);
}

.square.move-target::after {
    content: "";
    position: absolute;
    width: 24%;
    height: 24%;
    border-radius: 50%;
    background: rgba(255,216,74,.85);
    box-shadow:
        0 0 10px rgba(255,216,74,.9);
    pointer-events: none;
}

.square.capture-target::after {
    content: "";
    position: absolute;
    width: 31%;
    height: 31%;
    border-radius: 50%;
    border: 3px solid #ffd84a;
    box-shadow:
        0 0 12px rgba(255,216,74,.9);
    pointer-events: none;
}

/* =========================================================
   CLASSIC CHECKER PIECE
   ========================================================= */

.piece {
    position: relative;
    width: 82%;
    height: 82%;
    border-radius: 50%;
    z-index: 5;
    cursor: pointer;

    transform: translateY(-1%);

    box-shadow:
        0 5px 5px rgba(0,0,0,.65),
        0 2px 2px rgba(0,0,0,.75);

    transition:
        transform .12s ease,
        filter .12s ease;
}

.piece:hover {
    transform: translateY(-4%) scale(1.04);
}

.piece.red {
    background:
        radial-gradient(
            circle at 32% 24%,
            #ffb0b0 0%,
            #ff5959 8%,
            #e71925 23%,
            #a90712 52%,
            #69050b 77%,
            #340207 100%
        );

    border: 2px solid #51040a;

    box-shadow:
        0 5px 6px rgba(0,0,0,.72),
        inset 0 3px 3px rgba(255,255,255,.45),
        inset 0 -5px 6px rgba(0,0,0,.45),
        0 0 7px rgba(255,30,30,.20);
}

.piece.black {
    background:
        radial-gradient(
            circle at 32% 24%,
            #9fa8b8 0%,
            #515a69 7%,
            #242b37 22%,
            #10151d 48%,
            #070a0f 74%,
            #020306 100%
        );

    border: 2px solid #010205;

    box-shadow:
        0 5px 6px rgba(0,0,0,.80),
        inset 0 3px 3px rgba(255,255,255,.30),
        inset 0 -5px 7px rgba(0,0,0,.72),
        0 0 7px rgba(255,255,255,.10);
}

/* Classic concentric raised ridges */
.piece::before {
    content: "";
    position: absolute;
    left: 10%;
    top: 10%;
    width: 80%;
    height: 80%;
    border-radius: 50%;
    pointer-events: none;

    border: 2px solid rgba(255,255,255,.20);

    box-shadow:
        inset 0 0 0 2px rgba(0,0,0,.24),
        inset 0 0 0 5px rgba(255,255,255,.10),
        inset 0 0 0 7px rgba(0,0,0,.20);
}

/* Smaller inner stepped ring */
.piece::after {
    content: "";
    position: absolute;
    left: 23%;
    top: 23%;
    width: 54%;
    height: 54%;
    border-radius: 50%;
    pointer-events: none;

    border: 1px solid rgba(255,255,255,.22);

    box-shadow:
        inset 0 0 0 2px rgba(0,0,0,.20),
        0 1px 1px rgba(255,255,255,.16);
}

/* Extra bottom rim gives the classic puck/stacked-ring appearance */
.piece .rim {
    position: absolute;
    left: 5%;
    top: 42%;
    width: 90%;
    height: 48%;
    border-radius: 0 0 50% 50%;
    border-bottom: 3px solid rgba(0,0,0,.35);
    pointer-events: none;
}

/* Gloss highlight */
.piece .shine {
    position: absolute;
    left: 19%;
    top: 10%;
    width: 35%;
    height: 18%;
    border-radius: 50%;
    transform: rotate(-22deg);
    background: linear-gradient(
        90deg,
        rgba(255,255,255,.48),
        rgba(255,255,255,0)
    );
    filter: blur(.4px);
    pointer-events: none;
}

/* =========================================================
   KINGS = TWO CLASSIC PIECES STACKED
   ========================================================= */

.piece.king {
    transform: translateY(-5%);
}

.piece.king::marker {
    display: none;
}

/*
   The king's second checker is created behind the main checker.
   No K letter is used.
*/
.piece.king .king-stack {
    position: absolute;
    left: 0;
    top: 11%;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    z-index: -1;
}

.piece.red.king .king-stack {
    background:
        radial-gradient(
            circle at 32% 24%,
            #ff8585 0%,
            #d71922 24%,
            #8d0710 58%,
            #470308 100%
        );
    border: 2px solid #4b0308;
    box-shadow:
        0 4px 5px rgba(0,0,0,.75),
        inset 0 2px 3px rgba(255,255,255,.25);
}

.piece.black.king .king-stack {
    background:
        radial-gradient(
            circle at 32% 24%,
            #737d8e 0%,
            #343b48 23%,
            #11161e 58%,
            #030407 100%
        );
    border: 2px solid #010204;
    box-shadow:
        0 4px 5px rgba(0,0,0,.78),
        inset 0 2px 3px rgba(255,255,255,.20);
}

.piece.king .king-stack::before {
    content: "";
    position: absolute;
    left: 10%;
    top: 10%;
    width: 80%;
    height: 80%;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.14);
    box-shadow:
        inset 0 0 0 3px rgba(0,0,0,.25);
}

/* ========================================================= */

.legend {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    min-height: 20px;
    margin-top: 3px;
    font-size: clamp(9px, 1.4vw, 12px);
    opacity: .72;
    flex-shrink: 0;
}

.legend span {
    display: flex;
    align-items: center;
    gap: 4px;
}

.dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 1px 2px #000;
}

.dot.red {
    background: #d71922;
}

.dot.black {
    background: #111;
    border: 1px solid #555;
}

.footer {
    min-height: 15px;
    margin-top: 2px;
    font-size: clamp(7px, 1.1vw, 10px);
    letter-spacing: 1px;
    opacity: .35;
    flex-shrink: 0;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {
    .game {
        padding: 5px 5px;
    }

    h1 {
        letter-spacing: 2px;
    }

    .subtitle {
        letter-spacing: 1px;
    }

    .controls {
        gap: 4px;
        margin-bottom: 3px;
    }

    button,
    select {
        padding: 5px 7px;
        border-radius: 6px;
    }

    .status {
        margin-bottom: 2px;
    }

    .board {
        padding: 3px;
        border-radius: 8px;
    }

    .piece {
        width: 84%;
        height: 84%;
    }

    .legend {
        margin-top: 1px;
        gap: 8px;
    }

    .footer {
        display: none;
    }
}
</style>
</head>

<body>

<div class="game">

    <h1>CHECKERS</h1>

    <div class="subtitle">
        CLASSIC • GLOSSY • TWO PLAYER
    </div>

    <div class="controls">

        <button id="twoPlayerBtn">
            2 PLAYERS
        </button>

        <button id="computerBtn">
            VS COMPUTER
        </button>

        <select id="difficulty">
            <option value="easy">EASY</option>
            <option value="medium" selected>MEDIUM</option>
            <option value="hard">HARD</option>
        </select>

        <button id="newGameBtn">
            NEW GAME
        </button>

        <button id="menuBtn">
            GAME ROOM
        </button>

    </div>

    <div class="status" id="status">
        Red's turn
    </div>

    <div class="board-area" id="boardArea">
        <div class="board" id="board"></div>
    </div>

    <div class="legend">
        <span>
            <i class="dot red"></i>
            RED
        </span>

        <span>
            <i class="dot black"></i>
            BLACK
        </span>

        <span>
            STACKED = KING
        </span>
    </div>

    <div class="footer">
        GAME ROOM • CHECKERS
    </div>

</div>

<script>
"use strict";

/* =========================================================
   CHECKERS GAME
   ========================================================= */

const boardElement = document.getElementById("board");
const boardArea = document.getElementById("boardArea");
const statusElement = document.getElementById("status");

const twoPlayerBtn = document.getElementById("twoPlayerBtn");
const computerBtn = document.getElementById("computerBtn");
const difficultySelect = document.getElementById("difficulty");
const newGameBtn = document.getElementById("newGameBtn");
const menuBtn = document.getElementById("menuBtn");

let board = [];
let currentPlayer = "r";
let selected = null;
let legalTargets = [];
let forcedPiece = null;
let gameOver = false;

let gameMode = "2p";
let computerThinking = false;

const SIZE = 8;

/*
    r = red
    b = black
    uppercase = king

    Red starts at the bottom and moves upward.
    Black starts at the top and moves downward.
*/

/* =========================================================
   BOARD SETUP
   ========================================================= */

function createInitialBoard() {

    board = Array.from(
        { length: SIZE },
        () => Array(SIZE).fill(null)
    );

    // Black pieces at top
    for (let row = 0; row < 3; row++) {

        for (let col = 0; col < SIZE; col++) {

            if ((row + col) % 2 === 1) {
                board[row][col] = "b";
            }
        }
    }

    // Red pieces at bottom
    for (let row = 5; row < 8; row++) {

        for (let col = 0; col < SIZE; col++) {

            if ((row + col) % 2 === 1) {
                board[row][col] = "r";
            }
        }
    }
}

/* =========================================================
   RENDER BOARD
   ========================================================= */

function render() {

    boardElement.innerHTML = "";

    for (let row = 0; row < SIZE; row++) {

        for (let col = 0; col < SIZE; col++) {

            const square = document.createElement("div");

            square.className =
                "square " +
                ((row + col) % 2 === 0 ? "light" : "dark");

            square.dataset.row = row;
            square.dataset.col = col;

            if (
                selected &&
                selected.row === row &&
                selected.col === col
            ) {
                square.classList.add("selected");
            }

            const target = legalTargets.find(
                move =>
                    move.row === row &&
                    move.col === col
            );

            if (target) {

                if (target.capture) {
                    square.classList.add("capture-target");
                } else {
                    square.classList.add("move-target");
                }
            }

            const piece = board[row][col];

            if (piece) {

                const pieceElement =
                    document.createElement("div");

                const color =
                    piece.toLowerCase();

                const king =
                    piece === piece.toUpperCase();

                pieceElement.className =
                    "piece " +
                    (color === "r" ? "red" : "black") +
                    (king ? " king" : "");

                const rim =
                    document.createElement("div");

                rim.className = "rim";

                const shine =
                    document.createElement("div");

                shine.className = "shine";

                pieceElement.appendChild(rim);
                pieceElement.appendChild(shine);

                if (king) {

                    const stack =
                        document.createElement("div");

                    stack.className = "king-stack";

                    pieceElement.appendChild(stack);
                }

                square.appendChild(pieceElement);
            }

            square.addEventListener(
                "click",
                () => handleSquareClick(row, col)
            );

            boardElement.appendChild(square);
        }
    }
}

/* =========================================================
   RESPONSIVE BOARD SIZE
   ========================================================= */

function fitBoard() {

    const areaRect =
        boardArea.getBoundingClientRect();

    const availableWidth =
        areaRect.width - 4;

    const availableHeight =
        areaRect.height - 4;

    let size =
        Math.min(
            availableWidth,
            availableHeight
        );

    /*
       Don't let a desktop board become absurdly large.
       But allow a large monitor to use more of the screen.
    */
    size = Math.min(size, 760);

    /*
       On extremely small screens, use whatever space exists.
    */
    size = Math.max(size, 0);

    boardElement.style.setProperty(
        "--board-size",
        size + "px"
    );
}

window.addEventListener("resize", fitBoard);

if (window.visualViewport) {
    window.visualViewport.addEventListener(
        "resize",
        fitBoard
    );
}

const resizeObserver =
    new ResizeObserver(fitBoard);

resizeObserver.observe(boardArea);

/* =========================================================
   GAME START
   ========================================================= */

function startGame() {

    createInitialBoard();

    currentPlayer = "r";
    selected = null;
    legalTargets = [];
    forcedPiece = null;
    gameOver = false;
    computerThinking = false;

    updateStatus();
    render();

    requestAnimationFrame(fitBoard);
}

/* =========================================================
   PIECE HELPERS
   ========================================================= */

function isRed(piece) {
    return piece && piece.toLowerCase() === "r";
}

function isBlack(piece) {
    return piece && piece.toLowerCase() === "b";
}

function isKing(piece) {
    return piece && piece === piece.toUpperCase();
}

function belongsTo(piece, player) {

    if (!piece) {
        return false;
    }

    return piece.toLowerCase() === player;
}

/* =========================================================
   DIRECTIONS
   ========================================================= */

function getDirections(piece) {

    if (isKing(piece)) {

        return [
            [-1, -1],
            [-1, 1],
            [1, -1],
            [1, 1]
        ];
    }

    /*
       Red moves upward.
       Black moves downward.
    */

    if (piece.toLowerCase() === "r") {

        return [
            [-1, -1],
            [-1, 1]
        ];
    }

    return [
        [1, -1],
        [1, 1]
    ];
}

function inside(row, col) {

    return (
        row >= 0 &&
        row < SIZE &&
        col >= 0 &&
        col < SIZE
    );
}

/* =========================================================
   SIMPLE MOVES
   ========================================================= */

function getSimpleMoves(row, col) {

    const piece = board[row][col];

    if (!piece) {
        return [];
    }

    const moves = [];

    for (const [dr, dc] of getDirections(piece)) {

        const nr = row + dr;
        const nc = col + dc;

        if (
            inside(nr, nc) &&
            !board[nr][nc]
        ) {

            moves.push({
                row: nr,
                col: nc,
                capture: null
            });
        }
    }

    return moves;
}

/* =========================================================
   CAPTURE MOVES
   ========================================================= */

function getCaptureMoves(row, col) {

    const piece = board[row][col];

    if (!piece) {
        return [];
    }

    const moves = [];

    for (const [dr, dc] of getDirections(piece)) {

        const middleRow = row + dr;
        const middleCol = col + dc;

        const landingRow = row + dr * 2;
        const landingCol = col + dc * 2;

        if (
            inside(landingRow, landingCol) &&
            board[middleRow]?.[middleCol] &&
            !board[landingRow][landingCol]
        ) {

            const middlePiece =
                board[middleRow][middleCol];

            if (
                middlePiece.toLowerCase() !==
                piece.toLowerCase()
            ) {

                moves.push({
                    row: landingRow,
                    col: landingCol,
                    capture: {
                        row: middleRow,
                        col: middleCol
                    }
                });
            }
        }
    }

    return moves;
}

/* =========================================================
   ALL MOVES FOR A PLAYER
   ========================================================= */

function getAllMoves(player) {

    const captures = [];
    const simple = [];

    for (let row = 0; row < SIZE; row++) {

        for (let col = 0; col < SIZE; col++) {

            const piece = board[row][col];

            if (!belongsTo(piece, player)) {
                continue;
            }

            for (const move of getCaptureMoves(row, col)) {

                captures.push({
                    from: { row, col },
                    to: {
                        row: move.row,
                        col: move.col
                    },
                    capture: move.capture
                });
            }
        }
    }

    /*
       Checkers requires captures whenever one exists.
    */

    if (captures.length > 0) {
        return captures;
    }

    for (let row = 0; row < SIZE; row++) {

        for (let col = 0; col < SIZE; col++) {

            const piece = board[row][col];

            if (!belongsTo(piece, player)) {
                continue;
            }

            for (const move of getSimpleMoves(row, col)) {

                simple.push({
                    from: { row, col },
                    to: {
                        row: move.row,
                        col: move.col
                    },
                    capture: null
                });
            }
        }
    }

    return simple;
}

/* =========================================================
   CLICK HANDLING
   ========================================================= */

function handleSquareClick(row, col) {

    if (gameOver || computerThinking) {
        return;
    }

    if (
        gameMode === "computer" &&
        currentPlayer === "b"
    ) {
        return;
    }

    const piece = board[row][col];

    /*
       If a piece is already selected,
       see whether this click is a legal target.
    */

    if (selected) {

        const target =
            legalTargets.find(
                move =>
                    move.row === row &&
                    move.col === col
            );

        if (target) {

            makeHumanMove(
                selected.row,
                selected.col,
                target
            );

            return;
        }
    }

    /*
       Selecting a piece.
    */

    if (
        piece &&
        belongsTo(piece, currentPlayer)
    ) {

        /*
           During multiple jumps, only the
           same piece can continue moving.
        */
        if (
            forcedPiece &&
            (
                forcedPiece.row !== row ||
                forcedPiece.col !== col
            )
        ) {
            return;
        }

        const captures =
            getCaptureMoves(row, col);

        const allCaptures =
            getAllMoves(currentPlayer)
                .filter(move => move.capture);

        /*
           If any capture exists, this piece must
           have a capture available to be selected.
        */
        if (
            allCaptures.length > 0 &&
            captures.length === 0
        ) {
            return;
        }

        selected = {
            row,
            col
        };

        legalTargets =
            captures.length > 0
                ? captures
                : getSimpleMoves(row, col);

        render();
    }
}

/* =========================================================
   HUMAN MOVE
   ========================================================= */

function makeHumanMove(row, col, target) {

    movePiece(
        row,
        col,
        target.row,
        target.col,
        target.capture
    );

    /*
       Check for another jump.
    */

    if (target.capture) {

        const moreCaptures =
            getCaptureMoves(
                target.row,
                target.col
            );

        if (moreCaptures.length > 0) {

            selected = {
                row: target.row,
                col: target.col
            };

            forcedPiece = {
                row: target.row,
                col: target.col
            };

            legalTargets = moreCaptures;

            updateStatus(
                "Multiple jump — continue!"
            );

            render();

            return;
        }
    }

    finishTurn();
}

/* =========================================================
   MOVE PIECE
   ========================================================= */

function movePiece(
    fromRow,
    fromCol,
    toRow,
    toCol,
    capture
) {

    let piece =
        board[fromRow][fromCol];

    board[fromRow][fromCol] = null;

    board[toRow][toCol] = piece;

    if (capture) {

        board[capture.row][capture.col] =
            null;
    }

    /*
       Promotion.
    */

    if (
        piece === "r" &&
        toRow === 0
    ) {
        board[toRow][toCol] = "R";
    }

    if (
        piece === "b" &&
        toRow === 7
    ) {
        board[toRow][toCol] = "B";
    }
}

/* =========================================================
   FINISH TURN
   ========================================================= */

function finishTurn() {

    selected = null;
    legalTargets = [];
    forcedPiece = null;

    currentPlayer =
        currentPlayer === "r"
            ? "b"
            : "r";

    if (checkGameOver()) {
        return;
    }

    updateStatus();
    render();

    if (
        gameMode === "computer" &&
        currentPlayer === "b"
    ) {

        computerMove();
    }
}

/* =========================================================
   GAME OVER
   ========================================================= */

function checkGameOver() {

    const redPieces = countPieces("r");
    const blackPieces = countPieces("b");

    if (redPieces === 0) {

        gameOver = true;
        updateStatus("BLACK WINS!");
        render();
        return true;
    }

    if (blackPieces === 0) {

        gameOver = true;
        updateStatus("RED WINS!");
        render();
        return true;
    }

    const moves =
        getAllMoves(currentPlayer);

    if (moves.length === 0) {

        gameOver = true;

        const winner =
            currentPlayer === "r"
                ? "BLACK"
                : "RED";

        updateStatus(
            winner + " WINS!"
        );

        render();

        return true;
    }

    return false;
}

function countPieces(player) {

    let count = 0;

    for (let row = 0; row < SIZE; row++) {

        for (let col = 0; col < SIZE; col++) {

            if (
                belongsTo(
                    board[row][col],
                    player
                )
            ) {
                count++;
            }
        }
    }

    return count;
}

/* =========================================================
   STATUS
   ========================================================= */

function updateStatus(custom) {

    if (custom) {

        statusElement.textContent =
            custom;

        return;
    }

    if (gameOver) {
        return;
    }

    if (
        gameMode === "computer" &&
        currentPlayer === "b"
    ) {

        statusElement.textContent =
            "Computer's turn";

        return;
    }

    statusElement.textContent =
        currentPlayer === "r"
            ? "Red's turn"
            : "Black's turn";
}

/* =========================================================
   COMPUTER
   ========================================================= */

function computerMove() {

    if (gameOver) {
        return;
    }

    computerThinking = true;

    updateStatus("Computer is thinking...");

    render();

    /*
       Small delay makes the computer feel
       like it is actually playing.
    */

    setTimeout(() => {

        let moves =
            getAllMoves("b");

        if (moves.length === 0) {

            computerThinking = false;

            checkGameOver();

            return;
        }

        let chosen;

        if (difficultySelect.value === "easy") {

            chosen =
                chooseEasyMove(moves);

        } else if (
            difficultySelect.value === "medium"
        ) {

            chosen =
                chooseMediumMove(moves);

        } else {

            chosen =
                chooseHardMove(moves);
        }

        performComputerMove(chosen);

    }, 450);
}

/* =========================================================
   EASY AI
   ========================================================= */

function chooseEasyMove(moves) {

    return moves[
        Math.floor(
            Math.random() * moves.length
        )
    ];
}

/* =========================================================
   MEDIUM AI
   ========================================================= */

function chooseMediumMove(moves) {

    const captures =
        moves.filter(
            move => move.capture
        );

    if (captures.length > 0) {

        /*
           Prefer captures that promote.
        */

        const promotions =
            captures.filter(
                move =>
                    move.to.row === 7 &&
                    board[
                        move.from.row
                    ][move.from.col] === "b"
            );

        if (promotions.length > 0) {
            return promotions[
                Math.floor(
                    Math.random() *
                    promotions.length
                )
            ];
        }

        return captures[
            Math.floor(
                Math.random() *
                captures.length
            )
        ];
    }

    /*
       Prefer moving toward promotion.
    */

    const scored =
        moves.map(move => {

            let score =
                move.to.row * 2;

            if (isSafeSquare(
                move.to.row,
                move.to.col,
                "b"
            )) {
                score += 3;
            }

            return {
                move,
                score
            };
        });

    scored.sort(
        (a, b) => b.score - a.score
    );

    const top =
        scored.slice(
            0,
            Math.min(3, scored.length)
        );

    return top[
        Math.floor(
            Math.random() * top.length
        )
    ].move;
}

/* =========================================================
   HARD AI
   ========================================================= */

function chooseHardMove(moves) {

    /*
       Clone current position and use minimax.
    */

    let bestScore = -Infinity;
    let bestMoves = [];

    for (const move of moves) {

        const snapshot =
            cloneBoard(board);

        applyMoveToBoard(
            board,
            move
        );

        let score =
            minimax(
                board,
                4,
                false,
                -Infinity,
                Infinity
            );

        board = snapshot;

        if (score > bestScore) {

            bestScore = score;
            bestMoves = [move];

        } else if (
            score === bestScore
        ) {

            bestMoves.push(move);
        }
    }

    return bestMoves[
        Math.floor(
            Math.random() *
            bestMoves.length
        )
    ];
}

/* =========================================================
   MINIMAX
   ========================================================= */

function minimax(
    position,
    depth,
    maximizing,
    alpha,
    beta
) {

    const blackMoves =
        getMovesFromPosition(
            position,
            "b"
        );

    const redMoves =
        getMovesFromPosition(
            position,
            "r"
        );

    if (
        depth === 0 ||
        blackMoves.length === 0 ||
        redMoves.length === 0
    ) {

        return evaluatePosition(
            position
        );
    }

    if (maximizing) {

        let best = -Infinity;

        for (const move of blackMoves) {

            const next =
                cloneBoard(position);

            applyMoveToBoard(
                next,
                move
            );

            const value =
                minimax(
                    next,
                    depth - 1,
                    false,
                    alpha,
                    beta
                );

            best =
                Math.max(best, value);

            alpha =
                Math.max(alpha, best);

            if (beta <= alpha) {
                break;
            }
        }

        return best;

    } else {

        let best = Infinity;

        for (const move of redMoves) {

            const next =
                cloneBoard(position);

            applyMoveToBoard(
                next,
                move
            );

            const value =
                minimax(
                    next,
                    depth - 1,
                    true,
                    alpha,
                    beta
                );

            best =
                Math.min(best, value);

            beta =
                Math.min(beta, best);

            if (beta <= alpha) {
                break;
            }
        }

        return best;
    }
}

/* =========================================================
   AI MOVE GENERATION ON ARBITRARY BOARD
   ========================================================= */

function getMovesFromPosition(
    position,
    player
) {

    const captures = [];
    const simple = [];

    for (let row = 0; row < SIZE; row++) {

        for (let col = 0; col < SIZE; col++) {

            const piece =
                position[row][col];

            if (
                !belongsTo(piece, player)
            ) {
                continue;
            }

            const dirs =
                getDirections(piece);

            for (const [dr, dc] of dirs) {

                const mr =
                    row + dr;

                const mc =
                    col + dc;

                const lr =
                    row + dr * 2;

                const lc =
                    col + dc * 2;

                if (
                    inside(lr, lc) &&
                    position[mr]?.[mc] &&
                    !position[lr][lc] &&
                    position[mr][mc]
                        .toLowerCase() !==
                    piece.toLowerCase()
                ) {

                    captures.push({
                        from: {
                            row,
                            col
                        },
                        to: {
                            row: lr,
                            col: lc
                        },
                        capture: {
                            row: mr,
                            col: mc
                        }
                    });
                }
            }
        }
    }

    if (captures.length > 0) {
        return captures;
    }

    for (let row = 0; row < SIZE; row++) {

        for (let col = 0; col < SIZE; col++) {

            const piece =
                position[row][col];

            if (
                !belongsTo(piece, player)
            ) {
                continue;
            }

            for (
                const [dr, dc]
                of getDirections(piece)
            ) {

                const nr =
                    row + dr;

                const nc =
                    col + dc;

                if (
                    inside(nr, nc) &&
                    !position[nr][nc]
                ) {

                    simple.push({
                        from: {
                            row,
                            col
                        },
                        to: {
                            row: nr,
                            col: nc
                        },
                        capture: null
                    });
                }
            }
        }
    }

    return simple;
}

/* =========================================================
   APPLY AI/MINIMAX MOVE
   ========================================================= */

function applyMoveToBoard(
    position,
    move
) {

    let piece =
        position[
            move.from.row
        ][
            move.from.col
        ];

    position[
        move.from.row
    ][
        move.from.col
    ] = null;

    position[
        move.to.row
    ][
        move.to.col
    ] = piece;

    if (move.capture) {

        position[
            move.capture.row
        ][
            move.capture.col
        ] = null;
    }

    /*
       Promotion.
    */

    if (
        piece === "b" &&
        move.to.row === 7
    ) {

        position[
            move.to.row
        ][
            move.to.col
        ] = "B";
    }

    if (
        piece === "r" &&
        move.to.row === 0
    ) {

        position[
            move.to.row
        ][
            move.to.col
        ] = "R";
    }
}

/* =========================================================
   EVALUATION
   ========================================================= */

function evaluatePosition(position) {

    let score = 0;

    for (let row = 0; row < SIZE; row++) {

        for (let col = 0; col < SIZE; col++) {

            const piece =
                position[row][col];

            if (!piece) {
                continue;
            }

            const king =
                isKing(piece);

            let value =
                king ? 5 : 3;

            /*
               Position value.
            */

            if (!king) {

                if (piece === "b") {
                    value += row * 0.15;
                }

                if (piece === "r") {
                    value +=
                        (7 - row) * 0.15;
                }
            }

            /*
               Center control.
            */

            if (
                col >= 2 &&
                col <= 5 &&
                row >= 2 &&
                row <= 5
            ) {
                value += .3;
            }

            if (piece.toLowerCase() === "b") {
                score += value;
            } else {
                score -= value;
            }
        }
    }

    return score;
}

/* =========================================================
   SAFETY CHECK
   ========================================================= */

function isSafeSquare(
    row,
    col,
    player
) {

    const enemy =
        player === "r"
            ? "b"
            : "r";

    /*
       Check whether an enemy can capture
       this location.
    */

    for (let r = 0; r < SIZE; r++) {

        for (let c = 0; c < SIZE; c++) {

            const piece =
                board[r][c];

            if (
                !belongsTo(
                    piece,
                    enemy
                )
            ) {
                continue;
            }

            for (
                const move
                of getCaptureMoves(r, c)
            ) {

                if (
                    move.row === row &&
                    move.col === col
                ) {
                    return false;
                }
            }
        }
    }

    return true;
}

/* =========================================================
   CLONE
   ========================================================= */

function cloneBoard(position) {

    return position.map(
        row => row.slice()
    );
}

/* =========================================================
   COMPUTER MOVE EXECUTION
   ========================================================= */

function performComputerMove(move) {

    movePiece(
        move.from.row,
        move.from.col,
        move.to.row,
        move.to.col,
        move.capture
    );

    /*
       Computer can make multiple jumps.
    */

    if (move.capture) {

        const moreCaptures =
            getCaptureMoves(
                move.to.row,
                move.to.col
            );

        if (moreCaptures.length > 0) {

            /*
               Choose the first available continuation,
               with the same difficulty logic.
            */

            let continuation;

            if (
                difficultySelect.value === "easy"
            ) {

                continuation =
                    moreCaptures[
                        Math.floor(
                            Math.random() *
                            moreCaptures.length
                        )
                    ];

            } else {

                continuation =
                    moreCaptures[
                        Math.floor(
                            Math.random() *
                            moreCaptures.length
                        )
                    ];
            }

            setTimeout(() => {

                performComputerContinuation(
                    move.to.row,
                    move.to.col,
                    continuation
                );

            }, 250);

            return;
        }
    }

    computerThinking = false;

    finishTurn();
}

/* =========================================================
   COMPUTER MULTIPLE JUMP
   ========================================================= */

function performComputerContinuation(
    row,
    col,
    move
) {

    movePiece(
        row,
        col,
        move.row,
        move.col,
        move.capture
    );

    if (move.capture) {

        const more =
            getCaptureMoves(
                move.row,
                move.col
            );

        if (more.length > 0) {

            const next =
                more[
                    Math.floor(
                        Math.random() *
                        more.length
                    )
                ];

            setTimeout(() => {

                performComputerContinuation(
                    move.row,
                    move.col,
                    next
                );

            }, 250);

            return;
        }
    }

    computerThinking = false;

    finishTurn();
}
