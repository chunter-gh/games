<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkers</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at center, #333, #050505);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    min-height: 100vh;
}

h1 {
    margin: 12px 0 4px 0;
    font-size: 30px;
}

#status {
    font-size: 18px;
    margin: 8px;
    min-height: 24px;
}

#board {
    width: min(92vw, 600px);
    height: min(92vw, 600px);

    margin: 15px auto;

    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);

    border: 8px solid #b8860b;
    border-radius: 8px;

    box-shadow:
        0 0 20px black,
        inset 0 0 10px #000;

    touch-action: manipulation;
}

.square {
    position: relative;

    display: flex;
    justify-content: center;
    align-items: center;

    user-select: none;
    -webkit-user-select: none;

    touch-action: manipulation;
}

.light {
    background:
        linear-gradient(
            135deg,
            #f5e1b8,
            #c9a875
        );
}

.dark {
    background:
        linear-gradient(
            135deg,
            #8b0000,
            #3d0000
        );
}


/* =========================================================
   PIECES
   ========================================================= */

.piece {
    width: 78%;
    height: 78%;

    border-radius: 50%;

    position: relative;

    border: 3px solid #111;

    box-shadow:
        inset 0 5px 8px rgba(255,255,255,.35),
        inset 0 -8px 12px rgba(0,0,0,.65),
        0 5px 8px rgba(0,0,0,.7);

    transition:
        transform .12s,
        box-shadow .12s;

    cursor: pointer;
}

.piece:hover {
    transform: scale(1.05);
}


/* RED */

.red {
    background:
        radial-gradient(
            circle at 35% 25%,
            #ff7777,
            #d40000 45%,
            #650000 100%
        );
}


/* BLACK */

.black {
    background:
        radial-gradient(
            circle at 35% 25%,
            #777,
            #222 45%,
            #000 100%
        );
}


/* =========================================================
   SELECTED PIECE
   ========================================================= */

.selected {
    box-shadow:
        0 0 0 5px yellow,
        0 0 20px yellow,
        inset 0 5px 8px rgba(255,255,255,.4),
        inset 0 -8px 12px rgba(0,0,0,.7);

    transform: scale(1.08);
}


/* =========================================================
   KING
   ========================================================= */

.king::after {
    content: "♛";

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -53%);

    font-size: 34px;

    color: #ffd700;

    text-shadow:
        1px 1px 2px black,
        0 0 5px #fff000;
}


/* =========================================================
   POSSIBLE MOVE
   ========================================================= */

.possible {
    box-shadow:
        inset 0 0 0 6px #ffff00,
        inset 0 0 20px #ffff00;
}

.possible::after {
    content: "";

    position: absolute;

    width: 30%;
    height: 30%;

    border-radius: 50%;

    background: #ffff00;

    box-shadow:
        0 0 12px #ffff00,
        0 0 25px #ffff00;

    pointer-events: none;
}


/* =========================================================
   BUTTON
   ========================================================= */

button {
    font-size: 18px;

    padding: 10px 22px;

    border-radius: 8px;

    border: 2px solid #b8860b;

    background:
        linear-gradient(
            #444,
            #111
        );

    color: white;

    cursor: pointer;
}

button:active {
    transform: scale(.96);
}

</style>
</head>


<body>

<h1>CHECKERS</h1>

<div id="status">
    Connecting...
</div>

<div id="board"></div>

<button id="newGame">
    NEW GAME
</button>


<script>

const boardElement =
    document.getElementById("board");

const statusElement =
    document.getElementById("status");

const newGameButton =
    document.getElementById("newGame");


/* =========================================================
   CONNECTION
   ========================================================= */

const socket =
    new WebSocket(
        "wss://games-z5k2.onrender.com/checkers"
    );


/* =========================================================
   LOCAL GAME STATE
   ========================================================= */

let myColor = null;

let board = [];

let currentPlayer = null;

let gameOver = false;

let winner = null;

let forcedPiece = null;

let selectedRow = null;

let selectedCol = null;


/* =========================================================
   CONNECTION OPEN
   ========================================================= */

socket.addEventListener(
    "open",
    () => {

        statusElement.textContent =
            "Connected — waiting for players...";
    }
);


/* =========================================================
   ASSIGN PLAYER
   ========================================================= */

socket.addEventListener(
    "message",
    event => {

        let data;

        try {
            data = JSON.parse(event.data);
        }
        catch (error) {
            return;
        }


        /* -------------------------------------------------
           PLAYER ASSIGNMENT
           ------------------------------------------------- */

        if (data.type === "assign") {

            myColor = data.color;

            statusElement.textContent =
                "You are " +
                myColor.toUpperCase();

            return;
        }


        /* -------------------------------------------------
           ERROR
           ------------------------------------------------- */

        if (data.type === "error") {

            statusElement.textContent =
                data.message;

            return;
        }


        /* -------------------------------------------------
           GAME STATE
           ------------------------------------------------- */

        if (data.type === "state") {

            board =
                data.board;

            currentPlayer =
                data.currentPlayer;

            gameOver =
                data.gameOver;

            winner =
                data.winner;

            forcedPiece =
                data.forcedPiece;

            selectedRow = null;
            selectedCol = null;

            drawBoard();

            updateStatus();

            return;
        }
    }
);


/* =========================================================
   DRAW BOARD
   ========================================================= */

function drawBoard() {

    boardElement.innerHTML = "";


    for (
        let row = 0;
        row < 8;
        row++
    ) {

        for (
            let col = 0;
            col < 8;
            col++
        ) {

            const square =
                document.createElement("div");

            square.className =
                "square " +
                (
                    (row + col) % 2 === 0
                        ? "light"
                        : "dark"
                );


            square.dataset.row = row;
            square.dataset.col = col;


            /*
             * TOUCH / CLICK
             */

            square.addEventListener(
                "pointerdown",
                function(event) {

                    event.preventDefault();

                    handleSquareTap(
                        row,
                        col
                    );
                }
            );


            const piece =
                board[row] &&
                board[row][col];


            if (piece) {

                const pieceElement =
                    document.createElement("div");

                pieceElement.className =
                    "piece " +
                    piece.color;


                if (piece.king) {

                    pieceElement.classList.add(
                        "king"
                    );
                }


                /*
                 * SELECTED PIECE
                 */

                if (
                    selectedRow === row &&
                    selectedCol === col
                ) {

                    pieceElement.classList.add(
                        "selected"
                    );
                }


                square.appendChild(
                    pieceElement
                );
            }


            boardElement.appendChild(
                square
            );
        }
    }


    /*
     * IMPORTANT:
     * Draw possible destinations AFTER
     * the board has been created.
     */

    if (
        selectedRow !== null &&
        selectedCol !== null
    ) {

        highlightMoves(
            selectedRow,
            selectedCol
        );
    }
}


/* =========================================================
   HANDLE TAP
   ========================================================= */

function handleSquareTap(
    row,
    col
) {

    if (gameOver) {
        return;
    }


    if (!myColor) {
        return;
    }


    /*
     * Only the player whose turn it is
     * can select a piece.
     */

    if (
        currentPlayer !== myColor
    ) {
        return;
    }


    const piece =
        board[row][col];


    /* -----------------------------------------------------
       NOTHING SELECTED YET
       ----------------------------------------------------- */

    if (
        selectedRow === null
    ) {

        if (
            piece &&
            piece.color === myColor
        ) {

            selectPiece(
                row,
                col
            );
        }

        return;
    }


    /* -----------------------------------------------------
       TAP ANOTHER OWN PIECE
       ----------------------------------------------------- */

    if (
        piece &&
        piece.color === myColor
    ) {

        selectPiece(
            row,
            col
        );

        return;
    }


    /* -----------------------------------------------------
       TAP DESTINATION
       ----------------------------------------------------- */

    if (
        isLegalDestination(
            selectedRow,
            selectedCol,
            row,
            col
        )
    ) {

        sendMove(
            selectedRow,
            selectedCol,
            row,
            col
        );

        return;
    }


    /*
     * Anything else clears selection.
     */

    selectedRow = null;
    selectedCol = null;

    drawBoard();
}


/* =========================================================
   SELECT PIECE
   ========================================================= */

function selectPiece(
    row,
    col
) {

    selectedRow = row;
    selectedCol = col;

    drawBoard();
}


/* =========================================================
   HIGHLIGHT POSSIBLE MOVES
   ========================================================= */

function highlightMoves(
    fromRow,
    fromCol
) {

    const destinations =
        getLegalDestinations(
            fromRow,
            fromCol
        );


    for (
        const destination
        of destinations
    ) {

        const square =
            getSquare(
                destination.row,
                destination.col
            );


        if (square) {

            square.classList.add(
                "possible"
            );
        }
    }
}


/* =========================================================
   GET LEGAL DESTINATIONS
   ========================================================= */

function getLegalDestinations(
    row,
    col
) {

    const piece =
        board[row][col];


    if (!piece) {
        return [];
    }


    if (
        piece.color !== myColor
    ) {

        return [];
    }


    /*
     * Forced multi-jump:
     * only the forced piece may move.
     */

    if (forcedPiece) {

        if (
            forcedPiece.row !== row ||
            forcedPiece.col !== col
        ) {

            return [];
        }
    }


    const destinations = [];


    /*
     * Check whether ANY capture exists.
     */

    const playerMustCapture =
        playerHasCapture(
            myColor
        );


    /*
     * CAPTURES
     */

    if (
        playerMustCapture ||
        forcedPiece
    ) {

        const captures =
            getCaptures(
                row,
                col
            );


        for (
            const capture
            of captures
        ) {

            destinations.push({
                row: capture.row,
                col: capture.col
            });
        }


        return destinations;
    }


    /*
     * NORMAL MOVEMENT
     */

    const directions =
        getDirections(piece);


    for (
        const direction
        of directions
    ) {

        const newRow =
            row + direction.dr;

        const newCol =
            col + direction.dc;


        if (
            insideBoard(
                newRow,
                newCol
            ) &&
            board[newRow][newCol] === null
        ) {

            destinations.push({

                row: newRow,

                col: newCol
            });
        }
    }


    return destinations;
}


/* =========================================================
   GET DIRECTIONS
   ========================================================= */

function getDirections(
    piece
) {

    const directions = [];


    /*
     * RED starts at bottom and moves UP.
     */

    if (
        piece.king ||
        piece.color === "red"
    ) {

        directions.push(
            { dr: -1, dc: -1 },
            { dr: -1, dc: 1 }
        );
    }


    /*
     * BLACK starts at top and moves DOWN.
     */

    if (
        piece.king ||
        piece.color === "black"
    ) {

        directions.push(
            { dr: 1, dc: -1 },
            { dr: 1, dc: 1 }
        );
    }


    return directions;
}


/* =========================================================
   GET CAPTURES
   ========================================================= */

function getCaptures(
    row,
    col
) {

    const piece =
        board[row][col];


    if (!piece) {
        return [];
    }


    const directions =
        getDirections(piece);


    const captures = [];


    for (
        const direction
        of directions
    ) {

        const middleRow =
            row + direction.dr;

        const middleCol =
            col + direction.dc;

        const landingRow =
            row + direction.dr * 2;

        const landingCol =
            col + direction.dc * 2;


        if (
            !insideBoard(
                middleRow,
                middleCol
            )
        ) {
            continue;
        }


        if (
            !insideBoard(
                landingRow,
                landingCol
            )
        ) {
            continue;
        }


        const middlePiece =
            board[middleRow][middleCol];


        const landingPiece =
            board[landingRow][landingCol];


        if (
            middlePiece &&
            middlePiece.color !== piece.color &&
            landingPiece === null
        ) {

            captures.push({

                row: landingRow,

                col: landingCol,

                captureRow: middleRow,

                captureCol: middleCol
            });
        }
    }


    return captures;
}


/* =========================================================
   DOES PLAYER HAVE CAPTURE?
   ========================================================= */

function playerHasCapture(
    color
) {

    for (
        let row = 0;
        row < 8;
        row++
    ) {

        for (
            let col = 0;
            col < 8;
            col++
        ) {

            const piece =
                board[row][col];


            if (
                piece &&
                piece.color === color
            ) {

                if (
                    getCaptures(
                        row,
                        col
                    ).length > 0
                ) {

                    return true;
                }
            }
        }
    }


    return false;
}


/* =========================================================
   IS LEGAL DESTINATION
   ========================================================= */

function isLegalDestination(
    fromRow,
    fromCol,
    toRow,
    toCol
) {

    const destinations =
        getLegalDestinations(
            fromRow,
            fromCol
        );


    return destinations.some(
        destination =>
            destination.row === toRow &&
            destination.col === toCol
    );
}


/* =========================================================
   SEND MOVE
   ========================================================= */

function sendMove(
    fromRow,
    fromCol,
    toRow,
    toCol
) {

    if (
        socket.readyState !==
        WebSocket.OPEN
    ) {

        return;
    }


    socket.send(
        JSON.stringify({

            type: "move",

            fromRow: fromRow,

            fromCol: fromCol,

            toRow: toRow,

            toCol: toCol
        })
    );


    /*
     * Clear local selection.
     * Server state will redraw the board.
     */

    selectedRow = null;
    selectedCol = null;
}


/* =========================================================
   GET SQUARE
   ========================================================= */

function getSquare(
    row,
    col
) {

    return document.querySelector(
        '.square[data-row="' +
        row +
        '"][data-col="' +
        col +
        '"]'
    );
}


/* =========================================================
   INSIDE BOARD
   ========================================================= */

function insideBoard(
    row,
    col
) {

    return (
        row >= 0 &&
        row < 8 &&
        col >= 0 &&
        col < 8
    );
}


/* =========================================================
   STATUS
   ========================================================= */

function updateStatus() {

    if (!myColor) {

        statusElement.textContent =
            "Connecting...";

        return;
    }


    if (gameOver) {

        if (winner) {

            statusElement.textContent =
                winner.toUpperCase() +
                " WINS!";
        }
        else {

            statusElement.textContent =
                "GAME OVER";
        }

        return;
    }


    if (
        !board ||
        board.length !== 8
    ) {

        statusElement.textContent =
            "Waiting for game...";

        return;
    }


    if (
        currentPlayer === myColor
    ) {

        statusElement.textContent =
            "YOUR TURN — " +
            myColor.toUpperCase();
    }
    else {

        statusElement.textContent =
            currentPlayer.toUpperCase() +
            " TURN";
    }
}


/* =========================================================
   NEW GAME
   ========================================================= */

newGameButton.addEventListener(
    "click",
    () => {

        if (
            socket.readyState ===
            WebSocket.OPEN
        ) {

            socket.send(
                JSON.stringify({
                    type: "new_game"
                })
            );
        }
    }
);


/* =========================================================
   CONNECTION CLOSED
   ========================================================= */

socket.addEventListener(
    "close",
    () => {

        statusElement.textContent =
            "Connection closed.";
    }
);


/* =========================================================
   CONNECTION ERROR
   ========================================================= */

socket.addEventListener(
    "error",
    () => {

        statusElement.textContent =
            "Connection error.";
    }
);

</script>

</body>
</html>
