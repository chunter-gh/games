<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(circle at 30% 10%, #263d62 0%, #090f19 65%);

    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
}

.game {
    width: min(96vw, 650px);
    text-align: center;
    padding: 12px;
}

h1 {
    margin: 5px 0 2px;

    font-size: clamp(28px, 7vw, 44px);
    letter-spacing: 4px;

    text-shadow:
        0 3px 8px #000,
        0 0 15px #79bfff;
}

#status {
    min-height: 28px;
    margin: 5px 0 10px;

    font-size: 18px;
    font-weight: bold;

    text-shadow: 0 2px 4px #000;
}

#board {
    width: min(92vw, 600px);
    height: min(92vw, 600px);

    margin: auto;

    display: grid;

    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);

    border: 8px solid #090909;
    border-radius: 12px;

    overflow: hidden;

    box-shadow:
        0 15px 35px rgba(0,0,0,.85),
        0 0 25px rgba(255,255,255,.12),
        inset 0 0 12px rgba(255,255,255,.35);

    touch-action: manipulation;
}

.square {
    position: relative;

    display: flex;
    justify-content: center;
    align-items: center;

    cursor: pointer;
    user-select: none;
}

/* =========================================================
   SHINY BOARD
========================================================= */

.light {
    background:
        linear-gradient(
            135deg,
            #ff4b4b 0%,
            #c80000 35%,
            #760000 75%,
            #3a0000 100%
        );

    box-shadow:
        inset 2px 2px 5px rgba(255,255,255,.25),
        inset -3px -3px 7px rgba(0,0,0,.45);
}

.dark {
    background:
        linear-gradient(
            135deg,
            #4a4a4a 0%,
            #202020 35%,
            #080808 75%,
            #000000 100%
        );

    box-shadow:
        inset 2px 2px 5px rgba(255,255,255,.18),
        inset -3px -3px 7px rgba(0,0,0,.8);
}

/* subtle shine across every square */

.square::after {
    content: "";

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 45%;

    background:
        linear-gradient(
            to bottom,
            rgba(255,255,255,.16),
            rgba(255,255,255,0)
        );

    pointer-events: none;
}

/* =========================================================
   SELECTION / MOVES
========================================================= */

.selected {
    box-shadow:
        inset 0 0 0 5px #ffe600,
        inset 0 0 20px #fff000,
        0 0 12px #ffe600;
}

.possible {
    box-shadow:
        inset 0 0 0 5px #35ff72,
        inset 0 0 18px #20ff55;
}

.possible::before {
    content: "";

    position: absolute;

    width: 25%;
    height: 25%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ffffff,
            #35ff72 35%,
            #00a83b 100%
        );

    box-shadow:
        0 0 8px #20ff55,
        0 0 16px #20ff55;

    z-index: 3;
}

.forced {
    box-shadow:
        inset 0 0 0 5px #00eaff,
        inset 0 0 20px #00eaff,
        0 0 12px #00eaff;
}

/* =========================================================
   CLASSIC HIGH-SHINE CHECKER PIECES
========================================================= */

.piece {
    width: 78%;
    height: 78%;

    border-radius: 50%;

    position: relative;

    border: 3px solid rgba(0,0,0,.8);

    pointer-events: none;

    box-shadow:
        0 7px 8px rgba(0,0,0,.85),
        0 2px 3px rgba(255,255,255,.35),
        inset 0 5px 7px rgba(255,255,255,.55),
        inset 0 -8px 10px rgba(0,0,0,.65);

    transition:
        transform .12s ease,
        box-shadow .12s ease;
}

/* =========================================================
   HIGH-SHINE RED PIECE
========================================================= */

.red-piece {
    background:
        radial-gradient(
            circle at 30% 22%,
            #ffffff 0%,
            #ffb0b0 5%,
            #ff5555 14%,
            #e00000 32%,
            #a00000 62%,
            #4d0000 88%,
            #1f0000 100%
        );

    box-shadow:
        0 8px 9px rgba(0,0,0,.85),
        0 0 8px rgba(255,40,40,.35),
        inset 0 6px 9px rgba(255,255,255,.65),
        inset 0 -9px 12px rgba(0,0,0,.7);
}

/* =========================================================
   HIGH-SHINE BLACK PIECE
========================================================= */

.black-piece {
    background:
        radial-gradient(
            circle at 30% 22%,
            #ffffff 0%,
            #bcbcbc 5%,
            #686868 13%,
            #303030 30%,
            #111111 58%,
            #030303 82%,
            #000000 100%
        );

    box-shadow:
        0 8px 9px rgba(0,0,0,.9),
        0 0 8px rgba(255,255,255,.15),
        inset 0 6px 9px rgba(255,255,255,.55),
        inset 0 -9px 12px rgba(0,0,0,.9);
}

/* =========================================================
   CLASSIC PIECE RIM
========================================================= */

.piece::after {
    content: "";

    position: absolute;

    left: 7%;
    right: 7%;

    bottom: -8px;

    height: 10px;

    border-radius: 50%;

    background:
        linear-gradient(
            to bottom,
            #111,
            #000
        );

    box-shadow:
        0 2px 3px rgba(0,0,0,.8);

    z-index: -1;
}

/* =========================================================
   GLASS-LIKE HIGHLIGHT
========================================================= */

.piece::before {
    content: "";

    position: absolute;

    left: 18%;
    top: 12%;

    width: 34%;
    height: 18%;

    border-radius: 50%;

    background:
        linear-gradient(
            to bottom,
            rgba(255,255,255,.9),
            rgba(255,255,255,.15)
        );

    transform: rotate(-20deg);

    filter: blur(1px);

    opacity: .8;
}

/* =========================================================
   KINGS
========================================================= */

.king::before {
    content: "♛";

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -53%);

    font-size: clamp(20px, 6vw, 36px);

    color: #ffd700;

    text-shadow:
        0 2px 2px #000,
        0 0 5px #fff,
        0 0 10px #ffd700;

    z-index: 5;
}

/* =========================================================
   BUTTONS
========================================================= */

.controls {
    display: flex;
    justify-content: center;

    gap: 10px;

    margin-top: 14px;

    flex-wrap: wrap;
}

button {
    border: 0;
    border-radius: 10px;

    padding: 12px 22px;

    font-size: 16px;
    font-weight: bold;

    color: white;

    background:
        linear-gradient(
            #347cc5,
            #12365e
        );

    box-shadow:
        0 4px 8px rgba(0,0,0,.5),
        inset 0 1px 1px rgba(255,255,255,.4);

    cursor: pointer;
}

button:active {
    transform: translateY(2px);
}

/* =========================================================
   RULES
========================================================= */

#rules {
    position: fixed;

    inset: 0;

    display: none;

    background: rgba(0,0,0,.75);

    justify-content: center;
    align-items: center;

    padding: 20px;

    z-index: 100;
}

.rules-box {
    max-width: 450px;

    background:
        linear-gradient(
            145deg,
            #182d4b,
            #091321
        );

    border: 2px solid #4f8fd0;

    border-radius: 15px;

    padding: 22px;

    text-align: left;

    box-shadow: 0 15px 50px #000;
}

.rules-box h2 {
    margin-top: 0;
    text-align: center;
}

.rules-box li {
    margin: 9px 0;
    line-height: 1.35;
}

#connection {
    font-size: 13px;
    opacity: .75;
    margin-top: 8px;
}

</style>
