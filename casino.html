<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Casino • Game Room</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}
body{color:white;background:radial-gradient(circle at 50% 17%,#32365f 0%,#15182f 48%,#080914 100%)}
.casino-room{position:relative;min-height:100dvh;overflow:hidden;display:flex;flex-direction:column;align-items:center}
.glow{position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%);left:50%;top:-130px;transform:translateX(-50%);pointer-events:none}
.title-area{position:relative;z-index:1;text-align:center;padding-top:clamp(24px,5vh,55px)}
.title{margin:0;font-size:clamp(34px,8vw,62px);font-weight:900;letter-spacing:4px;text-shadow:0 3px 0 #14283e,0 6px 12px rgba(0,0,0,.8),0 0 20px rgba(120,200,255,.45)}
.subtitle{margin-top:5px;font-size:clamp(10px,1.7vw,13px);letter-spacing:5px;color:#b9d7ee}
.menu{position:relative;z-index:1;width:min(82vw,370px);margin:clamp(10px,2vh,24px) auto auto;display:flex;flex-direction:column;gap:12px;padding:20px 6px}
.game-button{width:100%;min-height:82px;border:1px solid rgba(255,255,255,.35);border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.19),rgba(255,255,255,.04) 45%,rgba(0,0,0,.13)),linear-gradient(135deg,rgba(25,76,115,.54),rgba(8,35,58,.48));box-shadow:inset 0 2px 2px rgba(255,255,255,.35),inset 0 -7px 12px rgba(0,0,0,.25),0 10px 20px rgba(0,0,0,.45);color:white;cursor:pointer;display:flex;align-items:center;padding:0 25px;text-decoration:none;transition:transform .15s ease,box-shadow .15s ease}
.game-button:active{transform:scale(.96);box-shadow:inset 0 5px 12px rgba(0,0,0,.35),0 4px 8px rgba(0,0,0,.4)}
.game-button:focus-visible,.back:focus-visible{outline:3px solid #f8d78e;outline-offset:4px}
.icon{width:55px;flex-shrink:0;font-size:38px;text-align:center;filter:drop-shadow(0 4px 4px rgba(0,0,0,.65))}
.button-text{text-align:left;margin-left:15px;min-width:0}
.button-title{font-size:clamp(19px,5vw,25px);font-weight:900;letter-spacing:1px;text-shadow:0 2px 4px #000}
.button-subtitle{margin-top:3px;font-size:12px;color:#c9e5fa}
.back{position:relative;z-index:1;margin:0 0 clamp(20px,5vh,48px);padding:11px 18px;border:1px solid #8bb6d0;border-radius:12px;color:#d7eafa;text-decoration:none;font-size:13px;font-weight:bold;letter-spacing:.08em;background:#0c253cbd}
.back:hover{background:#244b72}
.sign-stage{position:relative;z-index:1;width:min(84vw,570px);margin-top:clamp(8px,2vh,20px);filter:drop-shadow(0 10px 22px #000b)}
.vegas-sign{display:block;width:100%;max-height:34vh;min-height:145px;overflow:visible}
.sign-post{fill:#35405a;stroke:#9babc2;stroke-width:3}
.sign-panel{fill:#f9f5e8;stroke:#d6a84c;stroke-width:16;filter:url(#signShadow)}
.sign-inner{fill:none;stroke:#4f8cbe;stroke-width:5}
.sign-bulb{fill:#fffbe2;filter:url(#bulbGlow) drop-shadow(0 0 9px #ffed91);animation:bulbChase 2.4s ease-in-out infinite}
.sign-star{fill:#e92938;transform-origin:310px 94px;filter:drop-shadow(0 0 9px #ff3d46);animation:starTwinkle 1.8s ease-in-out infinite}
.star-glint{fill:#fff8c6;stroke:#fff8c6;stroke-width:2;stroke-linecap:round;transform-origin:center;filter:drop-shadow(0 0 6px #fff);animation:glint 1.8s ease-in-out infinite}
.star-glint.second{animation-delay:-.9s}
.star-glint.third{animation-delay:-.45s}
.sign-welcome circle{fill:#fff;stroke:#3392c5;stroke-width:2}
.sign-welcome text{fill:#287faf;font:bold 27px Georgia,serif;text-anchor:middle;dominant-baseline:middle}
.sign-script{fill:#da3039;font:italic 52px "Brush Script MT","Segoe Script",cursive;text-anchor:middle;paint-order:stroke;stroke:#fff4ed;stroke-width:1.5;animation:neonBreath 4s ease-in-out infinite}
.sign-city{fill:#347cac;font:800 43px Georgia,serif;letter-spacing:5px;text-anchor:middle}
.sign-state{fill:#347cac;font:800 17px Georgia,serif;letter-spacing:8px;text-anchor:middle}
@keyframes bulbChase{0%,32%,100%{opacity:1}45%,70%{opacity:.55}}
@keyframes starTwinkle{0%,100%{opacity:.82;transform:scale(.95);filter:drop-shadow(0 0 5px #f43d46)}45%{opacity:1;transform:scale(1.08);filter:drop-shadow(0 0 19px #ff5364)}53%{opacity:.66;transform:scale(.96)}62%{opacity:1;transform:scale(1.06);filter:drop-shadow(0 0 23px #fff0a2)}}
@keyframes glint{0%,25%,75%,100%{opacity:0;transform:scale(.25)}39%,52%{opacity:1;transform:scale(1.25)}60%{opacity:0;transform:scale(.3)}}
@keyframes neonBreath{0%,100%{filter:drop-shadow(0 0 7px #f94952)}50%{filter:drop-shadow(0 0 16px #ff4554)}}
@media(prefers-reduced-motion:reduce){.sign-bulb,.sign-star,.sign-script,.star-glint{animation:none}.star-glint{opacity:.7}}
@media(max-width:450px){.game-button{min-height:70px;padding:0 18px}.icon{width:43px;font-size:31px}}

/* Fit the sign, game tiles, and return link inside the usable viewport. */
.casino-room{
  height:100dvh;min-height:0;overflow:hidden;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  justify-items:center;align-items:stretch;
  gap:clamp(4px,1vh,12px);
  padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom));
}
.title-area{padding-top:0}
.floor-scene{
  position:relative;isolation:isolate;width:min(100%,1120px);height:100%;min-height:0;
  justify-self:center;display:flex;align-items:center;justify-content:center;overflow:visible;
}
.floor-scene::after{
  content:"";position:absolute;z-index:0;left:4%;right:4%;bottom:1.5%;height:clamp(14px,3vh,28px);
  border-radius:50%;background:radial-gradient(ellipse,rgba(106,91,63,.42),rgba(37,34,30,.18) 46%,transparent 75%);
  filter:blur(3px);pointer-events:none;
}
.sign-stage{
  position:absolute;z-index:1;left:clamp(0px,1.2vw,14px);bottom:4%;
  width:clamp(92px,16vw,190px);height:clamp(118px,27vh,250px);min-height:0;margin:0;
  display:flex;align-items:flex-end;justify-content:center;filter:drop-shadow(0 7px 8px #000a);
}
.vegas-sign{width:100%;height:100%;min-height:0;max-height:100%;object-fit:contain}
.tumbleweed-track{
  position:absolute;z-index:3;right:0;bottom:8%;width:clamp(82px,25vw,285px);
  height:clamp(58px,13vh,100px);overflow:hidden;pointer-events:none;
}
.tumbleweed{
  position:absolute;left:0;bottom:0;width:clamp(42px,7.5vw,82px);height:auto;
  filter:drop-shadow(0 4px 3px #0009);animation:tumbleAcross 7s linear infinite;
}
@keyframes tumbleAcross{
  0%{transform:translate(130%,-4px) rotate(0deg);opacity:0}
  8%{opacity:1}
  90%{opacity:1}
  100%{transform:translate(-190%,2px) rotate(-720deg);opacity:0}
}
.menu{
  width:min(86vw,370px);min-height:0;max-height:100%;margin:0;
  padding:3px 6px;gap:clamp(3px,.7dvh,8px);overflow-y:auto;
}
.game-button{min-height:0;height:clamp(44px,7dvh,62px);flex:0 0 auto}
.back{margin:0;padding:8px 16px}
@media(max-height:650px){
  .title{font-size:clamp(27px,6vh,42px)}
  .subtitle{font-size:10px;letter-spacing:3px}
  .game-button{height:clamp(43px,8dvh,56px)}
  .icon{font-size:29px;width:45px}
  .button-title{font-size:17px}
  .button-subtitle{font-size:10px}
}
@media(max-height:500px){
  .casino-room{grid-template-rows:auto minmax(54px,.62fr) minmax(180px,1.38fr) auto;gap:3px}
  .title-area{padding-top:0}
  .title{font-size:27px}
  .subtitle{display:none}
  .game-button{height:40px;border-radius:12px}
  .menu{gap:3px;padding:2px 4px}
  .icon{font-size:24px;width:36px}
  .button-title{font-size:15px}
  .button-subtitle{display:none}
  .back{padding:6px 12px;font-size:11px}
}

/* ROTATING CASINO GAME SELECTION WHEEL */
.wheel-stage{
  position:relative;z-index:2;width:min(92vw,700px);height:min(38dvh,330px);
  min-height:210px;margin:0 auto;perspective:1100px;perspective-origin:50% 50%;
  touch-action:none;user-select:none;-webkit-user-select:none;overflow:visible;
}
.game-wheel{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.wheel-tile{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
.game-wheel .game-button{
  position:relative;left:0;top:0;translate:-50% -50%;width:clamp(235px,52vw,370px);
  height:clamp(60px,8.5dvh,78px);min-height:0;flex:none;padding:0 22px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:preserve-3d;
  will-change:transform;transition:filter .18s ease,box-shadow .18s ease;
}
.game-wheel .game-button:hover,.game-wheel .game-button:focus-visible{
  filter:brightness(1.28);box-shadow:0 0 28px rgba(113,220,255,.72),inset 0 2px 2px rgba(255,255,255,.4);
  outline:2px solid rgba(193,244,255,.9);outline-offset:2px;
}
@media(max-width:560px){
  .wheel-stage{width:96vw;height:min(37dvh,300px);min-height:200px}
  .game-wheel .game-button{width:min(80vw,310px);height:58px;padding:0 16px}
  .game-wheel .button-title{font-size:clamp(15px,4.5vw,20px)}
  .game-wheel .button-subtitle{display:none}
}
@media(max-height:600px){
  .wheel-stage{height:235px;min-height:180px}
  .game-wheel .game-button{height:52px}
}


@media(max-width:560px){
  .sign-stage{left:-2px;width:clamp(74px,18vw,105px);height:clamp(104px,25vh,158px);bottom:5%}
  .tumbleweed-track{width:clamp(68px,22vw,104px);height:72px;right:-2px;bottom:8%}
  .tumbleweed{width:42px}
}
@media(max-height:600px){
  .floor-scene{min-height:180px}
  .sign-stage{height:clamp(94px,30vh,180px);bottom:3%}
  .tumbleweed-track{bottom:6%;height:68px}
}
@media(prefers-reduced-motion:reduce){.tumbleweed{animation:none;transform:rotate(-20deg);opacity:1}}
</style>
</head>
<body>
<div class="casino-room">
  <div class="glow" aria-hidden="true"></div>
  <header class="title-area"><h1 class="title">CASINO</h1><div class="subtitle">CHOOSE YOUR GAME</div></header>
  <div class="floor-scene">
  <div class="sign-stage">
    <svg class="vegas-sign" viewBox="0 0 620 390" role="img" aria-labelledby="signTitle">
      <title id="signTitle">Animated Welcome to Fabulous Casino sign</title>
      <defs>
        <filter id="signShadow" x="-25%" y="-30%" width="150%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#03020b" flood-opacity=".8"/></filter>
        <filter id="bulbGlow" x="-250%" y="-250%" width="600%" height="600%"><feGaussianBlur stdDeviation="5" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <path class="sign-post" d="M176 324h18v65h-18zM423 324h18v65h-18z"/>
      <path class="sign-panel" d="M79 146 H541 L582 302 Q585 318 567 327 H53 Q35 318 38 302 Z"/>
      <path class="sign-inner" d="M82 151 H538 L576 302 Q579 312 565 320 H55 Q41 312 44 302 Z"/>
      <path id="bulbTrack" d="M79 146 H541 L582 302 Q585 318 567 327 H53 Q35 318 38 302 Z" fill="none" stroke="none"/>
      <g id="signBulbs" aria-hidden="true"></g>
      <path class="sign-star" d="M310 14 L322 79 L370 40 L335 91 L394 94 L335 105 L368 152 L322 117 L310 174 L299 117 L253 152 L286 105 L227 94 L286 91 L251 40 L299 79 Z"/>

      <path class="star-glint third" d="M273 99v14m-7-7h14"/>
      <g class="sign-welcome">
        <circle cx="124" cy="190" r="24"/><circle cx="186" cy="190" r="24"/><circle cx="248" cy="190" r="24"/><circle cx="310" cy="190" r="24"/><circle cx="372" cy="190" r="24"/><circle cx="434" cy="190" r="24"/><circle cx="496" cy="190" r="24"/>
        <text x="124" y="191">W</text><text x="186" y="191">E</text><text x="248" y="191">L</text><text x="310" y="191">C</text><text x="372" y="191">O</text><text x="434" y="191">M</text><text x="496" y="191">E</text>
      </g>
      <text class="sign-script" x="310" y="248">Fabulous</text>
      <text class="sign-city" x="310" y="291">CASINO</text>
    </svg>
  </div>
  <div class="wheel-stage" id="wheelStage" aria-label="Rotating casino game selection wheel">
    <nav class="game-wheel" id="casinoMenu" aria-label="Casino games">
      <a class="game-button" href="roulette.html"><span class="icon" aria-hidden="true">🎡</span><span class="button-text"><span class="button-title">ROULETTE</span><span class="button-subtitle">Place • Spin • Win</span></span></a>
      <a class="game-button" href="slots.html"><span class="icon" aria-hidden="true">🎰</span><span class="button-text"><span class="button-title">LUCKY LIGHTS SLOTS</span><span class="button-subtitle">Five Reels • Pull • Win</span></span></a>
      <a class="game-button" href="videopoker.html"><span class="icon" aria-hidden="true">🃏</span><span class="button-text"><span class="button-title">VIDEO POKER</span><span class="button-subtitle">Jacks or Better • Draw Five</span></span></a>
      <a class="game-button" href="blackjack.html"><span class="icon" aria-hidden="true">♠️</span><span class="button-text"><span class="button-title">BLACKJACK</span><span class="button-subtitle">Classic Cards • Dealer • 3:2</span></span></a>
      <a class="game-button" href="craps.html"><span class="icon" aria-hidden="true">🎲</span><span class="button-text"><span class="button-title">CRAPS</span><span class="button-subtitle">Pass Line • Point • Field</span></span></a>
    </nav>
  </div>
  <div class="tumbleweed-track" aria-hidden="true">
    <svg class="tumbleweed" viewBox="0 0 100 100">
      <g fill="none" stroke="#b17b43" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M50 50 C33 38 23 24 31 14 C39 4 54 13 51 27 C49 36 48 43 50 50"/>
        <path d="M50 50 C65 34 78 26 87 34 C97 43 86 56 73 52 C64 49 57 49 50 50"/>
        <path d="M50 50 C65 64 76 78 67 87 C58 97 45 86 49 73 C52 64 51 57 50 50"/>
        <path d="M50 50 C36 65 23 76 14 67 C4 58 14 45 27 49 C36 52 43 51 50 50"/>
        <path d="M50 50 C39 31 38 17 47 12 C58 6 65 20 58 31 C54 39 51 45 50 50"/>
        <path d="M50 50 C70 40 84 40 89 49 C95 60 81 66 70 58 C62 54 56 51 50 50"/>
        <path d="M50 50 C61 70 61 84 51 89 C40 95 34 81 42 70 C46 62 49 56 50 50"/>
        <path d="M50 50 C30 60 16 60 11 50 C6 39 20 34 31 42 C39 46 45 49 50 50"/>
        <path d="M27 31 C39 39 61 62 73 70 M71 28 C59 40 39 61 28 73 M34 18 C45 31 63 57 81 66 M18 65 C34 55 61 36 81 34"/>
      </g>
      <circle cx="50" cy="50" r="7" fill="#8b5a31"/>
    </svg>
  </div>
</div>
  <a class="back" href="index.html">← GAME ROOM</a>
</div>
<script>
const track=document.getElementById("bulbTrack");
const bulbs=document.getElementById("signBulbs");
const length=track.getTotalLength();
for(let i=0;i<76;i++){
  const point=track.getPointAtLength(length*i/76);
  const bulb=document.createElementNS("http://www.w3.org/2000/svg","circle");
  bulb.setAttribute("class","sign-bulb");
  bulb.setAttribute("cx",point.x.toFixed(1));
  bulb.setAttribute("cy",point.y.toFixed(1));
  bulb.setAttribute("r","6.2");
  bulb.style.animationDelay=(i%12)*-.2+"s";
  bulbs.appendChild(bulb);
}

const wheelStage=document.getElementById("wheelStage");
const casinoMenu=document.getElementById("casinoMenu");
const BASE_WHEEL_SPEED=360/24;
const FAST_WHEEL_MULTIPLIER=4.5;
const TOUCH_DEAD_ZONE=.12;
let wheelAngle=0;
let wheelVelocity=BASE_WHEEL_SPEED;
let lastWheelDirection="up";
let lastWheelFrame=performance.now();
let activeTouchId=null;
let touchStartX=0,touchStartY=0,touchMoved=false;
let suppressWheelClickUntil=0;

function arrangeCasinoWheel(){
  const tiles=[...casinoMenu.querySelectorAll(".game-button")];
  const count=tiles.length;
  if(!count)return;
  const radius=150;
  tiles.forEach((tile,index)=>{
    const angle=(360/count)*index;
    const holder=document.createElement("div");
    holder.className="wheel-tile";
    tile.replaceWith(holder);
    holder.appendChild(tile);
    holder.style.transform=`rotateX(${angle}deg) translateZ(${radius}px) rotateX(-${angle}deg)`;
  });
}
function setWheelVelocity(velocity){
  wheelVelocity=velocity;
  if(velocity>.01)lastWheelDirection="up";
  if(velocity<-.01)lastWheelDirection="down";
}
function setWheelMotion(direction,fast=false){
  if(direction!=="up"&&direction!=="down"){setWheelVelocity(0);return}
  const speed=BASE_WHEEL_SPEED*(fast?FAST_WHEEL_MULTIPLIER:1);
  setWheelVelocity(direction==="down"?-speed:speed);
}
function renderWheel(){
  casinoMenu.style.transform=`rotateX(${wheelAngle}deg)`;
  casinoMenu.querySelectorAll(".game-button").forEach(tile=>tile.style.transform=`rotateX(${-wheelAngle}deg)`);
}
function runWheelFrame(now){
  const elapsed=Math.min(Math.max((now-lastWheelFrame)/1000,0),.05);
  lastWheelFrame=now;
  if(Math.abs(wheelVelocity)>.01)wheelAngle=(wheelAngle+wheelVelocity*elapsed)%360;
  renderWheel();
  requestAnimationFrame(runWheelFrame);
}
function desktopWheelControl(event){
  const b=wheelStage.getBoundingClientRect();
  const y=(event.clientY-b.top)/b.height;
  if(y<.32)setWheelMotion("up",true);
  else if(y>.68)setWheelMotion("down",true);
  else setWheelMotion("center");
}
function touchWheelControl(event){
  const b=wheelStage.getBoundingClientRect();
  const y=Math.max(0,Math.min(1,(event.clientY-b.top)/b.height));
  const signed=(y-.5)*2;
  const distance=Math.abs(signed);
  if(distance<=TOUCH_DEAD_ZONE){setWheelMotion("center");return}
  const amount=(distance-TOUCH_DEAD_ZONE)/(1-TOUCH_DEAD_ZONE);
  const multiplier=.2+(FAST_WHEEL_MULTIPLIER-.2)*amount;
  setWheelVelocity(BASE_WHEEL_SPEED*multiplier*(signed<0?1:-1));
}
wheelStage.addEventListener("pointerdown",event=>{
  if(event.pointerType!=="touch")return;
  activeTouchId=event.pointerId;touchStartX=event.clientX;touchStartY=event.clientY;touchMoved=false;
  try{wheelStage.setPointerCapture(event.pointerId)}catch(_){}
  touchWheelControl(event);
});
wheelStage.addEventListener("pointermove",event=>{
  if(event.pointerType==="touch"){
    if(event.pointerId!==activeTouchId)return;
    if(Math.hypot(event.clientX-touchStartX,event.clientY-touchStartY)>8)touchMoved=true;
    touchWheelControl(event);if(touchMoved)event.preventDefault();return;
  }
  desktopWheelControl(event);
});
function releaseTouchWheel(event){
  if(event.pointerId!==activeTouchId)return;
  if(touchMoved)suppressWheelClickUntil=Date.now()+400;
  activeTouchId=null;setWheelMotion(lastWheelDirection,false);
}
wheelStage.addEventListener("pointerup",releaseTouchWheel);
wheelStage.addEventListener("pointercancel",releaseTouchWheel);
wheelStage.addEventListener("pointerleave",event=>{
  if(event.pointerType==="touch"&&activeTouchId!==null)return;
  setWheelMotion(lastWheelDirection,false);
});
wheelStage.addEventListener("click",event=>{
  if(Date.now()<suppressWheelClickUntil){event.preventDefault();event.stopPropagation()}
},true);
window.addEventListener("blur",()=>{if(activeTouchId===null)setWheelMotion(lastWheelDirection,false)});
window.addEventListener("pointerout",event=>{if(event.pointerType!=="touch"&&!event.relatedTarget)setWheelMotion(lastWheelDirection,false)});
document.addEventListener("visibilitychange",()=>{
  lastWheelFrame=performance.now();
  if(!document.hidden&&activeTouchId===null)setWheelMotion(lastWheelDirection,false);
});
arrangeCasinoWheel();
requestAnimationFrame(runWheelFrame);

</script>
</body>
</html>
